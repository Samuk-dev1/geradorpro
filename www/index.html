<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Estrada Infinita 3D — Ultra Realista (Suave)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;color:#eaf4ff}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* Tela Inicial */
  #startScreen{position:absolute;inset:0;background:radial-gradient(circle at center, #1a2235 0%, #05070c 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100}
  #startScreen h1{font-size:38px;color:#fff;text-shadow:0 0 20px #00ffff, 0 0 40px #0088ff;margin-bottom:10px;text-align:center;font-weight:900;letter-spacing:2px}
  #startScreen p{font-size:16px;color:#8ab4f8;margin-bottom:40px;text-align:center;max-width:80%}
  #btnStart{padding:18px 48px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(135deg,#0055ff,#00ffff);border:none;border-radius:40px;cursor:pointer;box-shadow:0 10px 30px rgba(0,255,255,0.4);animation:pulse 2s infinite;transition:transform 0.2s}
  #btnStart:active{transform:scale(0.95)}
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(0,255,255,0.4)}50%{box-shadow:0 10px 50px rgba(0,255,255,0.7)}}

  #hud{position:absolute;inset:0;pointer-events:none;display:none}
  
  #topBar{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
  #stats{display:flex;gap:10px}
  .stat{
    background:linear-gradient(160deg,rgba(10,12,25,.85),rgba(4,5,10,.9));
    border:1px solid rgba(0,255,255,.3); border-radius:12px;padding:8px 14px;min-width:96px;
    box-shadow:0 6px 22px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1); backdrop-filter:blur(6px);
  }
  .stat .k{display:block;font-size:9px;letter-spacing:2px;color:#00ffff;font-weight:800}
  .stat .v{display:block;font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 14px rgba(0,255,255,.5);font-variant-numeric:tabular-nums}

  #weatherBox{
    background:rgba(0,0,0,.7); border:1px solid rgba(255,255,255,.2); border-radius:12px;
    padding:8px 16px; font-size:14px; font-weight:800; color:#fff; text-transform:uppercase; letter-spacing:2px;
    backdrop-filter:blur(4px); transition:all 0.5s; box-shadow:0 4px 15px rgba(0,0,0,0.5);
  }

  /* Velocímetro */
  #speedo{position:absolute;left:20px;bottom:20px;width:140px;height:140px}
  #speedo .bg{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(20,25,35,.92),rgba(5,7,12,.96));border:3px solid rgba(0,255,255,.3);box-shadow:0 0 30px rgba(0,255,255,.2), inset 0 0 20px rgba(0,0,0,.8)}
  #speedo .ring{position:absolute;inset:8px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 64%,#000 66%);mask:radial-gradient(circle,transparent 64%,#000 66%)}
  #speedo .needle{position:absolute;left:50%;top:50%;width:4px;height:48px;background:linear-gradient(to top,#00ffff,#fff);border-radius:3px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(-120deg);box-shadow:0 0 12px rgba(255,255,255,.9);transition:transform .08s cubic-bezier(0.2, 0.8, 0.2, 1)}
  #speedo .hub{position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 35%,#fff,#0088aa);box-shadow:0 0 10px rgba(0,0,0,.9)}
  #speedo .num{position:absolute;left:0;right:0;bottom:26px;text-align:center}
  #speedo .num span{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 16px rgba(0,255,255,.8);font-variant-numeric:tabular-nums;line-height:1}
  #speedo .num small{display:block;font-size:9px;letter-spacing:1px;color:#00ffff;font-weight:800;margin-top:2px}
  #gearDisplay{position:absolute;right:-10px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.8);border:1px solid #00ffff;padding:4px 8px;border-radius:8px;font-size:16px;font-weight:900;color:#fff;box-shadow:0 0 10px rgba(0,255,255,0.4)}

  /* Controles Mobile */
  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  #touch .side{position:absolute;bottom:30px;display:flex;gap:16px;pointer-events:auto}
  #touch .side.left{left:180px}
  #touch .side.right{right:30px}
  #touch button{
    width:80px;height:80px;border-radius:50%;font-size:28px;color:#fff;
    background:linear-gradient(160deg,rgba(40,50,70,.85),rgba(15,20,30,.95));
    border:2px solid rgba(0,255,255,.4); box-shadow:0 8px 25px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.1);
    touch-action:none; cursor:pointer; transition:background 0.1s;
  }
  #touch button:active{background:rgba(0,255,255,.4);transform:scale(.92);border-color:#fff}
  
  @media (hover:none) and (pointer:coarse){
    #touch{display:block}
    #speedo{width:110px;height:110px;left:10px;bottom:10px}
    #speedo .num span{font-size:22px}
    #touch .side.left{left:130px}
    .stat{min-width:74px;padding:6px 10px}
    .stat .v{font-size:16px}
  }
</style>
</head>
<body>
<div id="startScreen">
  <h1>ESTRADA INFINITA PRO</h1>
  <p>Áudio Suave, Noite Mais Clara e Faróis Realistas.</p>
  <button id="btnStart">LIGAR MOTOR</button>
</div>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="topBar">
      <div id="stats">
        <div class="stat"><span class="k">PONTOS</span><span class="v" id="uiScore">0</span></div>
        <div class="stat"><span class="k">DISTÂNCIA</span><span class="v" id="uiDist">0 m</span></div>
      </div>
      <div id="weatherBox">DIA</div>
    </div>
    <div id="speedo">
      <div class="bg"></div><div class="ring" id="ring"></div><div class="needle" id="needle"></div><div class="hub"></div>
      <div class="num"><span id="uiKmh">0</span><small>KM/H</small></div>
      <div id="gearDisplay">N</div>
    </div>
  </div>
  <div id="touch">
    <div class="side left"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div class="side right"><button data-k="brake">▼</button><button data-k="gas">▲</button></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   MOTOR GRÁFICO E FÍSICA
   ===================================================================== */
const SEG_LEN = 200, ROAD_WIDTH = 2000, LANES = 3;
const FOV = 105, CAM_HEIGHT = 1400, CAM_DEPTH = 1/Math.tan((FOV/2)*Math.PI/180);
const DRAW_DIST = 320, PLAYER_Z = CAM_HEIGHT * CAM_DEPTH;
const MAX_SPEED = SEG_LEN * 65, ACCEL = MAX_SPEED/4.5, BREAKING = -MAX_SPEED * 1.2, DECEL = -MAX_SPEED/4;
const OFF_ROAD_DECEL = -MAX_SPEED/2.0, OFF_ROAD_LIMIT = MAX_SPEED/4, CENTRIFUGAL = 0.35;
const PLAYER_W = 680 / ROAD_WIDTH;

/* -------- SISTEMA DE ÁUDIO PROFISSIONAL (SUAVE E SEPARADO) -------- */
let aCtx, engOsc, engFilter, engGain;
let weaNoise, weaFilter, weaGain;

function initAudio(){
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    aCtx = new AudioContext();
    
    // MOTOR: 1 Oscilador "Triangle" (Muito mais suave e grave, sem o chiado irritante)
    engOsc = aCtx.createOscillator(); 
    engOsc.type = 'triangle';
    engFilter = aCtx.createBiquadFilter(); 
    engFilter.type = 'lowpass';
    engGain = aCtx.createGain(); 
    engGain.gain.value = 0;
    
    engOsc.connect(engFilter); 
    engFilter.connect(engGain); 
    engGain.connect(aCtx.destination);
    engOsc.start();

    // GERADOR DE RUÍDO (Para Chuva e Vento isolados)
    const bSize = aCtx.sampleRate * 2;
    const nBuf = aCtx.createBuffer(1, bSize, aCtx.sampleRate);
    const out = nBuf.getChannelData(0);
    for (let i = 0; i < bSize; i++) out[i] = Math.random() * 2 - 1;
    
    // CHUVA / NEVE
    weaNoise = aCtx.createBufferSource(); weaNoise.buffer = nBuf; weaNoise.loop = true;
    weaFilter = aCtx.createBiquadFilter(); 
    weaGain = aCtx.createGain(); weaGain.gain.value = 0;
    weaNoise.connect(weaFilter); weaFilter.connect(weaGain); weaGain.connect(aCtx.destination);
    weaNoise.start();

  } catch(e) { console.log("Áudio não suportado neste navegador."); }
}

let currentGear = 0;

function updateAudio(speedPct, env) {
  if(!aCtx) return;
  
  // SISTEMA DE MARCHAS SIMULADO (1 a 6)
  if (speedPct < 0.02) currentGear = 0; // Neutro
  else currentGear = Math.max(1, Math.ceil(speedPct * 6));
  
  document.getElementById('gearDisplay').textContent = currentGear === 0 ? 'N' : currentGear;

  let gearPct = 0;
  if (currentGear > 0) gearPct = (speedPct * 6) - (currentGear - 1);

  // Frequência do motor super grave e suave (40 a 90Hz)
  const baseFreq = 40 + (gearPct * 50); 
  
  engOsc.frequency.setTargetAtTime(baseFreq, aCtx.currentTime, 0.1);
  
  // Filtro baixo tira qualquer ruído agudo
  engFilter.frequency.setTargetAtTime(120 + (speedPct * 200), aCtx.currentTime, 0.1);
  
  // Volume sutil
  const vol = speedPct > 0.01 ? 0.05 + (speedPct * 0.1) : 0.02;
  engGain.gain.setTargetAtTime(vol, aCtx.currentTime, 0.1);

  // CLIMA SEPARADO
  let wV = 0;
  if(env.rain > 0) { 
      wV = env.rain * 0.25; 
      weaFilter.type = 'lowpass';
      weaFilter.frequency.value = 800; // Som de chuva batendo (Rumble)
  } 
  else if(env.snow > 0) { 
      wV = env.snow * 0.15; 
      weaFilter.type = 'bandpass';
      weaFilter.frequency.value = 400; // Som de vento uivando
  } 
  weaGain.gain.setTargetAtTime(wV, aCtx.currentTime, 0.5);
}

document.getElementById('btnStart').addEventListener('click', () => {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  initAudio();
  if(aCtx && aCtx.state === 'suspended') aCtx.resume();
});

/* -------- SISTEMA DE CLIMA -------- */
const CLIMATES = [
  { name:'DIA LIMPO', sky:['#2a7cbd','#6bb8f6','#c3e8ff'], fog:'#c3e8ff', fogDens:2, sun:1, moon:0, rain:0, snow:0, dark:0, light:0, ui:'#00ffff' },
  { name:'NEBLINA', sky:['#7a8b98','#a4b2bb','#d0d6dd'], fog:'#d0d6dd', fogDens:15, sun:0, moon:0, rain:0, snow:0, dark:0.2, light:0.8, ui:'#fff' },
  // NOITE CLARA AGORA É MENOS ESCURA (dark de 0.85 para 0.4) E CÉU MAIS AZULADO
  { name:'NOITE CLARA', sky:['#0d172a','#152542','#1f365c'], fog:'#0d172a', fogDens:4, sun:0, moon:1, rain:0, snow:0, dark:0.4, light:1, ui:'#ff00ff' },
  // TEMPESTADE AGORA É MENOS ESCURA
  { name:'TEMPESTADE', sky:['#1a1d24','#252933','#333947'], fog:'#252933', fogDens:8, sun:0, moon:0, rain:1, snow:0, dark:0.45, light:1, thunder:true, ui:'#ff3333' },
  { name:'NEVASCA', sky:['#8298a9','#a1b1bb','#c1c9cf'], fog:'#c1c9cf', fogDens:10, sun:0, moon:0, rain:0, snow:1, dark:0.2, light:0.6, ui:'#99ddff' }
];

let weatherTimer = 0;
const PHASE_DURATION = 35; 
const TRANS_DURATION = 8;  
let curW = 0, nextW = 1;
let currentEnv = JSON.parse(JSON.stringify(CLIMATES[0]));
let thunderFlash = 0;
let particles = [];
for(let i=0; i<350; i++) particles.push({x:Math.random(), y:Math.random(), s: 0.5+Math.random()*0.5});

function hex2rgb(h) { let c=h.substring(1); if(c.length===3)c=c.split('').map(x=>x+x).join(''); return [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)]; }
function rgb2hex(r,g,b) { return "#"+(1<<24|(r<<16)|(g<<8)|b).toString(16).slice(1); }
function lerpColor(a,b,t) { const c1=hex2rgb(a), c2=hex2rgb(b); return rgb2hex(Math.round(c1[0]+(c2[0]-c1[0])*t), Math.round(c1[1]+(c2[1]-c1[1])*t), Math.round(c1[2]+(c2[2]-c1[2])*t)); }

function updateWeather(dt) {
  weatherTimer += dt;
  if(weatherTimer >= PHASE_DURATION) {
    weatherTimer -= PHASE_DURATION;
    curW = nextW; nextW = (nextW + 1) % CLIMATES.length;
    document.getElementById('weatherBox').textContent = CLIMATES[curW].name;
    document.getElementById('weatherBox').style.color = CLIMATES[curW].ui;
    document.getElementById('weatherBox').style.borderColor = CLIMATES[curW].ui;
  }
  let t = 0;
  if(weatherTimer > (PHASE_DURATION - TRANS_DURATION)) t = (weatherTimer - (PHASE_DURATION - TRANS_DURATION)) / TRANS_DURATION;

  const w1 = CLIMATES[curW], w2 = CLIMATES[nextW];
  currentEnv.sky[0] = lerpColor(w1.sky[0], w2.sky[0], t); currentEnv.sky[1] = lerpColor(w1.sky[1], w2.sky[1], t); currentEnv.sky[2] = lerpColor(w1.sky[2], w2.sky[2], t);
  currentEnv.fog = lerpColor(w1.fog, w2.fog, t);
  currentEnv.fogDens = w1.fogDens + (w2.fogDens - w1.fogDens)*t;
  currentEnv.sun = w1.sun + (w2.sun - w1.sun)*t; currentEnv.moon = w1.moon + (w2.moon - w1.moon)*t;
  currentEnv.rain = w1.rain + (w2.rain - w1.rain)*t; currentEnv.snow = w1.snow + (w2.snow - w1.snow)*t;
  currentEnv.dark = w1.dark + (w2.dark - w1.dark)*t; currentEnv.light = w1.light + (w2.light - w1.light)*t;
  
  thunderFlash = Math.max(0, thunderFlash - dt*3);
  if(w1.thunder && Math.random() < 0.015) thunderFlash = 1;
}

/* -------- UTILITÁRIOS & CANVAS -------- */
const limit = (v,a,b) => Math.max(a, Math.min(v,b));
const easeIn = (a,b,p) => a + (b-a) * p*p; const easeInOut = (a,b,p) => a + (b-a) * ((-Math.cos(p*Math.PI)/2) + 0.5);
const interp = (a,b,p) => a + (b-a) * p; const percentRemaining = (n,t) => (n % t) / t;
const expFog = (d,dens) => 1 / Math.pow(Math.E, d*d*dens); const accelerate = (v,a,dt) => v + a*dt;
const randomChoice = arr => arr[Math.floor(Math.random()*arr.length)];
function increase(s, inc, max){ let r = s+inc; while(r>=max)r-=max; while(r<0)r+=max; return r; }
function roundRect(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

const cv = document.getElementById('cv'); const ctx = cv.getContext('2d', {alpha:false});
let W=0, H=0;
function resize(){ const dpr = Math.min(window.devicePixelRatio||1, 2); W = window.innerWidth; H = window.innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
window.addEventListener('resize', resize);

/* -------- SPRITES E VEÍCULOS -------- */
function makeSprite(worldW, worldH, drawFn, frames=1, fDur=150){
  const h=256, w=Math.max(8,Math.round(h*worldW/worldH)), list=[];
  for(let i=0;i<frames;i++){
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    drawFn(c.getContext('2d'), 0,0,w,h,i); list.push(c);
  }
  return {img:list[0], frames:list, w:worldW, h:worldH, fDur:fDur};
}

// Pedestre Animado
function drawPerson(g,x,y,w,h,f){
  const t=(f/8)*Math.PI*2, lSw=Math.sin(t)*w*0.25, cx=x+w/2, cy=y+Math.abs(Math.sin(t))*h*0.02;
  g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(cx, y+h*0.98, w*0.35, h*0.025, 0,0,7); g.fill();
  g.strokeStyle='#1e2b45'; g.lineWidth=w*0.16; g.lineCap='round'; g.beginPath();
  g.moveTo(cx-w*0.08, cy+h*0.55); g.lineTo(cx-w*0.08+lSw, cy+h*0.96); g.moveTo(cx+w*0.08, cy+h*0.55); g.lineTo(cx+w*0.08-lSw, cy+h*0.96); g.stroke();
  g.fillStyle='#c82a36'; roundRect(g, cx-w*0.22, cy+h*0.25, w*0.44, h*0.35, w*0.1); g.fill();
  g.fillStyle='#dfa87e'; g.beginPath(); g.arc(cx, cy+h*0.15, w*0.18, 0, 7); g.fill();
  g.fillStyle='#222'; g.beginPath(); g.arc(cx, cy+h*0.13, w*0.19, 0, 7); g.fill(); // Cabelo
}

function drawBuilding(g,x,y,w,h){
  g.fillStyle='#0f121a'; g.fillRect(x+w*0.05,y,w*0.9,h); g.fillStyle='#05070a'; g.fillRect(x+w*0.05,y,w*0.9,h*0.05);
  for(let r=0;r<7;r++){ for(let c=0;c<4;c++){
      if(Math.random()<0.25) { g.fillStyle=Math.random()<0.5?'#00ffff':'#ff00ff'; g.shadowBlur=12; g.shadowColor=g.fillStyle; }
      else if(Math.random()<0.45) { g.fillStyle='#ffeaaa'; g.shadowBlur=6; g.shadowColor='#ffeaaa'; }
      else { g.fillStyle='#1a1c22'; g.shadowBlur=0; }
      g.fillRect(x+w*(0.1+c*0.22), y+h*(0.08+r*0.13), w*0.14, h*0.07);
  }} g.shadowBlur=0;
}

// Modelos de Veículos
function drawSedan(g,x,y,w,h,c){
  g.fillStyle='rgba(0,0,0,.6)'; g.beginPath(); g.ellipse(x+w*0.5,y+h*0.97,w*0.48,h*0.09,0,0,7); g.fill();
  g.fillStyle='#111'; roundRect(g,x+w*0.0,y+h*0.55,w*0.16,h*0.4,h*0.05); roundRect(g,x+w*0.84,y+h*0.55,w*0.16,h*0.4,h*0.05);
  g.fillStyle=c.d; roundRect(g,x+w*0.18,y+h*0.1,w*0.64,h*0.4,h*0.15); g.fill();
  g.fillStyle='#0a0c12'; roundRect(g,x+w*0.23,y+h*0.14,w*0.54,h*0.26,h*0.06); g.fill();
  const bg=g.createLinearGradient(0,y+h*0.35,0,y+h*0.9); bg.addColorStop(0,c.m); bg.addColorStop(1,c.d);
  g.fillStyle=bg; roundRect(g,x+w*0.04,y+h*0.35,w*0.92,h*0.55,h*0.12); g.fill();
  g.fillStyle='#fff'; roundRect(g,x+w*0.4,y+h*0.75,w*0.2,h*0.1,h*0.02); g.fill();
}
function drawSports(g,x,y,w,h,c){
  g.fillStyle='rgba(0,0,0,.7)'; g.beginPath(); g.ellipse(x+w*0.5,y+h*0.98,w*0.52,h*0.08,0,0,7); g.fill();
  g.fillStyle='#050505'; roundRect(g,x-w*0.05,y+h*0.6,w*0.22,h*0.38,h*0.05); roundRect(g,x+w*0.83,y+h*0.6,w*0.22,h*0.38,h*0.05); 
  g.fillStyle=c.d; roundRect(g,x+w*0.15,y+h*0.2,w*0.7,h*0.3,h*0.12); g.fill();
  g.fillStyle='#050505'; roundRect(g,x+w*0.22,y+h*0.24,w*0.56,h*0.18,h*0.05); g.fill();
  g.fillStyle=c.m; roundRect(g,x,y+h*0.4,w,h*0.45,h*0.08); g.fill(); 
  g.fillStyle='#111'; roundRect(g,x+w*0.05,y+h*0.3,w*0.9,h*0.06,h*0.02); g.fill(); 
  ctx.fillRect(x+w*0.2, y+h*0.36, w*0.05, h*0.04); ctx.fillRect(x+w*0.75, y+h*0.36, w*0.05, h*0.04);
}
function drawTruck(g,x,y,w,h,c){
  g.fillStyle='rgba(0,0,0,.8)'; g.beginPath(); g.ellipse(x+w*0.5,y+h*0.98,w*0.48,h*0.06,0,0,7); g.fill();
  g.fillStyle='#111'; roundRect(g,x+w*0.05,y+h*0.8,w*0.12,h*0.2,h*0.02); roundRect(g,x+w*0.83,y+h*0.8,w*0.12,h*0.2,h*0.02);
  g.fillStyle=c.d; roundRect(g,x+w*0.08,y+h*0.05,w*0.84,h*0.85,h*0.05); g.fill(); 
  g.fillStyle='#1a1c22'; roundRect(g,x+w*0.15,y+h*0.1,w*0.7,h*0.4,h*0.04); g.fill(); 
}

const SPRITES = {
  BLD: makeSprite(3200, 6200, drawBuilding),
  PED: makeSprite(450, 850, drawPerson, 8, 120),
  TREE: makeSprite(2600, 4500, (g,x,y,w,h)=>{ g.fillStyle='#150c08'; g.fillRect(x+w*0.42, y+h*0.5, w*0.16, h*0.5); g.fillStyle='#0f4220'; g.beginPath(); g.arc(x+w*0.5,y+h*0.35,w*0.45,0,7); g.fill(); g.fillStyle='#14582b'; g.beginPath(); g.arc(x+w*0.5,y+h*0.25,w*0.35,0,7); g.fill();})
};
const CAR_TYPES = [
  { draw: drawSedan, w:780, h:640, cols:[{m:'#1da1f2',d:'#115b8a'}, {m:'#e0245e',d:'#8f1338'}, {m:'#bdc3c7',d:'#7f8c8d'}] },
  { draw: drawSports, w:880, h:520, cols:[{m:'#f1c40f',d:'#b89500'}, {m:'#e74c3c',d:'#962d22'}, {m:'#9b59b6',d:'#6c3483'}] },
  { draw: drawTruck, w:950, h:950, cols:[{m:'#ecf0f1',d:'#95a5a6'}, {m:'#27ae60',d:'#1e8449'}] }
];
const CAR_SPRITES = [];
CAR_TYPES.forEach(t => t.cols.forEach(c => CAR_SPRITES.push(makeSprite(t.w, t.h, (g,x,y,w,h)=>t.draw(g,x,y,w,h,c)))));

/* -------- PISTA -------- */
let segments=[], cars=[], trackLength=0;
const ROAD = { LENGTH:{SHORT:25,MED:50,LONG:100}, HILL:{LOW:20,MED:40,HIGH:65}, CURVE:{EASY:2,MED:4,HARD:6.5} };

function addSegment(curve, y){
  const n = segments.length;
  segments.push({ index:n, p1:{world:{y:segments.length?segments[segments.length-1].p2.world.y:0, z:n*SEG_LEN}, camera:{}, screen:{}}, p2:{world:{y:y, z:(n+1)*SEG_LEN}, camera:{}, screen:{}}, curve:curve, sprites:[], cars:[], clip:0, color:null });
}
function addRoad(enter, hold, leave, curve, y){
  const startY = segments.length?segments[segments.length-1].p2.world.y:0, endY = startY + (y||0)*SEG_LEN, total = enter+hold+leave;
  for(let n=0;n<enter;n++) addSegment(easeIn(0,curve,n/enter), easeInOut(startY,endY,n/total));
  for(let n=0;n<hold ;n++) addSegment(curve, easeInOut(startY,endY,(enter+n)/total));
  for(let n=0;n<leave;n++) addSegment(easeInOut(curve,0,n/leave), easeInOut(startY,endY,(enter+hold+n)/total));
}

function buildTrack(){
  segments=[]; cars=[];
  addRoad(ROAD.LENGTH.SHORT, ROAD.LENGTH.SHORT, ROAD.LENGTH.SHORT, 0, 0);
  addRoad(ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.CURVE.EASY, ROAD.HILL.LOW);
  addRoad(ROAD.LENGTH.LONG, ROAD.LENGTH.MED, ROAD.LENGTH.LONG, -ROAD.CURVE.MED, -ROAD.HILL.MED);
  addRoad(ROAD.LENGTH.SHORT, ROAD.LENGTH.SHORT, ROAD.LENGTH.SHORT, 0, 0);
  addRoad(ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.CURVE.HARD, ROAD.HILL.HIGH);
  addRoad(ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.LENGTH.MED, -ROAD.CURVE.EASY, -ROAD.HILL.LOW);
  addRoad(200, 200, 200, -ROAD.CURVE.EASY, -(segments.length?segments[segments.length-1].p2.world.y:0)/SEG_LEN);
  
  for(let n=0;n<segments.length;n++) segments[n].color = (Math.floor(n/3)%2) ? {road:'#3c3e44', grass:'#1a2830', rumble:'#a0a2a5', lane:'#fff'} : {road:'#32343a', grass:'#132025', rumble:'#8a1030', lane:null};
  trackLength = segments.length * SEG_LEN;
  
  // Cenário
  for(let i=8; i<segments.length-8; i+=4) {
    const s = Math.random()<0.5?-1:1;
    segments[i].sprites.push({source:SPRITES.TREE, offset:s*(2.2+Math.random()*2.5)});
    if(Math.random()<0.25) segments[i].sprites.push({source:SPRITES.BLD, offset:s*(4.5+Math.random()*2)});
    if(Math.random()<0.45) segments[i].sprites.push({source:SPRITES.PED, offset:s*(1.35+Math.random()*0.4), phase:Math.random()*1000});
  }
  // Trânsito
  for(let i=0; i<50; i++){
    const z = Math.floor(Math.random()*segments.length)*SEG_LEN;
    const c = {offset:Math.random()*1.6-0.8, z:z, sprite:randomChoice(CAR_SPRITES), speed:MAX_SPEED/4+Math.random()*MAX_SPEED/2, percent:0};
    segments[Math.floor(z/SEG_LEN)%segments.length].cars.push(c); cars.push(c);
  }
}

/* -------- LÓGICA -------- */
let pos=0, pX=0, speed=0, shake=0, bgOff=0, time=0, dist=0, score=0;
const input = {gas:0, brake:0, left:0, right:0};
let steerIn=0, steerVis=0, carPitch=0;

const KEYS = {ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown', e=>{if(KEYS[e.code]){input[KEYS[e.code]]=1;e.preventDefault()}});
window.addEventListener('keyup', e=>{if(KEYS[e.code]){input[KEYS[e.code]]=0;e.preventDefault()}});
document.querySelectorAll('#touch button').forEach(b => {
  const k=b.dataset.k, on=e=>{e.preventDefault();input[k]=1}, off=e=>{e.preventDefault();input[k]=0};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off); b.addEventListener('contextmenu',e=>e.preventDefault());
});

function overlap(x1,w1,x2,w2){ const h=0.82/2; return !(x1+w1*h < x2-w2*h || x1-w1*h > x2+w2*h); }

function update(dt){
  time += dt; updateWeather(dt);
  const pSeg = segments[Math.floor((pos+PLAYER_Z)/SEG_LEN)%segments.length];
  const sPct = speed/MAX_SPEED;
  updateAudio(sPct, currentEnv);

  const stTarg = input.right - input.left;
  steerIn += (stTarg - steerIn) * (1-Math.pow(0.0005, dt)); // Esterço realista
  if(Math.abs(steerIn)<0.02 && stTarg===0) steerIn=0;
  carPitch += ((input.gas?1:input.brake?-1:0) - carPitch) * dt * 5;

  pos = increase(pos, dt*speed, trackLength); dist += (dt*speed)/380;
  const dx = dt * 2.5 * sPct * (1-sPct*0.2);
  pX += steerIn * dx - dx * sPct * pSeg.curve * CENTRIFUGAL;

  if(input.gas) speed = accelerate(speed, ACCEL, dt);
  else if(input.brake) speed = accelerate(speed, BREAKING, dt);
  else speed = accelerate(speed, DECEL, dt);

  const off = (pX < -1 || pX > 1);
  if(off && speed > OFF_ROAD_LIMIT) { speed = accelerate(speed, OFF_ROAD_DECEL, dt); shake = Math.min(1, shake+dt*4); }
  else shake = Math.max(0, shake-dt*4);

  for(let c of cars) {
    const oS = segments[Math.floor(c.z/SEG_LEN)%segments.length];
    c.z = increase(c.z, dt*c.speed, trackLength); c.percent = percentRemaining(c.z, SEG_LEN);
    const nS = segments[Math.floor(c.z/SEG_LEN)%segments.length];
    if(oS !== nS) { oS.cars.splice(oS.cars.indexOf(c),1); nS.cars.push(c); }
  }
  for(let c of pSeg.cars) {
    if(speed > c.speed && overlap(pX, PLAYER_W, c.offset, c.sprite.w/ROAD_WIDTH)){
      speed = c.speed*0.3; pos = increase(c.z, -PLAYER_Z, trackLength); shake = 1; break;
    }
  }

  pX = limit(pX, -2.4, 2.4); speed = limit(speed, 0, MAX_SPEED);
  steerVis += ((steerIn*sPct) - steerVis) * dt * 10;
  score += dt*sPct*45*(off?0.2:1); bgOff += pSeg.curve*sPct*dt*400;

  if(currentEnv.rain > 0 || currentEnv.snow > 0) {
    const pSpeed = currentEnv.rain > 0 ? 70 : 15;
    for(let p of particles) {
      p.y += p.s * dt * pSpeed; p.x -= steerIn * dt * (currentEnv.snow>0?2.5:0.8);
      if(p.y > 1) { p.y = -0.1; p.x = Math.random(); }
      if(p.x < 0) p.x += 1; else if (p.x > 1) p.x -= 1;
    }
  }
}

/* -------- RENDER ======== */
function project(p, cx, cy, cz, d, w, h, rw){
  p.camera.x=(p.world.x||0)-cx; p.camera.y=(p.world.y||0)-cy; p.camera.z=(p.world.z||0)-cz;
  p.screen.scale=d/p.camera.z; p.screen.x=Math.round(w/2+(p.screen.scale*p.camera.x*w/2));
  p.screen.y=Math.round(h/2-(p.screen.scale*p.camera.y*h/2)); p.screen.w=Math.round(p.screen.scale*rw*w/2);
}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4); ctx.closePath(); ctx.fill(); }

function drawSkyHills(){
  const grad = ctx.createLinearGradient(0,0,0,H*0.62);
  grad.addColorStop(0, currentEnv.sky[0]); grad.addColorStop(0.55, currentEnv.sky[1]); grad.addColorStop(1, currentEnv.sky[2]);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  if(thunderFlash > 0) { ctx.fillStyle=`rgba(255,255,255,${thunderFlash})`; ctx.fillRect(0,0,W,H); }

  const sx = W*0.5 - (bgOff*0.3 % (W*2)), sy = H*0.45;
  if(currentEnv.sun > 0) {
    ctx.globalAlpha = currentEnv.sun; ctx.fillStyle='#ffda44'; ctx.shadowColor='#ffda44'; ctx.shadowBlur=50;
    ctx.beginPath(); ctx.arc(sx,sy,H*0.12,0,7); ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  if(currentEnv.moon > 0) {
    ctx.globalAlpha = currentEnv.moon; ctx.fillStyle='#eaf4ff'; ctx.shadowColor='#fff'; ctx.shadowBlur=25;
    ctx.beginPath(); ctx.arc(sx+W*0.2,sy-H*0.2,H*0.07,0,7); ctx.fill();
    ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(sx+W*0.2 - H*0.025,sy-H*0.2 - H*0.02,H*0.06,0,7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  
  const off = bgOff; const horiz = H/2;
  const layer = (bY, amp, clr, o, f) => {
    ctx.fillStyle=clr; ctx.beginPath(); ctx.moveTo(0,bY+H);
    for(let x=0;x<=W;x+=20){ const t=(x+o)*f; ctx.lineTo(x, bY-amp*(0.55+0.3*Math.sin(t)+0.18*Math.sin(t*2.3))); }
    ctx.lineTo(W,bY+H); ctx.closePath(); ctx.fill();
  };
  const d1 = currentEnv.dark * 0.4; // Menos escuro
  
  // 3 Camadas de fundo (Montanhas Distantes e Colinas)
  layer(horiz, H*0.12, lerpColor('#5b6a7b', '#1c222b', d1), off*0.08, 2*Math.PI/1200); 
  layer(horiz+4, H*0.08, lerpColor('#4b5a6b', '#252b36', d1), off*0.22, 2*Math.PI/900); 
  layer(horiz+10, H*0.05, lerpColor('#3a4b5c', '#1b1f28', d1), off*0.42, 2*Math.PI/620); 
}

function renderPlayer(){
  const w=Math.min(W*0.28, H*0.42), h=w*0.62, bX=W/2+limit(pX,-1.6,1.6)*W*0.045+(shake?(Math.random()-0.5)*shake*9:0), bY=H-h*0.45+(shake?(Math.random()-0.5)*shake*6:0);
  const byOff = carPitch*h*-0.18 + Math.sin(time*30)*(speed/MAX_SPEED)*2;
  ctx.save(); ctx.translate(bX,bY); const x=-w/2, yS=-h/2;

  // Feixe dos Faróis (MUITO MENOR e MAIS BAIXO)
  if(currentEnv.light > 0) {
    ctx.globalCompositeOperation = 'screen';
    const lOp = currentEnv.light * 0.25; // Menos ofuscante
    const lGrad = ctx.createLinearGradient(0, yS, 0, yS - H*0.25);
    lGrad.addColorStop(0, `rgba(220,240,255,${lOp})`); lGrad.addColorStop(1, 'rgba(220,240,255,0)');
    ctx.fillStyle = lGrad;
    
    // Feixe Esq
    ctx.beginPath(); ctx.moveTo(x+w*0.15, yS); ctx.lineTo(-W*0.5, yS - H*0.25); ctx.lineTo(W*0.1, yS - H*0.25); ctx.lineTo(x+w*0.35, yS); ctx.fill();
    // Feixe Dir
    ctx.beginPath(); ctx.moveTo(x+w*0.65, yS); ctx.lineTo(-W*0.1, yS - H*0.25); ctx.lineTo(W*0.5, yS - H*0.25); ctx.lineTo(x+w*0.85, yS); ctx.fill();
    
    ctx.globalCompositeOperation = 'source-over';
  }

  // Sombra
  ctx.fillStyle='rgba(0,0,0,.65)'; ctx.beginPath(); ctx.ellipse(0,yS+h*0.5,w*0.55,h*0.14,0,0,7); ctx.fill();

  // RODAS COM ROTAÇÃO (Melhoradas)
  const wheelW = w*0.16, wheelH = h*0.55;
  ctx.fillStyle='#050608'; roundRect(ctx, x, yS+h*0.15, wheelW, wheelH, h*0.05); roundRect(ctx, x+w*0.84, yS+h*0.15, wheelW, wheelH, h*0.05);
  
  const turnAngle = steerIn * (Math.PI / 5.5);
  ctx.save(); ctx.translate(x+wheelW/2, yS+h*0.25); ctx.rotate(turnAngle);
  roundRect(ctx, -wheelW/2, -wheelH/2, wheelW, wheelH, h*0.05);
  ctx.fillStyle='#222'; roundRect(ctx, -wheelW/4, -wheelH/4, wheelW/2, wheelH/2, h*0.02); ctx.restore();
  
  ctx.save(); ctx.translate(x+w*0.84+wheelW/2, yS+h*0.25); ctx.rotate(turnAngle);
  ctx.fillStyle='#050608'; roundRect(ctx, -wheelW/2, -wheelH/2, wheelW, wheelH, h*0.05);
  ctx.fillStyle='#222'; roundRect(ctx, -wheelW/4, -wheelH/4, wheelW/2, wheelH/2, h*0.02); ctx.restore();

  // Carroceria Inclinando
  ctx.rotate(steerVis*0.09); const yB=-h/2+byOff;
  
  // Teto
  const tg=ctx.createLinearGradient(0,yB,0,yB+h*0.42); tg.addColorStop(0,'#00aaff'); tg.addColorStop(1,'#0044aa');
  ctx.fillStyle=tg; roundRect(ctx,x+w*0.18,yB,w*0.64,h*0.4,h*0.12); ctx.fill();
  
  // Vidro Traseiro (com reflexo)
  const vg=ctx.createLinearGradient(0,yB+h*0.05,0,yB+h*0.35); vg.addColorStop(0,'#03060a'); vg.addColorStop(1,'#101c2e');
  ctx.fillStyle=vg; roundRect(ctx,x+w*0.23,yB+h*0.08,w*0.54,h*0.25,h*0.06); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.15)'; roundRect(ctx,x+w*0.28,yB+h*0.11,w*0.44,h*0.06,h*0.02); ctx.fill();
  
  // Corpo Principal (Largo e Esportivo)
  const bg=ctx.createLinearGradient(0,yB+h*0.3,0,yB+h*0.9); bg.addColorStop(0,'#00ffff'); bg.addColorStop(0.5,'#0077ff'); bg.addColorStop(1,'#001166');
  ctx.fillStyle=bg; roundRect(ctx,x+w*0.02,yB+h*0.3,w*0.96,h*0.62,h*0.14); ctx.fill();
  
  // Detalhe Aerofólio
  ctx.fillStyle='#111'; roundRect(ctx, x+w*0.04, yB+h*0.25, w*0.92, h*0.07, h*0.02); ctx.fill();
  ctx.fillRect(x+w*0.2, yB+h*0.32, w*0.05, h*0.05); ctx.fillRect(x+w*0.75, yB+h*0.32, w*0.05, h*0.05);

  // Lanternas, Freio e Reflexo no Chão
  const brk = input.brake || speed<30;
  ctx.shadowColor = brk?'#ff0033':'rgba(255,0,30,.4)'; ctx.shadowBlur=brk?50:15; ctx.fillStyle=brk?'#ff3355':'#aa0022';
  roundRect(ctx,x+w*0.06,yB+h*0.46,w*0.24,h*0.14,h*0.04); ctx.fill(); roundRect(ctx,x+w*0.7,yB+h*0.46,w*0.24,h*0.14,h*0.04); ctx.fill(); ctx.shadowBlur=0;
  
  // Para-choque e Placa
  ctx.fillStyle='#111'; roundRect(ctx,x+w*0.02,yB+h*0.78,w*0.96,h*0.14,h*0.05); ctx.fill();
  ctx.fillStyle='#eee'; roundRect(ctx,x+w*0.4,yB+h*0.64,w*0.2,h*0.1,h*0.02); ctx.fill();
  
  // Escapamento Esportivo (4 saídas)
  ctx.fillStyle='#222'; 
  roundRect(ctx,x+w*0.14,yB+h*0.86,w*0.06,h*0.08,h*0.02); ctx.fill(); roundRect(ctx,x+w*0.22,yB+h*0.86,w*0.06,h*0.08,h*0.02); ctx.fill();
  roundRect(ctx,x+w*0.72,yB+h*0.86,w*0.06,h*0.08,h*0.02); ctx.fill(); roundRect(ctx,x+w*0.8,yB+h*0.86,w*0.06,h*0.08,h*0.02); ctx.fill();

  ctx.restore();
}

function render(){
  const bSeg=segments[Math.floor(pos/SEG_LEN)%segments.length], bPct=percentRemaining(pos,SEG_LEN);
  const pSeg=segments[Math.floor((pos+PLAYER_Z)/SEG_LEN)%segments.length], pPct=percentRemaining(pos+PLAYER_Z,SEG_LEN);
  
  drawSkyHills();
  let maxy=H, x=0, dx=-(bSeg.curve*bPct);
  const camY = interp(pSeg.p1.world.y, pSeg.p2.world.y, pPct) + CAM_HEIGHT + (shake*60*(Math.random()-0.5));

  // Pista
  for(let n=0; n<DRAW_DIST; n++){
    const s=segments[(bSeg.index+n)%segments.length];
    s.clip=maxy; s.fog=expFog(n/DRAW_DIST, currentEnv.fogDens);
    const cz = pos - (s.index<bSeg.index ? trackLength : 0);
    project(s.p1, pX*ROAD_WIDTH-x, camY, cz, CAM_DEPTH, W, H, ROAD_WIDTH);
    project(s.p2, pX*ROAD_WIDTH-x-dx, camY, cz, CAM_DEPTH, W, H, ROAD_WIDTH);
    x+=dx; dx+=s.curve;

    if(s.p1.camera.z<=CAM_DEPTH || s.p2.screen.y>=s.p1.screen.y || s.p2.screen.y>=maxy) continue;
    
    const p1=s.p1.screen, p2=s.p2.screen, c=s.color, r1=p1.w/6, r2=p2.w/6;
    ctx.fillStyle=c.grass; ctx.fillRect(0,p2.y,W,p1.y-p2.y);
    poly(p1.x-p1.w-r1,p1.y, p1.x-p1.w,p1.y, p2.x-p2.w,p2.y, p2.x-p2.w-r2,p2.y, c.rumble);
    poly(p1.x+p1.w+r1,p1.y, p1.x+p1.w,p1.y, p2.x+p2.w,p2.y, p2.x+p2.w+r2,p2.y, c.rumble);
    poly(p1.x-p1.w,p1.y, p1.x+p1.w,p1.y, p2.x+p2.w,p2.y, p2.x-p2.w,p2.y, c.road);
    if(c.lane){
      const lw1=p1.w*2/LANES, lw2=p2.w*2/LANES, l1=p1.w/26, l2=p2.w/26;
      let lx1=p1.x-p1.w+lw1, lx2=p2.x-p2.w+lw2;
      for(let l=1;l<LANES;l++,lx1+=lw1,lx2+=lw2) poly(lx1-l1/2,p1.y, lx1+l1/2,p1.y, lx2+l2/2,p2.y, lx2-l2/2,p2.y, c.lane);
    }
    if(s.fog<1) { ctx.globalAlpha=1-s.fog; ctx.fillStyle=currentEnv.fog; ctx.fillRect(0,p2.y,W,p1.y-p2.y); ctx.globalAlpha=1; }
    maxy=s.p1.screen.y;
  }

  // Sprites
  for(let n=DRAW_DIST-1; n>0; n--){
    const s=segments[(bSeg.index+n)%segments.length];
    for(let c of s.cars){
      const sc=interp(s.p1.screen.scale, s.p2.screen.scale, c.percent);
      const cx=interp(s.p1.screen.x, s.p2.screen.x, c.percent) + sc*c.offset*ROAD_WIDTH*W/2;
      const cy=interp(s.p1.screen.y, s.p2.screen.y, c.percent);
      drawSprite(c.sprite, sc, cx, cy, s.clip, s.fog, null, true);
    }
    for(let p of s.sprites){
      const sx=s.p1.screen.x + s.p1.screen.scale*p.offset*ROAD_WIDTH*W/2;
      drawSprite(p.source, s.p1.screen.scale, sx, s.p1.screen.y, s.clip, s.fog, p, false);
    }
  }

  if(currentEnv.dark > 0) { ctx.fillStyle = `rgba(0,4,15,${currentEnv.dark})`; ctx.fillRect(0,H*0.45,W,H*0.55); }

  renderPlayer();

  // Partículas
  if(currentEnv.rain > 0 || currentEnv.snow > 0) {
    ctx.strokeStyle = currentEnv.rain > 0 ? `rgba(200,220,255,${currentEnv.rain*0.6})` : `rgba(255,255,255,${currentEnv.snow*0.8})`;
    ctx.lineWidth = currentEnv.rain > 0 ? 1.5 : 3;
    ctx.beginPath();
    const l = currentEnv.rain > 0 ? 35 : 6; 
    for(let p of particles) {
      const px = p.x*W, py = p.y*H;
      ctx.moveTo(px, py); ctx.lineTo(px - (steerIn*18), py + l);
    }
    ctx.stroke();
  }

  if(shake>0.72) { ctx.fillStyle=`rgba(255,0,0,${(shake-0.72)*0.6})`; ctx.fillRect(0,0,W,H); }
}

function drawSprite(src, sc, dX, dY, clipY, fog, obj, isCar){
  if(sc<=0||fog<0.03) return; const dw=sc*src.w*W/2, dh=sc*src.h*W/2;
  const x=dX-dw/2, y=dY-dh; if(dw<1||x>W||x+dw<0) return;
  let img=src.img;
  if(src.frames&&src.frames.length>1){
    const idx=Math.floor((time*1000+(obj?obj.phase:0))/src.fDur)%src.frames.length; img=src.frames[idx];
  }
  const nClip=(y+dh)>clipY;
  if(nClip){ if(clipY<=0) return; ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,clipY); ctx.clip(); }
  
  // Lanternas menores e mais sutis nos carros da frente
  if(isCar && currentEnv.light > 0) {
     ctx.globalAlpha = currentEnv.light * Math.min(1, fog * 2);
     ctx.fillStyle='#ff0000'; ctx.shadowColor='#ff0000'; ctx.shadowBlur=10*sc*100; // Borrão bem menor
     
     // Lanterna Esquerda
     ctx.beginPath(); ctx.ellipse(dX - dw*0.3, dY-dh*0.35, dw*0.1, dh*0.05, 0,0,7); ctx.fill();
     // Lanterna Direita
     ctx.beginPath(); ctx.ellipse(dX + dw*0.3, dY-dh*0.35, dw*0.1, dh*0.05, 0,0,7); ctx.fill();
     
     ctx.shadowBlur=0;
  }

  ctx.globalAlpha=fog; ctx.drawImage(img,x,y,dw,dh); ctx.globalAlpha=1;
  if(nClip) ctx.restore();
}

let lastKmh = -1;
function updateHUD(){
  const kmh = Math.round((speed/MAX_SPEED)*330);
  if(kmh!==lastKmh){
    lastKmh=kmh; document.getElementById('uiKmh').textContent=kmh; const pct=kmh/330;
    document.getElementById('needle').style.transform=`translate(-50%,-100%) rotate(${-120+pct*240}deg)`;
    document.getElementById('ring').style.background=`conic-gradient(from 210deg, #00ffff 0deg, #fff ${pct*240}deg, rgba(255,255,255,.07) ${pct*240}deg, transparent 240deg)`;
  }
  document.getElementById('uiScore').textContent=Math.floor(score).toLocaleString('pt-BR');
  document.getElementById('uiDist').textContent=Math.floor(dist).toLocaleString('pt-BR')+' m';
}

function frame(now){
  if(!window.lastT) window.lastT=now; let dt=Math.min((now-window.lastT)/1000, 0.25); window.lastT=now;
  window.acc = (window.acc||0)+dt; while(window.acc>=1/60){ update(1/60); window.acc-=1/60; }
  render(); updateHUD(); requestAnimationFrame(frame);
}

resize(); buildTrack(); speed=0; requestAnimationFrame(frame);
})();
</script>
