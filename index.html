<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPS Premium Tracker</title>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary-color: #007AFF; --bg-color: #f4f4f9; --text-color: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 20px 30px 20px; }
        
        .top-controls { display: flex; justify-content: space-between; pointer-events: auto; }
        
        .btn-action { background: rgba(255, 255, 255, 0.95); border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); cursor: pointer; color: var(--text-color); font-size: 1.2rem; }
        .btn-sync { background: var(--primary-color); color: white; border-radius: 25px; padding: 0 20px; width: auto; font-weight: bold; font-size: 1rem; gap: 8px; }

        .bottom-panel { background: white; border-radius: 25px; padding: 25px 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1); pointer-events: auto; position: relative; }

        /* Sistema de Busca e Autocomplete */
        .search-container { display: flex; align-items: center; background: var(--bg-color); border-radius: 15px; padding: 12px 15px; margin-bottom: 15px; }
        .search-container i { color: #888; margin-right: 10px; }
        .search-container input { border: none; background: transparent; width: 100%; font-size: 1.1rem; outline: none; color: var(--text-color); }
        
        #suggestions { position: absolute; bottom: 100%; left: 0; width: 100%; background: white; border-radius: 15px 15px 0 0; max-height: 200px; overflow-y: auto; box-shadow: 0 -10px 20px rgba(0,0,0,0.1); display: none; z-index: 20; }
        .suggestion-item { padding: 15px 20px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.95rem; }
        .suggestion-item:active { background: #f0f0f0; }

        .btn-navigate { width: 100%; background: var(--primary-color); color: white; border: none; padding: 16px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-navigate.active { background: #34C759; }

        .side-controls { position: absolute; bottom: 180px; right: 20px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-layer">
        <div class="top-controls">
            <button class="btn-action" onclick="alert('Menu')"><i class="fa-solid fa-bars"></i></button>
            <button class="btn-action btn-sync" onclick="requestCompassPermission()"><i class="fa-solid fa-compass"></i> Ativar Bússola</button>
        </div>

        <div class="side-controls">
            <button class="btn-action" onclick="recenterMap()"><i class="fa-solid fa-crosshairs"></i></button>
        </div>

        <div class="bottom-panel">
            <ul id="suggestions"></ul>
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="destination" placeholder="Buscar endereço..." oninput="searchLocation(this.value)">
            </div>
            <button class="btn-navigate" id="btn-start" onclick="toggleNavigation()">
                <i class="fa-solid fa-route"></i> Iniciar Rota
            </button>
        </div>
    </div>

    <script>
        let map;
        let userMarker;
        let isNavigating = false;
        
        // Iniciando em Itamaraju, BA
        let currentLat = -17.0384; 
        let currentLng = -39.5283;
        let currentHeading = 0;
        
        let destLat = null;
        let destLng = null;

        const mapStyle = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
        });

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: mapStyle,
                center: [currentLng, currentLat],
                zoom: 15,
                pitch: 0,
                bearing: 0
            });

            // Criar pino de navegação do usuário
            const el = document.createElement('div');
            el.innerHTML = '<i class="fa-solid fa-location-arrow" style="color: #007AFF; font-size: 28px; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.4)); transform: rotate(-45deg);"></i>';
            
            userMarker = new maplibregl.Marker({ element: el })
                .setLngLat([currentLng, currentLat])
                .addTo(map);

            startTracking();
        }

        // --- RASTREAMENTO GPS E BÚSSOLA ---
        function startTracking() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    position => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        
                        // Atualiza a posição no mapa
                        userMarker.setLngLat([currentLng, currentLat]);

                        // Se estiver se movendo rápido o suficiente, o GPS fornece a direção precisa (heading)
                        if (position.coords.speed > 1.5 && position.coords.heading !== null) {
                            currentHeading = position.coords.heading;
                            if (isNavigating) map.setBearing(currentHeading);
                        }
                    },
                    error => console.warn('Erro GPS:', error),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        // Acessar bússola do celular (Giroscópio/Magnetômetro)
        function requestCompassPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            enableCompass();
                            alert("Bússola ativada!");
                        }
                    }).catch(console.error);
            } else {
                enableCompass(); // Androids mais antigos não exigem requestPermission
            }
        }

        function enableCompass() {
            window.addEventListener('deviceorientationabsolute', (event) => {
                if (isNavigating) {
                    let compass = event.webkitCompassHeading || Math.abs(event.alpha - 360);
                    if (compass) {
                        currentHeading = compass;
                        map.setBearing(currentHeading);
                    }
                }
            }, true);
        }

        // --- SISTEMA DE BUSCA (NOMINATIM API) ---
        let searchTimeout;
        function searchLocation(query) {
            const suggestionsBox = document.getElementById('suggestions');
            if (query.length < 3) {
                suggestionsBox.style.display = 'none';
                return;
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=5&addressdetails=1`)
                    .then(res => res.json())
                    .then(data => {
                        suggestionsBox.innerHTML = '';
                        if (data.length > 0) {
                            suggestionsBox.style.display = 'block';
                            data.forEach(place => {
                                const li = document.createElement('div');
                                li.className = 'suggestion-item';
                                // Formatar nome do local
                                const nome = place.address.road || place.display_name.split(',')[0];
                                const bairro = place.address.suburb || place.address.city_district || "";
                                li.innerHTML = `<strong>${nome}</strong> <br><small>${bairro}</small>`;
                                li.onclick = () => selectLocation(place.lat, place.lon, nome);
                                suggestionsBox.appendChild(li);
                            });
                        }
                    });
            }, 500); // Aguarda o usuário parar de digitar por meio segundo
        }

        // --- TRAÇAR ROTA (OSRM API) ---
        function selectLocation(lat, lng, name) {
            document.getElementById('destination').value = name;
            document.getElementById('suggestions').style.display = 'none';
            destLat = lat;
            destLng = lng;

            // Fazer chamada para a API de Rotas (OSRM)
            const url = `https://router.project-osrm.org/route/v1/driving/${currentLng},${currentLat};${destLng},${destLat}?overview=full&geometries=geojson`;
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        const routeGeoJSON = data.routes[0].geometry;
                        drawRoute(routeGeoJSON);
                        
                        // Ajustar a câmera para mostrar a rota inteira
                        const coordinates = routeGeoJSON.coordinates;
                        const bounds = coordinates.reduce(function (bounds, coord) {
                            return bounds.extend(coord);
                        }, new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));

                        map.fitBounds(bounds, { padding: 50 });
                    }
                });
        }

        function drawRoute(geojsonData) {
            if (map.getSource('route')) {
                map.getSource('route').setData(geojsonData);
            } else {
                map.addSource('route', { type: 'geojson', data: geojsonData });
                map.addLayer({
                    id: 'route-line',
                    type: 'line',
                    source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#007AFF', 'line-width': 6, 'line-opacity': 0.8 }
                });
            }
        }

        // --- NAVEGAÇÃO 3D ---
        function toggleNavigation() {
            const btn = document.getElementById('btn-start');

            if (!isNavigating) {
                if (!destLat) { alert("Pesquise e selecione um destino na lista primeiro!"); return; }
                
                isNavigating = true;
                btn.innerHTML = '<i class="fa-solid fa-times"></i> Encerrar Rota';
                btn.classList.add('active');
                
                // Mudar para visão 3D com a bússola/Heading atual
                map.flyTo({ center: [currentLng, currentLat], zoom: 18, pitch: 60, bearing: currentHeading, essential: true });

            } else {
                isNavigating = false;
                destLat = null; destLng = null;
                document.getElementById('destination').value = '';
                btn.innerHTML = '<i class="fa-solid fa-route"></i> Iniciar Rota';
                btn.classList.remove('active');
                
                if (map.getLayer('route-line')) map.removeLayer('route-line');
                if (map.getSource('route')) map.removeSource('route');

                map.flyTo({ center: [currentLng, currentLat], zoom: 15, pitch: 0, bearing: 0 });
            }
        }

        function recenterMap() {
            map.flyTo({ center: [currentLng, currentLat], zoom: isNavigating ? 18 : 15, pitch: isNavigating ? 60 : 0, bearing: isNavigating ? currentHeading : 0 });
        }
    </script>
</body>
</html>
