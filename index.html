<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Estrada Infinita 3D — Realista</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:#eaf4ff}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  #hud{position:absolute;inset:0;pointer-events:none;user-select:none}

  #stats{position:absolute;top:16px;left:16px;display:flex;gap:10px}
  .stat{
    background:linear-gradient(160deg,rgba(12,20,34,.78),rgba(6,10,18,.85));
    border:1px solid rgba(90,190,255,.28);
    border-radius:12px;padding:8px 14px;min-width:96px;
    box-shadow:0 6px 22px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(6px);
  }
  .stat .k{display:block;font-size:9px;letter-spacing:2px;color:#6fb4e6;font-weight:700}
  .stat .v{display:block;font-size:20px;font-weight:800;color:#fff;
    text-shadow:0 0 14px rgba(80,200,255,.55);font-variant-numeric:tabular-nums}

  #speedo{position:absolute;left:18px;bottom:18px;width:132px;height:132px}
  #speedo .bg{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 42%,rgba(18,30,48,.92),rgba(4,7,13,.96));
    border:2px solid rgba(90,190,255,.25);
    box-shadow:0 0 34px rgba(0,140,255,.22), inset 0 0 26px rgba(0,0,0,.75);
  }
  #speedo .ring{
    position:absolute;inset:7px;border-radius:50%;
    -webkit-mask:radial-gradient(circle,transparent 66%,#000 68%);
            mask:radial-gradient(circle,transparent 66%,#000 68%);
  }
  #speedo .needle{
    position:absolute;left:50%;top:50%;width:4px;height:44px;
    background:linear-gradient(to top,#ff2d55,#ff9f0a);
    border-radius:3px;transform-origin:50% 100%;
    transform:translate(-50%,-100%) rotate(-120deg);
    box-shadow:0 0 12px rgba(255,60,80,.85);
    transition:transform .06s linear;
  }
  #speedo .hub{
    position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 35%,#dfefff,#4a6f96);
    box-shadow:0 0 10px rgba(0,0,0,.8);
  }
  #speedo .num{
    position:absolute;left:0;right:0;bottom:24px;text-align:center;
  }
  #speedo .num span{font-size:26px;font-weight:800;color:#fff;
    text-shadow:0 0 16px rgba(80,200,255,.7);font-variant-numeric:tabular-nums}
  #speedo .num small{display:block;font-size:9px;letter-spacing:2px;color:#6fb4e6;font-weight:700}

  #hint{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    font-size:12px;letter-spacing:1px;color:#9ec8e8;
    background:rgba(6,12,22,.6);padding:8px 18px;border-radius:20px;
    border:1px solid rgba(90,190,255,.2);white-space:nowrap;
    animation:fadeHint 10s ease forwards;
  }
  @keyframes fadeHint{0%,72%{opacity:1}100%{opacity:0}}

  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  #touch .side{position:absolute;bottom:22px;display:flex;gap:14px;pointer-events:auto}
  #touch .side.left{left:170px}
  #touch .side.right{right:22px}
  #touch button{
    width:76px;height:76px;border-radius:50%;font-size:26px;color:#dff0ff;
    background:linear-gradient(160deg,rgba(20,36,58,.85),rgba(8,14,24,.9));
    border:2px solid rgba(90,190,255,.35);
    box-shadow:0 6px 20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    touch-action:none;
  }
  #touch button:active{background:rgba(0,160,255,.4);transform:scale(.94)}
  @media (hover:none) and (pointer:coarse){
    #touch{display:block}
    #hint{display:none}
    #speedo{width:104px;height:104px}
    #speedo .num span{font-size:20px}
    .stat{min-width:74px;padding:6px 10px}
    .stat .v{font-size:15px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="stats">
      <div class="stat"><span class="k">PONTOS</span><span class="v" id="uiScore">0</span></div>
      <div class="stat"><span class="k">DISTÂNCIA</span><span class="v" id="uiDist">0 m</span></div>
      <div class="stat"><span class="k">RECORDE</span><span class="v" id="uiBest">0</span></div>
    </div>

    <div id="speedo">
      <div class="bg"></div>
      <div class="ring" id="ring"></div>
      <div class="needle" id="needle"></div>
      <div class="hub"></div>
      <div class="num"><span id="uiKmh">0</span><small>KM/H</small></div>
    </div>

    <div id="hint">↑/W acelerar · ↓/S frear · ←→/A D curvar · P pausar</div>
  </div>

  <div id="touch">
    <div class="side left">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
    </div>
    <div class="side right">
      <button data-k="brake">▼</button>
      <button data-k="gas">▲</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   ESTRADA INFINITA 3D — pseudo-3D racing engine v2
   ===================================================================== */

/* ------------------------- CONSTANTES ------------------------- */
const SEG_LEN      = 200;
const RUMBLE_LEN   = 3;
const ROAD_WIDTH   = 2000;
const LANES        = 3;
const FOV          = 100;
const CAM_HEIGHT   = 1000;
const CAM_DEPTH    = 1 / Math.tan((FOV/2) * Math.PI/180);
const DRAW_DIST    = 300;
const PLAYER_Z     = CAM_HEIGHT * CAM_DEPTH;
const FOG_DENSITY  = 5;

const MAX_SPEED       = SEG_LEN * 60;
const ACCEL           = MAX_SPEED / 4.5;
const BREAKING        = -MAX_SPEED;
const DECEL           = -MAX_SPEED / 5;
const OFF_ROAD_DECEL  = -MAX_SPEED / 2.2;
const OFF_ROAD_LIMIT  = MAX_SPEED / 4;
const CENTRIFUGAL     = 0.32;

const PLAYER_W = 700 / ROAD_WIDTH;

const SKY_TOP  = '#0b4a8a';
const SKY_MID  = '#4b9bd8';
const SKY_BOT  = '#c8e6f7';
const FOG_COLOR= '#c8e6f7';

const COLORS = {
  LIGHT : { road:'#4a4a54', grass:'#2f9e44', rumble:'#f1f3f5', lane:'#f8f9fa' },
  DARK  : { road:'#41414b', grass:'#2b8a3e', rumble:'#e03131', lane:null     },
  START : { road:'#ffffff', grass:'#2f9e44', rumble:'#ffffff', lane:null     },
  FINISH: { road:'#1b1f24', grass:'#2b8a3e', rumble:'#1b1f24', lane:null     }
};

/* ------------------------- UTILITÁRIOS ------------------------- */
const limit     = (v,a,b) => Math.max(a, Math.min(v,b));
const easeIn    = (a,b,p) => a + (b-a) * p*p;
const easeInOut = (a,b,p) => a + (b-a) * ((-Math.cos(p*Math.PI)/2) + 0.5);
const interp    = (a,b,p) => a + (b-a) * p;
const percentRemaining = (n,t) => (n % t) / t;
const expFog    = (d,dens) => 1 / Math.pow(Math.E, d*d*dens);
const accelerate= (v,a,dt) => v + a*dt;
const randomChoice = arr => arr[Math.floor(Math.random()*arr.length)];

function increase(start, inc, max){
  let r = start + inc;
  while (r >= max) r -= max;
  while (r < 0)    r += max;
  return r;
}
function roundRect(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,   x+w,y+h, r);
  g.arcTo(x+w,y+h, x,  y+h, r);
  g.arcTo(x,  y+h, x,  y,   r);
  g.arcTo(x,  y,   x+w,y,   r);
  g.closePath();
}

/* =====================================================================
   CANVAS
   ===================================================================== */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
let W = 0, H = 0, skyGrad = null;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth  || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  skyGrad = ctx.createLinearGradient(0,0,0,H*0.62);
  skyGrad.addColorStop(0,    SKY_TOP);
  skyGrad.addColorStop(0.55, SKY_MID);
  skyGrad.addColorStop(1,    SKY_BOT);
}
window.addEventListener('resize', resize);

/* =====================================================================
   SPRITES PRÉ-RENDERIZADOS
   ===================================================================== */
function makeSprite(worldW, worldH, drawFn, frames, frameDuration){
  const n = frames || 1;
  const h = 256;
  const w = Math.max(8, Math.round(h * worldW / worldH));
  const list = [];
  for (let i=0;i<n;i++){
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    drawFn(g, 0, 0, w, h, i);
    list.push(c);
  }
  return { img:list[0], frames:list, w:worldW, h:worldH, count:n,
           frameDuration: frameDuration || 150 };
}

/* ---------- vegetação / cenário ---------- */
function drawTree(g,x,y,w,h){
  const cx = x + w/2;
  g.fillStyle = '#5b3a1e';
  g.fillRect(cx - w*0.07, y + h*0.52, w*0.14, h*0.48);
  const blob = (bx,by,r,col) => { g.fillStyle=col; g.beginPath(); g.arc(bx,by,r,0,7); g.fill(); };
  blob(cx,           y+h*0.40, w*0.40, '#1f7a35');
  blob(cx - w*0.26,  y+h*0.54, w*0.30, '#1f7a35');
  blob(cx + w*0.26,  y+h*0.54, w*0.30, '#1f7a35');
  blob(cx - w*0.12,  y+h*0.28, w*0.28, '#2ba84a');
  blob(cx + w*0.14,  y+h*0.32, w*0.24, '#2ba84a');
  blob(cx,           y+h*0.20, w*0.22, '#3cc45c');
}

function drawPine(g,x,y,w,h){
  const cx = x + w/2;
  g.fillStyle = '#4a3018';
  g.fillRect(cx - w*0.06, y + h*0.78, w*0.12, h*0.22);
  const tri = (ty,by,hw,col) => {
    g.fillStyle = col;
    g.beginPath(); g.moveTo(cx, ty); g.lineTo(cx+hw, by); g.lineTo(cx-hw, by);
    g.closePath(); g.fill();
  };
  tri(y+h*0.02, y+h*0.42, w*0.30, '#146b2c');
  tri(y+h*0.22, y+h*0.62, w*0.38, '#1a8035');
  tri(y+h*0.44, y+h*0.82, w*0.46, '#1f9440');
}

function drawPalm(g,x,y,w,h){
  const cx = x + w/2;
  g.strokeStyle = '#7a5a34'; g.lineWidth = w*0.10; g.lineCap='round';
  g.beginPath(); g.moveTo(cx, y+h); g.quadraticCurveTo(cx+w*0.06, y+h*0.5, cx, y+h*0.22); g.stroke();
  g.fillStyle = '#1f8f3a';
  for (let i=0;i<7;i++){
    const a = -Math.PI/2 + (i-3)*0.42;
    g.beginPath();
    g.moveTo(cx, y+h*0.22);
    g.quadraticCurveTo(cx + Math.cos(a)*w*0.42, y+h*0.22 + Math.sin(a)*h*0.14,
                       cx + Math.cos(a)*w*0.60, y+h*0.22 + Math.sin(a)*h*0.22 + h*0.05);
    g.quadraticCurveTo(cx + Math.cos(a)*w*0.40, y+h*0.24 + Math.sin(a)*h*0.10,
                       cx, y+h*0.24);
    g.closePath(); g.fill();
  }
  g.fillStyle='#8a6a3a';
  g.beginPath(); g.arc(cx-w*0.07, y+h*0.25, w*0.06,0,7); g.fill();
  g.beginPath(); g.arc(cx+w*0.07, y+h*0.25, w*0.06,0,7); g.fill();
}

function drawBush(g,x,y,w,h){
  g.fillStyle = '#1f7a35';
  g.beginPath(); g.arc(x+w*0.30, y+h*0.66, w*0.30, 0, 7); g.fill();
  g.beginPath(); g.arc(x+w*0.70, y+h*0.66, w*0.30, 0, 7); g.fill();
  g.fillStyle = '#2ba84a';
  g.beginPath(); g.arc(x+w*0.50, y+h*0.44, w*0.36, 0, 7); g.fill();
}

function drawRock(g,x,y,w,h){
  g.fillStyle = '#6b7280';
  g.beginPath();
  g.moveTo(x+w*0.06, y+h);
  g.lineTo(x+w*0.24, y+h*0.22);
  g.lineTo(x+w*0.58, y);
  g.lineTo(x+w*0.88, y+h*0.34);
  g.lineTo(x+w, y+h);
  g.closePath(); g.fill();
  g.fillStyle = '#8b93a1';
  g.beginPath();
  g.moveTo(x+w*0.24, y+h*0.22);
  g.lineTo(x+w*0.58, y);
  g.lineTo(x+w*0.66, y+h*0.42);
  g.closePath(); g.fill();
}

function drawHouse(g,x,y,w,h){
  g.fillStyle = '#e9e2d4';
  g.fillRect(x+w*0.12, y+h*0.36, w*0.76, h*0.64);
  g.fillStyle = '#b23a2e';
  g.beginPath();
  g.moveTo(x, y+h*0.40); g.lineTo(x+w*0.5, y); g.lineTo(x+w, y+h*0.40);
  g.closePath(); g.fill();
  g.fillStyle = '#8ecae6';
  g.fillRect(x+w*0.22, y+h*0.52, w*0.20, h*0.22);
  g.fillRect(x+w*0.58, y+h*0.52, w*0.20, h*0.22);
  g.fillStyle = '#6b4a2a';
  g.fillRect(x+w*0.44, y+h*0.72, w*0.16, h*0.28);
}

function drawBuilding(g,x,y,w,h){
  g.fillStyle = '#8d99ae';
  g.fillRect(x+w*0.06, y, w*0.88, h);
  g.fillStyle = '#6b7689';
  g.fillRect(x+w*0.06, y, w*0.88, h*0.05);
  g.fillStyle = '#ffe6a7';
  for (let r=0;r<6;r++){
    for (let c=0;c<3;c++){
      if (Math.random() < 0.72)
        g.fillRect(x + w*(0.16 + c*0.26), y + h*(0.10 + r*0.145), w*0.16, h*0.085);
    }
  }
}

function drawSign(g,x,y,w,h){
  g.fillStyle = '#7a7a7a';
  g.fillRect(x+w*0.44, y+h*0.55, w*0.12, h*0.45);
  g.fillStyle = '#2b8a3e';
  g.fillRect(x, y, w, h*0.58);
  g.strokeStyle = '#fff'; g.lineWidth = Math.max(1,w*0.06);
  g.strokeRect(x+w*0.09, y+h*0.08, w*0.82, h*0.42);
  g.fillStyle = '#fff';
  g.fillRect(x+w*0.22, y+h*0.19, w*0.56, h*0.06);
  g.fillRect(x+w*0.22, y+h*0.31, w*0.38, h*0.06);
}

function drawLamp(g,x,y,w,h){
  g.fillStyle = '#6b7280';
  g.fillRect(x+w*0.38, y+h*0.10, w*0.24, h*0.90);
  g.beginPath();
  g.arc(x+w*0.5, y+h*0.10, w*0.42, Math.PI, 0);
  g.lineTo(x+w*0.92, y+h*0.10);
  g.lineTo(x+w*0.08, y+h*0.10);
  g.closePath(); g.fill();
  g.fillStyle = '#ffe9a8';
  g.beginPath(); g.arc(x+w*0.5, y+h*0.14, w*0.20, 0, 7); g.fill();
}

/* ---------- SEMÁFORO (4 estados) ---------- */
function drawTrafficLight(g,x,y,w,h,f){
  const cx = x + w/2;

  // poste
  g.fillStyle = '#3a3a3a';
  g.fillRect(cx - w*0.045, y + h*0.30, w*0.09, h*0.70);
  // base
  g.fillStyle = '#242424';
  g.fillRect(cx - w*0.11, y + h*0.965, w*0.22, h*0.035);
  // suporte
  g.fillStyle = '#2e2e2e';
  g.fillRect(cx - w*0.035, y + h*0.295, w*0.07, h*0.03);

  // caixa
  g.fillStyle = '#161616';
  roundRect(g, x + w*0.15, y, w*0.70, h*0.33, w*0.12);
  g.fill();
  // moldura
  g.strokeStyle = '#2a2a2a';
  g.lineWidth = Math.max(1, w*0.025);
  roundRect(g, x + w*0.15, y, w*0.70, h*0.33, w*0.12);
  g.stroke();

  // estados: 0=vermelho, 1=verm+amar, 2=verde, 3=amarelo
  const states = [
    [1,0,0],
    [1,1,0],
    [0,0,1],
    [0,1,0]
  ];
  const s = states[f % 4];
  const r = w*0.135;
  const ys = [y + h*0.075, y + h*0.165, y + h*0.255];
  const cols = [
    ['#ff2222','#390909'],
    ['#ffcc00','#392900'],
    ['#22dd44','#0a3a12']
  ];

  for (let i=0;i<3;i++){
    const on = s[i];
    if (on){
      g.shadowColor = cols[i][0];
      g.shadowBlur = 16;
    }
    g.fillStyle = on ? cols[i][0] : cols[i][1];
    g.beginPath();
    g.arc(cx, ys[i], r, 0, 7);
    g.fill();
    g.shadowBlur = 0;
  }

  // brilho/reflexo na parte de baixo
  g.fillStyle = 'rgba(255,255,255,.06)';
  g.beginPath();
  g.ellipse(cx, y+h*0.33, w*0.28, h*0.008, 0, 0, 7);
  g.fill();
}

/* ---------- PESSOA (ciclo de caminhada 8 frames) ---------- */
function drawPerson(g,x,y,w,h,f,shirt,hair){
  const t = (f / 8) * Math.PI * 2;
  const legSwing = Math.sin(t)     * w * 0.22;
  const armSwing = Math.sin(t)     * w * 0.20;
  const bob      = Math.abs(Math.sin(t)) * h * 0.014;
  const cx = x + w/2;
  const cy = y + bob;

  // sombra no chão
  g.fillStyle = 'rgba(0,0,0,.30)';
  g.beginPath();
  g.ellipse(cx, y + h*0.985, w*0.34, h*0.020, 0, 0, 7);
  g.fill();

  // pernas
  g.strokeStyle = '#2b3a55';
  g.lineWidth = w*0.14;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(cx - w*0.07, cy + h*0.56);
  g.lineTo(cx - w*0.07 + legSwing, cy + h*0.955);
  g.moveTo(cx + w*0.07, cy + h*0.56);
  g.lineTo(cx + w*0.07 - legSwing, cy + h*0.955);
  g.stroke();

  // sapatos
  g.fillStyle = '#14161c';
  g.beginPath();
  g.ellipse(cx - w*0.07 + legSwing, cy + h*0.962, w*0.10, h*0.020, 0, 0, 7);
  g.fill();
  g.beginPath();
  g.ellipse(cx + w*0.07 - legSwing, cy + h*0.962, w*0.10, h*0.020, 0, 0, 7);
  g.fill();

  // torso
  g.fillStyle = shirt;
  roundRect(g, cx - w*0.20, cy + h*0.28, w*0.40, h*0.32, w*0.10);
  g.fill();
  // sombreamento lateral
  g.fillStyle = 'rgba(0,0,0,.14)';
  roundRect(g, cx + w*0.01, cy + h*0.28, w*0.19, h*0.32, w*0.10);
  g.fill();
  // colarinho
  g.fillStyle = 'rgba(0,0,0,.18)';
  roundRect(g, cx - w*0.12, cy + h*0.27, w*0.24, h*0.04, w*0.03);
  g.fill();

  // braços
  g.strokeStyle = shirt;
  g.lineWidth = w*0.11;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(cx - w*0.17, cy + h*0.31);
  g.lineTo(cx - w*0.17 - armSwing*0.75, cy + h*0.555);
  g.moveTo(cx + w*0.17, cy + h*0.31);
  g.lineTo(cx + w*0.17 + armSwing*0.75, cy + h*0.555);
  g.stroke();

  // mãos
  g.fillStyle = '#e8b48a';
  g.beginPath();
  g.arc(cx - w*0.17 - armSwing*0.75, cy + h*0.565, w*0.055, 0, 7);
  g.fill();
  g.beginPath();
  g.arc(cx + w*0.17 + armSwing*0.75, cy + h*0.565, w*0.055, 0, 7);
  g.fill();

  // pescoço
  g.fillStyle = '#dba57c';
  g.fillRect(cx - w*0.05, cy + h*0.245, w*0.10, h*0.05);

  // cabeça (vista de trás)
  g.fillStyle = '#e8b48a';
  g.beginPath();
  g.arc(cx, cy + h*0.16, w*0.17, 0, 7);
  g.fill();

  // cabelo
  g.fillStyle = hair;
  g.beginPath();
  g.arc(cx, cy + h*0.152, w*0.178, 0, 7);
  g.fill();
  // orelhas
  g.fillStyle = '#dba57c';
  g.beginPath();
  g.arc(cx - w*0.168, cy + h*0.168, w*0.032, 0, 7);
  g.fill();
  g.beginPath();
  g.arc(cx + w*0.168, cy + h*0.168, w*0.032, 0, 7);

}

function drawCarSprite(g,x,y,w,h,color){

  g.beginPath(); g.ellipse(x+w*0.5, y+h*0.97, w*0.48, h*0.09, 0, 0, 7); g.fill();

  g.fillStyle = '#15161a';
  roundRect(g, x+w*0.00, y+h*0.52, w*0.16, h*0.44, h*0.05); g.fill();
  roundRect(g, x+w*0.84, y+h*0.52, w*0.16, h*0.44, h*0.05); g.fill();

  roundRect(g, x+w*0.17, y+h*0.02, w*0.66, h*0.46, h*0.14); g.fill();

  bg.addColorStop(0.5, color.dark);

  roundRect(g, x+w*0.08, y+h*0.34, w*0.84, h*0.12, h*0.05); g.fill();

  // lanternas

  roundRect(g, x+w*0.40, y+h*0.66, w*0.20, h*0.10, h*0.02); g.fill();
}

/* =====================================================================
   CONSTRUÇÃO DA PISTA
   ===================================================================== */
let segments = [];
let cars = [];
let trackLength = 0;

const ROAD = {
  LENGTH: { NONE:0, SHORT:25, MEDIUM:50, LONG:100 },
  HILL  : { NONE:0, LOW:20, MEDIUM:40, HIGH:60 },
  CURVE : { NONE:0, EASY:2, MEDIUM:4, HARD:6 }
};

function lastY(){
  return segments.length === 0 ? 0 : segments[segments.length-1].p2.world.y;
}

function addSegment(curve, y){
  const n = segments.length;
  segments.push({
    index : n,
    p1 : { world:{ y:lastY(), z: n*SEG_LEN },      camera:{}, screen:{} },
    p2 : { world:{ y:y,       z:(n+1)*SEG_LEN },   camera:{}, screen:{} },
    curve : curve,
    sprites : [],
    cars : [],
    fog : 1,
    clip : 0,
    color : null
  });
}

function addRoad(enter, hold, leave, curve, y){
  const startY = lastY();
  const endY   = startY + (y || 0) * SEG_LEN;
  const total  = enter + hold + leave;
  for (let n=0;n<enter;n++) addSegment(easeIn(0,curve,n/enter),      easeInOut(startY,endY,n/total));
  for (let n=0;n<hold ;n++) addSegment(curve,                        easeInOut(startY,endY,(enter+n)/total));
  for (let n=0;n<leave;n++) addSegment(easeInOut(curve,0,n/leave),   easeInOut(startY,endY,(enter+hold+n)/total));
}

const addStraight = (n) => { n = n || ROAD.LENGTH.MEDIUM; addRoad(n,n,n,0,0); };
const addHill     = (n,h) => { n = n || ROAD.LENGTH.MEDIUM; h = (h===undefined?ROAD.HILL.MEDIUM:h); addRoad(n,n,n,0,h); };
const addCurve    = (n,c,h) => { n = n || ROAD.LENGTH.MEDIUM; c = (c===undefined?ROAD.CURVE.MEDIUM:c); h = h||0; addRoad(n,n,n,c,h); };

function addLowRollingHills(n,h){
  n = n || ROAD.LENGTH.SHORT; h = h || ROAD.HILL.LOW;
  addRoad(n,n,n, 0,                     h/2);
  addRoad(n,n,n, 0,                    -h);
  addRoad(n,n,n, ROAD.CURVE.EASY,       h);
  addRoad(n,n,n, 0,                     0);
  addRoad(n,n,n,-ROAD.CURVE.EASY,       h/2);
  addRoad(n,n,n, 0,                     0);
}

function addSCurves(){
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY,   ROAD.HILL.NONE);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  ROAD.CURVE.EASY,  -ROAD.HILL.LOW);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY,   ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.MEDIUM,-ROAD.HILL.MEDIUM);
}

function addBumps(){
  addRoad(10,10,10,0, 5);
  addRoad(10,10,10,0,-2);
  addRoad(10,10,10,0,-5);
  addRoad(10,10,10,0, 8);
  addRoad(10,10,10,0, 5);
  addRoad(10,10,10,0,-7);
  addRoad(10,10,10,0, 5);
  addRoad(10,10,10,0,-2);
}

function addDownhillToEnd(n){
  n = n || 200;
  addRoad(n,n,n, -ROAD.CURVE.EASY, -lastY()/SEG_LEN);
}

function addSprite(i, sprite, offset, phase){
  if (i < 0 || i >= segments.length) return;
  segments[i].sprites.push({ source:sprite, offset:offset, phase: phase || 0 });
}

function buildTrack(){
  segments = [];
  cars = [];

  addStraight(ROAD.LENGTH.SHORT);
  addLowRollingHills();
  addSCurves();
  addCurve(ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.LOW);
  addBumps();
  addLowRollingHills();
  addCurve(ROAD.LENGTH.LONG*2, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
  addStraight();
  addHill(ROAD.LENGTH.MEDIUM, ROAD.HILL.HIGH);
  addSCurves();
  addCurve(ROAD.LENGTH.LONG, -ROAD.CURVE.MEDIUM, ROAD.HILL.NONE);
  addHill(ROAD.LENGTH.LONG, ROAD.HILL.HIGH);
  addCurve(ROAD.LENGTH.LONG, ROAD.CURVE.MEDIUM, -ROAD.HILL.LOW);
  addBumps();
  addHill(ROAD.LENGTH.LONG, -ROAD.HILL.MEDIUM);
  addStraight();
  addSCurves();
  addDownhillToEnd();

  for (let n=0;n<segments.length;n++){
    segments[n].color = (Math.floor(n/RUMBLE_LEN) % 2) ? COLORS.DARK : COLORS.LIGHT;
  }
  for (let n=0;n<12;n++){
    segments[n].color = COLORS.START;
    segments[segments.length-1-n].color = COLORS.FINISH;
  }

  trackLength = segments.length * SEG_LEN;

  decorate();
  resetCars();
}

function decorate(){
  const n = segments.length;

  // postes de luz
  for (let i=24; i<n-24; i+=16){
    addSprite(i, SPRITES.LAMP,  1.28);
    addSprite(i, SPRITES.LAMP, -1.28);
  }

  // SEMÁFOROS (pares, a cada ~380 segmentos)
  for (let i=120; i<n-120; i+=380){
    const phase = Math.random() * 8000;
    addSprite(i, SPRITES.TRAFFIC,  1.28, phase);
    addSprite(i, SPRITES.TRAFFIC, -1.28, phase);
  }

  // PESSOAS andando no acostamento — muitas, com fase aleatória
  for (let i=16; i<n-16; i+=3){
    if (Math.random() < 0.62){
      const side = Math.random() < 0.5 ? -1 : 1;
      const off  = side * (1.05 + Math.random()*0.75);
      const sp   = randomChoice(PERSON_SPRITES);
      addSprite(i, sp, off, Math.random()*2000);
    }
  }

  // vegetação
  for (let i=8; i<n-8; i+=2){
    if (Math.random() < 0.55){
      const side = Math.random() < 0.5 ? -1 : 1;
      const off  = side * (2.3 + Math.random()*5.5);
      const kind = Math.random();
      const sp = kind < 0.34 ? SPRITES.TREE
               : kind < 0.58 ? SPRITES.PINE
               : kind < 0.74 ? SPRITES.PALM
               : kind < 0.90 ? SPRITES.BUSH
               :               SPRITES.ROCK;
      addSprite(i, sp, off);
    }
  }

  // casas e prédios
  for (let i=40; i<n-40; i+=22){
    const side = Math.random() < 0.5 ? -1 : 1;
    const off  = side * (3.6 + Math.random()*3.2);
    addSprite(i, Math.random() < 0.72 ? SPRITES.HOUSE : SPRITES.BUILDING, off);
  }

  // placas
  for (let i=60; i<n-60; i+=47){
    const side = Math.random() < 0.5 ? -1 : 1;
    addSprite(i, SPRITES.SIGN, side * 1.40);
  }
}

/* --------- trânsito (carros + ônibus) --------- */
function resetCars(){
  cars = [];
  const totalCars = 42;
  const totalBuses = 12;
  const total = totalCars + totalBuses;

  for (let i=0;i<total;i++){
    const isBus = i >= totalCars;
    const offset = (Math.random()*1.6 - 0.8);
    const z = Math.floor(Math.random()*segments.length) * SEG_LEN;
    const sprite = isBus ? randomChoice(BUS_SPRITES) : randomChoice(CAR_SPRITES);
    const baseSpd = MAX_SPEED/4.5 + Math.random()*MAX_SPEED/3.2;
    const spd = isBus ? baseSpd * 0.72 : baseSpd;
    const car = { offset:offset, z:z, sprite:sprite, speed:spd, percent:0, isBus:isBus };
    const seg = findSegment(z);
    if (seg) seg.cars.push(car);
    cars.push(car);
  }
}

/* =====================================================================
   ESTADO DO JOGO
   ===================================================================== */
let position = 0;
let playerX  = 0;
let speed    = 0;
let shake    = 0;
let bgOffset = 0;
let time     = 0;
let distanceM = 0;
let score     = 0;
let best      = parseInt(localStorage.getItem('estrada_best_v2') || '0', 10) || 0;
let paused    = false;
let lastKmh   = -1;

/* ---- COMANDOS MELHORADOS ---- */
const input = { gas:false, brake:false, left:false, right:false };
let steerInput = 0;      // -1..1 suavizado
let steerVisual = 0;     // inclinação visual do carro
let throttle = 0;        // 0..1 suavizado

/* =====================================================================
   ENTRADA
   ===================================================================== */
const KEYMAP = {
  ArrowUp:'gas', KeyW:'gas', Space:'gas',
  ArrowDown:'brake', KeyS:'brake',
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right'
};

window.addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (a){ input[a] = true; e.preventDefault(); }
  if (e.code === 'KeyP'){ paused = !paused; }
}, { passive:false });

window.addEventListener('keyup', e => {
  const a = KEYMAP[e.code];
  if (a){ input[a] = false; e.preventDefault(); }
}, { passive:false });

window.addEventListener('blur', () => {
  input.gas = input.brake = input.left = input.right = false;
});

document.querySelectorAll('#touch button').forEach(btn => {
  const k = btn.dataset.k;
  const on  = e => { e.preventDefault(); input[k] = true;  };
  const off = e => { e.preventDefault(); input[k] = false; };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

/* =====================================================================
   LÓGICA
   ===================================================================== */
function findSegment(z){
  return segments[Math.floor(z / SEG_LEN) % segments.length];
}

function overlap(x1,w1,x2,w2,pct){
  const half = (pct || 1) / 2;
  const min1 = x1 - w1*half, max1 = x1 + w1*half;
  const min2 = x2 - w2*half, max2 = x2 + w2*half;
  return !(max1 < min2 || min1 > max2);
}

function update(dt){
  time += dt;

  const playerSegment = findSegment(position + PLAYER_Z);
  const speedPercent  = speed / MAX_SPEED;

  /* ---- SUAVIZAÇÃO DOS COMANDOS ---- */
  // esterço: interpolação exponencial (suave mas responsivo)
  const steerTarget = (input.right?1:0) - (input.left?1:0);
  const steerLerp = 1 - Math.pow(0.0015, dt);      // ~ rápido a 60fps
  steerInput += (steerTarget - steerInput) * steerLerp;
  if (Math.abs(steerInput) < 0.02 && steerTarget === 0) steerInput = 0;

  // throttle/brake suave para visual
  const thTarget = input.gas ? 1 : (input.brake ? -1 : 0);
  throttle += (thTarget - throttle) * Math.min(1, dt*6);

  /* ---- MOVIMENTO ---- */
  position = increase(position, dt * speed, trackLength);
  distanceM += (dt * speed) / 380;

  // direção com autoridade dependente da velocidade
  const steerAuthority = 1 - speedPercent * 0.18;
  const dx = dt * 2.2 * speedPercent * steerAuthority;
  playerX += steerInput * dx;

  // força centrífuga nas curvas
  playerX -= dx * speedPercent * playerSegment.curve * CENTRIFUGAL;

  // aceleração / freio / desaceleração
  if (input.gas)        speed = accelerate(speed, ACCEL, dt);
  else if (input.brake) speed = accelerate(speed, BREAKING, dt);
  else                  speed = accelerate(speed, DECEL, dt);

  // fora da estrada
  const offRoad = (playerX < -1 || playerX > 1);
  if (offRoad && speed > OFF_ROAD_LIMIT){
    speed = accelerate(speed, OFF_ROAD_DECEL, dt);
    shake = Math.min(1, shake + dt*3);
  } else {
    shake = Math.max(0, shake - dt*3);
  }

  // trânsito
  updateCars(dt, playerSegment);

  // colisão com carros/ônibus
  for (const car of playerSegment.cars){
    const carW = car.sprite.w / ROAD_WIDTH;
    if (speed > car.speed && overlap(playerX, PLAYER_W, car.offset, carW, 0.82)){
      speed = car.speed * (car.isBus ? 0.28 : 0.42);
      position = increase(car.z, -PLAYER_Z, trackLength);
      shake = 1;
      break;
    }
  }

  playerX = limit(playerX, -2.4, 2.4);
  speed   = limit(speed, 0, MAX_SPEED);

  /* ---- VISUAL: inclinação do carro ---- */
  const leanTarget = steerInput * speedPercent;
  steerVisual += (leanTarget - steerVisual) * Math.min(1, dt*9);

  // pontuação
  score += dt * speedPercent * 42 * (offRoad ? 0.35 : 1);

  // fundo parallax
  bgOffset += playerSegment.curve * speedPercent * dt * 380;
}

function updateCars(dt, playerSegment){
  for (let i=0;i<cars.length;i++){
    const car = cars[i];
    const oldSeg = findSegment(car.z);

    car.z = increase(car.z, dt * car.speed, trackLength);
    car.percent = percentRemaining(car.z, SEG_LEN);

    const newSeg = findSegment(car.z);
    if (oldSeg !== newSeg){
      const idx = oldSeg.cars.indexOf(car);
      if (idx >= 0) oldSeg.cars.splice(idx,1);
      newSeg.cars.push(car);
    }
  }
}

/* =====================================================================
   RENDERIZAÇÃO
   ===================================================================== */
function project(p, camX, camY, camZ, depth, width, height, roadWidth){
  p.camera.x = (p.world.x || 0) - camX;
  p.camera.y = (p.world.y || 0) - camY;
  p.camera.z = (p.world.z || 0) - camZ;
  p.screen.scale = depth / p.camera.z;
  p.screen.x = Math.round((width /2) + (p.screen.scale * p.camera.x * width /2));
  p.screen.y = Math.round((height/2) - (p.screen.scale * p.camera.y * height/2));
  p.screen.w = Math.round(             (p.screen.scale * roadWidth  * width /2));
}

function polygon(x1,y1,x2,y2,x3,y3,x4,y4,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath(); ctx.fill();
}

function renderSegment(seg){
  const p1 = seg.p1.screen, p2 = seg.p2.screen;
  const c  = seg.color;
  const r1 = p1.w / Math.max(6, 2*LANES);
  const r2 = p2.w / Math.max(6, 2*LANES);
  const l1 = p1.w / Math.max(32, 8*LANES);
  const l2 = p2.w / Math.max(32, 8*LANES);

  ctx.fillStyle = c.grass;
  ctx.fillRect(0, p2.y, W, p1.y - p2.y);

  polygon(p1.x-p1.w-r1, p1.y, p1.x-p1.w, p1.y, p2.x-p2.w, p2.y, p2.x-p2.w-r2, p2.y, c.rumble);
  polygon(p1.x+p1.w+r1, p1.y, p1.x+p1.w, p1.y, p2.x+p2.w, p2.y, p2.x+p2.w+r2, p2.y, c.rumble);
  polygon(p1.x-p1.w, p1.y, p1.x+p1.w, p1.y, p2.x+p2.w, p2.y, p2.x-p2.w, p2.y, c.road);

  if (c.lane){
    const lw1 = p1.w*2/LANES, lw2 = p2.w*2/LANES;
    let lx1 = p1.x - p1.w + lw1;
    let lx2 = p2.x - p2.w + lw2;
    for (let lane=1; lane<LANES; lane++, lx1+=lw1, lx2+=lw2){
      polygon(lx1-l1/2, p1.y, lx1+l1/2, p1.y, lx2+l2/2, p2.y, lx2-l2/2, p2.y, c.lane);
    }
  }

  if (seg.fog < 1){
    ctx.globalAlpha = 1 - seg.fog;
    ctx.fillStyle = FOG_COLOR;
    ctx.fillRect(0, p2.y, W, p1.y - p2.y);
    ctx.globalAlpha = 1;
  }
}

function renderSprite(src, scale, destX, destY, clipY, fog, obj){
  if (scale <= 0) return;
  const dw = scale * src.w * W/2;
  const dh = scale * src.h * W/2;
  if (dw < 1.6 || dh < 1.6) return;

  const x = destX - dw/2;
  const y = destY - dh;
  if (x > W || x + dw < 0) return;

  const alpha = fog;
  if (alpha < 0.035) return;

  let img = src.img;
  if (src.frames && src.frames.length > 1){
    const phase = obj ? (obj.phase || 0) : 0;
    const idx = Math.floor((time*1000 + phase) / src.frameDuration) % src.frames.length;
    img = src.frames[(idx + src.frames.length) % src.frames.length];
  }

  const needClip = (y + dh) > clipY;
  if (needClip){
    if (clipY <= 0) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, clipY);
    ctx.clip();
  }

  ctx.globalAlpha = alpha;
  ctx.drawImage(img, x, y, dw, dh);
  ctx.globalAlpha = 1;

  if (needClip) ctx.restore();
}

/* ---------- fundo ---------- */
function drawSky(){
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,W,H);

  const sx = W*0.74, sy = H*0.19;
  const glow = ctx.createRadialGradient(sx,sy,4, sx,sy, H*0.30);
  glow.addColorStop(0,   'rgba(255,250,215,.95)');
  glow.addColorStop(0.14,'rgba(255,238,160,.55)');
  glow.addColorStop(1,   'rgba(255,230,140,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx,sy,H*0.30,0,7); ctx.fill();
  ctx.fillStyle = 'rgba(255,252,230,.95)';
  ctx.beginPath(); ctx.arc(sx,sy,H*0.045,0,7); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.55)';
  const co = (bgOffset*0.06) % (W*1.6);
  const clouds = [[0.10,0.16,1.0],[0.42,0.10,0.72],[0.68,0.24,0.85],[0.92,0.14,0.6]];
  for (const [cx,cy,s] of clouds){
    let px = ((cx*W*1.6 - co) % (W*1.6));
    if (px < -W*0.3) px += W*1.6;
    const py = cy*H, r = H*0.030*s;
    ctx.beginPath();
    ctx.arc(px,        py,       r*1.5, 0,7);
    ctx.arc(px + r*1.5,py - r*0.4,r*1.1, 0,7);
    ctx.arc(px - r*1.5,py + r*0.1,r*1.0, 0,7);
    ctx.arc(px + r*0.4,py + r*0.5,r*1.2, 0,7);
    ctx.fill();
  }
}

function drawHills(){
  const horizon = H/2;

  const layer = (baseY, amp, color, off, freq) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, baseY + 400);
    for (let x=0; x<=W; x+=10){
      const t = (x + off) * freq;
      const y = baseY - amp * (0.55
                 + 0.30*Math.sin(t)
                 + 0.18*Math.sin(t*2.31 + 1.2)
                 + 0.14*Math.sin(t*0.63 + 0.4));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, baseY + 400);
    ctx.closePath();
    ctx.fill();
  };

  const off = bgOffset;
  layer(horizon + 4,  H*0.085, '#8fb6d4', off*0.22, 2*Math.PI/900);
  layer(horizon + 10, H*0.055, '#6d9cc0', off*0.42, 2*Math.PI/620);
  layer(horizon + 16, H*0.030, '#4f7fa6', off*0.68, 2*Math.PI/430);
}

/* ---------- CARRO DO JOGADOR (bem detalhado) ---------- */
function drawPlayerCar(){
  const carW = Math.min(W*0.30, H*0.48);
  const carH = carW * 0.72;

  const baseX = W/2 + limit(playerX, -1.6, 1.6) * W * 0.045
              + (shake ? (Math.random()-0.5) * shake * 9 : 0);
  const baseY = H - carH*0.78
              + Math.sin(time*22) * (speed/MAX_SPEED) * 2.8
              + (shake ? (Math.random()-0.5) * shake * 6 : 0);

  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.rotate(steerVisual * 0.055);   // inclinação por esterço

  const x = -carW/2, y = -carH/2, w = carW, h = carH;

  // sombra
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath();
  ctx.ellipse(0, h*0.50, w*0.53, h*0.14, 0, 0, 7);
  ctx.fill();

  // rodas traseiras
  ctx.fillStyle = '#111216';
  roundRect(ctx, x+w*0.00, y+h*0.20, w*0.15, h*0.62, h*0.05); ctx.fill();
  roundRect(ctx, x+w*0.85, y+h*0.20, w*0.15, h*0.62, h*0.05); ctx.fill();
  // rodas dianteiras (um pouco mais largas, viram com o esterço)
  const wTurn = steerInput * w * 0.03;
  ctx.fillStyle = '#0d0e12';
  roundRect(ctx, x+w*0.015 + wTurn, y+h*0.22, w*0.13, h*0.58, h*0.05); ctx.fill();
  roundRect(ctx, x+w*0.855 + wTurn, y+h*0.22, w*0.13, h*0.58, h*0.05); ctx.fill();
  // detalhes das rodas
  ctx.fillStyle = '#3a3d44';
  roundRect(ctx, x+w*0.025, y+h*0.28, w*0.11, h*0.20, h*0.04); ctx.fill();
  roundRect(ctx, x+w*0.865, y+h*0.28, w*0.11, h*0.20, h*0.04); ctx.fill();

  // teto
  const tg = ctx.createLinearGradient(0, y, 0, y+h*0.42);
  tg.addColorStop(0, '#7a1010');
  tg.addColorStop(1, '#4a0a0a');
  ctx.fillStyle = tg;
  roundRect(ctx, x+w*0.19, y+h*0.00, w*0.62, h*0.42, h*0.13); ctx.fill();

  // vidro traseiro
  const vg = ctx.createLinearGradient(0, y+h*0.04, 0, y+h*0.36);
  vg.addColorStop(0,'#0a1620');
  vg.addColorStop(0.5,'#1f3d54');
  vg.addColorStop(1,'#2e5670');
  ctx.fillStyle = vg;
  roundRect(ctx, x+w*0.24, y+h*0.06, w*0.52, h*0.28, h*0.07); ctx.fill();
  // reflexo do vidro
  ctx.fillStyle = 'rgba(200,230,255,.22)';
  roundRect(ctx, x+w*0.27, y+h*0.10, w*0.46, h*0.08, h*0.03); ctx.fill();

  // carroceria
  const bg = ctx.createLinearGradient(0, y+h*0.22, 0, y+h*0.92);
  bg.addColorStop(0,   '#ff5858');
  bg.addColorStop(0.35,'#e62626');
  bg.addColorStop(0.7, '#b91616');
  bg.addColorStop(1,   '#7a0a0a');
  ctx.fillStyle = bg;
  roundRect(ctx, x+w*0.04, y+h*0.24, w*0.92, h*0.66, h*0.14); ctx.fill();

  // brilho superior
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  roundRect(ctx, x+w*0.09, y+h*0.28, w*0.82, h*0.11, h*0.05); ctx.fill();

  // lanternas
  const brakeOn = input.brake || speed < 30;
  ctx.shadowColor = brakeOn ? '#ff3a3a' : 'rgba(255,60,60,.4)';
  ctx.shadowBlur  = brakeOn ? 26 : 10;
  ctx.fillStyle   = brakeOn ? '#ff6a6a' : '#c02020';
  roundRect(ctx, x+w*0.08, y+h*0.44, w*0.20, h*0.15, h*0.05); ctx.fill();
  roundRect(ctx, x+w*0.72, y+h*0.44, w*0.20, h*0.15, h*0.05); ctx.fill();
  ctx.shadowBlur = 0;

  // para-choque
  ctx.fillStyle = '#25272d';
  roundRect(ctx, x+w*0.04, y+h*0.72, w*0.92, h*0.16, h*0.05); ctx.fill();
  // detalhe cromado
  ctx.fillStyle = '#8a929c';
  roundRect(ctx, x+w*0.10, y+h*0.74, w*0.80, h*0.025, h*0.01); ctx.fill();

  // placa
  ctx.fillStyle = '#e9eef4';
  roundRect(ctx, x+w*0.40, y+h*0.60, w*0.20, h*0.11, h*0.02); ctx.fill();
  ctx.fillStyle = '#5a6673';
  ctx.fillRect(x+w*0.42, y+h*0.635, w*0.16, h*0.012);
  ctx.fillRect(x+w*0.42, y+h*0.665, w*0.16, h*0.012);

  // aerofólio
  ctx.fillStyle = '#1c1e23';
  roundRect(ctx, x+w*0.06, y+h*0.20, w*0.88, h*0.06, h*0.02); ctx.fill();
  // hastes do aerofólio
  ctx.fillStyle = '#2a2c32';
  roundRect(ctx, x+w*0.16, y+h*0.24, w*0.05, h*0.05, h*0.01); ctx.fill();
  roundRect(ctx, x+w*0.79, y+h*0.24, w*0.05, h*0.05, h*0.01); ctx.fill();

  // escape
  ctx.fillStyle = '#3a3d44';
  roundRect(ctx, x+w*0.18, y+h*0.86, w*0.10, h*0.045, h*0.015); ctx.fill();
  roundRect(ctx, x+w*0.72, y+h*0.86, w*0.10, h*0.045, h*0.015); ctx.fill();

  ctx.restore();
}

/* ---------- render principal ---------- */
function render(){
  const baseSegment  = findSegment(position);
  const basePercent  = percentRemaining(position, SEG_LEN);
  const playerSegment= findSegment(position + PLAYER_Z);
  const playerPercent= percentRemaining(position + PLAYER_Z, SEG_LEN);
  const playerY      = interp(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);

  drawSky();
  drawHills();

  let maxy = H;
  let x  = 0;
  let dx = -(baseSegment.curve * basePercent);

  const camShake = shake * 60 * (Math.random() - 0.5);
  const camY = playerY + CAM_HEIGHT + camShake;

  // ---- estrada ----
  for (let n=0; n<DRAW_DIST; n++){
    const seg = segments[(baseSegment.index + n) % segments.length];
    seg.looped = seg.index < baseSegment.index;
    seg.fog    = expFog(n / DRAW_DIST, FOG_DENSITY);
    seg.clip   = maxy;

    const camZ = position - (seg.looped ? trackLength : 0);

    project(seg.p1, (playerX * ROAD_WIDTH) - x,      camY, camZ, CAM_DEPTH, W, H, ROAD_WIDTH);
    project(seg.p2, (playerX * ROAD_WIDTH) - x - dx, camY, camZ, CAM_DEPTH, W, H, ROAD_WIDTH);

    x  += dx;
    dx += seg.curve;

    if (seg.p1.camera.z <= CAM_DEPTH) continue;
    if (seg.p2.screen.y >= seg.p1.screen.y) continue;
    if (seg.p2.screen.y >= maxy) continue;

    renderSegment(seg);
    maxy = seg.p1.screen.y;
  }

  // ---- sprites e veículos ----
  for (let n = DRAW_DIST - 1; n > 0; n--){
    const seg = segments[(baseSegment.index + n) % segments.length];

    // veículos de trânsito
    for (let i=0;i<seg.cars.length;i++){
      const car = seg.cars[i];
      const scale = interp(seg.p1.screen.scale, seg.p2.screen.scale, car.percent);
      const cx    = interp(seg.p1.screen.x, seg.p2.screen.x, car.percent)
                  + (scale * car.offset * ROAD_WIDTH * W/2);
      const cy    = interp(seg.p1.screen.y, seg.p2.screen.y, car.percent);
      renderSprite(car.sprite, scale, cx, cy, seg.clip, seg.fog, null);
    }

    // cenário / pessoas / semáforos
    for (let i=0;i<seg.sprites.length;i++){
      const sp = seg.sprites[i];
      const scale = seg.p1.screen.scale;
      const sx = seg.p1.screen.x + (scale * sp.offset * ROAD_WIDTH * W/2);
      const sy = seg.p1.screen.y;
      renderSprite(sp.source, scale, sx, sy, seg.clip, seg.fog, sp);
    }
  }

  // ---- carro do jogador ----
  drawPlayerCar();

  // ---- vinheta ----
  const vg = ctx.createRadialGradient(W/2, H*0.5, Math.min(W,H)*0.35, W/2, H*0.5, Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  // ---- flash de colisão ----
  if (shake > 0.72){
    ctx.fillStyle = 'rgba(255,60,60,' + ((shake-0.72)*0.6) + ')';
    ctx.fillRect(0,0,W,H);
  }

  // ---- pausa ----
  if (paused){
    ctx.fillStyle = 'rgba(4,8,16,.72)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#eaf4ff';
    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(H*0.07) + 'px Segoe UI, system-ui, sans-serif';
    ctx.fillText('PAUSADO', W/2, H/2);
    ctx.font = '600 ' + Math.round(H*0.026) + 'px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#8ec6ea';
    ctx.fillText('Pressione P para continuar', W/2, H/2 + H*0.065);
    ctx.textAlign = 'start';
  }
}

/* =====================================================================
   HUD
   ===================================================================== */
const uiScore = document.getElementById('uiScore');
const uiDist  = document.getElementById('uiDist');
const uiBest  = document.getElementById('uiBest');
const uiKmh   = document.getElementById('uiKmh');
const needle  = document.getElementById('needle');
const ring    = document.getElementById('ring');

uiBest.textContent = Math.floor(best).toLocaleString('pt-BR');

function updateHUD(){
  const kmh = Math.round((speed / MAX_SPEED) * 320);
  if (kmh !== lastKmh){
    lastKmh = kmh;
    uiKmh.textContent = kmh;
    const pct = kmh / 320;
    needle.style.transform =
      'translate(-50%,-100%) rotate(' + (-120 + pct*240) + 'deg)';
    ring.style.background =
      'conic-gradient(from 210deg, #00e5ff 0deg, #00ffa3 ' + (pct*240) + 'deg, ' +
      'rgba(255,255,255,.07) ' + (pct*240) + 'deg, rgba(255,255,255,.07) 240deg, transparent 240deg)';
  }
  uiScore.textContent = Math.floor(score).toLocaleString('pt-BR');
  uiDist.textContent  = Math.floor(distanceM).toLocaleString('pt-BR') + ' m';
}

let bestTimer = 0;
function checkBest(dt){
  bestTimer += dt;
  if (bestTimer > 0.5){
    bestTimer = 0;
    if (score > best){
      best = score;
      localStorage.setItem('estrada_best_v2', String(Math.floor(best)));
      uiBest.textContent = Math.floor(best).toLocaleString('pt-BR');
    }
  }
}

/* =====================================================================
   LOOP
   ===================================================================== */
const STEP = 1/60;
let lastTime = 0;
let accumulator = 0;

function frame(now){
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.25) dt = 0.25;

  if (!paused){
    accumulator += dt;
    let guard = 0;
    while (accumulator >= STEP && guard < 6){
      update(STEP);
      accumulator -= STEP;
      guard++;
    }
    if (guard >= 6) accumulator = 0;
  } else {
    accumulator = 0;
  }

  render();
  updateHUD();
  checkBest(dt);

  requestAnimationFrame(frame);
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
resize();
buildTrack();
position = 0;
playerX  = 0;
speed    = MAX_SPEED * 0.12;
requestAnimationFrame(frame);

})();
