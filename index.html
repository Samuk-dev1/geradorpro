<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gestor IPTV · Premium</title>
  <!-- Phosphor Icons (elegante, consistente) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* ===== RESET & GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: #0b0d15;
      color: #eef2ff;
      padding-bottom: 90px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    #app {
      max-width: 480px;
      width: 100%;
      padding: 20px 16px 100px;
      position: relative;
    }

    /* ===== GLASSMORPHISM + NEON ===== */
    .glass-card {
      background: rgba(20, 25, 40, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(120, 80, 255, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(120, 80, 255, 0.1);
      border-radius: 28px;
      padding: 18px 16px;
      transition: all 0.2s ease;
    }

    h1, h2, h3 {
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    h2 {
      font-size: 1.4rem;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #b6a0ff, #7b4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    /* ===== TOGGLE iOS ===== */
    .toggle-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0;
    }
    .toggle-switch {
      position: relative;
      width: 52px;
      height: 30px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #2a2f44;
      border-radius: 30px;
      transition: 0.3s;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      height: 24px;
      width: 24px;
      left: 3px;
      bottom: 3px;
      background: #eef2ff;
      border-radius: 50%;
      transition: 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .toggle-switch input:checked + .toggle-slider {
      background: linear-gradient(135deg, #7b4dff, #3f8cff);
    }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(22px);
      background: white;
    }

    /* ===== BOTÕES ===== */
    .btn-neon {
      background: linear-gradient(135deg, #6b3bff, #3f7bff);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 40px;
      box-shadow: 0 4px 18px rgba(60, 40, 220, 0.5);
      transition: 0.2s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-neon:active {
      transform: scale(0.95);
      box-shadow: 0 2px 10px rgba(60, 40, 220, 0.7);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #7b4dff;
      color: #c6b8ff;
      padding: 8px 14px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-outline:active {
      background: rgba(123, 77, 255, 0.2);
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      background: rgba(16, 20, 32, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 48px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-around;
      border: 1px solid rgba(120, 80, 255, 0.3);
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #6b718a;
      transition: 0.2s;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 40px;
      background: transparent;
    }
    .nav-item i {
      font-size: 1.8rem;
      transition: 0.2s;
    }
    .nav-item span {
      font-size: 0.6rem;
      font-weight: 500;
      margin-top: 2px;
    }
    .nav-item.active {
      color: #b6a0ff;
      background: rgba(123, 77, 255, 0.15);
    }
    .nav-item.active i {
      color: #b6a0ff;
      filter: drop-shadow(0 0 8px #7b4dff);
    }

    /* ===== FAB ===== */
    .fab {
      position: fixed;
      bottom: 100px;
      right: 24px;
      background: linear-gradient(135deg, #8b5cf6, #4f7bff);
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 24px rgba(80, 40, 220, 0.6);
      color: white;
      font-size: 2.2rem;
      border: none;
      transition: 0.2s;
      z-index: 50;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .fab:active {
      transform: scale(0.92);
    }

    /* ===== CARDS ===== */
    .client-card, .plan-card, .template-card {
      margin-bottom: 14px;
      padding: 16px;
      border-radius: 24px;
      background: rgba(22, 28, 44, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #2a2f44;
      color: #b6b9d0;
    }
    .status-badge.ativo { background: #1f3b3b; color: #6fcf97; }
    .status-badge.vencido { background: #3b1f2a; color: #f28b82; }
    .status-badge.proximo { background: #3b2f1f; color: #f9ca7f; }

    .actions-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .icon-btn {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 30px;
      padding: 8px 14px;
      color: #c6b8ff;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .icon-btn:active { background: rgba(123, 77, 255, 0.2); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: #141a28;
      padding: 24px 20px 40px;
      width: 100%;
      max-width: 480px;
      border-radius: 40px 40px 0 0;
      border: 1px solid rgba(120,80,255,0.2);
      transform: translateY(40px);
      transition: 0.3s;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    /* ===== OUTROS ===== */
    .section {
      display: none;
      animation: fadeSlide 0.3s ease;
    }
    .section.active {
      display: block;
    }
    @keyframes fadeSlide {
      0% { opacity: 0.3; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .input-glass {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 40px;
      padding: 14px 18px;
      color: white;
      width: 100%;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    .input-glass:focus {
      border-color: #7b4dff;
      box-shadow: 0 0 0 3px rgba(123, 77, 255, 0.2);
    }
    .time-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .time-group input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 30px;
      padding: 12px 16px;
      color: white;
      font-size: 1rem;
      flex: 1;
      min-width: 100px;
    }
    .separator {
      height: 1px;
      background: rgba(255,255,255,0.05);
      margin: 20px 0;
    }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
<div id="app">
  <!-- ===== TELAS ===== -->
  <!-- Clientes -->
  <div id="tab-clientes" class="section active">
    <div class="flex-between"><h2>📡 Clientes</h2><span id="client-count" style="font-size:0.8rem;color:#6b718a;">0</span></div>
    <div id="client-list"></div>
  </div>

  <!-- Planos -->
  <div id="tab-planos" class="section">
    <h2>📦 Planos</h2>
    <div id="plan-list"></div>
    <button class="btn-neon" style="margin-top:12px;" onclick="adicionarPlano()">+ Novo Plano</button>
  </div>

  <!-- Templates -->
  <div id="tab-templates" class="section">
    <h2>📋 Templates</h2>
    <div id="template-list"></div>
  </div>

  <!-- Configurações -->
  <div id="tab-config" class="section">
    <h2>⚙️ Configurações</h2>
    <div class="glass-card">
      <div style="margin-bottom:12px;font-weight:500;">Horários de Notificação</div>
      <div class="time-group" id="time-group">
        <input type="time" class="input-glass" id="time1" value="08:00">
        <input type="time" class="input-glass" id="time2" value="13:00">
        <input type="time" class="input-glass" id="time3" value="18:00">
      </div>
      <button class="btn-neon" onclick="salvarHorarios()" style="width:100%;justify-content:center;">Salvar Horários</button>
    </div>
    <div class="glass-card" style="margin-top:16px;">
      <div class="flex-between">
        <span>Backup & Restore</span>
        <div>
          <button class="btn-outline" onclick="fazerBackup()">💾 Backup</button>
          <button class="btn-outline" onclick="document.getElementById('restoreInput').click()">📂 Restore</button>
          <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="restoreBackup(event)">
        </div>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fab-add" onclick="abrirModalCliente()">+</button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="tab-clientes"><i class="ph ph-users"></i><span>Clientes</span></div>
    <div class="nav-item" data-tab="tab-planos"><i class="ph ph-cards"></i><span>Planos</span></div>
    <div class="nav-item" data-tab="tab-templates"><i class="ph ph-files"></i><span>Templates</span></div>
    <div class="nav-item" data-tab="tab-config"><i class="ph ph-gear"></i><span>Config</span></div>
  </nav>

  <!-- MODAL CLIENTE -->
  <div class="modal-overlay" id="modalCliente">
    <div class="modal-content">
      <h3 style="margin-bottom:16px;">➕ Novo Cliente</h3>
      <input class="input-glass" id="inputNome" placeholder="Nome do cliente" style="margin-bottom:12px;">
      <input class="input-glass" id="inputNumero" placeholder="WhatsApp (DDD + número)" style="margin-bottom:12px;">
      <input class="input-glass" id="inputPlano" placeholder="Plano (ex: Basic)" style="margin-bottom:12px;">
      <input class="input-glass" id="inputVencimento" type="date" style="margin-bottom:12px;">
      <div style="display:flex;gap:12px;margin-top:8px;">
        <button class="btn-neon" onclick="salvarCliente()">Salvar</button>
        <button class="btn-outline" onclick="fecharModalCliente()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL TEMPLATE ENVIO -->
  <div class="modal-overlay" id="modalEnvio">
    <div class="modal-content">
      <h3 style="margin-bottom:12px;">✈️ Escolher Template</h3>
      <div id="template-envio-list"></div>
      <button class="btn-outline" onclick="fecharModalEnvio()" style="margin-top:12px;">Cancelar</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ===== CAPACITOR CHECK =====
    const isCap = typeof window.Capacitor !== 'undefined' && window.Capacitor.isNativePlatform();
    const cap = isCap ? window.Capacitor : null;

    // ===== STORE (Preferences + fallback) =====
    const STORE_KEY = 'iptv_manager_data';
    let data = {
      clientes: [],
      planos: [],
      templates: [
        { id: 't1', label: 'Vence hoje', dias: 0, ativo: true },
        { id: 't2', label: 'Vence em 1 dia', dias: 1, ativo: true },
        { id: 't3', label: 'Vence em 2 dias', dias: 2, ativo: true },
        { id: 't4', label: 'Vence em 3 dias', dias: 3, ativo: true },
        { id: 't5', label: 'Vence em 4 dias', dias: 4, ativo: true },
        { id: 't6', label: 'Vence em 5 dias', dias: 5, ativo: true },
        { id: 't7', label: 'Vencidos', dias: -1, ativo: true }
      ],
      horarios: ['08:00', '13:00', '18:00']
    };

    // carregar dados
    async function carregarDados() {
      try {
        if (isCap) {
          const { Preferences } = await import('@capacitor/preferences');
          const result = await Preferences.get({ key: STORE_KEY });
          if (result.value) {
            const parsed = JSON.parse(result.value);
            data = { ...data, ...parsed };
          }
        } else {
          const local = localStorage.getItem(STORE_KEY);
          if (local) {
            const parsed = JSON.parse(local);
            data = { ...data, ...parsed };
          }
        }
      } catch (e) { console.warn('Erro ao carregar dados', e); }
      renderAll();
    }
    async function salvarDados() {
      try {
        const str = JSON.stringify(data);
        if (isCap) {
          const { Preferences } = await import('@capacitor/preferences');
          await Preferences.set({ key: STORE_KEY, value: str });
        } else {
          localStorage.setItem(STORE_KEY, str);
        }
      } catch (e) { console.warn('Erro ao salvar', e); }
    }

    // ===== RENDER =====
    function renderAll() {
      renderClientes();
      renderPlanos();
      renderTemplates();
      renderHorarios();
      document.getElementById('client-count').textContent = data.clientes.length;
    }

    function renderClientes() {
      const container = document.getElementById('client-list');
      if (!data.clientes.length) {
        container.innerHTML = `<div class="glass-card" style="text-align:center;color:#6b718a;">Nenhum cliente cadastrado</div>`;
        return;
      }
      container.innerHTML = data.clientes.map((c, idx) => {
        const statusClass = c.status || 'ativo';
        return `
          <div class="client-card">
            <div class="card-row"><strong>${c.nome}</strong><span class="status-badge ${statusClass}">${statusClass}</span></div>
            <div class="card-row"><span>📱 ${c.numero}</span><span>📅 ${c.vencimento}</span></div>
            <div class="card-row"><span>📦 ${c.plano}</span></div>
            <div class="actions-group">
              <button class="icon-btn" onclick="whatsappCliente('${c.numero}')"><i class="ph ph-whatsapp-logo"></i> WhatsApp</button>
              <button class="icon-btn" onclick="abrirModalEnvio(${idx})"><i class="ph ph-paper-plane-tilt"></i> Enviar</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderPlanos() {
      const container = document.getElementById('plan-list');
      if (!data.planos.length) {
        container.innerHTML = `<div class="glass-card" style="text-align:center;color:#6b718a;">Nenhum plano criado</div>`;
        return;
      }
      container.innerHTML = data.planos.map((p, i) => `
        <div class="plan-card"><div class="flex-between"><span><strong>${p.nome}</strong></span><span>R$ ${p.preco}</span></div></div>
      `).join('');
    }

    function renderTemplates() {
      const container = document.getElementById('template-list');
      container.innerHTML = data.templates.map((t, i) => `
        <div class="template-card">
          <div class="toggle-wrapper">
            <span>${t.label}</span>
            <label class="toggle-switch">
              <input type="checkbox" ${t.ativo ? 'checked' : ''} onchange="toggleTemplate(${i}, this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div style="display:flex;gap:8px;margin-top:4px;">
            <button class="btn-outline" onclick="copiarTemplate(${i})"><i class="ph ph-copy"></i> Copiar</button>
          </div>
        </div>
      `).join('');
    }

    function renderHorarios() {
      document.getElementById('time1').value = data.horarios[0] || '08:00';
      document.getElementById('time2').value = data.horarios[1] || '13:00';
      document.getElementById('time3').value = data.horarios[2] || '18:00';
    }

    // ===== FUNÇÕES =====
    window.adicionarPlano = function() {
      const nome = prompt('Nome do plano:');
      if (!nome) return;
      const preco = prompt('Preço (ex: 49.90):');
      if (!preco) return;
      data.planos.push({ nome, preco });
      salvarDados().then(renderAll);
    };

    window.salvarCliente = function() {
      const nome = document.getElementById('inputNome').value.trim();
      const numero = document.getElementById('inputNumero').value.trim();
      const plano = document.getElementById('inputPlano').value.trim();
      const vencimento = document.getElementById('inputVencimento').value;
      if (!nome || !numero || !vencimento) { alert('Preencha todos os campos'); return; }
      const cliente = { nome, numero, plano, vencimento, status: 'ativo', id: Date.now() };
      data.clientes.push(cliente);
      salvarDados().then(() => {
        renderAll();
        fecharModalCliente();
        agendarNotificacoes(cliente);
      });
    };

    window.whatsappCliente = function(numero) {
      const url = `https://wa.me/55${numero.replace(/\D/g, '')}`;
      window.open(url, '_blank');
    };

    // Envio template
    let clienteEnvioIdx = -1;
    window.abrirModalEnvio = function(idx) {
      clienteEnvioIdx = idx;
      const container = document.getElementById('template-envio-list');
      container.innerHTML = data.templates.filter(t => t.ativo).map((t, i) => `
        <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;">
          <span>${t.label}</span>
          <button class="btn-outline" onclick="enviarTemplateCliente(${i})">Enviar</button>
        </div>
      `).join('');
      document.getElementById('modalEnvio').classList.add('active');
    };
    window.fecharModalEnvio = function() {
      document.getElementById('modalEnvio').classList.remove('active');
    };
    window.enviarTemplateCliente = function(tIdx) {
      if (clienteEnvioIdx < 0) return;
      const cliente = data.clientes[clienteEnvioIdx];
      const template = data.templates[tIdx];
      if (!cliente || !template) return;
      const texto = `${template.label} - Cliente: ${cliente.nome}, vencimento ${cliente.vencimento}`;
      const url = `https://wa.me/55${cliente.numero.replace(/\D/g, '')}?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
      fecharModalEnvio();
    };

    window.toggleTemplate = function(idx, val) {
      data.templates[idx].ativo = val;
      salvarDados().then(() => { renderTemplates(); });
    };

    window.copiarTemplate = async function(idx) {
      const texto = data.templates[idx].label;
      try {
        if (isCap) {
          const { Clipboard } = await import('@capacitor/clipboard');
          await Clipboard.write({ string: texto });
        } else {
          await navigator.clipboard.writeText(texto);
        }
        alert('Texto copiado!');
      } catch (e) { alert('Erro ao copiar'); }
    };

    window.salvarHorarios = function() {
      const t1 = document.getElementById('time1').value;
      const t2 = document.getElementById('time2').value;
      const t3 = document.getElementById('time3').value;
      data.horarios = [t1, t2, t3];
      salvarDados().then(() => alert('Horários salvos!'));
    };

    window.fazerBackup = async function() {
      try {
        const json = JSON.stringify(data, null, 2);
        if (isCap) {
          const { Filesystem, Directory } = await import('@capacitor/filesystem');
          const { Share } = await import('@capacitor/share');
          const result = await Filesystem.writeFile({
            path: 'iptv_backup.json',
            data: json,
            directory: Directory.Documents
          });
          await Share.share({ title: 'Backup IPTV', text: 'Backup gerado', url: result.uri });
        } else {
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'iptv_backup.json';
          a.click();
        }
      } catch (e) { alert('Erro no backup: ' + e.message); }
    };

    window.restoreBackup = async function(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        data = { ...data, ...parsed };
        await salvarDados();
        renderAll();
        alert('Restore concluído!');
      } catch (e) { alert('Erro no restore: ' + e.message); }
    };

    // ===== NOTIFICAÇÕES =====
    window.agendarNotificacoes = async function(cliente) {
      if (!isCap) return;
      try {
        const { LocalNotifications } = await import('@capacitor/local-notifications');
        // Verificar permissão
        const perm = await LocalNotifications.requestPermissions();
        if (perm.display !== 'granted') return;

        const venc = new Date(cliente.vencimento + 'T00:00:00');
        const hoje = new Date();
        const diffDays = Math.ceil((venc - hoje) / (1000*60*60*24));

        // Para cada template ativo, verifica se bate com diffDays
        for (const t of data.templates) {
          if (!t.ativo) continue;
          let shouldNotify = false;
          if (t.dias === -1 && diffDays < 0) shouldNotify = true;
          else if (t.dias >= 0 && diffDays === t.dias) shouldNotify = true;

          if (shouldNotify) {
            for (const horario of data.horarios) {
              const [h, m] = horario.split(':').map(Number);
              const notifDate = new Date();
              notifDate.setHours(h, m, 0, 0);
              if (notifDate < new Date()) notifDate.setDate(notifDate.getDate() + 1);
              await LocalNotifications.schedule({
                notifications: [{
                  title: '📡 IPTV - Cliente',
                  body: `${cliente.nome} - ${t.label}`,
                  id: Date.now() + Math.random() * 1000,
                  schedule: { at: notifDate }
                }]
              });
            }
          }
        }
      } catch (e) { console.warn('Erro notificação', e); }
    };

    // ===== MODAL =====
    window.abrirModalCliente = function() {
      document.getElementById('modalCliente').classList.add('active');
    };
    window.fecharModalCliente = function() {
      document.getElementById('modalCliente').classList.remove('active');
    };

    // ===== NAVEGAÇÃO =====
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        this.classList.add('active');
        const tabId = this.dataset.tab;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
      });
    });

    // ===== INICIALIZAÇÃO =====
    carregarDados();
  })();
</script>
</body>
</html>
