<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>TechAssist Pro Mobile</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js para Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6366f1',
                        darkbg: '#0f172a',
                        cardbg: 'rgba(30, 41, 59, 0.7)' // Glassmorphism escuro
                    }
                }
            }
        }
    </script>
    <style>
        /* Ocultar scrollbar */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f172a; 
            color: #f1f5f9; 
            overscroll-behavior-y: contain; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animações de Tela */
        .page { display: none; animation: fadeSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .page.active { display: block; }
        @keyframes fadeSlideUp { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Partículas Flutuantes */
        .particles-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .particle { 
            position: absolute; 
            bottom: -50px; 
            color: rgba(59, 130, 246, 0.15); 
            font-size: 2rem; 
            animation: floatUp linear infinite; 
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Botão FAB (Floating Action Button) */
        .fab-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 30;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col relative">

    <!-- Sistema de Partículas -->
    <div class="particles-container">
        <i class="fa-solid fa-gamepad particle" style="left: 10%; animation-duration: 15s; font-size: 3rem;"></i>
        <i class="fa-solid fa-microchip particle" style="left: 30%; animation-duration: 18s; animation-delay: 2s; font-size: 2rem;"></i>
        <i class="fa-solid fa-screwdriver-wrench particle" style="left: 60%; animation-duration: 12s; animation-delay: 5s; font-size: 2.5rem;"></i>
        <i class="fa-solid fa-compact-disc particle" style="left: 80%; animation-duration: 20s; animation-delay: 1s; font-size: 2rem;"></i>
        <i class="fa-solid fa-bolt particle" style="left: 50%; animation-duration: 16s; animation-delay: 7s; font-size: 1.5rem;"></i>
    </div>

    <!-- HEADER -->
    <header class="glass-panel text-white p-4 flex justify-between items-center sticky top-0 z-40 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="text-2xl active:scale-90 transition-transform p-1">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400" id="header-title">
                Dashboard
            </h1>
        </div>
        <button class="active:scale-90 transition-transform relative">
            <i class="fa-solid fa-bell text-xl text-slate-300"></i>
            <span class="absolute -top-1 -right-1 bg-red-500 w-3 h-3 rounded-full border-2 border-slate-900"></span>
        </button>
    </header>

    <!-- MENU LATERAL (SIDEBAR) -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-50 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm"></div>
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 glass-panel border-r border-slate-700 text-white z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-6 border-b border-slate-700 bg-gradient-to-b from-blue-900/40 to-transparent">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center text-3xl shadow-lg mb-3">
                <i class="fa-solid fa-shop"></i>
            </div>
            <h2 class="font-bold text-lg" id="shop-name-display">TechAssist Pro</h2>
            <p class="text-xs text-blue-300">Gestão Mobile</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="navigate('dashboard', 'Dashboard'); toggleSidebar()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-slate-700/50 transition text-left">
                <i class="fa-solid fa-chart-pie w-5 text-blue-400"></i> <span class="font-medium">Dashboard</span>
            </button>
            <button onclick="navigate('clientes', 'Clientes'); toggleSidebar()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-slate-700/50 transition text-left">
                <i class="fa-solid fa-users w-5 text-green-400"></i> <span class="font-medium">Clientes</span>
            </button>
            <button onclick="navigate('aparelhos', 'Aparelhos'); toggleSidebar()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-slate-700/50 transition text-left">
                <i class="fa-solid fa-gamepad w-5 text-purple-400"></i> <span class="font-medium">Aparelhos</span>
            </button>
            <button onclick="navigate('os', 'Ordens de Serviço'); toggleSidebar()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-slate-700/50 transition text-left">
                <i class="fa-solid fa-clipboard-check w-5 text-orange-400"></i> <span class="font-medium">Ordens de Serviço</span>
            </button>
            <hr class="border-slate-700 my-4">
            <button onclick="navigate('config', 'Configurações'); toggleSidebar()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-slate-700/50 transition text-left">
                <i class="fa-solid fa-gear w-5 text-slate-400"></i> <span class="font-medium">Configurações</span>
            </button>
        </nav>
        <div class="p-4 border-t border-slate-700 text-center text-xs text-slate-500">
            Versão 2.0 • Premium
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL (VIEWS) -->
    <main class="flex-1 overflow-y-auto pb-24 relative px-4 pt-4">
        
        <!-- DASHBOARD -->
        <section id="view-dashboard" class="page active space-y-5">
            <!-- Card Financeiro -->
            <div class="rounded-3xl p-6 shadow-lg bg-gradient-to-br from-blue-600 to-indigo-700 relative overflow-hidden">
                <div class="absolute top-0 right-0 -mr-8 -mt-8 opacity-20 text-9xl"><i class="fa-solid fa-wallet"></i></div>
                <p class="text-blue-200 text-sm font-medium mb-1 relative z-10">Faturamento Bruto</p>
                <h2 class="text-4xl font-black text-white relative z-10" id="dash-faturamento">R$ 0,00</h2>
            </div>

            <!-- Resumo Cards -->
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center text-center">
                    <span class="text-3xl font-black text-white" id="dash-os-abertas">0</span>
                    <span class="text-xs text-slate-400 font-medium uppercase mt-1">OS Abertas</span>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center text-center">
                    <span class="text-3xl font-black text-white" id="dash-os-concluidas">0</span>
                    <span class="text-xs text-slate-400 font-medium uppercase mt-1">Concluídas</span>
                </div>
            </div>

            <!-- Gráficos -->
            <div class="glass-panel p-4 rounded-2xl">
                <h3 class="font-bold text-slate-200 mb-4 text-sm"><i class="fa-solid fa-chart-line mr-2"></i>Status das OS</h3>
                <div class="w-full h-48">
                    <canvas id="graficoOS"></canvas>
                </div>
            </div>
            
            <h3 class="font-bold text-slate-300 mt-6 ml-1 text-sm">Movimentações Recentes</h3>
            <div id="lista-os-recentes" class="space-y-3 pb-4"></div>
        </section>

        <!-- CLIENTES -->
        <section id="view-clientes" class="page">
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400"></i>
                <input type="text" placeholder="Buscar cliente..." class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-3 pl-12 pr-4 text-white outline-none focus:border-primary">
            </div>
            <div id="lista-clientes" class="space-y-3"></div>
            <!-- FAB Button -->
            <button onclick="abrirModal('modal-cliente')" class="fab-btn w-14 h-14 bg-gradient-to-r from-green-500 to-emerald-600 rounded-full text-white text-xl flex items-center justify-center active:scale-90 transition">
                <i class="fa-solid fa-plus"></i>
            </button>
        </section>

        <!-- APARELHOS -->
        <section id="view-aparelhos" class="page">
            <div id="lista-aparelhos" class="space-y-3"></div>
            <button onclick="abrirModal('modal-aparelho')" class="fab-btn w-14 h-14 bg-gradient-to-r from-purple-500 to-fuchsia-600 rounded-full text-white text-xl flex items-center justify-center active:scale-90 transition">
                <i class="fa-solid fa-plus"></i>
            </button>
        </section>

        <!-- OS -->
        <section id="view-os" class="page">
            <div id="lista-os" class="space-y-3"></div>
            <button onclick="abrirModalOS()" class="fab-btn w-14 h-14 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full text-white text-xl flex items-center justify-center active:scale-90 transition">
                <i class="fa-solid fa-plus"></i>
            </button>
        </section>

        <!-- CONFIGURAÇÕES -->
        <section id="view-config" class="page space-y-4">
            <div class="glass-panel p-5 rounded-2xl">
                <h3 class="font-bold text-white mb-4"><i class="fa-solid fa-store mr-2 text-primary"></i>Dados da Assistência</h3>
                <label class="text-xs text-slate-400 mb-1 block">Nome da Loja</label>
                <input type="text" id="config-loja" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white outline-none focus:border-primary mb-4" value="TechAssist Pro">
                
                <button onclick="salvarConfig()" class="w-full bg-primary text-white font-bold p-3 rounded-xl active:bg-blue-600 transition">Salvar Alterações</button>
            </div>

            <div class="glass-panel p-5 rounded-2xl flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-white">Notificações WhatsApp</h3>
                    <p class="text-xs text-slate-400">Abrir link ao gerar OS</p>
                </div>
                <input type="checkbox" id="config-zap" checked class="w-6 h-6 accent-primary rounded">
            </div>
            
            <button onclick="limparDados()" class="w-full glass-panel border border-red-900/50 text-red-400 font-bold p-4 rounded-xl mt-4 active:bg-red-900/20 transition">
                <i class="fa-solid fa-trash-can mr-2"></i> Apagar Todos os Dados
            </button>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION (Para acesso rápido sem abrir o menu) -->
    <nav class="glass-panel border-t border-slate-800 fixed bottom-0 w-full z-20 pb-safe">
        <ul class="flex justify-around items-center p-1">
            <li class="flex-1 text-center">
                <button onclick="navigate('dashboard', 'Dashboard', this)" class="nav-btn-bottom w-full py-2 text-primary flex flex-col items-center gap-1 transition">
                    <i class="fa-solid fa-house text-xl"></i>
                    <span class="text-[10px] font-semibold">Início</span>
                </button>
            </li>
            <li class="flex-1 text-center">
                <button onclick="navigate('clientes', 'Clientes', this)" class="nav-btn-bottom w-full py-2 text-slate-400 flex flex-col items-center gap-1 transition">
                    <i class="fa-solid fa-users text-xl"></i>
                    <span class="text-[10px] font-semibold">Clientes</span>
                </button>
            </li>
            <li class="flex-1 text-center">
                <button onclick="navigate('os', 'Ordens de Serviço', this)" class="nav-btn-bottom w-full py-2 text-slate-400 flex flex-col items-center gap-1 transition relative">
                    <div class="absolute -top-4 bg-gradient-to-r from-blue-500 to-indigo-500 w-12 h-12 rounded-full flex items-center justify-center border-4 border-slate-900 text-white shadow-lg mx-auto left-0 right-0">
                        <i class="fa-solid fa-clipboard-list text-xl"></i>
                    </div>
                    <span class="text-[10px] font-semibold mt-7">OS</span>
                </button>
            </li>
            <li class="flex-1 text-center">
                <button onclick="navigate('aparelhos', 'Aparelhos', this)" class="nav-btn-bottom w-full py-2 text-slate-400 flex flex-col items-center gap-1 transition">
                    <i class="fa-solid fa-gamepad text-xl"></i>
                    <span class="text-[10px] font-semibold">Aparelhos</span>
                </button>
            </li>
        </ul>
    </nav>

    <!-- ================= MODAIS (Fundo translúcido premium) ================= -->
    
    <!-- Modal Cliente -->
    <div id="modal-cliente" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex-col justify-end">
        <div class="bg-slate-800 rounded-t-3xl p-6 border-t border-slate-700 shadow-2xl animation-slide-up">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Novo Cliente</h2>
                <button onclick="fecharModal('modal-cliente')" class="w-8 h-8 bg-slate-700 rounded-full text-slate-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-cliente" class="space-y-4">
                <div>
                    <label class="text-sm font-medium text-slate-400 block mb-1">Nome Completo</label>
                    <input type="text" id="cli-nome" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-primary">
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-400 block mb-1">WhatsApp</label>
                    <input type="tel" id="cli-whatsapp" inputmode="numeric" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-primary" placeholder="DDD + Número">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold p-4 rounded-xl mt-4 active:scale-95 transition shadow-lg">Salvar Cliente</button>
            </form>
        </div>
    </div>

    <!-- Modal Aparelho -->
    <div id="modal-aparelho" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex-col justify-end">
        <div class="bg-slate-800 rounded-t-3xl p-6 border-t border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Novo Aparelho</h2>
                <button onclick="fecharModal('modal-aparelho')" class="w-8 h-8 bg-slate-700 rounded-full text-slate-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-aparelho" class="space-y-4">
                <div>
                    <label class="text-sm font-medium text-slate-400 block mb-1">Categoria</label>
                    <select id="apa-tipo" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-primary">
                        <option value="PlayStation">PlayStation</option>
                        <option value="Xbox">Xbox</option>
                        <option value="Nintendo">Nintendo / Portátil</option>
                        <option value="PC">Computador / Notebook</option>
                        <option value="Acessório">Controle / Acessório</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-400 block mb-1">Marca e Modelo</label>
                    <input type="text" id="apa-modelo" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-primary" placeholder="Ex: Xbox Series S">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-fuchsia-600 text-white font-bold p-4 rounded-xl mt-4 active:scale-95 transition shadow-lg">Salvar Aparelho</button>
            </form>
        </div>
    </div>

    <!-- Modal OS -->
    <div id="modal-os" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex-col justify-end">
        <div class="bg-slate-800 rounded-t-3xl p-6 border-t border-slate-700 shadow-2xl h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 sticky top-0 bg-slate-800 z-10 pb-2 border-b border-slate-700">
                <h2 class="text-xl font-bold text-white">Nova OS</h2>
                <button onclick="fecharModal('modal-os')" class="w-8 h-8 bg-slate-700 rounded-full text-slate-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-os" class="space-y-4">
                <div>
                    <label class="text-sm font-medium text-slate-400 block mb-1">Cliente</label>
                    <select id="os-cliente" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none"></select>
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-400 block mb-1">Aparelho</label>
                    <select id="os-aparelho" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none"></select>
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-400 block mb-1">Defeito Relatado / Serviço</label>
                    <textarea id="os-defeito" required rows="2" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none" placeholder="Ex: RGH não dá boot, limpeza térmica..."></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-medium text-slate-400 block mb-1">Status</label>
                        <select id="os-status" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none text-sm">
                            <option value="Orçamento">Orçamento</option>
                            <option value="Aprovado">Aprovado</option>
                            <option value="Aguardando Peca">Aguardando Peça</option>
                            <option value="Concluido">Concluído</option>
                            <option value="Entregue">Entregue</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-slate-400 block mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" inputmode="decimal" id="os-valor" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none text-sm" placeholder="0.00">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold p-4 rounded-xl mt-6 active:scale-95 transition shadow-lg">Gerar Ordem de Serviço</button>
            </form>
        </div>
    </div>

    <!-- Scripts do App Móvel -->
    <script>
        // Sistema de Banco de Dados Local
        const db = {
            get: (key) => JSON.parse(localStorage.getItem(key)) || [],
            set: (key, data) => localStorage.setItem(key, JSON.stringify(data)),
            id: () => Math.floor(Math.random() * 900000 + 100000).toString() // ID 6 digitos
        };

        let chartInstancia = null; // Instância do gráfico

        // --- NAVEGAÇÃO E SIDEBAR ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                // Abrir
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                // Fechar
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function navigate(pageId, title, btnBottom = null) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`view-${pageId}`).classList.add('active');
            document.getElementById('header-title').innerText = title;

            // Resetar cor dos botões bottom
            if(btnBottom) {
                document.querySelectorAll('.nav-btn-bottom').forEach(b => {
                    b.classList.remove('text-primary');
                    b.classList.add('text-slate-400');
                });
                btnBottom.classList.add('text-primary');
                btnBottom.classList.remove('text-slate-400');
            }

            atualizarDados();
        }

        // --- MODAIS ---
        function abrirModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        function fecharModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
        function abrirModalOS() {
            const clientes = db.get('clientes');
            const aparelhos = db.get('aparelhos');
            
            if(clientes.length === 0 || aparelhos.length === 0) {
                alert("Cadastre pelo menos 1 cliente e 1 aparelho primeiro.");
                return;
            }

            document.getElementById('os-cliente').innerHTML = clientes.map(c => `<option value="${c.nome}|${c.whatsapp}">${c.nome}</option>`).join('');
            document.getElementById('os-aparelho').innerHTML = aparelhos.map(a => `<option value="${a.modelo} (${a.tipo})">${a.modelo} (${a.tipo})</option>`).join('');
            
            abrirModal('modal-os');
        }

        // --- CRUD E FORMS ---
        document.getElementById('form-cliente').addEventListener('submit', function(e) {
            e.preventDefault();
            const clientes = db.get('clientes');
            clientes.push({
                id: db.id(),
                nome: document.getElementById('cli-nome').value,
                whatsapp: document.getElementById('cli-whatsapp').value
            });
            db.set('clientes', clientes);
            this.reset();
            fecharModal('modal-cliente');
            atualizarDados();
        });

        document.getElementById('form-aparelho').addEventListener('submit', function(e) {
            e.preventDefault();
            const aparelhos = db.get('aparelhos');
            aparelhos.push({
                id: db.id(),
                tipo: document.getElementById('apa-tipo').value,
                modelo: document.getElementById('apa-modelo').value
            });
            db.set('aparelhos', aparelhos);
            this.reset();
            fecharModal('modal-aparelho');
            atualizarDados();
        });

        document.getElementById('form-os').addEventListener('submit', function(e) {
            e.preventDefault();
            const ordens = db.get('ordens');
            const numOs = String(ordens.length + 1).padStart(4, '0');
            
            const clData = document.getElementById('os-cliente').value.split('|');
            const clienteNome = clData[0];
            const clienteZap = clData[1];

            ordens.push({
                os: numOs,
                cliente: clienteNome,
                zap: clienteZap,
                aparelho: document.getElementById('os-aparelho').value,
                defeito: document.getElementById('os-defeito').value,
                status: document.getElementById('os-status').value,
                valor: parseFloat(document.getElementById('os-valor').value || 0),
                data: new Date().toLocaleDateString('pt-BR')
            });
            db.set('ordens', ordens);
            
            // Lógica WhatsApp
            if(document.getElementById('config-zap').checked && clienteZap) {
                const msg = `Olá ${clienteNome}! Sua OS #${numOs} foi gerada na ${document.getElementById('shop-name-display').innerText}. Aparelho: ${document.getElementById('os-aparelho').value}. Avisaremos sobre novidades!`;
                window.open(`https://wa.me/55${clienteZap.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
            }

            this.reset();
            fecharModal('modal-os');
            atualizarDados();
        });

        // Configurações
        function salvarConfig() {
            const nome = document.getElementById('config-loja').value;
            localStorage.setItem('shopName', nome);
            document.getElementById('shop-name-display').innerText = nome;
            alert("Configurações salvas!");
        }

        function limparDados() {
            if(confirm("TEM CERTEZA? Isso vai apagar tudo!")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        // --- RENDERIZAÇÃO & GRÁFICOS ---
        function atualizarDados() {
            const clientes = db.get('clientes');
            const aparelhos = db.get('aparelhos');
            const ordens = db.get('ordens');

            // Set Configurações Iniciais
            const shopName = localStorage.getItem('shopName') || 'TechAssist Pro';
            document.getElementById('shop-name-display').innerText = shopName;
            document.getElementById('config-loja').value = shopName;

            // Render Clientes
            document.getElementById('lista-clientes').innerHTML = clientes.length ? clientes.map(c => `
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between mb-3 border-l-4 border-l-green-500">
                    <div>
                        <h4 class="font-bold text-white">${c.nome}</h4>
                        <p class="text-sm text-slate-400 mt-1"><i class="fa-brands fa-whatsapp text-green-400"></i> ${c.whatsapp}</p>
                    </div>
                </div>
            `).join('') : '<p class="text-center text-slate-500 mt-10">Nenhum cliente cadastrado.</p>';

            // Render Aparelhos
            const iconesTipo = {
                'PlayStation': 'fa-brands fa-playstation text-blue-400',
                'Xbox': 'fa-brands fa-xbox text-green-500',
                'PC': 'fa-solid fa-computer text-slate-300',
                'Nintendo': 'fa-solid fa-gamepad text-red-500',
                'Acessório': 'fa-solid fa-headset text-purple-400'
            };

            document.getElementById('lista-aparelhos').innerHTML = aparelhos.length ? aparelhos.map(a => `
                <div class="glass-panel p-4 rounded-2xl flex items-center gap-4 mb-3">
                    <div class="w-12 h-12 bg-slate-800 rounded-xl flex items-center justify-center text-2xl shadow-inner border border-slate-700">
                        <i class="${iconesTipo[a.tipo] || 'fa-solid fa-microchip text-slate-400'}"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-500 uppercase">${a.tipo}</p>
                        <h4 class="font-bold text-white">${a.modelo}</h4>
                    </div>
                </div>
            `).join('') : '<p class="text-center text-slate-500 mt-10">Nenhum aparelho cadastrado.</p>';

            // Render OS
            const badges = {
                'Orçamento': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/50',
                'Aprovado': 'bg-blue-500/20 text-blue-400 border-blue-500/50',
                'Aguardando Peca': 'bg-orange-500/20 text-orange-400 border-orange-500/50',
                'Concluido': 'bg-green-500/20 text-green-400 border-green-500/50',
                'Entregue': 'bg-slate-500/20 text-slate-400 border-slate-500/50'
            };

            const htmlOS = ordens.map(o => `
                <div class="glass-panel p-4 rounded-2xl mb-3">
                    <div class="flex justify-between items-start mb-3">
                        <span class="font-black text-white text-lg">#${o.os}</span>
                        <span class="text-[10px] font-bold px-2 py-1 rounded border uppercase ${badges[o.status] || 'bg-slate-800 text-white'}">${o.status}</span>
                    </div>
                    <h4 class="font-bold text-primary text-sm">${o.cliente}</h4>
                    <p class="text-xs text-slate-400 mb-2">${o.aparelho}</p>
                    <div class="bg-slate-900/50 p-3 rounded-xl text-xs text-slate-300 mb-3 border border-slate-800">
                        <i class="fa-solid fa-wrench text-slate-500 mr-1"></i> ${o.defeito}
                    </div>
                    <div class="flex justify-between items-center border-t border-slate-800 pt-3">
                        <span class="text-xs text-slate-500"><i class="fa-regular fa-calendar"></i> ${o.data}</span>
                        <span class="font-bold text-emerald-400">R$ ${o.valor.toFixed(2).replace('.', ',')}</span>
                    </div>
                </div>
            `).reverse().join('');

            document.getElementById('lista-os').innerHTML = ordens.length ? htmlOS : '<p class="text-center text-slate-500 mt-10">Nenhuma OS gerada.</p>';
            document.getElementById('lista-os-recentes').innerHTML = ordens.length ? htmlOS : '<p class="text-center text-slate-500 mt-4 text-sm">Nenhuma movimentação.</p>';
            
            // Dashboard Stats
            const osAbertas = ordens.filter(o => !['Concluido', 'Entregue'].includes(o.status)).length;
            const osConcluidas = ordens.filter(o => ['Concluido', 'Entregue'].includes(o.status)).length;
            document.getElementById('dash-os-abertas').innerText = osAbertas;
            document.getElementById('dash-os-concluidas').innerText = osConcluidas;

            const faturamento = ordens.filter(o => ['Concluido', 'Entregue'].includes(o.status)).reduce((acc, curr) => acc + curr.valor, 0);
            document.getElementById('dash-faturamento').innerText = `R$ ${faturamento.toFixed(2).replace('.', ',')}`;

            // Atualizar Gráfico (Chart.js)
            atualizarGrafico(ordens);
        }

        function atualizarGrafico(ordens) {
            const ctx = document.getElementById('graficoOS');
            if(!ctx) return;

            const contagem = {
                'Orçamento': 0, 'Aprovado': 0, 'Aguardando Peca': 0, 'Concluido': 0, 'Entregue': 0
            };
            ordens.forEach(o => { if(contagem[o.status] !== undefined) contagem[o.status]++; });

            const data = {
                labels: ['Orç.', 'Aprov.', 'Peça', 'Concl.', 'Entregue'],
                datasets: [{
                    label: 'Qtd de OS',
                    data: [contagem['Orçamento'], contagem['Aprovado'], contagem['Aguardando Peca'], contagem['Concluido'], contagem['Entregue']],
                    backgroundColor: ['#eab308', '#3b82f6', '#f97316', '#22c55e', '#64748b'],
                    borderRadius: 6,
                    borderWidth: 0
                }]
            };

            if(chartInstancia) {
                chartInstancia.data = data;
                chartInstancia.update();
            } else {
                chartInstancia = new Chart(ctx, {
                    type: 'bar',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { display: false, beginAtZero: true },
                            x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } }
                        }
                    }
                });
            }
        }

        // Iniciar
        window.onload = atualizarDados;
    </script>
</body>
</html>
