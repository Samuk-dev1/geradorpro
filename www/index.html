<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f1a">
<title>TechMaster OS</title>
<style>
/* =========================================================
   RESET E VARIÁVEIS
   ========================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0f1a; --bg2:#111827; --surface:#161d2e; --surface2:#1c2539;
  --border:#25304a; --border2:#2e3a55;
  --text:#e7edf7; --text2:#9aa7c2; --text3:#6b7894;
  --primary:#4f7cff; --primary2:#6a5cff; --accent:#22d3ee;
  --success:#22c55e; --warning:#f59e0b; --danger:#ef4444;
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --sidebar-w:260px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#eef1f8; --bg2:#e4e8f2; --surface:#ffffff; --surface2:#f4f6fb;
  --border:#dde2ee; --border2:#cdd4e4;
  --text:#101828; --text2:#4a5573; --text3:#7a849e;
  --shadow:0 8px 30px rgba(30,50,90,.12);
  --shadow-sm:0 2px 10px rgba(30,50,90,.08);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); overflow-x:hidden;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* =========================================================
   LAYOUT PRINCIPAL E MENU LATERAL (CORRIGIDO)
   ========================================================= */
#app{display:none;min-height:100vh;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
#app.ready{display:block}
#loader{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:var(--bg);z-index:9999;transition:opacity .4s;
}
#loader .logo-spin{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(79,124,255,.5);animation:pulse 1.4s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#loader h1{font-size:22px;font-weight:800;letter-spacing:.5px}
#loader p{color:var(--text2);font-size:13px}

.shell{display:flex;min-height:100vh;position:relative}

/* Fundo escuro (overlay) para mobile */
#sidebarOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);
  z-index:190;display:none;
}
#sidebarOverlay.open{display:block;animation:fadeIn .2s;}

/* Sidebar */
#sidebar{
  width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;
  transition:transform .28s cubic-bezier(.4,0,.2,1);padding-top:var(--safe-top);
}
#sidebar.collapsed{transform:translateX(-100%)}
.brand{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid var(--border)}
.brand .logo{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 14px rgba(79,124,255,.4);
}
.brand .name{font-weight:800;font-size:16px;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--text2);font-weight:500}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  color:var(--text2);font-weight:600;font-size:14px;margin-bottom:3px;
  transition:background .15s,color .15s;width:100%;text-align:left;
}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(79,124,255,.18),rgba(106,92,255,.08));
  color:var(--primary);position:relative;
}
.nav-item.active::before{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;
  background:var(--primary);border-radius:0 3px 3px 0;
}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;min-width:0;margin-left:var(--sidebar-w);transition:margin .28s;width:100%}
.main.full{margin-left:0}

/* Ajustes específicos para Mobile */
@media(max-width:900px){
  .main { margin-left: 0; } /* Remove a margem no celular */
  #sidebar { box-shadow: 4px 0 24px rgba(0,0,0,0.5); } /* Adiciona sombra para parecer gaveta */
}

/* Topbar */
.topbar{
  position:sticky;top:0;z-index:100;background:rgba(11,15,26,.85);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:12px 18px;
  display:flex;align-items:center;gap:14px;padding-top:calc(12px + var(--safe-top));
}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.85)}
.icon-btn{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--text2);background:var(--surface);border:1px solid var(--border);
  transition:transform .1s,background .15s;flex-shrink:0;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn svg{width:21px;height:21px}
#menuBtn{display:none}
.page-title{font-size:18px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-wrap{flex:1;max-width:440px;position:relative;margin-left:auto}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3)}
#globalSearch{
  width:100%;padding:11px 14px 11px 42px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;transition:border .15s;
}
#globalSearch:focus{border-color:var(--primary)}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.avatar{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;
  border:2px solid var(--border2);cursor:pointer;
}
.notif-dot{position:relative}
.notif-dot::after{content:"";position:absolute;top:8px;right:9px;width:8px;height:8px;
  background:var(--danger);border-radius:50%;border:2px solid var(--surface)}

/* Content */
.content{padding:22px;max-width:1400px;width:100%;margin:0 auto;flex:1}
@media(max-width:900px){.content{padding:16px}}

/* =========================================================
   COMPONENTES
   ========================================================= */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.card-pad{padding:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-head h2{font-size:19px;font-weight:800}
.section-head p{color:var(--text2);font-size:13px;margin-top:2px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;
  transition:transform .1s,filter .15s,background .15s;white-space:nowrap;
  border:1px solid transparent;min-height:44px;
}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 16px rgba(79,124,255,.35)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface2);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:rgba(239,68,68,.14);color:var(--danger);border-color:rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.24)}
.btn-success{background:rgba(34,197,94,.15);color:var(--success);border-color:rgba(34,197,94,.3)}
.btn-sm{padding:8px 13px;font-size:13px;min-height:38px;border-radius:10px}
.btn-icon{padding:10px;min-width:44px}

/* Grid helpers */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .topbar{padding:10px 12px}
  .search-wrap{display:none}
  #menuBtn{display:flex}
  .page-title{font-size:16px}
}

/* Stat cards */
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;position:relative;overflow:hidden;transition:transform .15s,border .15s;
}
.stat:active{transform:scale(.985)}
.stat .ic{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;
}
.stat .ic svg{width:22px;height:22px}
.stat .val{font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat .lbl{font-size:12px;color:var(--text2);font-weight:600;margin-top:2px}
.stat .trend{font-size:11px;margin-top:8px;font-weight:700}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap}
.tag svg{width:12px;height:12px}

/* Chips / filters */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);
  font-size:13px;font-weight:600;color:var(--text2);transition:.15s;min-height:38px}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:12px;background:var(--bg2);
  border:1px solid var(--border);color:var(--text);outline:none;font-size:14px;
  transition:border .15s,background .15s;min-height:46px;
}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:var(--surface)}
.field .hint{font-size:11px;color:var(--text3);margin-top:5px}
.row{display:grid;gap:12px}
.row-2{grid-template-columns:1fr 1fr}
.row-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.row-2,.row-3{grid-template-columns:1fr}}

/* Modal */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);
  z-index:1000;display:none;align-items:flex-end;justify-content:center;
}
.modal-back.open{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);width:100%;max-width:640px;max-height:92vh;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;overflow:hidden;
  display:flex;flex-direction:column;animation:slideUp .28s cubic-bezier(.4,0,.2,1);
  border:1px solid var(--border);border-bottom:none;
}
@media(min-width:700px){
  .modal-back{align-items:center;padding:20px}
  .modal{border-radius:var(--radius-lg);max-height:88vh;border-bottom:1px solid var(--border)}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}
.modal-head h3{font-size:17px;font-weight:800}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px;
  justify-content:flex-end;flex-shrink:0;padding-bottom:calc(14px + var(--safe-bottom))}
.modal-foot .btn{flex:1}
@media(min-width:700px){.modal-foot .btn{flex:0 0 auto}}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:11px 12px;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--text3);border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap}
tbody td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
.link{color:var(--primary);font-weight:700;cursor:pointer}
.link:hover{text-decoration:underline}

/* List / cards for OS */
.os-list{display:flex;flex-direction:column;gap:10px}
.os-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;display:flex;flex-direction:column;gap:10px;transition:.15s;cursor:pointer;
}
.os-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.os-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.os-num{font-weight:800;font-size:14px;color:var(--primary)}
.os-device{font-size:13px;color:var(--text2);margin-top:2px}
.os-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-top:2px}
.os-meta span{display:inline-flex;align-items:center;gap:5px}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty svg{width:56px;height:56px;opacity:.4;margin-bottom:12px}
.empty h4{font-size:15px;color:var(--text2);margin-bottom:4px}
.empty p{font-size:13px}

/* Timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;
  border-radius:50%;background:var(--primary);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--primary)}
.tl-item .tl-date{font-size:11px;color:var(--text3);font-weight:600}
.tl-item .tl-title{font-size:13px;font-weight:700;margin-top:2px}
.tl-item .tl-desc{font-size:12px;color:var(--text2);margin-top:2px}

/* Toast */
#toast-wrap{position:fixed;bottom:calc(20px + var(--safe-bottom));right:20px;left:20px;
  z-index:2000;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);
  border-radius:12px;padding:13px 16px;box-shadow:var(--shadow);font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:10px;max-width:340px;animation:toastIn .3s;pointer-events:auto;
}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast svg{width:18px;height:18px;flex-shrink:0}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

/* Search results dropdown */
#searchResults{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
  max-height:420px;overflow-y:auto;display:none;z-index:150;
}
#searchResults.open{display:block}
.sr-group{padding:8px 12px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text3);font-weight:800}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.sr-item:hover{background:var(--surface2)}
.sr-item small{display:block;color:var(--text3);font-size:11px;margin-top:1px}

/* Charts */
.chart-box{position:relative;height:220px;width:100%}
.chart-box canvas{width:100%;height:100%}

/* Print */
@media print{
  body{background:#fff;color:#000}
  #sidebar,.topbar,.no-print,.modal-back,#toast-wrap,#sidebarOverlay{display:none!important}
  .main{margin:0}
  .content{padding:0}
  .print-doc{box-shadow:none;border:none;page-break-after:always}
}
.print-doc{background:#fff;color:#111;padding:32px;border-radius:8px;max-width:800px;margin:0 auto;
  font-family:Arial,Helvetica,sans-serif;line-height:1.5;font-size:13px}
.print-doc h1,.print-doc h2,.print-doc h3{color:#111}
.print-doc table{color:#111}
.print-doc thead th{color:#555;border-color:#ccc}
.print-doc tbody td{border-color:#ddd}
.print-doc .doc-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;
  padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.print-doc .doc-head h1{font-size:20px;margin:0}
.print-doc .doc-head .co{font-size:12px;color:#444;line-height:1.6}
.print-doc .doc-title{text-align:center;font-size:16px;font-weight:800;text-transform:uppercase;
  letter-spacing:1px;margin:14px 0 18px;background:#f0f0f0;padding:8px;border-radius:4px}
.print-doc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.print-doc .block h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#555;
  border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:6px}
.print-doc .block p{margin:2px 0;font-size:12px}
.print-doc .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px dotted #ddd}
.print-doc .kv.total{font-weight:800;font-size:14px;border-top:2px solid #111;border-bottom:none;margin-top:6px;padding-top:8px}
.print-doc .sign{margin-top:36px;border-top:1px solid #111;padding-top:6px;text-align:center;font-size:12px;width:60%;margin-left:auto;margin-right:auto}

/* Misc */
.flex{display:flex}.items-center{align-items:center}.gap-8{gap:8px}.gap-12{gap:12px}
.justify-between{justify-content:space-between}.flex-wrap{flex-wrap:wrap}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}
.text-sm{font-size:13px}.text-xs{font-size:11px}.text-muted{color:var(--text2)}
.text-danger{color:var(--danger)}.text-success{color:var(--success)}.text-warn{color:var(--warning)}
.fw-800{font-weight:800}.w-full{width:100%}
.hidden{display:none!important}

/* Privacy notice */
.privacy{
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);border-radius:12px;
  padding:12px 14px;font-size:12px;color:var(--text2);display:flex;gap:10px;margin-bottom:14px;
}
.privacy svg{width:18px;height:18px;flex-shrink:0;color:var(--accent);margin-top:1px}

/* Role selector */
.role-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="logo-spin">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 3-3 3-3-3 3-3z"/><path d="M19 9l3 3-3 3-3-3 3-3z"/><path d="M5 9l3 3-3 3-3-3 3-3z"/><path d="M12 16l3 3-3 3-3-3 3-3z"/></svg>
  </div>
  <h1>TechMaster OS</h1>
  <p>Carregando sistema…</p>
</div>

<!-- APP -->
<div id="app">
<div class="shell">

  <!-- OVERLAY DO MENU (celular) -->
  <div id="sidebarOverlay" onclick="window.toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="collapsed">

window.uid = function(prefix='id'){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
};
window.brl = function(v){
  const n = Number(v)||0;
  return 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
};
window.fmtDate = function(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR');
};
window.fmtDateTime = function(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
};
window.todayISO = function(){ return new Date().toISOString(); };
window.todayDate = function(){ return new Date().toISOString().slice(0,10); };
window.daysAgoISO = function(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); };
window.esc = function(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
};
window.maskPhone = function(v){
  v = String(v||'').replace(/\D/g,'').slice(0,11);
  if(v.length<=2) return v;
  if(v.length<=6) return '('+v.slice(0,2)+') '+v.slice(2);
  if(v.length<=10) return '('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6);
  return '('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
};
window.maskCPF = function(v){
  v = String(v||'').replace(/\D/g,'').slice(0,14);
  if(v.length<=11){
    return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  }
  return v.replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');
};
window.onlyDigits = function(v){ return String(v||'').replace(/\D/g,''); };

window.saveState = function(){
  try{
    localStorage.setItem(window.STORE_KEY, JSON.stringify(window.state));
    return true;
  }catch(e){
    console.error('Erro ao salvar', e);
    window.toast('Erro ao salvar dados no dispositivo','error');
    return false;
  }
};

window.loadState = function(){
  try{
    const raw = localStorage.getItem(window.STORE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || typeof data!=='object') return false;
    Object.assign(window.state, data);
    ['clients','orders','parts','movs','technicians','expenses','payments'].forEach(k=>{
      if(!Array.isArray(window.state[k])) window.state[k]=[];
    });
    if(!window.state.counters) window.state.counters={order:0};
    if(!window.state.settings) window.state.settings={};
    return true;
  }catch(e){
    console.error('Erro ao carregar', e);
    return false;
  }
};

window.loadSettings = function(){
  try{ const r=localStorage.getItem(window.SETTINGS_KEY); if(r) window.state.settings=JSON.parse(r)||{}; }catch(e){}
};

window.toast = function(msg, type='info'){
  const wrap = document.getElementById('toast-wrap');
  if(!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast ' + (type==='success'?'success':type==='error'?'error':type==='warn'?'warn':'');
  const iconMap = {
    success:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    error:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 12v4"/></svg>'
  };
  t.innerHTML = (iconMap[type]||iconMap.info) + '<span>'+window.esc(msg)+'</span>';
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(120%)'; t.style.transition='.3s'; }, 2600);
  setTimeout(()=>t.remove(), 3000);
};

window.navigate = function(section){
  if(section!==window.currentSection) window.lastSection = window.currentSection;
  window.currentSection = section;
  const item = window.NAV_ITEMS.find(n=>n.id===section);
  document.getElementById('pageTitle').textContent = item ? item.label : 'TechMaster';
  window.renderNav();
  window.renderSection();
  
  // No mobile, fechar a sidebar automaticamente ao navegar
  if (window.innerWidth <= 900) {
    document.getElementById('sidebar').classList.add('collapsed');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }

  window.scrollTo({top:0,behavior:'smooth'});
};

window.renderSection = function(){
  const c = document.getElementById('content');
  try {
    switch(window.currentSection){

      case 'orders': c.innerHTML = window.renderOrders(); window.bindOrders(); break;

      case 'finance': c.innerHTML = window.renderFinance(); window.bindFinance(); break;
      case 'technicians': c.innerHTML = window.renderTechnicians(); window.bindTechnicians(); break;
      case 'warranty': c.innerHTML = window.renderWarranty(); window.bindWarranty(); break;
      case 'reports': c.innerHTML = window.renderReports(); window.bindReports(); break;
      case 'settings': c.innerHTML = window.renderSettings(); window.bindSettings(); break;

// CANVAS CHARTS
window.setupCanvas = function(canvas){
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  if(rect.width === 0 || rect.height === 0) return null;
  canvas.width = rect.width*dpr;
  canvas.height = rect.height*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  return {ctx, w: rect.width, h: rect.height};
};
window.cssVar = function(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
};
window.drawBarChart = function(id, labels, values, color){
  const canvas = document.getElementById(id); if(!canvas) return;
  const setup = window.setupCanvas(canvas); if(!setup) return;
  const {ctx,w,h} = setup;
  ctx.clearRect(0,0,w,h);
  const padL=40, padB=26, padT=14, padR=10;
  const cw = w-padL-padR, ch = h-padT-padB;
  const max = Math.max(...values, 1);
  const bw = cw / labels.length * 0.6;
  const gap = cw / labels.length;
  ctx.strokeStyle = window.cssVar('--border')||'#2e3a55';
  ctx.fillStyle = window.cssVar('--text3')||'#6b7894';
  ctx.font = '10px sans-serif';
  ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const y = padT + ch - (i/4)*ch;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    const val = (max*i/4);
    ctx.fillText('R$'+Math.round(val), 4, y-2);
  }
  const grad = ctx.createLinearGradient(0,padT,0,padT+ch);
  grad.addColorStop(0, color);
  grad.addColorStop(1, color+'55');
  values.forEach((v,i)=>{
    const x = padL + gap*i + (gap-bw)/2;
    const bh = (v/max)*ch;
    const y = padT + ch - bh;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, bw, bh, 4) : ctx.rect(x, y, bw, bh);
    ctx.fill();
    ctx.fillStyle = window.cssVar('--text3')||'#6b7894';
    ctx.textAlign='center';
    ctx.fillText(labels[i], x+bw/2, h-8);
    ctx.textAlign='left';
  });
};
window.drawDonutChart = function(id, items){
  const canvas = document.getElementById(id); if(!canvas) return;
  const setup = window.setupCanvas(canvas); if(!setup) return;
  const {ctx,w,h} = setup;
  ctx.clearRect(0,0,w,h);
  const cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 16;
  const inner = r*0.6;
  const total = items.reduce((a,b)=>a+b.value,0)||1;
  let start = -Math.PI/2;
  items.forEach(it=>{
    const angle = (it.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle = it.color;
    ctx.fill();
    start += angle;
  });
  ctx.fillStyle = window.cssVar('--text')||'#fff';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(total, cx, cy+2);
  ctx.font = '10px sans-serif';
  ctx.fillStyle = window.cssVar('--text3')||'#6b7894';
  ctx.fillText('ORDENS', cx, cy+16);
  let ly = 12;
  ctx.textAlign='left';
  items.slice(0,6).forEach(it=>{
    ctx.fillStyle = it.color;
    ctx.fillRect(w-130, ly-8, 8, 8);
    ctx.fillStyle = window.cssVar('--text2')||'#9aa7c2';
    ctx.font = '10px sans-serif';
    ctx.fillText(it.label.slice(0,16)+' ('+it.value+')', w-118, ly);
    ly += 16;
  });
};

window.calcBudget = function(){
  const labor = Number(document.getElementById('fBudLabor').value)||0;
  const parts = Number(document.getElementById('fBudParts').value)||0;
  const disc = Number(document.getElementById('fBudDisc').value)||0;
  const down = Number(document.getElementById('fBudDown').value)||0;
  const total = Math.max(0, labor+parts-disc);
  const rem = Math.max(0, total-down);
  document.getElementById('fBudTotal').value = total.toFixed(2);
};

window.saveOrder = function(editId){
  try {
    const clientId = document.getElementById('fClient').value;
    const defect = document.getElementById('fDefect').value.trim();
    const brand = document.getElementById('fDevBrand').value.trim();
    const model = document.getElementById('fDevModel').value.trim();
    if(!clientId){ window.toast('Selecione um cliente','error'); return; }
    if(!defect){ window.toast('Informe o defeito relatado','error'); return; }
    if(!brand || !model){ window.toast('Informe marca e modelo do aparelho','error'); return; }

    const labor = Number(document.getElementById('fBudLabor').value)||0;
    const parts = Number(document.getElementById('fBudParts').value)||0;
    const disc = Number(document.getElementById('fBudDisc').value)||0;
    const down = Number(document.getElementById('fBudDown').value)||0;
    const total = Math.max(0, labor+parts-disc);

    const data = {
      clientId,
      technicianId: document.getElementById('fTech').value || '',
      device:{
        type:document.getElementById('fDevType').value,
        brand, model,
        color:document.getElementById('fDevColor').value.trim(),
        imei1:document.getElementById('fDevImei1').value.trim(),
        imei2:document.getElementById('fDevImei2').value.trim(),
        serial:document.getElementById('fDevSerial').value.trim(),
        password:document.getElementById('fDevPwd').value,
        passwordRecorded: !!document.getElementById('fDevPwd').value,
        physicalState:document.getElementById('fDevState').value.trim(),
        accessories:document.getElementById('fDevAcc').value.trim(),
        photos:[], notes:''
      },
      reportedDefect: defect,
      diagnosis:{
        initial:document.getElementById('fDiagInit').value.trim(),
        tests:document.getElementById('fDiagTests').value.trim(),
        identified:document.getElementById('fDiagIdent').value.trim(),
        solution:document.getElementById('fDiagSol').value.trim(),
        techNotes:''
      },
      budget:{labor, parts, discount:disc, total, downPayment:down, remaining: Math.max(0,total-down)},
      status: document.getElementById('fStatus').value || 'recebido'
    };

    if(editId){
      const o = window.orderById(editId);
      if(!o){ window.toast('OS não encontrada','error'); return; }
      const prevStatus = o.status;
      Object.assign(o, data);
      o.updatedAt = window.todayISO();
      if(prevStatus !== data.status){
        o.statusHistory.push({from:prevStatus, to:data.status, at: window.todayISO(), by:'Usuário'});
      }
      window.saveState();
      window.toast('OS atualizada com sucesso','success');
    } else {
      const num = window.nextOrderNumber();
      const newOrder = Object.assign({
        id:window.uid('os'),
        number: num,
        createdAt: window.todayISO(),
        updatedAt: window.todayISO(),
        statusHistory:[{from:'', to:data.status, at: window.todayISO(), by:'Usuário'}],
        priority:'normal',
        warranty:null,
        linkedOrderId:null,
        deliveryDate:null
      }, data);
      window.state.orders.push(newOrder);
      window.saveState();
      window.toast('OS '+num+' criada com sucesso','success');
    }
    window.closeModal();
    window.renderSection();
  } catch(e) {
    console.error(e);
    window.toast("Erro ao salvar OS", "error");
  }
};

window.changeOrderStatus = function(id){
  const o = window.orderById(id); if(!o) return;
  const newStatus = document.getElementById('detailStatus').value;
  if(newStatus === o.status){ window.closeModal(); return; }
  const prev = o.status;
  o.status = newStatus;
  o.updatedAt = window.todayISO();
  o.statusHistory.push({from:prev, to:newStatus, at:window.todayISO(), by:'Usuário'});
  if(newStatus==='entregue' && !o.deliveryDate) o.deliveryDate = window.todayISO();
  window.saveState();
  window.toast('Status atualizado para '+window.statusMeta(newStatus).label,'success');
  window.closeModal();
  window.renderSection();
};

window.deleteOrder = function(id){
  const o = window.orderById(id); if(!o) return;
  window.confirmDialog('Excluir OS', `Tem certeza que deseja excluir a OS ${o.number}? Esta ação não pode ser desfeita.`, ()=>{
    window.state.orders = window.state.orders.filter(x=>x.id!==id);
    window.state.payments = window.state.payments.filter(p=>p.orderId!==id);
    window.saveState();
    window.toast('OS excluída','success');
    window.closeModal();
    window.renderSection();
  });
};

window.saveClient = function(editId, fromOrder){
  const name = document.getElementById('cName').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  if(!name){ window.toast('Informe o nome do cliente','error'); return; }
  if(!phone){ window.toast('Informe o telefone','error'); return; }
  const data = {
    name, cpf:document.getElementById('cCpf').value.trim(),
    phone, email:document.getElementById('cEmail').value.trim(),
    address:document.getElementById('cAddress').value.trim(),
    city:document.getElementById('cCity').value.trim(),
    state:document.getElementById('cState').value.trim().toUpperCase(),
    notes:document.getElementById('cNotes').value.trim()
  };
  if(editId){
    const c = window.clientById(editId);
    Object.assign(c, data);
    window.toast('Cliente atualizado','success');
  } else {
    const c = Object.assign({id:window.uid('cli'), createdAt: window.todayISO()}, data);
    window.state.clients.push(c);
    window.toast('Cliente cadastrado','success');
    if(fromOrder){
      window.saveState();
      window.closeModal();
      setTimeout(()=>{ window.openOrderForm(); }, 200);
      return;
    }
  }
  window.saveState();
  window.closeModal();
  window.renderSection();
};

window.deleteClient = function(id){
  const c = window.clientById(id); if(!c) return;
  const hasOrders = window.state.orders.some(o=>o.clientId===id);
  const msg = hasOrders
    ? `O cliente ${c.name} possui ordens de serviço vinculadas. Excluir mesmo assim?`
    : `Excluir o cliente ${c.name}?`;
  window.confirmDialog('Excluir Cliente', msg, ()=>{
    window.state.clients = window.state.clients.filter(x=>x.id!==id);
    window.saveState();
    window.toast('Cliente excluído','success');
    window.closeModal();
    window.renderSection();
  });
};

window.savePart = function(editId){
  const name = document.getElementById('pName').value.trim();
  if(!name){ window.toast('Informe o nome da peça','error'); return; }
  const data = {
    name,
    sku: document.getElementById('pSku').value.trim(),
    category: document.getElementById('pCat').value.trim(),
    brand: document.getElementById('pBrand').value.trim(),
    model: document.getElementById('pModel').value.trim(),
    qty: Number(document.getElementById('pQty').value)||0,
    minQty: Number(document.getElementById('pMin').value)||0,
    cost: Number(document.getElementById('pCost').value)||0,
    price: Number(document.getElementById('pPrice').value)||0,
    supplier: document.getElementById('pSupplier').value.trim(),
    location: document.getElementById('pLoc').value.trim()
  };
  if(editId){
    const p = window.partById(editId);
    Object.assign(p, data);
    window.toast('Peça atualizada','success');
  } else {
    window.state.parts.push(Object.assign({id:window.uid('part'), createdAt:window.todayISO()}, data));
    window.toast('Peça cadastrada','success');
  }
  window.saveState();
  window.closeModal();
  window.renderSection();
};

window.stockMove = function(id, type){
  const p = window.partById(id); if(!p) return;
  const qtyStr = prompt(type==='entrada'?'Quantidade a adicionar:':'Quantidade a retirar:','1');
  if(qtyStr===null) return;
  const qty = parseInt(qtyStr,10);
  if(!qty || qty<=0){ window.toast('Quantidade inválida','error'); return; }
  if(type==='saida' && qty>Number(p.qty)){
    if(!confirm('A quantidade excede o estoque. Prosseguir mesmo assim?')) return;
  }
  p.qty = Number(p.qty) + (type==='entrada'?qty:-qty);
  window.state.movs.push({id:window.uid('mv'), partId:id, type, qty, date:window.todayISO(), notes:''});
  window.saveState();
  window.toast('Movimentação registrada','success');
  window.closeModal();
  window.renderSection();
};

window.deletePart = function(id){
  const p = window.partById(id); if(!p) return;
  window.confirmDialog('Excluir Peça', `Excluir a peça "${p.name}"?`, ()=>{
    window.state.parts = window.state.parts.filter(x=>x.id!==id);
    window.state.movs = window.state.movs.filter(m=>m.partId!==id);
    window.saveState();
    window.toast('Peça excluída','success');
    window.closeModal();
    window.renderSection();
  });
};

window.savePayment = function(){
  const orderId = document.getElementById('payOrder').value;
  const amount = Number(document.getElementById('payAmount').value)||0;
  if(!orderId){ window.toast('Nenhuma OS selecionada','error'); return; }
  if(amount<=0){ window.toast('Informe um valor válido','error'); return; }
  const o = window.orderById(orderId);
  if(!o){ window.toast('OS não encontrada','error'); return; }
  window.state.payments.push({
    id:window.uid('pay'), orderId, amount,
    method: document.getElementById('payMethod').value,
    date: document.getElementById('payDate').value || window.todayISO(),
    notes: document.getElementById('payNotes').value.trim()
  });
  window.saveState();
  window.toast('Pagamento de '+window.brl(amount)+' registrado','success');
  window.closeModal();
  window.renderSection();
};

window.openTechForm = function(editId){

  const body = `

window.saveTech = function(editId){
  const name = document.getElementById('tName').value.trim();
  if(!name){ window.toast('Informe o nome','error'); return; }
  const data = {
    name,
    phone: document.getElementById('tPhone').value.trim(),
    specialty: document.getElementById('tSpec').value.trim(),
    commission: Number(document.getElementById('tComm').value)||0,
    active: document.getElementById('tActive').value==='true'
  };
  if(editId){
    Object.assign(window.techById(editId), data);
    window.toast('Técnico atualizado','success');
  } else {
    window.state.technicians.push(Object.assign({id:window.uid('tec')}, data));
    window.toast('Técnico cadastrado','success');
  }
  window.saveState();
  window.closeModal();
  window.renderSection();
};

window.toggleTech = function(id){
  const t = window.techById(id); if(!t) return;
  t.active = !t.active;
  window.saveState();
  window.renderSection();
};

window.deleteTech = function(id){
  const t = window.techById(id); if(!t) return;
  window.confirmDialog('Excluir Técnico', `Excluir ${t.name}? As OS vinculadas permanecerão.`, ()=>{
    window.state.technicians = window.state.technicians.filter(x=>x.id!==id);
    window.state.orders.forEach(o=>{ if(o.technicianId===id) o.technicianId=''; });
    window.saveState();
    window.toast('Técnico excluído','success');
    window.renderSection();
  });
};

window.renderWarranty = function(){
  const delivered = window.state.orders.filter(o=>o.status==='entregue' && o.warranty);
  const now = new Date();
  const list = delivered.map(o=>{
    const end = new Date(o.warranty.completedAt);
    end.setDate(end.getDate() + Number(o.warranty.days||0));
    const daysLeft = Math.ceil((end - now)/(1000*60*60*24));
    return {o, end, daysLeft};
  }).sort((a,b)=>a.daysLeft-b.daysLeft);
  return `
  <div class="section-head">
    <div><h2>Garantias</h2><p>Controle de garantia dos serviços entregues</p></div>
  </div>
  ${list.length ? `<div class="os-list">${list.map(({o,end,daysLeft})=>{
    const cli = window.clientById(o.clientId);
    const active = daysLeft>=0;
    return `<div class="os-card" onclick="window.openOrderDetail('${o.id}')">
      <div class="os-card-top">
        <div>
          <div class="os-num">${o.number}</div>
          <div class="os-device">${window.esc(o.device.brand)} ${window.esc(o.device.model)} · ${window.esc(cli?cli.name:'—')}</div>
        </div>
        <span class="tag" style="background:${active?'var(--success)':'var(--danger)'}22;color:${active?'var(--success)':'var(--danger)'}">${active?daysLeft+' dias restantes':'Expirada'}</span>
      </div>
      <div class="os-meta">
        <span>${window.icon('shield',12)} ${o.warranty.days} dias</span>
        <span>Concluído: ${window.fmtDate(o.warranty.completedAt)}</span>
        <span>Vence: ${window.fmtDate(end.toISOString())}</span>
      </div>
    </div>`;
  }).join('')}</div>` : `<div class="empty">${window.icon('shield',48)}<h4>Nenhuma garantia registrada</h4><p>Garantias são criadas ao entregar OS com garantia</p></div>`}`;
};

window.openWhatsApp = function(orderId, clientId){
  let cli, o;
  if(orderId){ o = window.orderById(orderId); cli = window.clientById(o.clientId); }
  else if(clientId){ cli = window.clientById(clientId); }
  if(!cli){ window.toast('Cliente não encontrado','error'); return; }
  const phone = window.onlyDigits(cli.phone);
  if(!phone){ window.toast('Cliente sem telefone','error'); return; }
  let msg = '';
  if(o){
    const key = o.status==='pronto'?'ready':o.status==='entregue'?'delivered':o.status==='aprovacao'?'budget':'received';
    msg = (window.state.settings.waMessages&&window.state.settings.waMessages[key]) || 'Olá, [nome]!';
    msg = msg.replace(/\[nome\]/g, cli.name.split(' ')[0])
             .replace(/\[modelo\]/g, o.device.brand+' '+o.device.model)
             .replace(/\[os\]/g, o.number)
             .replace(/\[valor\]/g, window.brl(window.pendingForOrder(o.id)));
  } else {
    msg = `Olá, ${cli.name.split(' ')[0]}! Tudo bem?`;
  }
  const body = `
    <div class="field"><label>Mensagem</label><textarea id="waMsg" rows="5">${window.esc(msg)}</textarea></div>
    <p class="text-xs text-muted">O WhatsApp será aberto para você revisar e enviar.</p>
  `;
  const foot = `
    <button class="btn btn-ghost" onclick="window.closeModal()">Cancelar</button>
    <button class="btn btn-success" onclick="window.sendWhatsApp('${phone}')">${window.icon('whatsapp',16)} Abrir WhatsApp</button>
  `;
  window.openModal('Enviar WhatsApp', body, foot);
};

window.sendWhatsApp = function(phone){
  const msg = document.getElementById('waMsg').value;
  const url = 'https://wa.me/55'+phone+'?text='+encodeURIComponent(msg);
  window.open(url,'_blank');
  window.closeModal();
};

    const pend = window.pendingForOrder(o.id);
    body = `
      <div class="block"><h4>Serviços Realizados</h4><p>${window.esc(o.diagnosis.solution||o.reportedDefect)}</p></div>
      <div style="margin-top:14px">
        <div class="kv"><span>Valor total</span><b>${window.brl(o.budget.total)}</b></div>

    </body></html>`;
  const w = window.open('','_blank');
  if(!w){ window.toast('Permita pop-ups para imprimir','error'); return; }
  w.document.write(html);

  setTimeout(()=>{ w.focus(); w.print(); }, 400);

// BACKUP
// =========================================================
window.exportBackup = function(){
  const data = JSON.stringify(window.state,null,2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'techmaster_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  localStorage.setItem('techmaster_last_backup', new Date().toLocaleString('pt-BR'));
  const el = document.getElementById('lastBackup');
  if(el) el.textContent = localStorage.getItem('techmaster_last_backup');
  window.toast('Backup exportado com sucesso','success');
};

window.importBackup = function(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.clients) || !Array.isArray(data.orders)){
        window.toast('Arquivo inválido','error'); return;
      }
      window.confirmDialog('Restaurar Backup','Todos os dados atuais serão substituídos pelo backup. Continuar?',()=>{
        Object.assign(window.state, data);
        window.saveState();
        window.toast('Backup restaurado','success');
        window.renderSection();
      });
    }catch(err){
      window.toast('Erro ao ler o arquivo','error');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
};

window.clearAllData = function(){
  window.confirmDialog('Apagar todos os dados','Tem CERTEZA? Todos os dados serão apagados permanentemente.',()=>{
    window.state = {clients:[],orders:[],parts:[],movs:[],technicians:[],expenses:[],payments:[],settings:window.state.settings,counters:{order:0}};
    window.saveState();
    window.toast('Dados apagados','success');
    window.navigate('dashboard');
  });
};

window.loadDemoData = function(){
  window.confirmDialog('Carregar dados de demonstração','Isso substituirá todos os dados atuais. Continuar?',()=>{
    window.seedDemo();
    window.saveState();
    window.toast('Dados de demonstração carregados','success');
    window.navigate('dashboard');
  });
};

// =========================================================
// BUSCA GLOBAL
// =========================================================
window.setupGlobalSearch = function(){
  const input = document.getElementById('globalSearch');
  const results = document.getElementById('searchResults');
  if(!input) return;
  input.addEventListener('input',()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.classList.remove('open'); return; }
    let html = '';
    const clients = window.state.clients.filter(c=>
      c.name.toLowerCase().includes(q) || window.onlyDigits(c.phone).includes(window.onlyDigits(q)) || (c.cpf||'').includes(q)
    ).slice(0,5);
    if(clients.length){
      html += `<div class="sr-group">Clientes</div>`;
      html += clients.map(c=>`<div class="sr-item" onclick="window.openClientDetail('${c.id}');document.getElementById('searchResults').classList.remove('open');document.getElementById('globalSearch').value=''">${window.esc(c.name)}<small>${window.esc(c.phone)}</small></div>`).join('');
    }
    const orders = window.state.orders.filter(o=>
      o.number.toLowerCase().includes(q) ||
      (o.device.model||'').toLowerCase().includes(q) ||
      (o.device.imei1||'').includes(q) ||
      (o.device.brand||'').toLowerCase().includes(q)
    ).slice(0,5);
    if(orders.length){
      html += `<div class="sr-group">Ordens de Serviço</div>`;
      html += orders.map(o=>`<div class="sr-item" onclick="window.openOrderDetail('${o.id}');document.getElementById('searchResults').classList.remove('open');document.getElementById('globalSearch').value=''">${o.number} · ${window.esc(o.device.brand)} ${window.esc(o.device.model)}<small>${window.statusMeta(o.status).label}</small></div>`).join('');
    }
    const parts = window.state.parts.filter(p=>
      p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.model||'').toLowerCase().includes(q)
    ).slice(0,5);
    if(parts.length){
      html += `<div class="sr-group">Peças</div>`;
      html += parts.map(p=>`<div class="sr-item" onclick="window.openPartDetail('${p.id}');document.getElementById('searchResults').classList.remove('open');document.getElementById('globalSearch').value=''">${window.esc(p.name)}<small>${window.esc(p.sku)} · ${p.qty} un</small></div>`).join('');
    }
    if(!html) html = `<div class="sr-item" style="cursor:default">Nenhum resultado encontrado</div>`;
    results.innerHTML = html;
    results.classList.add('open');
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.search-wrap')) results.classList.remove('open');
  });
};

// =========================================================
// TEMA E TOPBAR
// =========================================================
window.setTheme = function(theme){
  document.documentElement.dataset.theme = theme;
  try{ localStorage.setItem(window.THEME_KEY, theme); }catch(e){}
};
window.toggleTheme = function(){
  const cur = document.documentElement.dataset.theme==='light'?'dark':'light';
  window.setTheme(cur);
  window.toast('Tema '+(cur==='light'?'claro':'escuro')+' ativado','success');
};
window.initTheme = function(){
  let t = 'dark';
  try{ t = localStorage.getItem(window.THEME_KEY) || 'dark'; }catch(e){}
  window.setTheme(t);
  if(window.state.settings.primaryColor) window.applyPrimaryColor(window.state.settings.primaryColor);
};

window.setupTopbar = function(){
  document.getElementById('themeBtn').addEventListener('click',window.toggleTheme);
  document.getElementById('notifBtn').addEventListener('click',()=>{
    const lowStock = window.state.parts.filter(p=>Number(p.qty)<=Number(p.minQty));
    const pending = window.state.orders.filter(o=>window.pendingForOrder(o.id)>0 && o.status!=='cancelado');
    const body = `
      <h4 style="margin-bottom:10px;font-size:13px;color:var(--text2)">NOTIFICAÇÕES</h4>
      ${lowStock.length?`<div class="card card-pad mb-8" style="padding:12px;border-left:3px solid var(--warning)"><b>${lowStock.length} peça(s)</b> com estoque baixo</div>`:''}
      ${pending.length?`<div class="card card-pad mb-8" style="padding:12px;border-left:3px solid var(--danger)"><b>${pending.length} OS</b> com pagamento pendente</div>`:''}
      <div class="card card-pad" style="padding:12px;border-left:3px solid var(--primary)">Sistema operando normalmente</div>
    `;
    window.openModal('Notificações',body,`<button class="btn btn-ghost w-full" onclick="window.closeModal()">Fechar</button>`);
  });
  document.getElementById('avatarBtn').addEventListener('click',()=>{
    const body = `
      <p class="text-sm text-muted mb-16">Modo demonstração local. Selecione um perfil para simular a interface:</p>
      <div class="flex gap-8 flex-wrap">
        <button class="role-badge" onclick="window.toast('Perfil Administrador selecionado (demo)','success');window.closeModal()">Administrador</button>
        <button class="role-badge" onclick="window.toast('Perfil Técnico selecionado (demo)','success');window.closeModal()">Técnico</button>
        <button class="role-badge" onclick="window.toast('Perfil Atendente selecionado (demo)','success');window.closeModal()">Atendente</button>
      </div>
      <p class="text-xs text-muted mt-16">Este seletor é apenas ilustrativo.</p>
    `;
    window.openModal('Perfil de Acesso',body,`<button class="btn btn-ghost w-full" onclick="window.closeModal()">Fechar</button>`);
  });
  document.getElementById('modalBack').addEventListener('click',e=>{
    if(e.target.id==='modalBack') window.closeModal();
  });
};

// =========================================================
// INICIALIZAÇÃO
// =========================================================
window.init = function(){
  try {
    window.loadSettings();
    const loaded = window.loadState();
    if(!loaded){
      window.seedDemo();
      window.saveState();
    }
    window.initTheme();
    window.setupTopbar();
    window.setupGlobalSearch();
    window.renderNav();
    
    // Configura o estado inicial da sidebar dependendo da tela
    if(window.innerWidth > 900) {
       document.getElementById('sidebar').classList.remove('collapsed');
    } else {
       document.getElementById('sidebar').classList.add('collapsed');
    }

    window.navigate('dashboard');
    
    // Esconder loader
    const loader = document.getElementById('loader');
    if(loader){
      loader.style.opacity='0';
      setTimeout(()=>{
        loader.style.display='none';
        document.getElementById('app').classList.add('ready');
      }, 350);
    }
  } catch(err) {
    console.error("Erro na inicialização:", err);
    document.getElementById('loader').style.display='none';
    document.getElementById('app').classList.add('ready');
    alert("Erro ao iniciar o aplicativo: " + err.message);
  }
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', window.init);
} else {
  window.init();
}

window.addEventListener('resize',()=>{
  if(window.currentSection==='dashboard') window.bindDashboard();
});
</script>
