<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pobre Futebol TV</title>
<meta name="theme-color" content="#05080a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root { --bg:#05080a; --panel:rgba(8,14,12,.94); --green:#00d26a; --text:#eaf5ee; --muted:#7f9a8a; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#000; color:var(--text); font-family:system-ui,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; background:#000; object-fit:contain; }

  /* Splash */
  #splash { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #0b2a1a, var(--bg) 70%); transition:opacity .6s; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash .ball { font-size:64px; animation:bounce 1s infinite alternate ease-in; }
  #splash h1 { font-size:clamp(32px,8vw,72px); letter-spacing:4px; text-transform:uppercase; font-weight:900; margin-top:12px; }
  #splash h1 span { color:var(--green); }
  #splash p { color:var(--muted); margin-top:14px; font-size:15px; }
  .bar { width:min(260px,60vw); height:4px; background:#12251b; border-radius:4px; margin-top:22px; overflow:hidden; }
  .bar i { display:block; height:100%; width:40%; background:var(--green); border-radius:4px; animation:slide 1.1s infinite ease-in-out; }
  @keyframes slide { from{margin-left:-40%} to{margin-left:100%} }
  @keyframes bounce { to { transform:translateY(-22px) } }
  #splash .actions { margin-top:22px; display:none; flex-direction:column; gap:10px; align-items:center; text-align:center; max-width:90vw; }
  #splash button, #splash label { background:var(--green); color:#00160a; border:0; padding:12px 20px; border-radius:10px; font-weight:700; cursor:pointer; font-size:15px; }

  /* Menu */
  #menu { position:fixed; inset:0; z-index:50; display:flex; opacity:0; pointer-events:none; transition:opacity .25s;
    background:linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,0) 100%); }
  #menu.show { opacity:1; pointer-events:auto; }
  .col { height:100%; display:flex; flex-direction:column; background:var(--panel); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  #cats { width:min(240px,32vw); border-right:1px solid #16261d; }
  #chs { width:min(380px,48vw); border-right:1px solid #16261d; }
  .head { padding:14px; font-weight:800; color:var(--green); letter-spacing:1px; font-size:13px; text-transform:uppercase; }
  #search { margin:0 12px 10px; padding:10px 12px; border-radius:8px; border:1px solid #1d3327; background:#0c1712; color:var(--text); font-size:14px; outline:none; }
  .list { overflow-y:auto; flex:1; }
  .item { padding:12px 14px; cursor:pointer; display:flex; align-items:center; gap:10px; font-size:14px; border-left:3px solid transparent; }
  .item:hover { background:#10201a; }
  .item.active { background:#12301f; border-left-color:var(--green); }
  .item img { width:34px; height:34px; object-fit:contain; background:#0c1712; border-radius:6px; flex:none; }
  .item .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .c { margin-left:auto; color:var(--muted); font-size:12px; }
  #menuSpace { flex:1; }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:60; background:rgba(0,0,0,.75); padding:8px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
  #err { position:fixed; inset:auto 0 40% 0; text-align:center; z-index:40; color:#ffb4b4; display:none; padding:0 20px; text-shadow:0 1px 4px #000; }
</style>
</head>
<body>

<video id="v" autoplay playsinline></video>
<div id="err">Canal indisponível. Toque na tela e escolha outro.</div>
<div id="toast"></div>

<div id="menu">
  <div class="col" id="cats"><div class="head">Categorias</div><div class="list" id="catList"></div><button id="install" style="display:none;margin:10px;padding:10px;border:0;border-radius:8px;background:#00d26a;color:#00160a;font-weight:700;cursor:pointer">Instalar app</button></div>
  <div class="col" id="chs"><div class="head" id="chTitle">Canais</div>
    <input id="search" placeholder="Buscar canal..." autocomplete="off">
    <div class="list" id="chList"></div></div>
  <div id="menuSpace"></div>
</div>

<div id="splash">
  <div class="ball">⚽</div>
  <h1>Pobre <span>Futebol</span></h1>
  <p id="status">Carregando canais...</p>
  <div class="bar" id="bar"><i></i></div>
  <div class="actions" id="actions">
    <div id="failMsg" style="color:var(--muted);font-size:14px"></div>
    <button id="retry">Tentar novamente</button>
  </div>
</div>

<script>
/* ===== CONFIGURAÇÃO ===== */
const PLAYLIST_URL = "http://lojaemporio10.biz/get.php?username=xNXa89PV&password=69kTGx&type=m3u_plus";
// Se o navegador bloquear (CORS / http em página https), publique o worker.js e coloque o endereço dele aqui.
const API_URL = ""; // endereço do seu worker/proxy (veja worker.js). Se vazio, tenta direto.
/* ======================== */

const $ = id => document.getElementById(id);
const video = $("v"), menu = $("menu");
let channels = [], groups = new Map(), curGroup = "Todos", curChannel = null, hls = null, errTimer = null;

/* ---------- Parser M3U (somente canais ao vivo) ---------- */
function parseM3U(text) {
  const lines = text.split(/\r?\n/), out = [];
  let meta = null;
  for (let raw of lines) {
    const l = raw.trim();
    if (l.startsWith("#EXTINF")) {
      const attr = k => { const m = l.match(new RegExp(k + '="([^"]*)"', "i")); return m ? m[1] : ""; };
      meta = {
        name: (l.split(/,(.*)$/s)[1] || attr("tvg-name") || "Canal").trim(),
        logo: attr("tvg-logo"),
        group: attr("group-title") || "Sem categoria"
      };
    } else if (l && !l.startsWith("#") && meta) {
      const isVod = /\/(movie|series)\//i.test(l) || /\.(mp4|mkv|avi)(\?|$)/i.test(l);
      const grpVod = /(filme|movie|s[eé]rie|series|vod|novela|desenho.*(filme)|temporada)/i.test(meta.group);
      if (!isVod && !grpVod) out.push({ ...meta, url: l });
      meta = null;
    }
  }
  return out;
}

/* ---------- Carregamento ---------- */
async function fetchText(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.text();
}
async function loadPlaylist() {
  $("actions").style.display = "none"; $("bar").style.display = "block";
  $("status").textContent = "Carregando canais...";
  try {
    let text;
    try { text = await fetchText(API_URL || PLAYLIST_URL); }
    catch (e) { if (API_URL) text = await fetchText(PLAYLIST_URL); else throw e; }
    try { localStorage.setItem("pf_cache", text); } catch (e) {}
    start(text);
  } catch (e) {
    let cached = null; try { cached = localStorage.getItem("pf_cache"); } catch (x) {}
    if (cached) { start(cached); return; }
    fail("Não foi possível baixar a lista (o navegador pode estar bloqueando por CORS ou conteúdo misto http/https).");
  }
}
function fail(msg) {
  $("status").textContent = "Falha ao carregar";
  $("bar").style.display = "none";
  $("failMsg").textContent = msg;
  $("actions").style.display = "flex";
}
function start(text) {
  channels = parseM3U(text);
  if (!channels.length) return fail("Nenhum canal encontrado na lista.");
  groups = new Map([["Todos", channels]]);
  channels.forEach(c => { if (!groups.has(c.group)) groups.set(c.group, []); groups.get(c.group).push(c); });
  renderCats(); renderChannels();
  let last = null; try { last = localStorage.getItem("pf_last"); } catch (e) {}
  const first = channels.find(c => c.url === last) || channels[0];
  play(first);
  setTimeout(() => $("splash").classList.add("hide"), 900);
}

/* ---------- Player ---------- */
function streamUrl(u) {
  if (/\.m3u8(\?|$)/i.test(u)) return u;
  if (/\.ts(\?|$)/i.test(u)) return u.replace(/\.ts(\?|$)/i, ".m3u8$1");
  if (/^https?:\/\/[^/]+\/(live\/)?[^/]+\/[^/]+\/\d+$/i.test(u)) return u + ".m3u8";
  return u;
}
function play(ch) {
  curChannel = ch; $("err").style.display = "none";
  try { localStorage.setItem("pf_last", ch.url); } catch (e) {}
  toast(ch.name);
  if (hls) { hls.destroy(); hls = null; }
  const src = streamUrl(ch.url);
  clearTimeout(errTimer);
  if (window.Hls && Hls.isSupported() && /\.m3u8/i.test(src)) {
    hls = new Hls({ lowLatencyMode: true, maxBufferLength: 20 });
    hls.loadSource(src); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) { setTimeout(() => hls && hls.startLoad(), 1500); }
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else $("err").style.display = "block";
    });
  } else {
    video.src = src; video.play().catch(() => {});
  }
  video.onerror = () => { $("err").style.display = "block"; };
  markActive();
}

/* ---------- Menu ---------- */
function renderCats() {
  const el = $("catList"); el.innerHTML = "";
  groups.forEach((list, name) => {
    const d = document.createElement("div");
    d.className = "item" + (name === curGroup ? " active" : "");
    d.innerHTML = `<span class="n"></span><span class="c">${list.length}</span>`;
    d.querySelector(".n").textContent = name;
    d.onclick = () => { curGroup = name; $("search").value = ""; renderCats(); renderChannels(); };
    el.appendChild(d);
  });
}
function renderChannels() {
  const q = $("search").value.trim().toLowerCase();
  let list = groups.get(curGroup) || [];
  if (q) list = channels.filter(c => c.name.toLowerCase().includes(q));
  $("chTitle").textContent = q ? "Busca" : curGroup;
  const el = $("chList"); el.innerHTML = "";
  const frag = document.createDocumentFragment();
  list.slice(0, 600).forEach(c => {
    const d = document.createElement("div");
    d.className = "item"; d.dataset.url = c.url;
    if (c.logo) { const i = document.createElement("img"); i.loading = "lazy"; i.src = c.logo; i.onerror = () => i.remove(); d.appendChild(i); }
    const n = document.createElement("span"); n.className = "n"; n.textContent = c.name; d.appendChild(n);
    d.onclick = () => { play(c); menu.classList.remove("show"); };
    frag.appendChild(d);
  });
  el.appendChild(frag); markActive();
}
function markActive() {
  document.querySelectorAll("#chList .item").forEach(d => d.classList.toggle("active", curChannel && d.dataset.url === curChannel.url));
}
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2200); }

/* Toque na tela abre/fecha o menu */
$("menuSpace").onclick = () => menu.classList.remove("show");
video.addEventListener("click", () => { menu.classList.add("show"); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") menu.classList.remove("show");
  else if (e.key === "Enter" && !menu.classList.contains("show") && e.target.tagName !== "INPUT") menu.classList.add("show");
  else if (e.key === "f") document.documentElement.requestFullscreen?.();
});
$("search").addEventListener("input", renderChannels);
$("retry").onclick = loadPlaylist;

/* PWA */
(function setupPWA() {
  try {
    const icon = n => {
      const c = document.createElement("canvas"); c.width = c.height = n; const g = c.getContext("2d");
      g.fillStyle = "#05080a"; g.fillRect(0, 0, n, n);
      g.fillStyle = "#00d26a"; g.beginPath(); g.arc(n/2, n/2, n*.38, 0, 7); g.fill();
      g.fillStyle = "#05080a"; g.beginPath(); g.arc(n/2, n/2, n*.14, 0, 7); g.fill();
      return c.toDataURL("image/png");
    };
    const i192 = icon(192), i512 = icon(512);
    const base = location.href.split("#")[0].split("?")[0];
    const manifest = {
      name: "Pobre Futebol TV", short_name: "Pobre Futebol",
      start_url: base, scope: base.replace(/[^/]*$/, ""),
      display: "fullscreen", display_override: ["fullscreen", "standalone"], orientation: "landscape",
      background_color: "#05080a", theme_color: "#05080a",
      icons: [
        { src: i192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: i512, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: i512, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
    const add = (rel, href) => { const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add("manifest", url); add("apple-touch-icon", i192); add("icon", i192);
  } catch (e) {}
})();
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; $("install").style.display = "block"; });
$("install").onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; $("install").style.display = "none"; };
window.addEventListener("appinstalled", () => { $("install").style.display = "none"; });

loadPlaylist();
</script>
</body>
</html>
