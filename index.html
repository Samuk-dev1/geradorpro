<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UniTV Player</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>

<style>
:root {
    --bg-red: #8B0000;
    --bg-red-dark: #5a0000;
    --text: #ffffff;
    --text-muted: #ffcccc;
    --focus: #ffdd00;
    --border: rgba(255,255,255,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

body {
    background: var(--bg-red);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

/* ============================================ */
/* HEADER - MENU SUPERIOR (igual à foto)        */
/* ============================================ */
.top-menu {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 55px;
    background: linear-gradient(180deg, #6b0000, #8B0000);
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.top-logo {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    margin-right: 35px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    letter-spacing: 0.5px;
}
.top-logo .icon-tv {
    color: #4a90e2;
    font-size: 18px;
}

.top-nav {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
    -webkit-overflow-scrolling: touch;
}
.top-nav::-webkit-scrollbar { display: none; }

.top-nav-item {
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    outline: none;
    transition: 0.2s;
    flex-shrink: 0;
    border-radius: 3px;
    position: relative;
}
.top-nav-item:hover { color: #ffcc00; }
.top-nav-item.active {
    color: #fff;
    font-weight: 700;
}
.top-nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 20%;
    width: 60%;
    height: 2px;
    background: #fff;
}
.top-nav-item:focus {
    background: var(--focus);
    color: #000;
}

.top-icons {
    display: flex;
    gap: 18px;
    margin-left: 20px;
    color: #fff;
    font-size: 15px;
    align-items: center;
}
.top-icons i { cursor: pointer; opacity: 0.85; transition: 0.2s; }
.top-icons i:hover { opacity: 1; transform: scale(1.1); }
.top-time {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin-left: 15px;
    white-space: nowrap;
}

/* ============================================ */
/* LAYOUT PRINCIPAL                             */
/* ============================================ */
.main-layout {
    position: fixed;
    top: 55px;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    background: var(--bg-red);
}

/* COLUNA ESQUERDA - LISTA DE CANAIS */
.left-panel {
    width: 42%;
    max-width: 480px;
    background: var(--bg-red-dark);
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    position: relative;
}

.left-panel-title {
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    background: transparent;
    border-bottom: none;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 45px;
}

.left-panel-title .back-btn-inline {
    background: rgba(255,255,255,0.12);
    border: 1px solid var(--border);
    color: #fff;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    outline: none;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: 0.2s;
}
.left-panel-title .back-btn-inline:hover { background: rgba(255,255,255,0.25); }
.left-panel-title .back-btn-inline:focus {
    background: var(--focus);
    color: #000;
    border-color: #fff;
}

.list-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.3) transparent;
    -webkit-overflow-scrolling: touch;
    padding: 0;
}
.list-container::-webkit-scrollbar { width: 6px; }
.list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

.list-item {
    display: flex;
    align-items: center;
    padding: 11px 16px;
    cursor: pointer;
    outline: none;
    transition: background 0.15s;
    gap: 14px;
    border-left: 4px solid transparent;
}
.list-item:hover { background: rgba(255,255,255,0.06); }
.list-item.active {
    background: rgba(255,255,255,0.1);
    border-left-color: #ffcc00;
}
.list-item:focus {
    background: var(--focus);
    border-left-color: #fff;
}
.list-item:focus .item-num,
.list-item:focus .item-name { color: #000; }
.list-item:focus .item-logo { background: rgba(0,0,0,0.1); }

.item-num {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    min-width: 45px;
    text-align: right;
    letter-spacing: 0.5px;
}

.item-logo {
    width: 55px;
    height: 38px;
    object-fit: contain;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    flex-shrink: 0;
    padding: 2px;
}

.item-name {
    flex: 1;
    font-size: 16px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 400;
}

/* Rodapé da lista */
.list-footer {
    padding: 10px 18px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.25);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 8px;
}
.list-footer .menu-key {
    background: #333;
    color: #fff;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: bold;
    font-size: 11px;
    border: 1px solid rgba(255,255,255,0.2);
}

/* COLUNA DIREITA - PLAYER */
.right-panel {
    flex: 1;
    background: #000;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

.player-wrapper {
    flex: 1;
    background: #000;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#main-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

.player-placeholder {
    color: rgba(255,255,255,0.25);
    text-align: center;
    padding: 20px;
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.player-placeholder i {
    font-size: 70px;
    margin-bottom: 20px;
    display: block;
    color: rgba(255,255,255,0.12);
}
.player-placeholder p {
    font-size: 15px;
    color: rgba(255,255,255,0.35);
}

/* Botão de tela cheia */
.btn-fullscreen {
    position: absolute;
    bottom: 15px;
    right: 15px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.5);
    width: 42px;
    height: 42px;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    outline: none;
    transition: 0.2s;
    backdrop-filter: blur(5px);
}
.btn-fullscreen:hover { background: rgba(139,0,0,0.9); border-color: #fff; transform: scale(1.05); }
.btn-fullscreen:focus {
    background: var(--focus);
    color: #000;
    border-color: #fff;
    transform: scale(1.15);
    box-shadow: 0 0 20px var(--focus);
}

#player-loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 35px;
    display: none;
    z-index: 40;
}

.live-indicator {
    position: absolute;
    top: 15px; left: 15px;
    background: rgba(239,68,68,0.95);
    color: #fff;
    padding: 6px 14px;
    border-radius: 15px;
    font-size: 11px;
    font-weight: 800;
    display: none;
    align-items: center;
    gap: 6px;
    z-index: 40;
    letter-spacing: 0.5px;
}
.live-indicator.show { display: flex; }
.live-indicator .dot {
    width: 7px; height: 7px;
    background: #fff;
    border-radius: 50%;
    animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }

.player-footer {
    height: 55px;
    background: #2a0000;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 25px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 15px;
    color: #fff;
}
.footer-name {
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
    max-width: 40%;
    font-size: 16px;
}
.footer-time {
    color: #fff;
    font-weight: 500;
    white-space: nowrap;
    font-size: 15px;
}
.footer-program {
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    font-weight: 400;
    font-size: 15px;
}

/* ============================================ */
/* TELA CHEIA                                   */
/* ============================================ */
#fullscreen-player {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    z-index: 2000;
    display: none;
    flex-direction: column;
}
#fullscreen-player.active { display: flex; }

.fs-video-wrap {
    flex: 1;
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

#fs-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

.fs-close {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(139,0,0,0.9);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.4);
    width: 50px; height: 50px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2100;
    outline: none;
    transition: 0.2s;
}
.fs-close:hover { background: #8B0000; transform: scale(1.1); }
.fs-close:focus {
    background: var(--focus);
    color: #000;
    border-color: #fff;
    transform: scale(1.15);
}

.fs-title {
    position: absolute;
    top: 20px; left: 20px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    z-index: 2100;
    max-width: 60%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#fs-loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 40px;
    display: none;
    z-index: 2100;
}

.fs-live {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(239,68,68,0.95);
    color: #fff;
    padding: 7px 16px;
    border-radius: 15px;
    font-size: 12px;
    font-weight: 800;
    display: none;
    align-items: center;
    gap: 7px;
    z-index: 2100;
}
.fs-live.show { display: flex; }
.fs-live .dot {
    width: 7px; height: 7px;
    background: #fff;
    border-radius: 50%;
    animation: blink 1s infinite;
}

.fs-footer {
    height: 55px;
    background: #2a0000;
    display: flex;
    align-items: center;
    padding: 0 25px;
    gap: 25px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 15px;
    color: #fff;
}
.fs-footer .footer-name {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
    max-width: 40%;
    font-size: 16px;
}
.fs-footer .footer-time {
    color: #fff;
    font-weight: 500;
    white-space: nowrap;
    font-size: 15px;
}

/* ============================================ */
/* MODAL DE EPISÓDIOS                           */
/* ============================================ */
#episodes-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-red-dark);
    z-index: 1500;
    display: none;
    flex-direction: column;
    overflow-y: auto;
}
#episodes-modal.active { display: flex; }

.episodes-header {
    height: 55px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    background: linear-gradient(180deg, #6b0000, #8B0000);
    position: sticky;
    top: 0;
    z-index: 10;
    gap: 15px;
    border-bottom: 1px solid var(--border);
}
.back-btn {
    font-size: 18px;
    cursor: pointer;
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    color: #fff;
    background: rgba(0,0,0,0.3);
}
.back-btn:focus { background: var(--focus); color: #000; }

.season-selector {
    padding: 15px 20px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
}
.season-selector::-webkit-scrollbar { display: none; }
.season-btn {
    background: rgba(0,0,0,0.3);
    padding: 10px 20px;
    border-radius: 20px;
    color: #fff;
    cursor: pointer;
    border: 1px solid var(--border);
    white-space: nowrap;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    outline: none;
}
.season-btn.active { background: #fff; color: var(--bg-red); }
.season-btn:focus { background: var(--focus); color: #000; transform: scale(1.05); }

.episode-list { padding: 0 20px 30px 20px; }
.episode-item {
    display: flex;
    background: rgba(0,0,0,0.3);
    margin-bottom: 10px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    outline: none;
    align-items: center;
    padding: 14px 18px;
    gap: 15px;
}
.episode-item:focus { border-color: var(--focus); background: rgba(255,255,255,0.15); }
.episode-num {
    font-size: 15px;
    color: #ffcc00;
    font-weight: bold;
    min-width: 60px;
}
.episode-title {
    flex: 1;
    font-size: 14px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* RESPONSIVO MOBILE */
@media (max-width: 900px) {
    .main-layout { flex-direction: column; }
    .left-panel {
        width: 100%;
        max-width: none;
        height: 55%;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .right-panel { height: 45%; }
    .top-logo { font-size: 15px; margin-right: 15px; }
    .top-nav-item { padding: 8px 12px; font-size: 12px; }
    .top-icons { display: none; }
    .top-time { font-size: 12px; margin-left: 5px; }
    .item-num { font-size: 14px; min-width: 38px; }
    .item-logo { width: 45px; height: 30px; }
    .item-name { font-size: 14px; }
    .player-footer { height: 45px; font-size: 12px; padding: 0 12px; gap: 12px; }
    .footer-name { font-size: 13px; }
    .footer-time { font-size: 12px; }
    .footer-program { font-size: 12px; }
    .btn-fullscreen { width: 38px; height: 38px; font-size: 15px; bottom: 10px; right: 10px; }
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
</style>
</head>
<body>

<!-- MENU SUPERIOR - Apenas TV, FILMES, SÉRIES -->
<div class="top-menu">
    <div class="top-logo"><i class="fa-solid fa-tv icon-tv"></i> UniTV</div>
    <div class="top-nav" id="topNav">
        <div class="top-nav-item active" tabindex="0" data-tab="live" onclick="changeTab('live', this)">TV</div>
        <div class="top-nav-item" tabindex="0" data-tab="movie" onclick="changeTab('movie', this)">FILMES</div>
        <div class="top-nav-item" tabindex="0" data-tab="series" onclick="changeTab('series', this)">SÉRIES</div>
    </div>
    <div class="top-icons">
        <i class="fa-solid fa-magnifying-glass" tabindex="0"></i>
        <i class="fa-solid fa-filter" tabindex="0"></i>
        <i class="fa-solid fa-clock-rotate-left" tabindex="0"></i>
        <i class="fa-solid fa-user" tabindex="0"></i>
        <i class="fa-solid fa-bell" tabindex="0"></i>
        <i class="fa-solid fa-wifi"></i>
    </div>
    <div class="top-time" id="topTime">15:31</div>
</div>

<!-- LAYOUT PRINCIPAL -->
<div class="main-layout">
    <!-- LATERAL ESQUERDA - LISTA DE CANAIS -->
    <div class="left-panel">
        <div class="left-panel-title" id="leftPanelTitle">
            <span id="leftPanelTitleText">Lista de Canais</span>
            <button class="back-btn-inline" id="backToCatsBtn" tabindex="0" onclick="backToCategories()" style="display:none;">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>
        </div>
        <div class="list-container" id="listContainer">
            <div style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Carregando...</div>
        </div>
        <div class="list-footer">
            Pressione <span class="menu-key">MENU</span> para pesquisar canais
        </div>
    </div>

    <!-- DIREITA - PLAYER -->
    <div class="right-panel">
        <div class="player-wrapper">
            <div class="player-placeholder" id="playerPlaceholder">
                <i class="fa-solid fa-tv"></i>
                <p>Selecione um canal para assistir</p>
            </div>
            <video id="main-video" controls playsinline webkit-playsinline style="display:none;"></video>
            <div id="player-loading"><i class="fa-solid fa-spinner fa-spin"></i></div>
            <div class="live-indicator" id="liveIndicator">
                <span class="dot"></span> AO VIVO
            </div>
            <button class="btn-fullscreen" tabindex="0" id="btnFullscreen" onclick="openFullscreen()" title="Tela Cheia">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
        <div class="player-footer">
            <div class="footer-name" id="footerName">GLOBO RJ HD</div>
            <div class="footer-time" id="footerTime">15:25-16:55</div>
            <div class="footer-program" id="footerProgram">No Ritmo da Fé</div>
        </div>
    </div>
</div>

<!-- TELA CHEIA -->
<div id="fullscreen-player">
    <div class="fs-video-wrap">
        <video id="fs-video" controls playsinline webkit-playsinline></video>
        <div id="fs-loading"><i class="fa-solid fa-spinner fa-spin"></i></div>
        <div class="fs-live" id="fsLive"><span class="dot"></span> AO VIVO</div>
        <div class="fs-title" id="fsTitle">Carregando...</div>
        <button class="fs-close" tabindex="0" onclick="closeFullscreen()"><i class="fa-solid fa-compress"></i></button>
    </div>
    <div class="fs-footer">
        <div class="footer-name" id="fsFooterName">Canal</div>
        <div class="footer-time" id="fsFooterTime">--:--</div>
    </div>
</div>

<!-- MODAL DE EPISÓDIOS -->
<div id="episodes-modal">
    <div class="episodes-header">
        <div class="back-btn" tabindex="0" onclick="closeEpisodes()"><i class="fa-solid fa-arrow-left"></i></div>
        <div id="seriesTitle" style="font-size:15px; font-weight:bold;">Série</div>
    </div>
    <div class="season-selector" id="seasonSelector"></div>
    <div class="episode-list" id="episodeList"></div>
</div>

<script>
// ==========================================

let currentTab = 'live';

let hlsInstance = null;

let hlsFsInstance = null;
let mpegtsFsInstance = null;

const listContainer = document.getElementById('listContainer');
const leftPanelTitleText = document.getElementById('leftPanelTitleText');
const backToCatsBtn = document.getElementById('backToCatsBtn');
const mainVideo = document.getElementById('main-video');
const fsVideo = document.getElementById('fs-video');

const playerLoading = document.getElementById('player-loading');

const fsPlayer = document.getElementById('fullscreen-player');
const fsLoading = document.getElementById('fs-loading');
const fsLive = document.getElementById('fsLive');
const fsTitle = document.getElementById('fsTitle');
const fsFooterName = document.getElementById('fsFooterName');
const fsFooterTime = document.getElementById('fsFooterTime');
const episodesModal = document.getElementById('episodes-modal');
const seasonSelector = document.getElementById('seasonSelector');
const episodeList = document.getElementById('episodeList');

// Relógio
function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('topTime').innerText = `${h}:${m}`;
}
setInterval(updateClock, 1000);
updateClock();

// ==========================================
// NAVEGAÇÃO ENTRE ABAS
// ==========================================
async function changeTab(tab, element) {
    currentTab = tab;
    currentCategoryId = null;
    currentCategoryName = '';
    currentView = 'categories';
    document.querySelectorAll('.top-nav-item').forEach(el => el.classList.remove('active'));
    if (element) element.classList.add('active');
    
    let action = '';
    if (tab === 'live') action = 'get_live_categories';
    else if (tab === 'movie') action = 'get_vod_categories';
    else if (tab === 'series') action = 'get_series_categories';
    
    const titles = {
        live: 'Lista de Canais',
        movie: 'Lista de Filmes',
        series: 'Lista de Séries'
    };
    leftPanelTitleText.innerText = titles[tab] || 'Lista';
    backToCatsBtn.style.display = 'none';
    listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Carregando...</div>';
    
    try {
        const cats = await apiRequest(action);
        if (cats && cats.length > 0) {
            allCategories = cats;
            renderCategories();
        } else {
            listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Vazio.</div>';
        }
    } catch (e) {
        console.error(e);
        listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#ff6666;">Erro de conexão.</div>';
    }
}

// ==========================================
// RENDERIZA CATEGORIAS
// ==========================================
function renderCategories() {
    currentView = 'categories';
    listContainer.innerHTML = '';
    backToCatsBtn.style.display = 'none';
    
    allCategories.forEach((cat, index) => {
        const el = document.createElement('div');
        el.className = 'list-item';
        el.tabIndex = 0;
        el.innerHTML = `
            <div class="item-num" style="text-align:center; min-width:35px;"><i class="fa-solid fa-folder" style="color:#ffcc00; font-size:16px;"></i></div>
            <div class="item-name" style="font-weight:500;">${cat.category_name}</div>
        `;
        el.onclick = () => openCategory(cat.category_id, cat.category_name);
        el.onfocus = () => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        listContainer.appendChild(el);
    });
    
    setTimeout(() => {
        const first = listContainer.querySelector('.list-item');
        if (first) first.focus();
    }, 100);
}

// ==========================================
// ABRE UMA CATEGORIA
// ==========================================
async function openCategory(categoryId, categoryName) {
    currentCategoryId = categoryId;
    currentCategoryName = categoryName;
    currentView = 'content';
    
    leftPanelTitleText.innerText = categoryName;
    backToCatsBtn.style.display = 'flex';
    
    listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Carregando...</div>';
    
    let action = '';
    if (currentTab === 'live') action = 'get_live_streams';
    else if (currentTab === 'movie') action = 'get_vod_streams';
    else if (currentTab === 'series') action = 'get_series';
    
    try {
        const data = await apiRequest(`${action}&category_id=${categoryId}`);
        currentItems = Array.isArray(data) ? data : [];
        renderContent();
    } catch (e) {
        console.error(e);
        listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#ff6666;">Erro.</div>';
    }
}

function renderContent() {
    listContainer.innerHTML = '';
    
    if (!currentItems || currentItems.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Nenhum item.</div>';
        return;
    }
    
    currentItems.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 'list-item';
        el.tabIndex = 0;
        el.dataset.index = index;
        
        let num = item.num || (index + 1);
        let imgUrl = item.stream_icon || item.cover || '';
        let name = item.name;
        
        el.innerHTML = `
            <div class="item-num">${num}</div>
            <img class="item-logo" src="${imgUrl}" onerror="this.style.visibility='hidden'">
            <div class="item-name">${name}</div>
        `;
        
        el.onclick = () => {
            document.querySelectorAll('.list-item').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
            
            if (currentTab === 'series') {
                openSeriesInfo(item.series_id, item.name);
            } else {
                playInRightPanel(item, currentTab);
            }
        };
        
        el.onfocus = () => {
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            if (!currentPlayingItem || currentPlayingItem.stream_id !== item.stream_id) {
                updateFooterPreview(item, index);
            }
        };
        
        listContainer.appendChild(el);
    });
    
    setTimeout(() => {
        const first = listContainer.querySelector('.list-item');
        if (first) first.focus();
    }, 100);
}

function updateFooterPreview(item, index) {
    document.getElementById('footerName').innerText = item.name || 'UniTV';
    document.getElementById('footerTime').innerText = '--:--';
    document.getElementById('footerProgram').innerText = item.category_name || '';
}

// ==========================================
// VOLTA PARA AS CATEGORIAS
// ==========================================
function backToCategories() {
    if (currentView === 'content') {
        renderCategories();
    }
}

// ==========================================
// SÉRIES - Episódios
// ==========================================
async function openSeriesInfo(seriesId, title) {
    document.getElementById('seriesTitle').innerText = title;
    episodesModal.classList.add('active');
    seasonSelector.innerHTML = '<div style="color:#fff; padding:10px;">Carregando...</div>';
    episodeList.innerHTML = '';
    seriesDataCache = null;
    
    try {
        const data = await apiRequest(`get_series_info&series_id=${seriesId}`);
        seriesDataCache = data;
        if (data && data.episodes) {
            const seasons = Object.keys(data.episodes);
            renderSeasons(seasons);
            if (seasons.length > 0) selectSeason(seasons[0]);
        } else {
            seasonSelector.innerHTML = '<div style="color:#ff6666; padding:10px;">Sem episódios.</div>';
        }
    } catch (e) {
        seasonSelector.innerHTML = '<div style="color:#ff6666; padding:10px;">Erro.</div>';
    }
}

function renderSeasons(seasons) {
    seasonSelector.innerHTML = '';
    seasons.forEach(seasonNum => {
        const btn = document.createElement('div');
        btn.className = 'season-btn';
        btn.innerText = `Temporada ${seasonNum}`;
        btn.tabIndex = 0;
        btn.onclick = () => selectSeason(seasonNum);
        seasonSelector.appendChild(btn);
    });
}

function selectSeason(seasonNum) {
    document.querySelectorAll('.season-btn').forEach(btn => {
        if(btn.innerText.includes(seasonNum)) btn.classList.add('active');
        else btn.classList.remove('active');
    });
    episodeList.innerHTML = '';
    const episodes = seriesDataCache.episodes[seasonNum];
    if (!episodes || episodes.length === 0) {
        episodeList.innerHTML = '<div style="text-align:center; color:#fff; padding:20px;">Vazio.</div>';
        return;
    }
    episodes.forEach(ep => {
        const item = document.createElement('div');
        item.className = 'episode-item';
        item.tabIndex = 0;
        item.innerHTML = `
            <div class="episode-num">EP ${ep.episode_num}</div>
            <div class="episode-title">${ep.title}</div>
        `;
        item.onclick = () => {
            closeEpisodes();
            playInRightPanel({
                stream_id: ep.id,
                name: `T${seasonNum} EP${ep.episode_num} - ${ep.title}`,
                stream_icon: seriesDataCache.info?.cover || ''
            }, 'series');
        };
        item.onfocus = () => item.scrollIntoView({ behavior: 'smooth', block: 'center' });
        episodeList.appendChild(item);
    });
    
    setTimeout(() => {
        const first = episodeList.querySelector('.episode-item');
        if (first) first.focus();
    }, 100);
}

function closeEpisodes() { episodesModal.classList.remove('active'); }

// ==========================================
// PLAYER NO PAINEL DIREITO
// ==========================================
function playInRightPanel(item, type) {
    currentPlayingItem = item;
    
    playerPlaceholder.style.display = 'none';
    mainVideo.style.display = 'block';
    playerLoading.style.display = 'block';
    
    document.getElementById('footerName').innerText = item.name || 'Canal';
    document.getElementById('footerTime').innerText = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
    document.getElementById('footerProgram').innerText = item.category_name || '';
    
    stopMainPlayer();
    
    if (type === 'series' || type === 'movie') {
        liveIndicator.classList.remove('show');
        let folder = type === 'series' ? 'series' : 'movie';
        let url = `${CONFIG.host}/${folder}/${CONFIG.username}/${CONFIG.password}/${item.stream_id}.mp4`;
        
        mainVideo.src = url;
        mainVideo.play().then(() => {
            playerLoading.style.display = 'none';
        }).catch(() => {
            mainVideo.src = `${CONFIG.host}/${folder}/${CONFIG.username}/${CONFIG.password}/${item.stream_id}.mkv`;
            mainVideo.play().then(() => playerLoading.style.display = 'none')
                .catch(() => playerLoading.style.display = 'none');
        });
    } else {
        liveIndicator.classList.add('show');
        const tsUrl = `${CONFIG.host}/live/${CONFIG.username}/${CONFIG.password}/${item.stream_id}.ts`;
        
        if (typeof mpegts !== 'undefined' && mpegts.isSupported()) {
            try {
                mpegtsInstance = mpegts.createPlayer({
                    type: 'mpegts', isLive: true, url: tsUrl
                }, {
                    enableWorker: true, enableStashBuffer: false,
                    stashInitialSize: 128, lazyLoad: false,
                    liveBufferLatencyChasing: false,
                    autoCleanupSourceBuffer: true,
                    autoCleanupMaxBackwardDuration: 30,
                    autoCleanupMinBackwardDuration: 15
                });
                mpegtsInstance.attachMediaElement(mainVideo);
                mpegtsInstance.load();
                mpegtsInstance.on(mpegts.Events.ERROR, () => {
                    if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
                    tryLiveHLS(item.stream_id);
                });
                mpegtsInstance.play().then(() => {
                    playerLoading.style.display = 'none';
                }).catch(() => playerLoading.style.display = 'none');
                
                setTimeout(() => {
                    if (mpegtsInstance && mainVideo.readyState < 2) {
                        if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
                        tryLiveHLS(item.stream_id);
                    }
                }, 8000);
            } catch(e) {
                tryLiveHLS(item.stream_id);
            }
        } else {
            tryLiveHLS(item.stream_id);
        }
    }
}

function tryLiveHLS(id) {
    playerLoading.style.display = 'block';
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    
    const urlM3U8 = `${CONFIG.host}/live/${CONFIG.username}/${CONFIG.password}/${id}.m3u8`;
    
    if (Hls.isSupported()) {
        hlsInstance = new Hls({
            enableWorker: true, lowLatencyMode: false,
            manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 3
        });
        hlsInstance.loadSource(urlM3U8);
        hlsInstance.attachMedia(mainVideo);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            playerLoading.style.display = 'none';
            mainVideo.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) playerLoading.style.display = 'none';
        });
    } else if (mainVideo.canPlayType('application/vnd.apple.mpegurl')) {
        mainVideo.src = urlM3U8;
        mainVideo.addEventListener('loadedmetadata', () => {
            playerLoading.style.display = 'none';
            mainVideo.play();
        });
    }
}

function stopMainPlayer() {
    if (hlsInstance) { try { hlsInstance.destroy(); } catch(e) {} hlsInstance = null; }
    if (mpegtsInstance) { try { mpegtsInstance.destroy(); } catch(e) {} mpegtsInstance = null; }
    mainVideo.pause();
    mainVideo.removeAttribute('src');
    mainVideo.load();
}

// ==========================================
// TELA CHEIA
// ==========================================
function openFullscreen() {
    if (!currentPlayingItem) return;
    
    stopMainPlayer();
    
    fsPlayer.classList.add('active');
    fsTitle.innerText = currentPlayingItem.name;
    fsFooterName.innerText = currentPlayingItem.name;
    fsFooterTime.innerText = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
    fsLoading.style.display = 'block';
    
    let type = 'live';
    if (currentTab === 'movie') type = 'movie';
    else if (currentTab === 'series') type = 'series';
    
    if (hlsFsInstance) { try { hlsFsInstance.destroy(); } catch(e) {} hlsFsInstance = null; }
    if (mpegtsFsInstance) { try { mpegtsFsInstance.destroy(); } catch(e) {} mpegtsFsInstance = null; }
    fsVideo.pause();
    fsVideo.removeAttribute('src');
    fsVideo.load();
    
    if (type === 'series' || type === 'movie') {
        fsLive.classList.remove('show');
        let folder = type === 'series' ? 'series' : 'movie';
        let url = `${CONFIG.host}/${folder}/${CONFIG.username}/${CONFIG.password}/${currentPlayingItem.stream_id}.mp4`;
        fsVideo.src = url;
        fsVideo.play().then(() => fsLoading.style.display = 'none').catch(() => {
            fsVideo.src = `${CONFIG.host}/${folder}/${CONFIG.username}/${CONFIG.password}/${currentPlayingItem.stream_id}.mkv`;
            fsVideo.play().then(() => fsLoading.style.display = 'none').catch(() => fsLoading.style.display = 'none');
        });
    } else {
        fsLive.classList.add('show');
        const tsUrl = `${CONFIG.host}/live/${CONFIG.username}/${CONFIG.password}/${currentPlayingItem.stream_id}.ts`;
        
        if (typeof mpegts !== 'undefined' && mpegts.isSupported()) {
            try {
                mpegtsFsInstance = mpegts.createPlayer({
                    type: 'mpegts', isLive: true, url: tsUrl
                }, {
                    enableWorker: true, enableStashBuffer: false,
                    stashInitialSize: 128, lazyLoad: false,
                    liveBufferLatencyChasing: false,
                    autoCleanupSourceBuffer: true,
                    autoCleanupMaxBackwardDuration: 30,
                    autoCleanupMinBackwardDuration: 15
                });
                mpegtsFsInstance.attachMediaElement(fsVideo);
                mpegtsFsInstance.load();
                mpegtsFsInstance.on(mpegts.Events.ERROR, () => {
                    if (mpegtsFsInstance) { mpegtsFsInstance.destroy(); mpegtsFsInstance = null; }
                    tryFsHLS(currentPlayingItem.stream_id);
                });
                mpegtsFsInstance.play().then(() => fsLoading.style.display = 'none').catch(() => fsLoading.style.display = 'none');
            } catch(e) {
                tryFsHLS(currentPlayingItem.stream_id);
            }
        } else {
            tryFsHLS(currentPlayingItem.stream_id);
        }
    }
    
    setTimeout(() => {
        const closeBtn = fsPlayer.querySelector('.fs-close');
        if (closeBtn) closeBtn.focus();
    }, 200);
}

function tryFsHLS(id) {
    if (hlsFsInstance) { hlsFsInstance.destroy(); hlsFsInstance = null; }
    const urlM3U8 = `${CONFIG.host}/live/${CONFIG.username}/${CONFIG.password}/${id}.m3u8`;
    
    if (Hls.isSupported()) {
        hlsFsInstance = new Hls({
            enableWorker: true, lowLatencyMode: false,
            manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 3
        });
        hlsFsInstance.loadSource(urlM3U8);
        hlsFsInstance.attachMedia(fsVideo);
        hlsFsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            fsLoading.style.display = 'none';
            fsVideo.play().catch(() => {});
        });
    } else if (fsVideo.canPlayType('application/vnd.apple.mpegurl')) {
        fsVideo.src = urlM3U8;
        fsVideo.addEventListener('loadedmetadata', () => {
            fsLoading.style.display = 'none';
            fsVideo.play();
        });
    }
}

function closeFullscreen() {
    fsPlayer.classList.remove('active');
    if (hlsFsInstance) { try { hlsFsInstance.destroy(); } catch(e) {} hlsFsInstance = null; }
    if (mpegtsFsInstance) { try { mpegtsFsInstance.destroy(); } catch(e) {} mpegtsFsInstance = null; }
    fsVideo.pause();
    fsVideo.removeAttribute('src');
    fsVideo.load();
    
    if (currentPlayingItem) {
        playInRightPanel(currentPlayingItem, currentTab);
    }
    
    setTimeout(() => {
        const focused = document.querySelector('.list-item:focus') || document.querySelector('.list-item');
        if (focused) focused.focus();
    }, 100);
}

// ==========================================
// API
// ==========================================
async function apiRequest(actionParams) {
    const url = `${CONFIG.host}/player_api.php?username=${CONFIG.username}&password=${CONFIG.password}&action=${actionParams}`;
    const response = await fetch(url);
    return await response.json();
}

// ==========================================
// CONTROLE REMOTO
// ==========================================
document.addEventListener('keydown', function(e) {
    if (fsPlayer.classList.contains('active')) {
        if (e.key === 'Escape' || e.key === 'Backspace') {
            closeFullscreen();
            e.preventDefault();
            return;
        }
        return;
    }
    
    if (e.key === 'Escape' || e.key === 'Backspace') {
        if (episodesModal.classList.contains('active')) {
            closeEpisodes();
            e.preventDefault();
            return;
        }
        if (currentView === 'content') {
            backToCategories();
            e.preventDefault();
            return;
        }
    }
    
    if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
        const focusables = Array.from(document.querySelectorAll('button, [tabindex="0"]'))
            .filter(el => el.offsetParent !== null && !el.disabled);
        const currentIdx = focusables.indexOf(document.activeElement);
        if (currentIdx === -1) return;
        
        let nextIdx = currentIdx;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextIdx = Math.min(currentIdx + 1, focusables.length - 1);
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') nextIdx = Math.max(currentIdx - 1, 0);
        
        focusables[nextIdx]?.focus();
        e.preventDefault();
    }
    
    if (e.key === 'Enter' && document.activeElement) {
        document.activeElement.click();
        e.preventDefault();
    }
});

// ==========================================
// INICIALIZAÇÃO
// ==========================================
window.onload = () => {
    changeTab('live', document.querySelector('.top-nav-item'));
};
