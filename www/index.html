<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --sidebar: #0d1421;
            --card: #151d2e;
            --card-hover: #1e2a42;
            --primary: #8b5cf6;
            --primary-2: #a78bfa;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --accent: #2dd4bf;
            --text: #f1f5f9;
            --text-sec: #94a3b8;
            --text-muted: #64748b;
            --live: #ef4444;
            --border: rgba(255,255,255,0.06);
            --shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;}
        html, body { height: 100%; overflow: hidden; }
        body { background: var(--bg); color: var(--text); display: flex; -webkit-font-smoothing: antialiased; }

        .sidebar {
            width: 260px; background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; height: 100vh;
            flex-shrink: 0; transition: transform .3s ease; z-index: 100;
        }
        .sidebar-header {
            padding: 22px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .logo {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 1.2rem;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .logo-text { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.3px; }
        .logo-text span { color: var(--primary-2); }

        .user-info {
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            font-size: 0.72rem; color: var(--text-muted);
        }
        .user-info .user-name {
            color: var(--text); font-weight: 600; font-size: 0.82rem;
            margin-bottom: 3px; display: flex; align-items: center; gap: 6px;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #10b981; box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .main-nav { padding: 12px; border-bottom: 1px solid var(--border); }
        .nav-title {
            font-size: 0.65rem; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-muted);
            padding: 8px 12px 6px; font-weight: 600;
        }
        .nav-btn {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px; border-radius: 10px; cursor: pointer;
            color: var(--text-sec); font-size: 0.88rem; font-weight: 500;
            transition: all .2s; margin-bottom: 3px;
            border-left: 3px solid transparent;
        }
        .nav-btn:hover { background: var(--card); color: var(--text); }
        .nav-btn.active {
            background: linear-gradient(90deg, rgba(139,92,246,0.18), transparent);
            color: var(--primary-2); border-left-color: var(--primary);
        }
        .nav-btn .icon { font-size: 1.1rem; width: 22px; text-align: center; }

        .categories-section { flex: 1; overflow-y: auto; padding: 12px 8px 20px; }
        .categories-section::-webkit-scrollbar { width: 5px; }
        .categories-section::-webkit-scrollbar-thumb { background: var(--card); border-radius: 10px; }

        .cat-btn {
            display: flex; align-items: center; padding: 8px 14px;
            border-radius: 8px; cursor: pointer; color: var(--text-sec);
            font-size: 0.82rem; transition: all .18s;
            margin-bottom: 1px; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; position: relative;
        }
        .cat-btn::before {
            content: ''; position: absolute; left: 4px; top: 50%;
            transform: translateY(-50%) scale(0); width: 4px; height: 4px;
            border-radius: 50%; background: var(--primary); transition: transform .2s;
        }
        .cat-btn:hover { background: var(--card); color: var(--text); padding-left: 18px; }
        .cat-btn:hover::before { transform: translateY(-50%) scale(1); }
        .cat-btn.active {
            background: var(--card); color: var(--primary-2);
            font-weight: 600; padding-left: 18px;
        }
        .cat-btn.active::before { transform: translateY(-50%) scale(1); }

        .main-area {
            flex: 1; display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            background: radial-gradient(ellipse at top, #131c31 0%, var(--bg) 60%);
        }
        .topbar {
            padding: 18px 28px; display: flex; align-items: center; gap: 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(10,14,26,0.6); backdrop-filter: blur(20px); z-index: 10;
        }
        .menu-toggle {
            display: none; background: var(--card); border: none;
            color: var(--text); width: 40px; height: 40px;
            border-radius: 10px; cursor: pointer; font-size: 1.2rem;
        }
        .page-title { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.4px; }
        .page-title .highlight {
            background: linear-gradient(135deg, var(--primary-2), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .search-box {
            margin-left: auto; display: flex; align-items: center; gap: 10px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 16px;
            width: 300px; max-width: 40vw; transition: all .2s;
        }
        .search-box:focus-within {
            border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .search-box input {
            background: transparent; border: none; outline: none;
            color: var(--text); font-size: 0.88rem; width: 100%; font-family: inherit;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box .icon { color: var(--text-muted); font-size: 0.9rem; }

        .content { flex: 1; overflow-y: auto; padding: 24px 28px 60px; }
        .content::-webkit-scrollbar { width: 8px; }
        .content::-webkit-scrollbar-thumb { background: var(--card); border-radius: 10px; }

        .section-info {
            margin-bottom: 18px; display: flex; align-items: center;
            gap: 12px; color: var(--text-muted); font-size: 0.82rem;
        }
        .section-info strong { color: var(--text); font-weight: 600; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--card); border-radius: 14px;
            overflow: hidden; cursor: pointer;
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; border: 1px solid transparent;
            animation: fadeIn .4s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(139,92,246,0.25);
        }
        .card-img-wrap {
            position: relative; width: 100%; padding-top: 60%;
            overflow: hidden; background: linear-gradient(135deg, #1e293b, #0f172a);
        }
        .card-img-wrap img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; transition: transform .5s;
        }
        .card:hover .card-img-wrap img { transform: scale(1.08); }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 55%);
            opacity: 0; transition: opacity .3s;
            display: flex; align-items: flex-end;
            justify-content: center; padding: 12px;
        }
        .card:hover .card-overlay { opacity: 1; }
        .play-btn {
            width: 44px; height: 44px; background: var(--primary);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.1rem;
            box-shadow: 0 8px 25px var(--primary-glow);
            transform: scale(0.7); transition: transform .3s;
        }
        .card:hover .play-btn { transform: scale(1); }

        .badge {
            position: absolute; top: 10px; left: 10px;
            padding: 4px 10px; border-radius: 6px;
            font-size: 0.62rem; font-weight: 700;
            letter-spacing: 0.5px; backdrop-filter: blur(10px);
        }
        .badge.live {
            background: rgba(239,68,68,0.95); color: #fff;
            animation: livePulse 2s infinite;
        }
        @keyframes livePulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
            50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
        }
        .badge.movie { background: rgba(139,92,246,0.95); color: #fff; }
        .badge.series { background: rgba(45,212,191,0.95); color: #042f2e; }

        .card-info { padding: 12px 14px 14px; }
        .card-title {
            font-size: 0.85rem; font-weight: 600;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; margin-bottom: 4px;
        }
        .card-sub { font-size: 0.72rem; color: var(--text-muted); }

        .load-more {
            display: block; width: 100%; max-width: 320px;
            margin: 32px auto 0; padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff; border: none; border-radius: 12px;
            cursor: pointer; font-weight: 600; font-size: 0.88rem;
            font-family: inherit; transition: all .25s;
            box-shadow: 0 8px 25px var(--primary-glow);
        }
        .load-more:hover { transform: translateY(-2px); }

        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 99;
        }
        .overlay.show { display: block; }

        #episodes-modal, #player-modal { display: none; position: fixed; inset: 0; z-index: 1000; }
        #episodes-modal {
            background: rgba(10,14,26,0.98); backdrop-filter: blur(20px);
            padding: 28px; overflow-y: auto;
        }
        .ep-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; max-width: 900px;
            margin-left: auto; margin-right: auto;
            padding-bottom: 20px; border-bottom: 1px solid var(--border);
        }
        .ep-header h2 {
            background: linear-gradient(135deg, var(--primary-2), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 1.3rem; font-weight: 700;
        }
        .btn-close-modal {
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 10px 18px; border-radius: 10px;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            font-family: inherit; transition: all .2s;
        }
        .btn-close-modal:hover { background: var(--live); border-color: var(--live); color: #fff; }
        .season-title {
            color: var(--primary-2); margin: 20px auto 12px;
            font-size: 1rem; font-weight: 600;
            max-width: 900px; padding-left: 8px;
            border-left: 3px solid var(--primary);
        }
        .ep-item {
            background: var(--card); padding: 14px 18px;
            margin: 0 auto 6px; max-width: 900px;
            border-radius: 10px; cursor: pointer;
            display: flex; justify-content: space-between;
            align-items: center; transition: all .2s;
            border: 1px solid transparent;
        }
        .ep-item:hover {
            background: var(--card-hover); border-color: var(--primary);
            transform: translateX(4px);
        }
        .ep-item .ep-name { font-size: 0.88rem; font-weight: 500; }
        .ep-item .ep-num {
            font-size: 0.72rem; color: var(--text-muted);
            background: var(--bg); padding: 4px 10px; border-radius: 6px;
        }

        #player-modal { background: #000; z-index: 2000; }
        #player-modal video { width: 100%; height: 100%; background: #000; }
        .video-info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(15,23,42,0.9); backdrop-filter: blur(20px);
            padding: 10px 18px; border-radius: 10px;
            font-size: 0.85rem; font-weight: 600;
            max-width: 60%; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            z-index: 2001; border: 1px solid var(--border);
        }
        .close-player {
            position: absolute; top: 20px; right: 20px;
            background: rgba(239,68,68,0.9); border: none; color: #fff;
            padding: 12px 20px; border-radius: 10px; cursor: pointer;
            z-index: 2001; font-weight: 600; font-size: 0.85rem;
            font-family: inherit; transition: all .2s;
            backdrop-filter: blur(10px);
        }
        .close-player:hover { background: var(--live); transform: scale(1.05); }
        .player-loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: #fff; text-align: center; z-index: 2001;
        }
        .player-loading .spinner2 {
            border: 4px solid rgba(255,255,255,.1);
            border-left-color: var(--primary);
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin{to{transform:rotate(360deg);}}

        .live-indicator {
            position: absolute; bottom: 90px; left: 20px;
            background: rgba(239,68,68,0.9); color: #fff;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
            z-index: 2001; backdrop-filter: blur(10px);
        }
        .live-indicator .dot {
            width: 8px; height: 8px; background: #fff;
            border-radius: 50%; animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* Botão "Ir para o Ao Vivo" - agora só aparece se MUITO atrasado */
        .go-live-btn {
            position: absolute; bottom: 140px; left: 50%;
            transform: translateX(-50%);
            background: var(--primary); color: #fff;
            border: none; padding: 12px 26px;
            border-radius: 30px; cursor: pointer;
            font-weight: 700; font-size: 0.85rem;
            font-family: inherit; z-index: 2002;
            box-shadow: 0 8px 25px var(--primary-glow);
            display: none;
            align-items: center; gap: 8px;
            animation: slideUp .3s;
        }
        .go-live-btn.show { display: flex; }
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Indicador de buffer (delay) */
        .delay-indicator {
            position: absolute; bottom: 90px; right: 20px;
            background: rgba(15,23,42,0.85); backdrop-filter: blur(10px);
            color: var(--text-sec);
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.72rem; font-weight: 600;
            z-index: 2001; border: 1px solid var(--border);
            display: none;
        }
        .delay-indicator.show { display: block; }
        .delay-indicator .secs { color: var(--accent); font-weight: 700; }

        #loading {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; flex-direction: column;
            background: radial-gradient(ellipse at top, #1a2338 0%, var(--bg) 60%);
            position: fixed; inset: 0; z-index: 3000;
            padding: 20px; text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,.08);
            border-left-color: var(--primary);
            border-radius: 50%; width: 56px; height: 56px;
            animation: spin 1s linear infinite; margin-bottom: 24px;
        }
        .progress-bar {
            width: 100%; max-width: 320px; height: 6px;
            background: var(--card); border-radius: 10px;
            overflow: hidden; margin-top: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%; transition: width .4s; border-radius: 10px;
        }
        #loading-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
        #loading-sub { font-size: 0.82rem; color: var(--text-muted); }
        .error-msg { color: #ef4444; padding: 20px; text-align: center; }
        .error-msg h3 { margin-bottom: 12px; }
        .error-msg button {
            margin-top: 20px; padding: 12px 25px;
            background: var(--primary); color: #fff;
            border: none; border-radius: 10px; cursor: pointer;
            font-size: 0.9rem; font-weight: 600; font-family: inherit;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed; left: 0; top: 0;
                transform: translateX(-100%);
                box-shadow: var(--shadow);
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: flex; align-items: center; justify-content: center; }
            .search-box { width: 180px; }
            .topbar { padding: 14px 18px; }
            .content { padding: 18px 16px 40px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
            .page-title { font-size: 1.05rem; }
        }
        @media (max-width: 500px) {
            .search-box { width: 100%; max-width: 100%; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
            .card-title { font-size: 0.78rem; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p id="loading-text">🔌 Conectando ao servidor...</p>
        <p id="loading-sub">Aguarde, carregando sua lista</p>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">📺</div>
            <div class="logo-text">Meu<span>IPTV</span></div>
        </div>
        <div class="user-info">
            <div class="user-name"><span class="status-dot"></span>962313</div>
            <div id="user-status-line">Verificando...</div>
        </div>
        <div class="main-nav">
            <div class="nav-title">Navegação</div>
            <div class="nav-btn active" data-tab="live" onclick="changeMainTab('live')">
                <span class="icon">🔴</span><span>Canais ao Vivo</span>
            </div>
            <div class="nav-btn" data-tab="movie" onclick="changeMainTab('movie')">
                <span class="icon">🎬</span><span>Filmes</span>
            </div>
            <div class="nav-btn" data-tab="series" onclick="changeMainTab('series')">
                <span class="icon">📺</span><span>Séries</span>
            </div>
        </div>
        <div class="categories-section" id="categoriesSection">
            <div class="nav-title" style="padding-left:12px;">Categorias</div>
            <div id="categoryList">
                <div class="cat-btn active" onclick="selectCategory(null, this)">Todas</div>
            </div>
        </div>
    </aside>

    <div class="main-area">
        <div class="topbar">
            <button class="menu-toggle" onclick="toggleSidebar(true)">☰</button>
            <div class="page-title" id="pageTitle"><span class="highlight">Canais</span> ao Vivo</div>
            <div class="search-box">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar..." oninput="filterBySearch()">
            </div>
        </div>
        <div class="content">
            <div class="section-info" id="sectionInfo"></div>
            <div class="grid" id="contentGrid"></div>
            <button class="load-more" id="loadMoreBtn" style="display:none;" onclick="loadMore()">Carregar Mais</button>
        </div>
    </div>

    <div id="episodes-modal">
        <div class="ep-header">
            <h2 id="ep-series-title">Série</h2>
            <button class="btn-close-modal" onclick="closeEpisodes()">✕ FECHAR</button>
        </div>
        <div id="ep-list"></div>
    </div>

    <div id="player-modal">
        <div class="video-info" id="video-title">Carregando...</div>
        <button class="close-player" onclick="closePlayer()">✕ FECHAR</button>

        <!-- Indicador AO VIVO -->
        <div class="live-indicator" id="liveIndicator" style="display:none;">
            <span class="dot"></span> AO VIVO
        </div>

        <!-- Indicador de delay (buffer) -->
        <div class="delay-indicator" id="delayIndicator">
            Delay: <span class="secs" id="delaySecs">0s</span>
        </div>

        <!-- Botão Ir para o Ao Vivo -->
        <button class="go-live-btn" id="goLiveBtn" onclick="jumpToLive()">
            ⏩ Ir para o Ao Vivo
        </button>

        <div class="player-loading" id="player-loading">
            <div class="spinner2"></div>
            <p id="player-status">Conectando ao canal...</p>
        </div>
        <video id="videoPlayer" controls playsinline></video>
    </div>

    <script>
        const SERVER = "https://zeus.meupanel.com.br";
        const USER   = "962313";
        const PASS   = "723839";
        const API    = `${SERVER}/player_api.php?username=${USER}&password=${PASS}`;

        const LIVE_M3U8_URL = id => `${SERVER}/live/${USER}/${PASS}/${id}.m3u8`;
        const LIVE_TS_URL   = id => `${SERVER}/live/${USER}/${PASS}/${id}.ts`;
        const MOVIE_URL     = id => `${SERVER}/movie/${USER}/${PASS}/${id}.mp4`;
        const SERIES_URL    = id => `${SERVER}/series/${USER}/${PASS}/${id}.mp4`;

        let currentMainTab = 'live';
        let currentCategoryId = null;
        let currentPage = 1;
        const PER_PAGE = 60;
        let hls = null;
        let mpegtsPlayer = null;
        let currentItems = [];
        let allCategories = [];
        let isLiveStream = false;
        let liveCheckInterval = null;

        const $ = id => document.getElementById(id);

        async function apiFetch(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status);
            const text = await res.text();
            try { return JSON.parse(text); }
            catch(e) { throw new Error("Resposta inválida"); }
        }

        window.addEventListener('load', async () => {
            updateProgress(10, "🔌 Conectando ao servidor...", "Verificando credenciais");
            try {
                const info = await apiFetch(API);
                if (!info || !info.user_info || info.user_info.auth === 0) {
                    throw new Error("Credenciais inválidas");
                }
                const exp = info.user_info.exp_date
                    ? new Date(info.user_info.exp_date * 1000).toLocaleDateString('pt-BR')
                    : 'N/A';

                $('user-status-line').innerText = `Expira em ${exp}`;
                updateProgress(30, "✅ Conectado!", `Expira em ${exp}`);
                await sleep(400);
                updateProgress(60, "📥 Baixando conteúdos...", "Canais ao vivo");
                await changeMainTab('live');
                updateProgress(100, "✅ Pronto!", "Todos os conteúdos carregados");
                await sleep(400);
                $('loading').style.display = 'none';
            } catch(e) {
                console.error(e);
                $('loading').innerHTML = `
                    <div class="error-msg">
                        <h3>❌ Erro ao conectar</h3>
                        <p>${e.message}</p>
                        <button onclick="location.reload()">🔄 Tentar Novamente</button>
                    </div>`;
            }
        });

        const sleep = ms => new Promise(r => setTimeout(r, ms));
        function updateProgress(pct, text, sub) {
            $('progressFill').style.width = pct + '%';
            if (text) $('loading-text').innerText = text;
            if (sub) $('loading-sub').innerText = sub;
        }

        function toggleSidebar(open) {
            $('sidebar').classList.toggle('open', open);
            $('overlay').classList.toggle('show', open);
        }

        async function changeMainTab(type) {
            currentMainTab = type;
            currentCategoryId = null;
            currentPage = 1;

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.nav-btn[data-tab="${type}"]`)?.classList.add('active');

            const titles = {
                live:   '<span class="highlight">Canais</span> ao Vivo',
                movie:  '<span class="highlight">Filmes</span>',
                series: '<span class="highlight">Séries</span>'
            };
            $('pageTitle').innerHTML = titles[type];

            if (window.innerWidth < 900) toggleSidebar(false);

            try { await loadCategories(); }
            catch(e) {
                console.error(e);
                $('contentGrid').innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#ef4444;padding:40px;">Erro: ${e.message}</p>`;
            }
        }

        async function loadCategories() {
            let action = '';
            if (currentMainTab === 'live')   action = 'get_live_categories';
            if (currentMainTab === 'movie')  action = 'get_vod_categories';
            if (currentMainTab === 'series') action = 'get_series_categories';

            const cats = await apiFetch(`${API}&action=${action}`);
            allCategories = Array.isArray(cats) ? cats : [];

            const listEl = $('categoryList');
            listEl.innerHTML = '';

            const allBtn = document.createElement('div');
            allBtn.className = 'cat-btn active';
            allBtn.innerText = 'Todas';
            allBtn.onclick = () => selectCategory(null, allBtn);
            listEl.appendChild(allBtn);

            allCategories.forEach(cat => {
                const btn = document.createElement('div');
                btn.className = 'cat-btn';
                btn.innerText = cat.category_name;
                btn.title = cat.category_name;
                btn.onclick = () => selectCategory(cat.category_id, btn);
                listEl.appendChild(btn);
            });

            await loadItems();
        }

        function selectCategory(catId, btnEl) {
            currentCategoryId = catId;
            currentPage = 1;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            if (window.innerWidth < 900) toggleSidebar(false);
            loadItems();
        }

        async function loadItems() {
            let action = '';
            if (currentMainTab === 'live')   action = 'get_live_streams';
            if (currentMainTab === 'movie')  action = 'get_vod_streams';
            if (currentMainTab === 'series') action = 'get_series';

            let url = `${API}&action=${action}`;
            if (currentCategoryId) url += `&category_id=${currentCategoryId}`;

            $('contentGrid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:40px;">⏳ Carregando...</p>';
            $('loadMoreBtn').style.display = 'none';

            const items = await apiFetch(url);
            currentItems = Array.isArray(items) ? items : [];
            currentPage = 1;
            renderContent();
        }

        function filterBySearch() {
            const q = $('searchInput').value.trim().toLowerCase();
            if (!q) { renderContent(); return; }
            const filtered = currentItems.filter(i => (i.name || '').toLowerCase().includes(q));
            renderFiltered(filtered, `🔍 Resultados para "${q}"`);
        }

        function renderContent() {
            const end = currentPage * PER_PAGE;
            const toShow = currentItems.slice(0, end);
            renderCards(toShow);

            $('sectionInfo').innerHTML = `<strong>${currentItems.length}</strong> itens encontrados`;

            if (end < currentItems.length) {
                $('loadMoreBtn').style.display = 'block';
                $('loadMoreBtn').innerText = `⬇ Carregar Mais (${currentItems.length - end} restantes)`;
            } else {
                $('loadMoreBtn').style.display = 'none';
            }
        }

        function renderFiltered(items, label) {
            renderCards(items.slice(0, 200));
            $('sectionInfo').innerHTML = `<strong>${items.length}</strong> ${label}`;
            $('loadMoreBtn').style.display = 'none';
        }

        function renderCards(items) {
            const gridEl = $('contentGrid');
            gridEl.innerHTML = '';

            if (items.length === 0) {
                gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px 20px;">Nenhum item encontrado.</p>';
                return;
            }

            items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = (idx * 15) + 'ms';
                card.onclick = () => playItem(item);

                let name, img, badgeClass, badgeText, sub;

                if (currentMainTab === 'live') {
                    name = item.name;
                    img = item.stream_icon || '';
                    badgeClass = 'live'; badgeText = 'LIVE';
                    sub = item.num ? `Canal #${item.num}` : 'Ao vivo';
                } else if (currentMainTab === 'movie') {
                    name = item.name;
                    img = item.stream_icon || '';
                    badgeClass = 'movie'; badgeText = 'FILME';
                    sub = item.rating && item.rating !== '0' ? `⭐ ${parseFloat(item.rating).toFixed(1)}` : 'Filme';
                } else {
                    name = item.name;
                    img = item.cover || '';
                    badgeClass = 'series'; badgeText = 'SÉRIE';
                    sub = item.rating && item.rating !== '0' ? `⭐ ${parseFloat(item.rating).toFixed(1)}` : 'Série';
                }

                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${img}" onerror="this.src='https://via.placeholder.com/300x180/1e293b/8b5cf6?text=Sem+Capa'">
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <div class="card-overlay"><div class="play-btn">▶</div></div>
                    </div>
                    <div class="card-info">
                        <div class="card-title" title="${name}">${name}</div>
                        <div class="card-sub">${sub}</div>
                    </div>`;
                gridEl.appendChild(card);
            });
        }

        function loadMore() { currentPage++; renderContent(); }

        async function playItem(item) {
            if (currentMainTab === 'series') { openEpisodes(item); return; }
            if (currentMainTab === 'live') { startLiveChannel(item); }
            else if (currentMainTab === 'movie') { startPlayer(MOVIE_URL(item.stream_id), item.name); }
        }

        // ==========================================
        // CANAIS AO VIVO — SEM ACELERAÇÃO
        // ==========================================
        function startLiveChannel(item) {
            isLiveStream = true;
            $('player-modal').style.display = 'block';
            $('video-title').innerText = item.name;
            $('player-loading').style.display = 'block';
            $('player-status').innerText = 'Conectando ao canal...';
            $('liveIndicator').style.display = 'flex';
            $('goLiveBtn').classList.remove('show');
            $('delayIndicator').classList.add('show');

            destroyPlayers();

            const video = $('videoPlayer');
            const m3u8Url = LIVE_M3U8_URL(item.stream_id);
            const tsUrl   = LIVE_TS_URL(item.stream_id);
            let failed = false;

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,

                    // ===== CONFIGURAÇÃO PARA DELAY NATURAL SEM TRAVAR =====
                    // Mantém 4 segmentos (~16s com segmentos de 4s) de buffer
                    liveSyncDurationCount: 4,
                    // Se atrasar mais que 12 segmentos (~48s), pula para o live
                    liveMaxLatencyDurationCount: 12,
                    liveDurationInfinity: true,

                    // CRUCIAL: sem aceleração automática do HLS.js
                    maxLiveSyncPlaybackRate: 1.0,
                    // Se o atraso ficar muito grande, faz seek em vez de acelerar
                    maxLiveSyncPlaybackRateThreshold: 0,

                    // Buffer
                    backBufferLength: 30,

                    // Timeouts generosos para não travar
                    manifestLoadingTimeOut: 15000,
                    manifestLoadingMaxRetry: 3,
                    manifestLoadingRetryDelay: 1000,
                    levelLoadingTimeOut: 15000,
                    levelLoadingMaxRetry: 4,
                    fragLoadingTimeOut: 30000,
                    fragLoadingMaxRetry: 8,
                    fragLoadingRetryDelay: 1000
                });

                hls.loadSource(m3u8Url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    $('player-loading').style.display = 'none';
                    video.play().catch(()=>{});
                    video.playbackRate = 1.0; // Garante velocidade normal
                    startLiveDelayMonitor(video);
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal && !failed) {
                        failed = true;
                        if (hls) { hls.destroy(); hls = null; }
                        playTsDirect(tsUrl);
                    }
                });

                setTimeout(() => {
                    if (failed || !hls) return;
                    if (!hls.levels || hls.levels.length === 0) {
                        failed = true;
                        hls.destroy(); hls = null;
                        playTsDirect(tsUrl);
                    }
                }, 10000);
            } else {
                video.src = m3u8Url;
                video.play().catch(() => playTsDirect(tsUrl));
                video.playbackRate = 1.0;
                startLiveDelayMonitor(video);
            }
        }

        // ==========================================
        // FALLBACK .TS (mpegts.js) — SEM ACELERAÇÃO
        // ==========================================
        function playTsDirect(tsUrl) {
            $('player-status').innerText = 'Tentando formato alternativo...';
            const video = $('videoPlayer');

            if (typeof mpegts === 'undefined' || !mpegts.isSupported()) {
                $('player-loading').innerHTML = `<p style="color:#ef4444;">⚠️ Canal não compatível.<br>Use um app nativo (VLC).</p>`;
                return;
            }

            try {
                mpegtsPlayer = mpegts.createPlayer({
                    type: 'mpegts',
                    isLive: true,
                    url: tsUrl
                }, {
                    enableWorker: true,
                    enableStashBuffer: false,
                    stashInitialSize: 128,
                    lazyLoad: false,

                    // CRUCIAL: sem "chasing" (perseguição automática) que causa aceleração
                    liveBufferLatencyChasing: false,
                    liveBufferLatencyChasingOnPaused: false,

                    // Buffer generoso para não travar
                    autoCleanupSourceBuffer: true,
                    autoCleanupMaxBackwardDuration: 30,
                    autoCleanupMinBackwardDuration: 15
                });

                mpegtsPlayer.attachMediaElement(video);
                mpegtsPlayer.load();

                mpegtsPlayer.on(mpegts.Events.ERROR, () => {
                    $('player-loading').innerHTML = `<p style="color:#ef4444;">⚠️ Não foi possível reproduzir.<br>Canal offline.</p>`;
                });

                mpegtsPlayer.play().then(() => {
                    $('player-loading').style.display = 'none';
                    video.playbackRate = 1.0;
                    startLiveDelayMonitor(video);
                }).catch(() => {
                    $('player-loading').style.display = 'none';
                });
            } catch(e) {
                $('player-loading').innerHTML = `<p style="color:#ef4444;">Erro: ${e.message}</p>`;
            }
        }

        // ==========================================
        // MONITOR DE DELAY (SEM CORRIGIR, SÓ EXIBIR)
        // ==========================================
        // Este monitor NÃO altera a velocidade de reprodução.
        // Ele apenas:
        //  1. Mostra o delay atual na tela
        //  2. Mostra o botão "Ir para o Ao Vivo" se o delay passar de 60s
        //  3. Corrige APENAS se o vídeo adiantar (currentTime > live edge), o que
        //     não deveria acontecer mas é uma proteção
        function startLiveDelayMonitor(video) {
            if (liveCheckInterval) clearInterval(liveCheckInterval);

            liveCheckInterval = setInterval(() => {
                if (!video || video.paused || !isLiveStream) return;

                const buffered = video.buffered;
                if (buffered.length === 0) return;

                const currentTime = video.currentTime;
                const liveEdge = buffered.end(buffered.length - 1);
                const delay = Math.max(0, liveEdge - currentTime);

                // Mostra o delay na tela
                $('delaySecs').innerText = Math.round(delay) + 's';

                // Botão "Ir ao vivo" só aparece se o delay for MUITO grande (>60s)
                if (delay > 60) {
                    $('goLiveBtn').classList.add('show');
                } else {
                    $('goLiveBtn').classList.remove('show');
                }

                // PROTEÇÃO: se o vídeo estiver além do buffer (adiantado),
                // recua para o live edge. Isso não deveria acontecer,
                // mas se acontecer, garante que fica no "agora".
                if (currentTime > liveEdge + 0.5) {
                    video.currentTime = liveEdge - 1;
                }

                // GARANTIA: força velocidade 1.0 sempre
                if (video.playbackRate !== 1.0) {
                    video.playbackRate = 1.0;
                }
            }, 2000);
        }

        // ==========================================
        // PULAR PARA O AO VIVO (manual)
        // ==========================================
        function jumpToLive() {
            const video = $('videoPlayer');
            const buffered = video.buffered;

            if (buffered.length > 0) {
                const liveEdge = buffered.end(buffered.length - 1);
                video.currentTime = liveEdge - 0.5;
                video.playbackRate = 1.0;
            }

            $('goLiveBtn').classList.remove('show');
        }

        async function openEpisodes(serie) {
            $('episodes-modal').style.display = 'block';
            $('ep-series-title').innerText = serie.name;
            $('ep-list').innerHTML = '<p style="color:#94a3b8;text-align:center;padding:40px;">⏳ Carregando episódios...</p>';

            try {
                const info = await apiFetch(`${API}&action=get_series_info&series_id=${serie.series_id}`);
                const eps = info.episodes || {};
                const seasons = Object.keys(eps).sort((a,b) => parseInt(a) - parseInt(b));

                let html = '';
                seasons.forEach(seasonNum => {
                    html += `<div class="season-title">📁 Temporada ${seasonNum}</div>`;
                    eps[seasonNum].forEach(ep => {
                        const safeTitle = (serie.name + ' - ' + ep.title).replace(/'/g, '');
                        html += `
                            <div class="ep-item" onclick="playEpisode('${ep.id}', '${safeTitle}')">
                                <span class="ep-name">${ep.title}</span>
                                <span class="ep-num">Ep ${ep.episode_num}</span>
                            </div>`;
                    });
                });
                $('ep-list').innerHTML = html || '<p style="color:#94a3b8;text-align:center;padding:40px;">Nenhum episódio encontrado.</p>';
            } catch(e) {
                $('ep-list').innerHTML = `<p style="color:#ef4444;text-align:center;padding:40px;">Erro: ${e.message}</p>`;
            }
        }

        function closeEpisodes() { $('episodes-modal').style.display = 'none'; }

        function playEpisode(episodeId, title) {
            closeEpisodes();
            startPlayer(SERIES_URL(episodeId), title);
        }

        function startPlayer(url, title) {
            isLiveStream = false;
            $('player-modal').style.display = 'block';
            $('video-title').innerText = title;
            $('player-status').innerText = 'Carregando vídeo...';
            $('player-loading').style.display = 'block';
            $('liveIndicator').style.display = 'none';
            $('goLiveBtn').classList.remove('show');
            $('delayIndicator').classList.remove('show');

            if (liveCheckInterval) { clearInterval(liveCheckInterval); liveCheckInterval = null; }

            destroyPlayers();
            const video = $('videoPlayer');
            video.playbackRate = 1.0;
            video.src = url;
            video.load();

            video.onloadeddata = () => { $('player-loading').style.display = 'none'; };
            video.onerror = () => {
                $('player-loading').innerHTML = `<p style="color:#ef4444;">⚠️ Formato não suportado.<br>Filmes MKV precisam de player nativo.</p>`;
            };
            video.play().catch(() => $('player-loading').style.display = 'none');
        }

        function destroyPlayers() {
            if (liveCheckInterval) { clearInterval(liveCheckInterval); liveCheckInterval = null; }
            if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
            if (mpegtsPlayer) { try { mpegtsPlayer.destroy(); } catch(e){} mpegtsPlayer = null; }
            const v = $('videoPlayer');
            v.pause();
            v.playbackRate = 1.0;
            v.removeAttribute('src');
            v.load();
            $('player-loading').style.display = 'block';
            $('player-loading').innerHTML = `
                <div class="spinner2"></div>
                <p id="player-status">Conectando...</p>`;
        }

        function closePlayer() {
            $('player-modal').style.display = 'none';
            isLiveStream = false;
            destroyPlayers();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closePlayer();
                closeEpisodes();
                toggleSidebar(false);
            }
        });
    </script>
</body>
</html>
