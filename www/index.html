ROUTES.agenda = function(){
  const hoje = todayISO();
  const list = DB.agenda.slice().sort((a,b)=> (a.data+a.hora).localeCompare(b.data+b.hora));
  const hojeList = list.filter(a=> a.data===hoje);
  const proximos = list.filter(a=> a.data>hoje);

  const itemHTML = a => {
    const c = DB.clientes.find(x=>x.id===a.clienteId);
    return '<div class="mini-item" style="cursor:default">'+
      '<div class="mi-ico">'+icon('clock',14)+'</div>'+
      '<div class="mi-txt"><b>'+esc(a.hora)+' · '+esc(a.tipo)+'</b><small>'+esc(c?c.nome:'—')+' · '+esc(a.telefone||'')+'</small>'+(a.obs?'<small style="opacity:.75">'+esc(a.obs)+'</small>':'')+'</div>'+
      '<button class="icon-btn" data-act="excluir-agenda" data-id="'+a.id+'" style="width:26px;height:26px">'+icon('trash',12)+'</button>'+
    '</div>';
  };

  let html = '<div class="page-head"><div><h1>Agenda</h1><p class="sub">Agendamentos, entregas e compromissos</p></div>'+
    '<div class="page-actions"><button class="btn" data-act="novo-agendamento">'+icon('plus',15)+' Novo agendamento</button></div></div>';

  html += '<div class="dash-grid">'+
    '<div class="card"><div class="card-head"><h3>Hoje — '+dOnly(hoje)+'</h3></div>'+
      (hojeList.length? '<div class="mini-list">'+hojeList.map(itemHTML).join('')+'</div>' : '<div class="empty">Nenhum compromisso hoje.</div>')+
    '</div>'+
    '<div class="card"><div class="card-head"><h3>Próximos agendamentos</h3></div>'+
      (proximos.length? '<div class="mini-list">'+proximos.slice(0,10).map(a=>{
        const c = DB.clientes.find(x=>x.id===a.clienteId);
        return '<div class="mini-item" style="cursor:default"><div class="mi-ico">'+icon('calendar',14)+'</div><div class="mi-txt"><b>'+dOnly(a.data)+' '+esc(a.hora)+'</b><small>'+esc(a.tipo)+' · '+esc(c?c.nome:'—')+'</small></div></div>';
      }).join('')+'</div>' : '<div class="empty">Nenhum agendamento futuro.</div>')+
    '</div>'+
  '</div>';

  html += '<div class="card"><div class="card-head"><h3>Todos os agendamentos</h3></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Hora</th><th>Tipo</th><th>Cliente</th><th>Telefone</th><th>Observações</th><th></th></tr></thead><tbody>'+
    (list.length? list.map(a=>{
      const c = DB.clientes.find(x=>x.id===a.clienteId);
      return '<tr><td>'+dOnly(a.data)+'</td><td>'+esc(a.hora)+'</td><td>'+esc(a.tipo)+'</td><td>'+esc(c?c.nome:'—')+'</td><td>'+esc(a.telefone||'—')+'</td><td style="color:var(--muted)">'+esc(a.obs||'—')+'</td>'+
      '<td><div class="t-actions"><button class="icon-btn" data-act="excluir-agenda" data-id="'+a.id+'">'+icon('trash',12)+'</button></div></td></tr>';
    }).join('') : '<tr><td colspan="7"><div class="empty">Nenhum agendamento.</div></td></tr>')+
    '</tbody></table></div></div>';

  return html;
};
function agendaForm(){
  openModal({
    title:'Novo agendamento',
    body:
      '<div class="grid2"><label class="fld">Data *<input name="data" type="date" required value="'+todayISO()+'"></label>'+
      '<label class="fld">Hora *<input name="hora" type="time" required value="09:00"></label></div>'+
      '<label class="fld">Cliente<select name="clienteId"><option value="">—</option>'+DB.clientes.map(c=>'<option value="'+c.id+'">'+esc(c.nome)+'</option>').join('')+'</select></label>'+
      '<div class="grid2"><label class="fld">Telefone<input name="telefone" placeholder="(11) 99999-9999"></label>'+
      '<label class="fld">Tipo<select name="tipo"><option>Agendamento de cliente</option><option>Entrega prevista</option><option>Retorno de equipamento</option><option>Manutenção agendada</option><option>Compromisso da assistência</option></select></label></div>'+
      '<label class="fld">Observações<textarea name="obs" rows="2"></textarea></label>',
    onSubmit(d){
      if(!d.data || !d.hora){ toast('Informe data e hora.','err'); return false; }
      DB.agenda.push({id:uid(), data:d.data, hora:d.hora, clienteId:d.clienteId, telefone:d.telefone, tipo:d.tipo, obs:d.obs});
      saveDB(); render(); toast('Agendamento criado.','ok'); return true;
    }
  });
}

/* ====================================================================
   RELATÓRIOS
   ==================================================================== */
ROUTES.relatorios = function(){
  const p = state.relPeriod || '30d';
  const r = periodoRange(p);
  const vendas = DB.vendas.filter(v=> v.status!=='Cancelada' && inRange(v.criadoEm, r));
  const osEntregues = DB.os.filter(o=> o.status==='Entregue' && inRange(o.entregueEm||o.criadoEm, r));
  const osAbertas = DB.os.filter(o=> inRange(o.criadoEm, r));
  const fat = receitaTotal(r.start);
  const lucro = lucroBruto(r.start);
  const despesas = DB.financeiro.filter(f=> f.tipo==='despesa' && f.pago && inRange(f.pagoEm||f.vencimento, r)).reduce((a,f)=>a+f.valor,0);

  // produtos mais vendidos
  const prodCount = {};
  vendas.forEach(v=> v.itens.forEach(i=>{ if(i.tipo==='produto') prodCount[i.nome] = (prodCount[i.nome]||0)+i.qtd; }));
  const topProd = Object.keys(prodCount).map(k=>({nome:k,qtd:prodCount[k]})).sort((a,b)=>b.qtd-a.qtd).slice(0,8);

  // serviços mais realizados
  const servCount = {};
  DB.os.forEach(o=> (o.servicos||[]).forEach(s=>{ servCount[s.nome]=(servCount[s.nome]||0)+(s.qtd||1); }));
  vendas.forEach(v=> v.itens.forEach(i=>{ if(i.tipo==='servico') servCount[i.nome]=(servCount[i.nome]||0)+i.qtd; }));
  const topServ = Object.keys(servCount).map(k=>({nome:k,qtd:servCount[k]})).sort((a,b)=>b.qtd-a.qtd).slice(0,8);

  // clientes top
  const cliTot = {};
  DB.vendas.forEach(v=>{ if(v.status==='Cancelada'||!v.clienteId) return; cliTot[v.clienteId]=(cliTot[v.clienteId]||0)+v.total; });
  DB.os.forEach(o=>{ if(o.status!=='Entregue') return; cliTot[o.clienteId]=(cliTot[o.clienteId]||0)+osTotal(o); });
  const topCli = Object.keys(cliTot).map(k=>({nome:nomeCliente(k), val:cliTot[k]})).sort((a,b)=>b.val-a.val).slice(0,8);

  const btn = (id,lbl)=> '<button class="chip '+(p===id?'on':'')+'" data-relp="'+id+'">'+lbl+'</button>';

  let html = '<div class="page-head"><div><h1>Relatórios</h1><p class="sub">Análise do período selecionado</p></div>'+
    '<div class="page-actions"><button class="btn ghost" data-act="csv-relatorio">'+icon('download',15)+' Exportar CSV</button>'+
    '<button class="btn ghost" data-act="imprimir-relatorio">'+icon('printer',15)+' Imprimir</button></div></div>';

  html += '<div class="filters">'+btn('hoje','Hoje')+btn('7d','Últimos 7 dias')+btn('30d','Últimos 30 dias')+btn('mes','Mês atual')+'</div>';

  html += '<div class="kpis">'+
    '<div class="kpi green"><div class="k-top"><div class="k-ico">'+icon('dollar',15)+'</div><div class="k-lbl">Faturamento</div></div><div class="k-val">'+money(fat)+'</div></div>'+
    '<div class="kpi"><div class="k-top"><div class="k-ico">'+icon('cart',15)+'</div><div class="k-lbl">Vendas</div></div><div class="k-val">'+vendas.length+'</div><div class="k-sub">'+money(vendas.reduce((a,v)=>a+v.total,0))+'</div></div>'+
    '<div class="kpi purple"><div class="k-top"><div class="k-ico">'+icon('wrench',15)+'</div><div class="k-lbl">OS abertas</div></div><div class="k-val">'+osAbertas.length+'</div></div>'+
    '<div class="kpi cyan"><div class="k-top"><div class="k-ico">'+icon('check',15)+'</div><div class="k-lbl">OS entregues</div></div><div class="k-val">'+osEntregues.length+'</div></div>'+
    '<div class="kpi red"><div class="k-top"><div class="k-ico">'+icon('down',15)+'</div><div class="k-lbl">Despesas pagas</div></div><div class="k-val">'+money(despesas)+'</div></div>'+
    '<div class="kpi green"><div class="k-top"><div class="k-ico">'+icon('chart',15)+'</div><div class="k-lbl">Lucro bruto estimado</div></div><div class="k-val">'+money(lucro)+'</div></div>'+
  '</div>';

  html += '<div class="dash-grid">'+
    '<div class="card"><div class="card-head"><h3>Produtos mais vendidos</h3></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th style="text-align:right">Qtd</th></tr></thead><tbody>'+
    (topProd.length? topProd.map(x=>'<tr><td>'+esc(x.nome)+'</td><td style="text-align:right;font-weight:700">'+x.qtd+'</td></tr>').join('') : '<tr><td colspan="2"><div class="empty">Sem dados no período.</div></td></tr>')+
    '</tbody></table></div></div>'+
    '<div class="card"><div class="card-head"><h3>Serviços mais realizados</h3></div><div class="table-wrap"><table><thead><tr><th>Serviço</th><th style="text-align:right">Qtd</th></tr></thead><tbody>'+
    (topServ.length? topServ.map(x=>'<tr><td>'+esc(x.nome)+'</td><td style="text-align:right;font-weight:700">'+x.qtd+'</td></tr>').join('') : '<tr><td colspan="2"><div class="empty">Sem dados.</div></td></tr>')+
    '</tbody></table></div></div>'+
  '</div>';

  html += '<div class="dash-grid">'+
    '<div class="card"><div class="card-head"><h3>Clientes com maior movimentação</h3></div><div class="table-wrap"><table><thead><tr><th>Cliente</th><th style="text-align:right">Total</th></tr></thead><tbody>'+
    (topCli.length? topCli.map(x=>'<tr><td>'+esc(x.nome)+'</td><td style="text-align:right;font-weight:700">'+money(x.val)+'</td></tr>').join('') : '<tr><td colspan="2"><div class="empty">Sem dados.</div></td></tr>')+
    '</tbody></table></div></div>'+
    '<div class="card"><div class="card-head"><h3>Produtividade dos técnicos</h3></div><div class="table-wrap"><table><thead><tr><th>Técnico</th><th>Concluídas</th><th style="text-align:right">Faturamento</th></tr></thead><tbody>'+
    DB.tecnicos.map(t=>{
      const conc = DB.os.filter(o=> o.tecnicoId===t.id && o.status==='Entregue');
      return '<tr><td>'+esc(t.nome)+'</td><td>'+conc.length+'</td><td style="text-align:right;font-weight:700">'+money(conc.reduce((a,o)=>a+osTotal(o),0))+'</td></tr>';
    }).join('')+
    '</tbody></table></div></div>'+
  '</div>';

  html += '<div class="card"><div class="card-head"><h3>Posição de estoque</h3></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Estoque</th><th>Mínimo</th><th style="text-align:right">Custo total</th></tr></thead><tbody>'+
    DB.produtos.map(x=>'<tr><td>'+esc(x.nome)+'</td><td><span class="badge '+(x.qtd<=0?'b-red':x.qtd<=x.min?'b-yellow':'b-green')+'">'+x.qtd+'</span></td><td>'+x.min+'</td><td style="text-align:right">'+money(x.custo*x.qtd)+'</td></tr>').join('')+
    '</tbody></table></div></div>';

  AFTER.push(()=>{
    $$('[data-relp]').forEach(b=> b.addEventListener('click', ()=>{ state.relPeriod = b.dataset.relp; render(); }));
  });
  return html;
};

ROUTES.whatsapp = function(){

  html += '<div class="card" style="margin-top:14px"><div class="card-head"><h3>Ordens de serviço recentes</h3></div><div class="table-wrap"><table><thead><tr><th>OS</th><th>Cliente</th><th>WhatsApp</th><th>Status</th><th>Enviar</th></tr></thead><tbody>'+

    }).join('')+
  '</tbody></table></div></div>';

  return html;
};

        cores.map(cor=>'<div class="swatch '+(c.cor===cor?'on':'')+'" style="background:'+cor+'" data-cor="'+cor+'"></div>').join('')+
      '</div></div>'+
      '<div class="info-note" style="margin-top:14px">'+icon('alert',13)+' Este é um <b>protótipo local</b>. Os dados ficam salvos apenas no <b>localStorage deste navegador</b> e não são compartilhados entre dispositivos ou usuários. Não há backup em nuvem.</div>'+
      '<button class="btn ghost" style="margin-top:12px;width:100%;justify-content:center" data-act="restaurar-demo">'+icon('refresh',15)+' Restaurar dados de demonstração</button>'+
    '</div>'+
  '</div>';

  html += '<div class="card" style="margin-top:14px"><div class="card-head"><h3>Mensagens padrão do WhatsApp</h3></div>'+
    '<div class="info-note" style="margin-bottom:14px">Use as variáveis: <b>{cliente}</b>, <b>{equipamento}</b>, <b>{empresa}</b>, <b>{os}</b>, <b>{total}</b>, <b>{servicos}</b>, <b>{data}</b></div>'+
    Object.keys(c.msgs).map(k=>'<label class="fld" style="text-transform:capitalize">'+esc(k)+'<textarea rows="2" id="msg_'+k+'">'+esc(c.msgs[k])+'</textarea></label>').join('')+
    '<button class="btn" data-act="salvar-msgs">'+icon('check',15)+' Salvar mensagens</button>'+
  '</div>';

  html += '<div class="card" style="margin-top:14px"><div class="card-head"><h3>Sobre este protótipo</h3></div>'+
    '<div style="font-size:12.5px;color:var(--muted);line-height:1.8">'+
    'Sistema de demonstração <b style="color:var(--text)">TechGestor</b> — single-file, 100% executado no navegador.<br>'+
    '• Não há backend, banco de dados externo, login real ou sincronização entre dispositivos.<br>'+
    '• Os dados persistem via <b style="color:var(--text)">localStorage</b> até que o cache do navegador seja limpo.<br>'+
    '• As comissões exibidas são <b style="color:var(--text)">estimativas</b> calculadas pelas regras configuradas.<br>'+
    '• As mensagens de WhatsApp são apenas <b style="color:var(--text)">preparadas</b> — o envio é confirmado por você dentro do app.<br>'+
    '• Dados de demonstração: clientes, produtos, OS, vendas e lançamentos financeiros fictícios.'+
    '</div></div>';

  AFTER.push(()=>{
    $$('[data-cor]').forEach(sw=> sw.addEventListener('click', ()=>{
      DB.config.cor = sw.dataset.cor; saveDB(); applyTheme();
      $$('[data-cor]').forEach(x=> x.classList.toggle('on', x.dataset.cor===sw.dataset.cor));
      toast('Cor atualizada.','ok');
    }));
    const t = $('#cfgTema');
    if(t) t.addEventListener('change', ()=>{ DB.config.tema = t.value; saveDB(); applyTheme(); render(); });
  });
  return html;
};

/* ====================================================================
   AÇÕES GLOBAIS (delegação de eventos)
   ==================================================================== */
document.addEventListener('click', function(e){
  // navegação
  const navEl = e.target.closest('[data-route]');
  if(navEl && !e.target.closest('[data-act]')){
    navigate(navEl.dataset.route);
    return;
  }
  // fechar modal
  if(e.target.closest('[data-close]') || (e.target.hasAttribute('data-backdrop') && e.target === e.target.closest('.backdrop'))){
    closeModal(); return;
  }
  // busca global
  const sr = e.target.closest('[data-sract]');
  if(sr){
    const p = sr.dataset.sract.split(':');
    $('#searchResults').classList.remove('show');
    $('#globalSearch').value = '';
    if(p[0]==='os' && p[1]==='ver'){ navigate('os'); setTimeout(()=>verOS(p[2]),60); }
    else if(p[0]==='clientes'){ navigate('clientes'); setTimeout(()=>verCliente(p[2]),60); }
    else if(p[0]==='produtos'){ navigate('produtos'); }
    return;
  }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch(act){
    /* dashboard */
    case 'dashp': state.dashPeriod = el.dataset.dashp; render(); break;
    case 'nova-os': osForm(); break;
    case 'ir-pdv': navigate('pdv'); break;
    case 'ir-produtos': navigate('produtos'); break;
    case 'ir-agenda': navigate('agenda'); break;
    case 'ir-relatorios': navigate('relatorios'); break;
    case 'novo-cliente': clienteForm(); break;

    /* OS */
    case 'ver-os': verOS(id); break;
    case 'editar-os': closeModal(); osForm(id); break;
    case 'status-os': closeModal(); statusOS(id); break;
    case 'imprimir-os': imprimirOS(id); break;
    case 'limpar-os-filtro': state.osFiltro = {q:'',status:'Todos'}; render(); break;
    case 'csv-os':
      exportCSV('ordens-de-servico.csv',
        ['Número','Cliente','Equipamento','Status','Técnico','Previsão','Total'],
        DB.os.map(o=>{
          const t = DB.tecnicos.find(x=>x.id===o.tecnicoId);
          return [o.numero, nomeCliente(o.clienteId), o.equip.categoria+' '+o.equip.marca+' '+o.equip.modelo, o.status, t?t.nome:'', o.previsao||'', osTotal(o).toFixed(2).replace('.',',')];
        }));
      break;
    case 'wa-os': abrirWhats(el.dataset.tpl, DB.os.find(o=>o.id===id)); break;

    /* clientes */
    case 'ver-cliente': verCliente(id); break;
    case 'editar-cliente': closeModal(); clienteForm(id); break;
    case 'excluir-cliente':
      confirmar('Excluir este cliente? As OS e vendas vinculadas permanecerão no sistema.', ()=>{
        DB.clientes = DB.clientes.filter(c=> c.id!==id);
        DB.equipamentos = DB.equipamentos.filter(x=> x.clienteId!==id);
        saveDB(); closeModal(); render(); toast('Cliente excluído.','ok');
      });
      break;
    case 'wa-cliente': {
      const c = DB.clientes.find(x=>x.id===id);
      if(!c || !c.whatsapp){ toast('Cliente sem WhatsApp cadastrado.','err'); break; }
      window.open(waLink(c.whatsapp, 'Olá '+c.nome.split(' ')[0]+'! Aqui é da '+DB.config.empresa+'. Como podemos ajudar?'), '_blank');
      break;
    }
    case 'csv-clientes':
      exportCSV('clientes.csv', ['Nome','CPF','Telefone','WhatsApp','E-mail','Endereço','Cadastro'],
        DB.clientes.map(c=>[c.nome,c.cpf||'',c.telefone,c.whatsapp||'',c.email||'',c.endereco||'',dOnly(c.criadoEm)]));
      break;

    /* equipamentos */
    case 'novo-equip': equipForm(); break;
    case 'editar-equip': equipForm(id); break;
    case 'excluir-equip':
      confirmar('Excluir este equipamento?', ()=>{
        DB.equipamentos = DB.equipamentos.filter(x=> x.id!==id);
        saveDB(); closeModal(); render(); toast('Equipamento excluído.','ok');
      });
      break;

    /* PDV */
    case 'pdv-mode': state.pdvMode = el.dataset.mode; state.pdvBusca=''; render(); break;
    case 'pdv-cat': state.pdvCat = el.dataset.cat; render(); break;
    case 'pdv-add': pdvAdd(id); break;
    case 'pdv-q': {
      const i = +el.dataset.i, d = +el.dataset.d;
      const item = state.pdvCart[i];
      if(!item) break;
      const novo = item.qtd + d;
      if(novo<=0){ state.pdvCart.splice(i,1); }
      else {
        if(item.tipo==='produto'){
          const p = DB.produtos.find(x=>x.id===item.id);
          if(p && novo > p.qtd){ toast('Estoque insuficiente.','err'); break; }
        }
        item.qtd = novo;
      }
      render(); break;
    }
    case 'pdv-del': state.pdvCart.splice(+el.dataset.i,1); render(); break;
    case 'pdv-clear': state.pdvCart = []; state.pdvDesconto = 0; render(); break;
    case 'pdv-finalizar': pdvFinalizar(); break;
    case 'hist-vendas': historicoVendas(); break;
    case 'imprimir-venda': imprimirVenda(id); break;
    case 'cancelar-venda': cancelarVenda(id); break;

    /* produtos */
    case 'novo-produto': produtoForm(); break;
    case 'editar-produto': produtoForm(id); break;
    case 'mov-estoque': movEstoque(id); break;
    case 'excluir-produto':
      confirmar('Excluir este produto do estoque?', ()=>{
        DB.produtos = DB.produtos.filter(x=> x.id!==id);
        saveDB(); closeModal(); render(); toast('Produto excluído.','ok');
      });
      break;
    case 'csv-produtos':
      exportCSV('estoque.csv', ['Código','Produto','Categoria','Marca','Custo','Preço','Qtd','Mínimo','Fornecedor'],
        DB.produtos.map(p=>[p.codigo,p.nome,p.categoria,p.marca,p.custo,p.preco,p.qtd,p.min,p.fornecedor||'']));
      break;

    /* serviços */
    case 'novo-servico': servicoForm(); break;
    case 'editar-servico': servicoForm(id); break;
    case 'excluir-servico':
      confirmar('Excluir este serviço do catálogo?', ()=>{
        DB.servicos = DB.servicos.filter(x=> x.id!==id);
        saveDB(); closeModal(); render(); toast('Serviço excluído.','ok');
      });
      break;

    /* financeiro */
    case 'nova-conta': contaForm(); break;
    case 'editar-conta': contaForm(id); break;
    case 'pagar-conta': {
      const f = DB.financeiro.find(x=>x.id===id);
      if(f){ f.pago = true; f.pagoEm = new Date().toISOString(); logActivity('Conta "'+f.descricao+'" marcada como paga'); saveDB(); render(); toast('Conta quitada.','ok'); }
      break;
    }
    case 'excluir-conta':
      confirmar('Excluir este lançamento financeiro?', ()=>{
        DB.financeiro = DB.financeiro.filter(x=> x.id!==id);
        saveDB(); closeModal(); render(); toast('Lançamento excluído.','ok');
      });
      break;
    case 'csv-financeiro':
      exportCSV('financeiro.csv', ['Descrição','Categoria','Tipo','Vencimento','Valor','Situação','Origem'],
        DB.financeiro.map(f=>[f.descricao,f.categoria,f.tipo,f.vencimento,f.valor,f.pago?'Pago':'Em aberto',f.origem||'manual']));
      break;

    /* caixa */
    case 'abrir-caixa':
      openModal({
        title:'Abrir caixa',
        body:'<label class="fld">Valor inicial (fundo de troco)<input name="valor" type="number" step="0.01" min="0" value="0"></label>',
        submitText:'Abrir caixa',
        onSubmit(d){
          DB.caixas.push({id:uid(), abertoEm:new Date().toISOString(), valorInicial:numOr(d.valor), fechado:false, fechadoEm:null, valorInformado:null, movimentos:[]});
          saveDB(); render(); toast('Caixa aberto.','ok'); return true;
        }
      });
      break;
    case 'novo-mov-caixa': {
      const caixa = DB.caixas.find(c=> !c.fechado);
      if(!caixa){ toast('Nenhum caixa aberto.','err'); break; }
      openModal({
        title:'Nova movimentação de caixa',
        body:'<label class="fld">Tipo<select name="tipo"><option value="entrada">Entrada</option><option value="saida">Saída / retirada</option><option value="reforco">Reforço de caixa</option></select></label>'+
             '<label class="fld">Descrição<input name="descricao" placeholder="Ex.: sangria, troco, venda avulsa"></label>'+
             '<label class="fld">Valor (R$)<input name="valor" type="number" step="0.01" min="0" value="0"></label>',
        onSubmit(d){
          const tipo = d.tipo==='saida' ? 'saida' : 'entrada';
          caixa.movimentos.push({id:uid(), tipo, descricao:(d.tipo==='reforco'?'Reforço: ':'')+d.descricao, valor:numOr(d.valor), hora:new Date().toISOString()});
          saveDB(); render(); toast('Movimentação registrada.','ok'); return true;
        }
      });
      break;
    }
    case 'fechar-caixa': {
      const caixa = DB.caixas.find(c=> !c.fechado);
      if(!caixa) break;
      const ent = caixa.movimentos.filter(m=>m.tipo==='entrada').reduce((a,m)=>a+m.valor,0);
      const sai = caixa.movimentos.filter(m=>m.tipo==='saida').reduce((a,m)=>a+m.valor,0);
      const esperado = caixa.valorInicial + ent - sai;
      openModal({
        title:'Fechar caixa',
        body:'<div class="info-note" style="margin-bottom:12px">Saldo esperado: <b>'+money(esperado)+'</b></div>'+
             '<label class="fld">Valor contado (R$)<input name="valor" type="number" step="0.01" min="0" value="'+esperado.toFixed(2)+'"></label>',
        submitText:'Fechar caixa',
        onSubmit(d){
          caixa.fechado = true;
          caixa.fechadoEm = new Date().toISOString();
          caixa.valorInformado = numOr(d.valor);
          saveDB(); render(); toast('Caixa fechado.','ok'); return true;
        }
      });
      break;
    }

    /* técnicos */
    case 'novo-tecnico': tecnicoForm(); break;
    case 'editar-tecnico': tecnicoForm(id); break;
    case 'excluir-tecnico':
      confirmar('Excluir este técnico?', ()=>{
        DB.tecnicos = DB.tecnicos.filter(x=> x.id!==id);
        saveDB(); closeModal(); render(); toast('Técnico excluído.','ok');
      });
      break;

    /* agenda */
    case 'novo-agendamento': agendaForm(); break;
    case 'excluir-agenda':
      confirmar('Excluir este agendamento?', ()=>{
        DB.agenda = DB.agenda.filter(x=> x.id!==id);
        saveDB(); closeModal(); render(); toast('Agendamento excluído.','ok');
      });
      break;

    /* relatórios */
    case 'csv-relatorio': {
      const r = periodoRange(state.relPeriod||'30d');
      const vendas = DB.vendas.filter(v=> v.status!=='Cancelada' && inRange(v.criadoEm, r));
      exportCSV('relatorio-vendas.csv', ['Venda','Data','Cliente','Pagamento','Total'],
        vendas.map(v=>[v.numero, dFull(v.criadoEm), nomeCliente(v.clienteId), v.pagamento, v.total.toFixed(2).replace('.',',')]));
      break;
    }
    case 'imprimir-relatorio': {
      const r = periodoRange(state.relPeriod||'30d');
      const fat = receitaTotal(r.start), lucro = lucroBruto(r.start);
      const html = '<!doctype html><html><head><meta charset="utf-8"><title>Relatório</title><style>'+
        'body{font-family:Arial,sans-serif;padding:26px;font-size:12.5px;color:#111}'+
        'h1{font-size:17px;border-bottom:2px solid #222;padding-bottom:8px}'+
        'table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border:1px solid #bbb;padding:6px;font-size:12px;text-align:left}'+
        'th{background:#f0f0f0}</style></head><body>'+
        '<h1>'+esc(DB.config.empresa)+' — Relatório gerencial</h1>'+
        '<p>Período: '+r.start.toLocaleDateString('pt-BR')+' a '+r.end.toLocaleDateString('pt-BR')+'</p>'+
        '<table><tr><th>Indicador</th><th>Valor</th></tr>'+
        '<tr><td>Faturamento</td><td>'+money(fat)+'</td></tr>'+
        '<tr><td>Lucro bruto estimado</td><td>'+money(lucro)+'</td></tr>'+
        '<tr><td>Contas a pagar em aberto</td><td>'+money(contasPagar())+'</td></tr>'+
        '<tr><td>Contas a receber em aberto</td><td>'+money(contasReceber())+'</td></tr>'+
        '<tr><td>Total de clientes</td><td>'+DB.clientes.length+'</td></tr>'+
        '<tr><td>OS em aberto</td><td>'+DB.os.filter(o=>OS_ABERTAS.indexOf(o.status)>=0).length+'</td></tr>'+
        '</table><p style="margin-top:20px;font-size:10px;color:#777">Gerado em '+dFull(new Date().toISOString())+' · TechGestor (protótipo)</p></body></html>';
      printHTML(html);
      break;
    }

    /* whatsapp templates */
    case 'ver-template': {
      const k = el.dataset.tpl;
      openInfo('Modelo de mensagem',
        '<label class="fld">Texto<textarea rows="6" id="tplTxt">'+esc(DB.config.msgs[k]||'')+'</textarea></label>'+
        '<div class="info-note" style="margin-top:10px">Variáveis: {cliente}, {equipamento}, {empresa}, {os}, {total}, {servicos}, {data}</div>'+
        '<button class="btn" style="margin-top:12px" data-act="salvar-tpl" data-tpl="'+k+'">'+icon('check',14)+' Salvar modelo</button>');
      break;
    }
    case 'salvar-tpl': {
      const k = el.dataset.tpl;
      const ta = $('#tplTxt');
      if(ta){ DB.config.msgs[k] = ta.value; saveDB(); toast('Modelo salvo.','ok'); closeModal(); }
      break;
    }

    /* configurações */
    case 'salvar-config': {
      const c = DB.config;
      c.empresa = $('#cfgEmpresa').value || c.empresa;
      c.telefone = $('#cfgTelefone').value;
      c.whatsapp = $('#cfgWhats').value;
      c.endereco = $('#cfgEndereco').value;
      c.osPrefix = $('#cfgPrefixo').value || 'OS';
      c.osNext = Math.max(1, Math.round(numOr($('#cfgOsNext').value, c.osNext)));
      c.estoqueMin = Math.max(0, Math.round(numOr($('#cfgEstMin').value, c.estoqueMin)));
      c.comissaoPct = numOr($('#cfgComissao').value, c.comissaoPct);
      c.tema = $('#cfgTema').value;
      saveDB(); applyTheme(); render(); toast('Configurações salvas.','ok');
      break;
    }
    case 'salvar-msgs': {
      Object.keys(DB.config.msgs).forEach(k=>{
        const el2 = $('#msg_'+k);
        if(el2) DB.config.msgs[k] = el2.value;
      });
      saveDB(); toast('Mensagens salvas.','ok');
      break;
    }
    case 'restaurar-demo':
      confirmar('Restaurar os dados de demonstração? Todas as alterações locais serão perdidas.', ()=>{
        DB = seedData(); saveDB(); closeModal(); navigate('dashboard');
        toast('Dados de demonstração restaurados.','ok');
      });
      break;

    case 'fechar-modal': closeModal(); break;
  }
});

/* resize -> redesenha gráficos */
let rzT;
window.addEventListener('resize', ()=>{
  clearTimeout(rzT);
  rzT = setTimeout(()=>{ if(['dashboard','relatorios'].indexOf(state.route)>=0) render(); }, 260);
});

/* ====================================================================
   INICIALIZAÇÃO
   ==================================================================== */
(function init(){
  loadDB();
  buildShell();
  navigate('dashboard');
  // relógio do topo
  setInterval(()=>{
    const dc = $('#dateChip');
    if(dc){
      const d = new Date();
      dc.textContent = d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }
  }, 30000);
  console.log('%cTechGestor','color:#3b82f6;font-weight:bold;font-size:14px','— protótipo local carregado. Dados em localStorage.');
})();
</script>
