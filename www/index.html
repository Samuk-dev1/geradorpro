<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4a8c2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🌾 Colheita Feliz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#4a8c2a;color:#fff;touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ========== START SCREEN ========== */
#startScreen{background:linear-gradient(180deg,#87ceeb 0%,#b8e0f0 40%,#7ec850 70%,#4a8c2a 100%);justify-content:center;align-items:center;padding:20px;text-align:center}
#startScreen h1{font-size:2.4rem;color:#fff;text-shadow:0 4px 0 #2d5016,0 8px 18px rgba(0,0,0,.35);margin-bottom:8px;letter-spacing:1px}
.subtitle{font-size:1rem;color:#2d5016;margin-bottom:24px;font-weight:700;background:rgba(255,255,255,.6);padding:6px 18px;border-radius:20px}
#farmNameInput{padding:14px 18px;font-size:1.05rem;border-radius:14px;border:3px solid #2d5016;width:88%;max-width:320px;margin-bottom:18px;text-align:center;background:#fff;color:#2d5016;font-weight:700;outline:none}
#farmNameInput:focus{border-color:#ffb300}
.btn-big{padding:16px 44px;font-size:1.3rem;border-radius:50px;background:linear-gradient(180deg,#ffd54f,#ffb300);color:#4a2800;border:none;font-weight:800;box-shadow:0 6px 0 #a06e00,0 10px 20px rgba(0,0,0,.3);cursor:pointer;margin-bottom:14px;transition:transform .08s}
.btn-big:active{transform:translateY(4px);box-shadow:0 2px 0 #a06e00}
.btn-small{background:rgba(0,0,0,.25);border:none;color:#fff;padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;font-weight:600;margin-top:6px}
.version{position:absolute;bottom:12px;font-size:.72rem;color:rgba(255,255,255,.7)}

/* ========== GAME SCREEN ========== */
#gameScreen{background:#4a8c2a}
#canvas{position:absolute;top:52px;bottom:68px;left:0;right:0;width:100%;height:calc(100% - 120px);display:block;touch-action:none}

#topBar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10}
.stat{background:rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;font-size:.9rem;font-weight:800;display:flex;align-items:center;gap:4px;white-space:nowrap}
.xp-bar{flex:1;position:relative;height:26px;background:rgba(0,0,0,.4);border-radius:13px;overflow:hidden;justify-content:center;min-width:60px}
#xpFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4caf50,#a5d84a);width:0%;transition:width .35s ease}
#xpText{position:relative;z-index:1;font-size:.7rem;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.stat-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

#bottomBar{position:absolute;bottom:0;left:0;right:0;height:68px;display:flex;justify-content:space-around;align-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px;padding-bottom:max(4px,env(safe-area-inset-bottom));z-index:10}
#bottomBar button{flex:1;height:100%;background:transparent;border:none;color:#fff;font-size:1.45rem;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;border-radius:10px;line-height:1}
#bottomBar button span{font-size:.66rem;font-weight:700;margin-top:2px}
#bottomBar button:active{background:rgba(255,255,255,.18)}

/* ========== PANEL ========== */
#panel{position:absolute;left:0;right:0;top:52px;bottom:68px;background:#f8f5ee;color:#333;z-index:20;display:flex;flex-direction:column;border-top-left-radius:20px;border-top-right-radius:20px;overflow:hidden;animation:slideUp .2s ease-out;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
#panelHeader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(180deg,#ffd54f,#ffb300);font-weight:800;color:#4a2800;font-size:1.05rem;flex-shrink:0}
#closePanel{background:rgba(0,0,0,.18);border:none;width:36px;height:36px;border-radius:50%;font-size:1.05rem;cursor:pointer;color:#4a2800;font-weight:800}
#panelContent{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}

/* ========== CARDS ========== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:#fff;border:2px solid #e0dbcf;border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.card .emoji{font-size:2.2rem;line-height:1}
.card .name{font-weight:800;font-size:.88rem;color:#2d5016}
.card .info{font-size:.7rem;color:#777;line-height:1.3}
.card .price{font-weight:800;color:#b8860b;font-size:.82rem;background:#fff8e0;padding:2px 10px;border-radius:10px}
.card button{margin-top:4px;padding:8px 12px;border-radius:20px;border:none;color:#fff;font-weight:800;font-size:.8rem;cursor:pointer;width:100%}
.card button.buy{background:#4caf50}
.card button.sell{background:#ff7043}
.card button.collect{background:#ffb300;color:#4a2800}
.card button:disabled{background:#ccc;cursor:not-allowed}
.card.locked{opacity:.55;filter:grayscale(.6)}

.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 16px;border-radius:20px;border:none;background:#ece7db;color:#555;font-weight:700;font-size:.82rem;white-space:nowrap;cursor:pointer;flex-shrink:0}
.tabs button.active{background:linear-gradient(180deg,#4caf50,#3a8a3e);color:#fff;box-shadow:0 2px 6px rgba(76,175,80,.5)}

.mission{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.06);border-left:5px solid #ffb300}
.mission.done{background:#d4edda;border-left-color:#4caf50}
.mission .title{font-weight:800;margin-bottom:8px;color:#2d5016;font-size:.92rem}
.mission .progress{background:#eee;height:14px;border-radius:7px;overflow:hidden;margin-bottom:8px}
.mission .progress>div{height:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);transition:width .3s}
.mission .reward{font-size:.78rem;color:#666;display:flex;justify-content:space-between;font-weight:600}

/* ========== TOAST / MODAL / FLOAT ========== */
#toast{position:absolute;top:66px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.88);color:#fff;padding:12px 22px;border-radius:24px;font-weight:700;z-index:30;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;font-size:.9rem;max-width:85%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.float-text{position:absolute;font-weight:900;font-size:1.2rem;text-shadow:0 2px 6px rgba(0,0,0,.75);pointer-events:none;z-index:25;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.8);opacity:0}15%{transform:translate(-50%,-8px) scale(1.1);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}

#modals{position:absolute;inset:0;z-index:40;pointer-events:none}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:auto;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal .box{background:#fff;border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;color:#333;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
.modal h3{margin-bottom:14px;color:#2d5016;font-size:1.15rem}
.modal p{font-size:.9rem;margin-bottom:10px;color:#555;line-height:1.5}
.modal .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.modal button{padding:10px 24px;border-radius:22px;border:none;font-weight:800;font-size:.88rem;cursor:pointer}
.modal .primary{background:linear-gradient(180deg,#ffd54f,#ffb300);color:#4a2800}
.modal .secondary{background:#ece7db;color:#555}
.modal .danger{background:#e74c3c;color:#fff}
.modal .seed-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.modal .seed-pick button{display:flex;flex-direction:column;align-items:center;padding:10px;background:#f8f5ee;color:#333;border:2px solid #e0dbcf;border-radius:12px}
.modal .seed-pick button .se{font-size:2rem}
.modal .seed-pick button .sn{font-weight:800;color:#2d5016;font-size:.82rem;margin-top:2px}
.modal .seed-pick button .si{font-size:.68rem;color:#777}

/* ========== RESPONSIVE ========== */
@media (orientation:landscape) and (max-height:500px){
  #topBar{height:42px}
  #bottomBar{height:56px}
  #canvas{top:42px;bottom:56px;height:calc(100% - 98px)}
  #panel{top:42px;bottom:56px}
  #startScreen h1{font-size:1.8rem}
  #bottomBar button{font-size:1.15rem}
  #bottomBar button span{font-size:.6rem}
}
@media (max-width:360px){
  #bottomBar button{font-size:1.25rem}
  #bottomBar button span{font-size:.6rem}
  .stat{font-size:.78rem;padding:4px 8px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= START ================= -->
  <div id="startScreen" class="screen">
    <h1>🌾 Colheita Feliz</h1>
    <p class="subtitle">Cuide da sua fazenda virtual!</p>
    <input id="farmNameInput" placeholder="Nome da fazenda" maxlength="20" autocomplete="off">
    <button id="playBtn" class="btn-big">▶ Jogar</button>
    <button id="newGameBtn" class="btn-small hidden">🆕 Começar de novo</button>
    <p class="version">v1.0 • offline</p>
  </div>

  <!-- ================= GAME ================= -->
  <div id="gameScreen" class="screen hidden">
    <canvas id="canvas"></canvas>

    <div id="topBar">
      <div class="stat">🪙 <span id="coinsLabel">0</span></div>
      <div class="stat">⭐ <span id="levelLabel">1</span></div>
      <div class="stat xp-bar">
        <div id="xpFill"></div>
        <span id="xpText">0/100</span>
      </div>
      <button id="soundBtn" class="stat-btn">🔊</button>
    </div>

    <div id="bottomBar">
      <button data-panel="shop">🛒<span>Loja</span></button>
      <button data-panel="inventory">🎒<span>Mochila</span></button>
      <button data-panel="animals">🐔<span>Animais</span></button>
      <button data-panel="missions">📋<span>Missões</span></button>
      <button data-panel="neighbors">👥<span>Vizinhos</span></button>
    </div>

    <div id="panel" class="hidden">
      <div id="panelHeader">
        <span id="panelTitle">Painel</span>
        <button id="closePanel">✕</button>
      </div>
      <div id="panelContent"></div>
    </div>

    <div id="toast"></div>
    <div id="modals"></div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   COLHEITA FELIZ — Fazenda virtual nostálgica
   Arquivo único: HTML + CSS + JS (Canvas + LocalStorage)
   ========================================================= */

/* ================== CONSTANTES ================== */
const CROPS = {
  wheat:      {n:'Trigo',    e:'🌾', cost:10,  grow:20,  price:12,  xp:5,  lvl:1},
  carrot:     {n:'Cenoura',  e:'🥕', cost:15,  grow:30,  price:18,  xp:7,  lvl:1},
  corn:       {n:'Milho',    e:'🌽', cost:25,  grow:45,  price:30,  xp:10, lvl:2},
  tomato:     {n:'Tomate',   e:'🍅', cost:35,  grow:60,  price:45,  xp:14, lvl:3},
  strawberry: {n:'Morango',  e:'🍓', cost:50,  grow:75,  price:65,  xp:18, lvl:4},
  sunflower:  {n:'Girassol', e:'🌻', cost:70,  grow:90,  price:95,  xp:22, lvl:5},
  pumpkin:    {n:'Abóbora',  e:'🎃', cost:90,  grow:110, price:120, xp:28, lvl:6},
  watermelon: {n:'Melancia', e:'🍉', cost:120, grow:140, price:165, xp:35, lvl:7},
};

const ANIMALS = {
  chicken: {n:'Galinha', e:'🐔', cost:150, prod:'egg',     prodName:'Ovo',    prodE:'🥚', time:30,  price:20, xp:10, lvl:1},
  pig:     {n:'Porco',   e:'🐷', cost:250, prod:'truffle', prodName:'Trufa',  prodE:'🍄', time:50,  price:35, xp:15, lvl:2},
  sheep:   {n:'Ovelha',  e:'🐑', cost:350, prod:'wool',    prodName:'Lã',     prodE:'🧶', time:60,  price:50, xp:20, lvl:3},
  cow:     {n:'Vaca',    e:'🐄', cost:450, prod:'milk',    prodName:'Leite',  prodE:'🥛', time:75,  price:60, xp:25, lvl:4},
  horse:   {n:'Cavalo',  e:'🐎', cost:700, prod:'leather', prodName:'Couro',  prodE:'🧵', time:100, price:90, xp:40, lvl:6},
};

const DECOS = [
  {id:'flower',    n:'Flor',       e:'🌷', cost:30,  lvl:1, xp:2},
  {id:'rock',      n:'Pedra',      e:'🪨', cost:40,  lvl:1, xp:3},
  {id:'bush',      n:'Arbusto',    e:'🌿', cost:50,  lvl:1, xp:3},
  {id:'tree',      n:'Árvore',     e:'🌳', cost:80,  lvl:1, xp:5},
  {id:'scarecrow', n:'Espantalho', e:'🧑‍🌾', cost:120, lvl:2, xp:8},
  {id:'fountain',  n:'Fonte',      e:'⛲', cost:200, lvl:3, xp:12},
];

const NEIGHBORS = [
  {id:'n1', name:'Fazenda do Zé',    lvl:3, e:'👨‍🌾', crop:'🌽', gift:{coin:50, seed:'corn', qty:2}},
  {id:'n2', name:'Sítio da Maria',   lvl:5, e:'👩‍🌾', crop:'🍓', gift:{coin:80, seed:'strawberry', qty:2}},
  {id:'n3', name:'Rancho do João',   lvl:8, e:'🧑‍🌾', crop:'🍉', gift:{coin:120, seed:'watermelon', qty:2}},
];

const WORLD_W = 900, WORLD_H = 1100;
const PLOT_X0 = 30, PLOT_Y0 = 250, PLOT_XS = 200, PLOT_YS = 150;
const PLOT_W = 185, PLOT_H = 125;
const PLOT_COLS = 4, PLOT_ROWS = 3, PLOT_COUNT = 12;
const INITIAL_PLOTS = 6;
const XP_PER_LEVEL = 100;
const SAVE_KEY = 'colheitaFeliz.save.v1';
const ANIMAL_SLOTS = [
  {x:100,y:800},{x:260,y:800},{x:420,y:800},{x:580,y:800},{x:740,y:800},
  {x:100,y:930},{x:260,y:930},{x:420,y:930},{x:580,y:930},{x:740,y:930},
];

const MISSION_DEFS = [
  {id:'plant5',        desc:'Plantar 5 sementes',        target:5,   reward:100, xp:20, get:s=>s.stats.planted},
  {id:'harvest10wheat',desc:'Colher 10 unidades de trigo',target:10, reward:150, xp:30, get:s=>(s.stats.harvestedByCrop.wheat||0)},
  {id:'buyChicken',    desc:'Comprar uma galinha',       target:1,   reward:100, xp:25, get:s=>(s.stats.animalsBought.chicken||0)},
  {id:'collect3eggs',  desc:'Coletar 3 ovos',            target:3,   reward:120, xp:25, get:s=>(s.stats.productsCollectedByType.egg||0)},
  {id:'earn100',       desc:'Ganhar 100 moedas',         target:100, reward:80,  xp:20, get:s=>s.stats.coinsEarned},
  {id:'unlockPlot',    desc:'Desbloquear um terreno',    target:1,   reward:200, xp:40, get:s=>s.stats.plotsUnlocked},
];

/* ================== ESTADO GLOBAL ================== */
let state = null;
let canvas, ctx, gameScreen;
let dpr = 1;
let cam = {scale:1, offX:0, offY:0};
let audioCtx = null;
let currentPanel = null;
let lastSaveAt = 0;
let lastFrame = 0;
let grassDots = [];

/* ================== UTILS ================== */
const $ = id => document.getElementById(id);
function now(){ return Date.now(); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(n){ return Math.floor(n).toLocaleString('pt-BR'); }

/* ================== AUDIO ================== */
function ensureAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
}
function beep(freq, dur, type='sine', vol=0.08){
  if (!state || !state.soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t+dur+0.03);
  } catch(e){}
}
const sfx = {
  plant:  ()=>{ beep(440,.08,'triangle'); setTimeout(()=>beep(660,.10,'triangle'),60); },
  harvest:()=>{ beep(660,.08,'square',.06); setTimeout(()=>beep(880,.12,'square',.06),70); },
  buy:    ()=>{ beep(520,.09,'sawtooth',.05); setTimeout(()=>beep(780,.12,'sawtooth',.05),70); },
  coin:   ()=>{ beep(880,.06,'square',.06); setTimeout(()=>beep(1170,.10,'square',.06),55); },
  mission:()=>{ [660,880,1320].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.08), i*90)); },
  error:  ()=>beep(180,.14,'sawtooth',.06),
  water:  ()=>{ beep(320,.10,'sine',.06); setTimeout(()=>beep(280,.12,'sine',.05),60); },
  click:  ()=>beep(600,.04,'sine',.04),
};

/* ================== ESTADO INICIAL ================== */
function defaultState(name){
  const plots = [];
  for (let i=0; i<PLOT_COUNT; i++){
    plots.push({crop:null, plantedAt:0, watered:false, unlocked: i<INITIAL_PLOTS});
  }
  return {
    version: 1,
    farmName: name || 'Minha Fazenda',
    coins: 500,
    xp: 0,
    level: 1,
    plots,
    seeds: { wheat:5, carrot:3 },
    inventory: {},
    animals: [],
    decos: [],
    missionsDone: {},
    lastDailyClaim: null,
    lastNeighborGift: {},
    soundOn: true,
    stats: {
      planted:0, harvested:0, harvestedByCrop:{}, coinsEarned:0,
      animalsBought:{}, productsCollected:0, productsCollectedByType:{},
      plotsUnlocked:0,
    },
  };
}

function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return null;
    const base = defaultState(data.farmName);
    const st = Object.assign({}, base, data);
    st.stats = Object.assign({}, base.stats, data.stats||{});
    st.seeds = Object.assign({}, base.seeds, data.seeds||{});
    st.inventory = Object.assign({}, data.inventory||{});
    st.animals = Array.isArray(data.animals) ? data.animals : [];
    st.decos = Array.isArray(data.decos) ? data.decos : [];
    st.missionsDone = data.missionsDone || {};
    st.lastNeighborGift = data.lastNeighborGift || {};
    if (!Array.isArray(st.plots) || st.plots.length !== PLOT_COUNT){
      st.plots = base.plots;
    } else {
      st.plots = st.plots.map(p=>({
        crop: p.crop||null, plantedAt: p.plantedAt||0,
        watered: !!p.watered, unlocked: !!p.unlocked,
      }));
    }
    return st;
  } catch(e){
    console.warn('Save corrompido:', e);
    return null;
  }
}

function saveGame(){
  if (!state) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    lastSaveAt = now();
  } catch(e){ console.warn('Erro ao salvar', e); }
}

/* ================== XP/NÍVEL ================== */
function addXP(amount){
  state.xp += amount;
  const newLevel = Math.floor(state.xp / XP_PER_LEVEL) + 1;
  if (newLevel > state.level){
    state.level = newLevel;
    toast(`⭐ Subiu para o nível ${state.level}!`);
    sfx.mission();
  }
  updateTopBar();
}

function addCoins(amount, countAsEarned){
  state.coins += amount;
  if (countAsEarned && amount > 0) state.stats.coinsEarned += amount;
  updateTopBar();
}

function spendCoins(amount){
  if (state.coins < amount) return false;
  state.coins -= amount;
  updateTopBar();
  return true;
}

/* ================== MISSÕES ================== */
function checkMissions(){
  let changed = false;
  for (const def of MISSION_DEFS){
    if (state.missionsDone[def.id]) continue;
    const prog = def.get(state);
    if (prog >= def.target){
      state.missionsDone[def.id] = true;
      addCoins(def.reward, true);
      addXP(def.xp);
      toast(`🎉 Missão: ${def.desc} (+${def.reward} 🪙)`);
      sfx.mission();
      changed = true;
    }
  }
  return changed;
}

/* ================== TOAST / FLOAT / MODAL ================== */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

function floatText(screenX, screenY, text, color){
  const canvasRect = canvas.getBoundingClientRect();
  const parentRect = gameScreen.getBoundingClientRect();
  const offX = canvasRect.left - parentRect.left;
  const offY = canvasRect.top - parentRect.top;
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.left = (offX + screenX) + 'px';
  el.style.top  = (offY + screenY) + 'px';
  el.style.color = color || '#ffd700';
  gameScreen.appendChild(el);
  setTimeout(()=>el.remove(), 1150);
}

function showModal(html){
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="box">${html}</div>`;
  wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });
  $('modals').appendChild(wrap);
  return wrap;
}

/* ================== CAMERA ================== */
function computeCamera(){
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;
  const s = Math.min(cw / WORLD_W, ch / WORLD_H);
  cam.scale = s;
  cam.offX = (cw - WORLD_W * s) / 2;
  cam.offY = (ch - WORLD_H * s) / 2;
}

function resizeCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(canvas.clientWidth  * dpr);
  canvas.height = Math.floor(canvas.clientHeight * dpr);
  computeCamera();
}

/* ================== GRAMA ================== */
function initGrass(){
  grassDots = [];
  for (let i=0;i<400;i++){
    grassDots.push({
      x: Math.random()*WORLD_W,
      y: Math.random()*WORLD_H,
      r: Math.random()*1.8+0.6,
    });
  }
}

/* ================== RENDER ================== */
function render(){
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);

  ctx.save();
  ctx.translate(cam.offX, cam.offY);
  ctx.scale(cam.scale, cam.scale);

  drawGround();
  drawPath();
  drawHouse();
  drawBarn();
  drawTrees();
  drawPlotArea();
  drawAnimalArea();
  drawAnimals();
  drawDecos();
  drawFenceBottom();

  ctx.restore();
}

function drawGround(){
  const g = ctx.createLinearGradient(0,0,0,WORLD_H);
  g.addColorStop(0,'#a2dd72');
  g.addColorStop(.5,'#7cc850');
  g.addColorStop(1,'#5ea63c');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,WORLD_W,WORLD_H);

  ctx.fillStyle = 'rgba(60,120,40,.28)';
  for (const d of grassDots){
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, 6.28);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(50,110,35,.28)';
  ctx.lineWidth = 1.2;
  for (let i=0;i<180;i++){
    const x = (i*53)%WORLD_W;
    const y = (i*97)%WORLD_H;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x+3, y-6);
    ctx.stroke();
  }
}

function drawPath(){
  ctx.fillStyle = 'rgba(200,168,116,.85)';
  ctx.fillRect(0, 220, WORLD_W, 18);
  ctx.fillRect(430, 90, 40, 130);
}

function drawHouse(){
  const x=40, y=40, w=180, h=140;
  ctx.fillStyle = 'rgba(0,0,0,.20)';
  ctx.beginPath();
  ctx.ellipse(x+w/2, y+h+10, w*.55, 14, 0, 0, 6.28);
  ctx.fill();
  ctx.fillStyle = '#f6e0b8';
  ctx.fillRect(x, y+50, w, h-50);
  ctx.strokeStyle = '#a07840';
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y+50, w, h-50);
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.moveTo(x-12, y+55);
  ctx.lineTo(x+w/2, y-8);
  ctx.lineTo(x+w+12, y+55);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#7d1e12';
  ctx.stroke();
  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(x+w/2-22, y+h-55, 44, 55);
  ctx.strokeStyle = '#5a3818';
  ctx.strokeRect(x+w/2-22, y+h-55, 44, 55);
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath();
  ctx.arc(x+w/2+12, y+h-28, 3, 0, 6.28);
  ctx.fill();
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(x+18, y+90, 40, 34);
  ctx.fillRect(x+w-58, y+90, 40, 34);
  ctx.strokeStyle = '#7d1e12';
  ctx.lineWidth = 2;
  ctx.strokeRect(x+18, y+90, 40, 34);
  ctx.strokeRect(x+w-58, y+90, 40, 34);
  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(x+w-45, y-15, 22, 40);
}

function drawBarn(){
  const x=690, y=50, w=180, h=120;
  ctx.fillStyle = 'rgba(0,0,0,.20)';
  ctx.beginPath();
  ctx.ellipse(x+w/2, y+h+10, w*.55, 12, 0, 0, 6.28);
  ctx.fill();
  ctx.fillStyle = '#b03a2e';
  ctx.fillRect(x, y+40, w, h-40);
  ctx.strokeStyle = '#6e1d14';
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y+40, w, h-40);
  ctx.fillStyle = '#8b2b20';
  ctx.beginPath();
  ctx.moveTo(x-10, y+45);
  ctx.lineTo(x+w/2, y-5);
  ctx.lineTo(x+w+10, y+45);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#5a1410';
  ctx.stroke();
  ctx.fillStyle = '#7a1f15';
  ctx.fillRect(x+w/2-28, y+h-55, 56, 55);
  ctx.strokeStyle = '#3d0d08';
  ctx.strokeRect(x+w/2-28, y+h-55, 56, 55);
  ctx.beginPath();
  ctx.moveTo(x+w/2, y+h-55);
  ctx.lineTo(x+w/2, y+h);
  ctx.moveTo(x+w/2-28, y+h-55);
  ctx.lineTo(x+w/2+28, y+h);
  ctx.stroke();
}

function drawTrees(){
  const trees = [
    {x:280, y:110, s:1.0},
    {x:480, y:95,  s:0.85},
    {x:600, y:210, s:0.95},
    {x:820, y:210, s:0.85},
  ];
  for (const t of trees) drawTree(t.x, t.y, t.s);
}

function drawTree(x, y, s){
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath();
  ctx.ellipse(x, y+22*s, 36*s, 12*s, 0, 0, 6.28);
  ctx.fill();
  ctx.fillStyle = '#6b4423';
  ctx.fillRect(x-7*s, y-4*s, 14*s, 32*s);
  const colors = ['#3d8b3d','#4fa64f','#5fbf5f'];
  for (let i=0;i<3;i++){
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.arc(x+(i-1)*12*s, y-22*s+i*4, 26*s, 0, 6.28);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  ctx.beginPath();
  ctx.arc(x-8*s, y-30*s, 8*s, 0, 6.28);
  ctx.fill();
}

function drawPlotArea(){
  for (let i=0;i<PLOT_COUNT;i++){
    const p = state.plots[i];
    const pos = plotPos(i);
    drawPlot(pos.x, pos.y, pos.w, pos.h, p, i);
  }
}

function plotPos(i){
  const c = i % PLOT_COLS;
  const r = Math.floor(i / PLOT_COLS);
  return { x: PLOT_X0 + c*PLOT_XS, y: PLOT_Y0 + r*PLOT_YS, w: PLOT_W, h: PLOT_H };
}

function drawPlot(x, y, w, h, plot, i){
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath();
  ctx.ellipse(x+w/2, y+h-6, w*.48, 10, 0, 0, 6.28);
  ctx.fill();

  if (!plot.unlocked){
    ctx.fillStyle = 'rgba(80,80,80,.55)';
    roundRect(x,y,w,h,14); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = 3;
    roundRect(x,y,w,h,14); ctx.stroke();
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔒', x+w/2, y+h/2);
    return;
  }

  const isWet = plot.crop && plot.watered;
  ctx.fillStyle = isWet ? '#5a3a1f' : '#7d4e22';
  roundRect(x,y,w,h,14); ctx.fill();

  ctx.fillStyle = isWet ? 'rgba(0,0,0,.18)' : 'rgba(0,0,0,.12)';
  for (let k=0;k<8;k++){
    const px = x+14 + ((k*41)%(w-28));
    const py = y+12 + ((k*57)%(h-24));
    ctx.beginPath();
    ctx.arc(px, py, 2.2, 0, 6.28);
    ctx.fill();
  }
  ctx.strokeStyle = '#5b3517';
  ctx.lineWidth = 3;
  roundRect(x,y,w,h,14); ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,.18)';
  ctx.lineWidth = 1.5;
  for (let k=1;k<3;k++){
    ctx.beginPath();
    ctx.moveTo(x+10, y+(h*k/3));
    ctx.lineTo(x+w-10, y+(h*k/3));
    ctx.stroke();
  }

  if (plot.crop){
    const crop = CROPS[plot.crop];
    const g = growthOf(plot);
    let emoji, scale;
    if (g >= 1)      { emoji = crop.e; scale = 1.15; }
    else if (g >= .6){ emoji = '🌿';   scale = .95; }
    else if (g >= .3){ emoji = '🌱';   scale = .80; }
    else             { emoji = '🌱';   scale = .65; }

    const t = performance.now()/700;
    const wob = Math.sin(t + i)*1.8;

    ctx.save();
    ctx.translate(x+w/2+wob, y+h/2+6);
    ctx.scale(scale, scale);
    ctx.font = '52px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 0, 0);
    ctx.restore();

    const barW = w-28, bx = x+14, by = y+h-14;
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillRect(bx, by, barW, 7);
    ctx.fillStyle = g >= 1 ? '#ffd700' : '#8bc34a';
    ctx.fillRect(bx, by, barW*Math.min(1,g), 7);
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, barW, 7);

    if (g >= 1){
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(x+w-16, y+16, 10, 0, 6.28);
      ctx.fill();
      ctx.fillStyle = '#4a2800';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', x+w-16, y+16);
    } else if (!plot.watered){
      ctx.fillStyle = 'rgba(33,150,243,.9)';
      ctx.beginPath();
      ctx.arc(x+16, y+16, 11, 0, 6.28);
      ctx.fill();
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💧', x+16, y+16);
    }
  } else {
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.arc(x+w/2, y+h/2, 8, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', x+w/2, y+h/2);
  }
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function drawAnimalArea(){
  const ax=30, ay=720, aw=840, ah=320;
  ctx.fillStyle = 'rgba(160,210,120,.45)';
  roundRect(ctx, ax, ay, aw, ah, 20);
  ctx.fill();

  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 4;
  ctx.setLineDash([]);
  for (let x=ax; x<=ax+aw; x+=60){
    ctx.fillStyle = '#6e451f';
    ctx.fillRect(x-3, ay-14, 6, 22);
    ctx.fillRect(x-3, ay+ah-8, 6, 22);
  }
  for (let y=ay; y<=ay+ah; y+=60){
    ctx.fillStyle = '#6e451f';
    ctx.fillRect(ax-3, y-8, 6, 22);
    ctx.fillRect(ax+aw-3, y-8, 6, 22);
  }
  ctx.beginPath();
  ctx.moveTo(ax, ay-6); ctx.lineTo(ax+aw, ay-6);
  ctx.moveTo(ax, ay+ah+6); ctx.lineTo(ax+aw, ay+ah+6);
  ctx.stroke();
}

function drawAnimals(){
  for (let i=0;i<state.animals.length;i++){
    const a = state.animals[i];
    const slot = ANIMAL_SLOTS[i % ANIMAL_SLOTS.length];
    const def = ANIMALS[a.type];
    if (!def) continue;

    const t = performance.now()/500 + i*0.9;
    const bob = Math.sin(t)*2;

    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath();
    ctx.ellipse(slot.x, slot.y+22, 28, 8, 0, 0, 6.28);
    ctx.fill();

    ctx.font = '50px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.e, slot.x, slot.y+bob);

    const ready = animalReady(a);
    const hunger = animalHunger(a);

    if (ready && hunger > 0){
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(slot.x+22, slot.y-24, 12, 0, 6.28);
      ctx.fill();
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#4a2800';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.prodE, slot.x+22, slot.y-24);
    } else if (hunger <= 0){
      ctx.fillStyle = 'rgba(255,0,0,.8)';
      ctx.beginPath();
      ctx.arc(slot.x-22, slot.y-24, 11, 0, 6.28);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', slot.x-22, slot.y-24);
    }
  }
}

function drawDecos(){
  for (const d of state.decos){
    const def = DECOS.find(x=>x.id===d.id);
    if (!def) continue;
    ctx.font = '44px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.e, d.x, d.y);
  }
}

function drawFenceBottom(){
  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 4;
  const y = WORLD_H - 20;
  ctx.beginPath();
  ctx.moveTo(20, y); ctx.lineTo(WORLD_W-20, y);
  ctx.stroke();
  ctx.fillStyle = '#6e451f';
  for (let x=20; x<WORLD_W-20; x+=55){
    ctx.fillRect(x, y-14, 5, 22);
  }
}

/* ================== LÓGICA DE CRESCIMENTO ================== */
function growthOf(plot){
  if (!plot.crop) return 0;
  const c = CROPS[plot.crop];
  const elapsed = (now() - plot.plantedAt) / 1000;
  return Math.min(1, elapsed / c.grow);
}

function animalReady(a){
  const def = ANIMALS[a.type];
  if (!def) return false;
  const elapsed = (now() - (a.lastCollected||0)) / 1000;
  return elapsed >= def.time;
}

function animalHunger(a){
  if (!a.lastFed) return 0;
  const minutes = (now() - a.lastFed) / 60000;
  return Math.max(0, 100 - minutes);
}

/* ================== INTERAÇÃO COM O CANVAS ================== */
function canvasTap(cx, cy){
  ensureAudio();
  const wx = (cx - cam.offX) / cam.scale;
  const wy = (cy - cam.offY) / cam.scale;

  // Toca em um canteiro?
  for (let i=0;i<PLOT_COUNT;i++){
    const p = plotPos(i);
    if (wx >= p.x && wx <= p.x+p.w && wy >= p.y && wy <= p.y+p.h){
      handlePlotTap(i, cx, cy, p);
      return;
    }
  }

  // Toca em animal?
  for (let i=0;i<state.animals.length;i++){
    const slot = ANIMAL_SLOTS[i % ANIMAL_SLOTS.length];
    const dx = wx - slot.x, dy = wy - slot.y;
    if (dx*dx + dy*dy < 40*40){
      handleAnimalTap(i, cx, cy);
      return;
    }
  }
}

function handlePlotTap(i, cx, cy, pos){
  const plot = state.plots[i];

  if (!plot.unlocked){
    // Desbloquear
    const cost = unlockCost(i);
    const ok = state.level >= Math.ceil(i/3)+1;
    if (!ok){
      toast(`🔒 Nível ${Math.ceil(i/3)+1} necessário`);
      return;
    }
    showModal(`
      <h3>🔓 Desbloquear Terreno</h3>
      <p>Libertar este canteiro por <b>${fmt(cost)} 🪙</b>?</p>
      <p style="font-size:.8rem">Nível necessário: <b>${Math.ceil(i/3)+1}</b></p>
      <div class="row">
        <button class="secondary" onclick="this.closest('.modal').remove()">Cancelar</button>
        <button class="primary" id="confirmUnlock">Comprar</button>
      </div>
    `);
    const modal = document.querySelector('.modal:last-child');
    modal.querySelector('#confirmUnlock').onclick = () => {
      if (!spendCoins(cost)){ toast('🪙 Moedas insuficientes'); sfx.error(); return; }
      plot.unlocked = true;
      state.stats.plotsUnlocked++;
      sfx.buy();
      modal.remove();
      checkMissions();
      saveGame();
      toast('✅ Terreno desbloqueado!');
    };
    return;
  }

  if (!plot.crop){
    // Escolher semente
    openSeedPicker(i);
    return;
  }

  const g = growthOf(plot);
  if (g >= 1){
    harvestPlot(i, cx, cy, pos);
  } else {
    waterPlot(i, cx, cy, pos);
  }
}

function openSeedPicker(i){
  const seeds = Object.entries(state.seeds).filter(([k,v])=>v>0 && CROPS[k]);
  if (seeds.length === 0){
    toast('🎒 Sem sementes! Compre na loja.');
    return;
  }
  const html = `
    <h3>🌱 Escolha a semente</h3>
    <div class="seed-pick">
      ${seeds.map(([k,v]) => {
        const c = CROPS[k];
        return `<button data-seed="${k}">
          <span class="se">${c.e}</span>
          <span class="sn">${c.n} (${v})</span>
          <span class="si">${c.grow}s • vende ${c.price}🪙</span>
        </button>`;
      }).join('')}
    </div>
    <div class="row">
      <button class="secondary" onclick="this.closest('.modal').remove()">Fechar</button>
    </div>
  `;
  const modal = showModal(html);
  modal.querySelectorAll('[data-seed]').forEach(btn=>{
    btn.onclick = () => {
      plantSeed(i, btn.dataset.seed);
      modal.remove();
    };
  });
}

function plantSeed(i, seedKey){
  const plot = state.plots[i];
  if (plot.crop) return;
  if (!state.seeds[seedKey] || state.seeds[seedKey] <= 0){
    toast('🚫 Sem sementes dessa cultura');
    return;
  }
  state.seeds[seedKey]--;
  plot.crop = seedKey;
  plot.plantedAt = now();
  plot.watered = false;
  state.stats.planted++;
  sfx.plant();
  const pos = plotPos(i);
  const sx = (pos.x + pos.w/2) * cam.scale + cam.offX;
  const sy = (pos.y) * cam.scale + cam.offY;
  floatText(sx, sy, '🌱 +1', '#7ed957');
  checkMissions();
  saveGame();
  refreshPanel();
}

function waterPlot(i, cx, cy, pos){
  const plot = state.plots[i];
  if (!plot.crop || plot.watered) return;
  plot.watered = true;
  // Acelera em 30%
  const elapsedMs = now() - plot.plantedAt;
  const totalMs = CROPS[plot.crop].grow * 1000;
  const remaining = totalMs - elapsedMs;
  plot.plantedAt -= remaining * 0.3;
  sfx.water();
  floatText(cx, cy, '💧 +30%', '#4fc3f7');
  saveGame();
}

function harvestPlot(i, cx, cy, pos){
  const plot = state.plots[i];
  const c = CROPS[plot.crop];
  if (!c) return;

  const qty = 2;
  state.inventory[plot.crop] = (state.inventory[plot.crop]||0) + qty;
  state.stats.harvested += qty;
  state.stats.harvestedByCrop[plot.crop] = (state.stats.harvestedByCrop[plot.crop]||0) + qty;

  addXP(c.xp);

  plot.crop = null;
  plot.plantedAt = 0;
  plot.watered = false;

  sfx.harvest();
  floatText(cx, cy, `+${qty} ${c.e}`, '#ffd700');

  checkMissions();
  saveGame();
  refreshPanel();
}

function handleAnimalTap(i, cx, cy){
  const a = state.animals[i];
  const def = ANIMALS[a.type];
  if (!def) return;
  const hunger = animalHunger(a);
  if (hunger <= 0){
    toast('🍽️ Alimente o animal primeiro!');
    return;
  }
  if (!animalReady(a)){
    const remain = def.time - (now()-a.lastCollected)/1000;
    toast(`⏳ ${def.n} produzindo... ${Math.ceil(remain)}s`);
    return;
  }
  // Coletar
  a.lastCollected = now();
  state.inventory[def.prod] = (state.inventory[def.prod]||0) + 1;
  state.stats.productsCollected++;
  state.stats.productsCollectedByType[def.prod] = (state.stats.productsCollectedByType[def.prod]||0) + 1;
  addXP(def.xp);
  sfx.harvest();
  floatText(cx, cy, `+1 ${def.prodE}`, '#ffd700');
  checkMissions();
  saveGame();
  refreshPanel();
}

/* ================== AÇÕES ================== */
function unlockCost(i){
  // Ordem de desbloqueio: os canteiros bloqueados após os iniciais
  const unlockedExtra = state.stats.plotsUnlocked;
  return Math.floor(250 * Math.pow(1.6, unlockedExtra));
}

function buySeed(key, qty=1){
  const c = CROPS[key];
  if (!c) return;
  if (state.level < c.lvl){
    toast(`🔒 Nível ${c.lvl} necessário`);
    sfx.error();
    return;
  }
  const total = c.cost * qty;
  if (!spendCoins(total)){ toast('🪙 Moedas insuficientes'); sfx.error(); return; }
  state.seeds[key] = (state.seeds[key]||0) + qty;
  sfx.buy();
  toast(`✅ +${qty} semente(s) de ${c.n}`);
  saveGame();
  refreshPanel();
  updateTopBar();
}

function sellItem(key, qty=1){
  const have = state.inventory[key]||0;
  if (have < qty) return;
  let price = 0;
  if (CROPS[key]) price = CROPS[key].price;
  else {
    for (const a of Object.values(ANIMALS)){
      if (a.prod === key){ price = a.price; break; }
    }
  }
  if (!price) return;
  state.inventory[key] -= qty;
  if (state.inventory[key] <= 0) delete state.inventory[key];
  addCoins(price*qty, true);
  sfx.coin();
  toast(`💰 +${price*qty} moedas`);
  saveGame();
  refreshPanel();
}

function sellAll(key){
  const have = state.inventory[key]||0;
  if (have > 0) sellItem(key, have);
}

function buyAnimal(type){
  const def = ANIMALS[type];
  if (!def) return;
  if (state.level < def.lvl){ toast(`🔒 Nível ${def.lvl} necessário`); sfx.error(); return; }
  if (state.animals.length >= ANIMAL_SLOTS.length){
    toast('🐾 Curral cheio!');
    return;
  }
  if (!spendCoins(def.cost)){ toast('🪙 Moedas insuficientes'); sfx.error(); return; }
  state.animals.push({
    type,
    lastCollected: now(),
    lastFed: now(),
    id: Date.now()+Math.random(),
  });
  state.stats.animalsBought[type] = (state.stats.animalsBought[type]||0) + 1;
  addXP(def.xp);
  sfx.buy();
  toast(`✅ ${def.n} comprada!`);
  checkMissions();
  saveGame();
  refreshPanel();
  updateTopBar();
}

function feedAnimal(idx){
  const a = state.animals[idx];
  if (!a) return;
  if (animalHunger(a) > 60){ toast('🍽️ Animal já está satisfeito'); return; }
  if (!spendCoins(20)){ toast('🪙 Moedas insuficientes'); sfx.error(); return; }
  a.lastFed = now();
  sfx.buy();
  toast('🍽️ Animal alimentado!');
  saveGame();
  refreshPanel();
}

function buyDeco(id){
  const def = DECOS.find(d=>d.id===id);
  if (!def) return;
  if (state.level < def.lvl){ toast(`🔒 Nível ${def.lvl} necessário`); sfx.error(); return; }
  if (!spendCoins(def.cost)){ toast('🪙 Moedas insuficientes'); sfx.error(); return; }
  // Posiciona em local aleatório livre
  const spots = [
    {x:140, y:600}, {x:320, y:620}, {x:500, y:600}, {x:680, y:620},
    {x:140, y:660}, {x:320, y:660}, {x:500, y:660}, {x:680, y:660},
  ];
  const used = state.decos.map(d=>`${d.x},${d.y}`);
  const free = spots.filter(s => !used.includes(`${s.x},${s.y}`));
  const spot = free.length ? free[Math.floor(Math.random()*free.length)] : {x: rand(100,800), y: rand(600,700)};
  state.decos.push({id, x: spot.x, y: spot.y});
  addXP(def.xp);
  sfx.buy();
  toast(`✅ ${def.n} instalada!`);
  saveGame();
  refreshPanel();
}

function rand(min, max){ return Math.random()*(max-min)+min; }

/* ================== PAINEL UI ================== */
function updateTopBar(){
  if (!state) return;
  $('coinsLabel').textContent = fmt(state.coins);
  $('levelLabel').textContent = state.level;
  const xpHere = state.xp % XP_PER_LEVEL;
  $('xpFill').style.width = (xpHere/XP_PER_LEVEL*100)+'%';
  $('xpText').textContent = xpHere + '/' + XP_PER_LEVEL;
}

function openPanel(name){
  currentPanel = name;
  $('panel').classList.remove('hidden');
  refreshPanel();
}

function closePanel(){
  currentPanel = null;
  $('panel').classList.add('hidden');
}

function refreshPanel(){
  if (!currentPanel) return;
  const titles = {
    shop: '🛒 Loja', inventory: '🎒 Mochila',
    animals: '🐔 Animais', missions: '📋 Missões', neighbors: '👥 Vizinhos'
  };
  $('panelTitle').textContent = titles[currentPanel] || 'Painel';
  const content = $('panelContent');
  if (currentPanel === 'shop') content.innerHTML = renderShop();
  else if (currentPanel === 'inventory') content.innerHTML = renderInventory();
  else if (currentPanel === 'animals') content.innerHTML = renderAnimalsPanel();
  else if (currentPanel === 'missions') content.innerHTML = renderMissions();
  else if (currentPanel === 'neighbors') content.innerHTML = renderNeighbors();
  bindPanelEvents();
}

let activeShopTab = 'seeds';

function renderShop(){
  const tabs = [
    {id:'seeds', label:'🌱 Sementes'},
    {id:'animals', label:'🐾 Animais'},
    {id:'decos', label:'🎨 Decorações'},
  ];
  let body = '';
  if (activeShopTab === 'seeds'){
    body = `<div class="grid">${Object.entries(CROPS).map(([k,c])=>{
      const locked = state.level < c.lvl;
      return `<div class="card ${locked?'locked':''}">
        <div class="emoji">${c.e}</div>
        <div class="name">${c.n}</div>
        <div class="info">${c.grow}s • +${c.xp}xp</div>
        <div class="price">${c.cost} 🪙</div>
        <button class="buy" data-buy-seed="${k}" ${locked?'disabled':''}>${locked?`🔒 Nível ${c.lvl}`:'Comprar'}</button>
      </div>`;
    }).join('')}</div>`;
  } else if (activeShopTab === 'animals'){
    body = `<div class="grid">${Object.entries(ANIMALS).map(([k,a])=>{
      const locked = state.level < a.lvl;
      return `<div class="card ${locked?'locked':''}">
        <div class="emoji">${a.e}</div>
        <div class="name">${a.n}</div>
        <div class="info">${a.prodE} ${a.prodName} a cada ${a.time}s</div>
        <div class="price">${a.cost} 🪙</div>
        <button class="buy" data-buy-animal="${k}" ${locked?'disabled':''}>${locked?`🔒 Nível ${a.lvl}`:'Comprar'}</button>
      </div>`;
    }).join('')}</div>`;
  } else {
    body = `<div class="grid">${DECOS.map(d=>{
      const locked = state.level < d.lvl;
      return `<div class="card ${locked?'locked':''}">
        <div class="emoji">${d.e}</div>
        <div class="name">${d.n}</div>
        <div class="info">+${d.xp} xp</div>
        <div class="price">${d.cost} 🪙</div>
        <button class="buy" data-buy-deco="${d.id}" ${locked?'disabled':''}>${locked?`🔒 Nível ${d.lvl}`:'Comprar'}</button>
      </div>`;
    }).join('')}</div>`;
  }
  return `
    <div class="tabs">
      ${tabs.map(t=>`<button class="${activeShopTab===t.id?'active':''}" data-shop-tab="${t.id}">${t.label}</button>`).join('')}
    </div>
    ${body}
  `;
}

function renderInventory(){
  const entries = Object.entries(state.inventory).filter(([k,v])=>v>0);
  if (entries.length === 0){
    return `<p style="text-align:center;padding:30px 10px;color:#999">🎒 Sua mochila está vazia.<br>Plante e colha para conseguir produtos!</p>`;
  }
  const cards = entries.map(([k,v])=>{
    let name = k, emoji = '❓', price = 0;
    if (CROPS[k]){ name = CROPS[k].n; emoji = CROPS[k].e; price = CROPS[k].price; }
    else {
      for (const a of Object.values(ANIMALS)){
        if (a.prod === k){ name = a.prodName; emoji = a.prodE; price = a.price; break; }
      }
    }
    return `<div class="card">
      <div class="emoji">${emoji}</div>
      <div class="name">${name}</div>
      <div class="info">Quantidade: <b>${v}</b></div>
      <div class="price">${price} 🪙 cada</div>
      <button class="sell" data-sell="${k}">Vender 1</button>
      <button class="sell" data-sell-all="${k}" style="margin-top:2px;background:#e67e22">Vender tudo</button>
    </div>`;
  }).join('');
  return `<div class="grid">${cards}</div>`;
}

function renderAnimalsPanel(){
  if (state.animals.length === 0){
    return `<p style="text-align:center;padding:30px 10px;color:#999">🐾 Nenhum animal ainda.<br>Compre na loja!</p>`;
  }
  const cards = state.animals.map((a,i)=>{
    const def = ANIMALS[a.type];
    if (!def) return '';
    const ready = animalReady(a);
    const hunger = Math.round(animalHunger(a));
    const remain = Math.max(0, def.time - (now()-a.lastCollected)/1000);
    const statusText = hunger <= 0 ? '😿 Faminto!' :
                       ready ? '✅ Pronto para coletar!' :
                       `⏳ ${Math.ceil(remain)}s`;
    return `<div class="card">
      <div class="emoji">${def.e}</div>
      <div class="name">${def.n}</div>
      <div class="info">Fome: ${hunger}%</div>
      <div class="info">${statusText}</div>
      <button class="collect" data-collect-animal="${i}" ${!ready||hunger<=0?'disabled':''}>Coletar ${def.prodE}</button>
      <button class="sell" data-feed-animal="${i}" style="background:#4caf50" ${hunger>60?'disabled':''}>🍽️ Alimentar (20🪙)</button>
    </div>`;
  }).join('');
  return `<div class="grid">${cards}</div>`;
}

function renderMissions(){
  return MISSION_DEFS.map(def=>{
    const done = !!state.missionsDone[def.id];
    const prog = Math.min(def.target, def.get(state));
    const pct = (prog/def.target*100);
    return `<div class="mission ${done?'done':''}">
      <div class="title">${done?'✅':'⏳'} ${def.desc}</div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="reward">
        <span>${prog}/${def.target}</span>
        <span>+${def.reward}🪙 +${def.xp}⭐</span>
      </div>
    </div>`;
  }).join('');
}

function renderNeighbors(){
  const todayStr = today();
  return NEIGHBORS.map(n=>{
    const claimed = state.lastNeighborGift[n.id] === todayStr;
    return `<div class="card" style="flex-direction:row;align-items:center;text-align:left;gap:12px;padding:12px">
      <div style="font-size:2.5rem">${n.e}</div>
      <div style="flex:1">
        <div class="name" style="font-size:.95rem">${n.name}</div>
        <div class="info">Nível ${n.lvl} • Cultiva ${n.crop}</div>
        <button class="collect" data-gift="${n.id}" style="margin-top:6px" ${claimed?'disabled':''}>
          ${claimed?'✅ Já visitou hoje':'🎁 Visitar (+'+n.gift.coin+'🪙)'}
        </button>
      </div>
    </div>`;
  }).join('') + `
    <div style="margin-top:14px;padding:14px;background:#fff8e0;border-radius:12px;color:#666;font-size:.8rem;text-align:center">
      💡 Em versões futuras, você poderá interagir com fazendeiros reais!
    </div>
  `;
}

function claimNeighborGift(id){
  const todayStr = today();
  if (state.lastNeighborGift[id] === todayStr){
    toast('⏳ Já visitou este vizinho hoje');
    return;
  }
  const n = NEIGHBORS.find(x=>x.id===id);
  if (!n) return;
  state.lastNeighborGift[id] = todayStr;
  addCoins(n.gift.coin, true);
  state.seeds[n.gift.seed] = (state.seeds[n.gift.seed]||0) + n.gift.qty;
  sfx.coin();
  toast(`🎁 +${n.gift.coin}🪙 +${n.gift.qty} sementes!`);
  saveGame();
  refreshPanel();
}

function bindPanelEvents(){
  // Tabs da loja
  document.querySelectorAll('[data-shop-tab]').forEach(btn=>{
    btn.onclick = () => { activeShopTab = btn.dataset.shopTab; refreshPanel(); };
  });
  // Buy seeds
  document.querySelectorAll('[data-buy-seed]').forEach(btn=>{
    btn.onclick = () => buySeed(btn.dataset.buySeed, 1);
  });
  // Buy animals
  document.querySelectorAll('[data-buy-animal]').forEach(btn=>{
    btn.onclick = () => buyAnimal(btn.dataset.buyAnimal);
  });
  // Buy decos
  document.querySelectorAll('[data-buy-deco]').forEach(btn=>{
    btn.onclick = () => buyDeco(btn.dataset.buyDeco);
  });
  // Sell
  document.querySelectorAll('[data-sell]').forEach(btn=>{
    btn.onclick = () => sellItem(btn.dataset.sell, 1);
  });
  document.querySelectorAll('[data-sell-all]').forEach(btn=>{
    btn.onclick = () => sellAll(btn.dataset.sellAll);
  });
  // Collect animal
  document.querySelectorAll('[data-collect-animal]').forEach(btn=>{
    btn.onclick = () => {
      const i = +btn.dataset.collectAnimal;
      handleAnimalTap(i, canvas.clientWidth/2, canvas.clientHeight/2);
    };
  });
  // Feed animal
  document.querySelectorAll('[data-feed-animal]').forEach(btn=>{
    btn.onclick = () => feedAnimal(+btn.dataset.feedAnimal);
  });
  // Neighbor gift
  document.querySelectorAll('[data-gift]').forEach(btn=>{
    btn.onclick = () => claimNeighborGift(btn.dataset.gift);
  });
}

/* ================== RECOMPENSA DIÁRIA ================== */
function checkDailyReward(){
  const t = today();
  if (state.lastDailyClaim === t) return;
  // Oferecer recompensa ao entrar
  const reward = {coins: 100 + state.level*20, seedQty: 3};
  const seedPool = Object.keys(CROPS).filter(k=>state.level >= CROPS[k].lvl);
  const seedKey = seedPool[Math.floor(Math.random()*seedPool.length)] || 'wheat';
  const modal = showModal(`
    <h3>🎁 Recompensa Diária!</h3>
    <p>Bem-vindo de volta à <b>${state.farmName}</b>!</p>
    <p style="font-size:1.6rem;margin:8px 0">🪙 +${reward.coins} &nbsp; 🌱 +${reward.seedQty} ${CROPS[seedKey].e}</p>
    <div class="row">
      <button class="primary" id="claimDaily">Resgatar!</button>
    </div>
  `);
  modal.querySelector('#claimDaily').onclick = () => {
    addCoins(reward.coins, true);
    state.seeds[seedKey] = (state.seeds[seedKey]||0) + reward.seedQty;
    state.lastDailyClaim = t;
    sfx.coin();
    toast(`🎁 +${reward.coins}🪙 +${reward.seedQty} sementes!`);
    saveGame();
    modal.remove();
  };
}

/* ================== BOOT ================== */
function startGame(farmName, existingSave){
  if (existingSave){
    state = existingSave;
  } else {
    state = defaultState(farmName);
    saveGame();
  }

  $('startScreen').classList.add('hidden');
  $('gameScreen').classList.remove('hidden');

  // Resize e loop
  resizeCanvas();
  updateTopBar();
  $('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';

  // Pré-calcula grama
  initGrass();

  // Loop de render
  if (!lastFrame){
    const loop = (t) => {
      render();
      // Salva a cada 30s
      if (now() - lastSaveAt > 30000) saveGame();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  // Recompensa diária após pequeno delay
  setTimeout(checkDailyReward, 400);
}

function boot(){
  canvas = $('canvas');
  ctx = canvas.getContext('2d');
  gameScreen = $('gameScreen');

  // Verifica save existente
  const existing = loadGame();
  if (existing){
    $('playBtn').textContent = '▶ Continuar';
    $('newGameBtn').classList.remove('hidden');
    $('farmNameInput').value = existing.farmName || '';
    $('farmNameInput').style.display = 'none';
    $('newGameBtn').onclick = () => {
      if (confirm('Apagar o save atual e começar uma nova fazenda?')){
        localStorage.removeItem(SAVE_KEY);
        location.reload();
      }
    };
  }

  $('playBtn').onclick = () => {
    ensureAudio();
    const save = loadGame();
    if (save){
      startGame(save.farmName, save);
    } else {
      let name = ($('farmNameInput').value || '').trim();
      if (!name) name = 'Minha Fazenda';
      if (name.length > 20) name = name.slice(0,20);
      startGame(name, null);
    }
  };

  $('farmNameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('playBtn').click();
  });

  // Som
  document.addEventListener('click', () => ensureAudio(), {once:true});

  // Resize
  window.addEventListener('resize', () => { if (canvas) resizeCanvas(); });
  window.addEventListener('orientationchange', () => setTimeout(()=>resizeCanvas(), 200));

  // Taps no canvas
  canvas.addEventListener('pointerdown', e => {
    if (!state) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    canvasTap(e.clientX - rect.left, e.clientY - rect.top);
  });

  // Bottom bar
  document.querySelectorAll('#bottomBar [data-panel]').forEach(btn=>{
    btn.addEventListener('click', () => {
      ensureAudio();
      sfx.click();
      openPanel(btn.dataset.panel);
    });
  });

  // Fechar painel
  $('closePanel').onclick = () => { sfx.click(); closePanel(); };

  // Som
  $('soundBtn').onclick = () => {
    if (!state) return;
    state.soundOn = !state.soundOn;
    $('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
    saveGame();
  };

  // Fechar painel com tecla ESC (desktop)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });

  // Salva ao sair
  window.addEventListener('beforeunload', () => saveGame());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveGame();
  });
}

window.addEventListener('load', boot);
window.addEventListener('error', e => {
  console.error('Erro capturado:', e.error || e.message);
});
</script>
