<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPS Premium Tracker</title>
    
    <!-- MapLibre GL JS para Mapas em 3D e Rotação Nativa -->
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #f4f4f9;
            --text-color: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); }

        /* Mapa */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* Splash Screen (Introdução) */
        #splash {
            position: fixed; inset: 0; background: linear-gradient(135deg, #007AFF, #0056b3);
            color: white; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.6s ease-in-out;
        }
        #splash i { font-size: 4rem; margin-bottom: 20px; animation: bounce 2s infinite; }
        #splash h1 { font-size: 2rem; margin-bottom: 10px; font-weight: 700; }
        #splash p { font-size: 1rem; opacity: 0.8; text-align: center; padding: 0 20px; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        /* UI Sobreposta (Botões e Painéis) */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 20px 30px 20px; }
        
        .top-controls { display: flex; justify-content: space-between; pointer-events: auto; }
        
        .btn-action {
            background: rgba(255, 255, 255, 0.95); border: none; border-radius: 50%;
            width: 50px; height: 50px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); cursor: pointer; color: var(--text-color); font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }

        .btn-sync {
            background: var(--primary-color); color: white; border-radius: 25px;
            padding: 0 20px; width: auto; font-weight: bold; font-size: 1rem; gap: 8px;
        }

        /* Painel de Busca e Navegação */
        .bottom-panel {
            background: white; border-radius: 25px; padding: 25px 20px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.1); pointer-events: auto;
            transform: translateY(0); transition: transform 0.3s ease;
        }

        .search-container {
            display: flex; align-items: center; background: var(--bg-color);
            border-radius: 15px; padding: 12px 15px; margin-bottom: 15px;
        }
        .search-container i { color: #888; margin-right: 10px; }
        .search-container input {
            border: none; background: transparent; width: 100%;
            font-size: 1.1rem; outline: none; color: var(--text-color);
        }

        .btn-navigate {
            width: 100%; background: var(--primary-color); color: white;
            border: none; padding: 16px; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        
        .btn-navigate.active { background: #34C759; box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4); }

        /* Bússola e Centralizar (lado direito inferior) */
        .side-controls { position: absolute; bottom: 180px; right: 20px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
    </style>
</head>
<body>

    <!-- Splash Screen (Introdução do App) -->
    <div id="splash">
        <i class="fa-solid fa-location-arrow"></i>
        <h1>GPS Premium</h1>
        <p id="splash-text">Inicializando sistema e verificando permissões...</p>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Interface do Usuário -->
    <div class="ui-layer">
        
        <!-- Controles Superiores -->
        <div class="top-controls">
            <button class="btn-action" onclick="openMenu()"><i class="fa-solid fa-bars"></i></button>
            <button class="btn-action btn-sync" onclick="syncOfflineMaps()">
                <i class="fa-solid fa-cloud-arrow-down"></i> Sincronizar
            </button>
        </div>

        <!-- Controles Laterais (Centralizar) -->
        <div class="side-controls">
            <button class="btn-action" onclick="recenterMap()"><i class="fa-solid fa-crosshairs"></i></button>
        </div>

        <!-- Painel Inferior -->
        <div class="bottom-panel" id="bottom-panel">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="destination" placeholder="Para onde você quer ir?">
            </div>
            <button class="btn-navigate" id="btn-start" onclick="toggleNavigation()">
                <i class="fa-solid fa-route"></i> Iniciar Rota
            </button>
        </div>
    </div>

    <script>
        let map;
        let userMarker;
        let watchId;
        let isNavigating = false;
        let currentLat = -17.0384; // Padrão: Itamaraju, BA
        let currentLng = -39.5283;
        let currentHeading = 0;

        // Estilo do mapa otimizado para mobile e navegação
        const mapStyle = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';

        // --- 1. Inicialização e Permissões Capacitor ---
        document.addEventListener('DOMContentLoaded', async () => {
            const splashText = document.getElementById('splash-text');
            
            // Simulação de requisição de permissões do Capacitor
            splashText.innerText = "Solicitando acesso ao GPS...";
            await requestCapacitorPermissions();

            splashText.innerText = "Carregando mapas...";
            initMap();

            // Esconder Splash Screen após o carregamento
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 600);
            }, 2500);
        });

        // Função para integrar com os plugins do Capacitor (Geolocation e Notifications)
        async function requestCapacitorPermissions() {
            try {
                // Se estiver rodando dentro do APK com Capacitor:
                if (window.Capacitor && window.Capacitor.Plugins) {
                    const { Geolocation, LocalNotifications } = window.Capacitor.Plugins;
                    if (Geolocation) await Geolocation.requestPermissions();
                    if (LocalNotifications) await LocalNotifications.requestPermissions();
                } else {
                    console.log("Rodando no navegador padrão. Simulando permissões Capacitor.");
                }
            } catch (error) {
                console.error("Erro nas permissões:", error);
            }
        }

        // --- 2. Configuração do Mapa ---
        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: mapStyle,
                center: [currentLng, currentLat],
                zoom: 14,
                pitch: 0, // Inicia plano (2D)
                bearing: 0
            });

            // Adicionar marcador customizado do usuário
            const el = document.createElement('div');
            el.innerHTML = '<i class="fa-solid fa-location-arrow" style="color: #007AFF; font-size: 24px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5)); transform: rotate(-45deg);"></i>';
            
            userMarker = new maplibregl.Marker({ element: el })
                .setLngLat([currentLng, currentLat])
                .addTo(map);

            startTracking();
        }

        // --- 3. Rastreamento GPS ---
        function startTracking() {
            if ('geolocation' in navigator) {
                watchId = navigator.geolocation.watchPosition(
                    position => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        
                        // Pegar a direção (heading) para onde o celular/carro está apontando
                        if (position.coords.heading !== null && !isNaN(position.coords.heading)) {
                            currentHeading = position.coords.heading;
                        }

                        // Atualizar posição do pino
                        userMarker.setLngLat([currentLng, currentLat]);

                        // Se estiver navegando, a câmera persegue o pino de forma rotacionada (3D)
                        if (isNavigating) {
                            map.easeTo({
                                center: [currentLng, currentLat],
                                bearing: currentHeading, // Gira o mapa apontando pra frente
                                pitch: 60, // Inclinação 3D
                                zoom: 18,
                                duration: 1000
                            });
                        }
                    },
                    error => console.warn('Erro GPS:', error),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        // --- 4. Controles da Interface ---
        function toggleNavigation() {
            const btn = document.getElementById('btn-start');
            const destInput = document.getElementById('destination').value;

            if (!isNavigating) {
                if (destInput.trim() === '') {
                    alert("Por favor, digite um destino primeiro!");
                    return;
                }
                // INICIAR ROTA
                isNavigating = true;
                btn.innerHTML = '<i class="fa-solid fa-times"></i> Encerrar Rota';
                btn.classList.add('active');
                
                // Mudar perspectiva para Navegação 3D "Reto para cima"
                map.flyTo({
                    center: [currentLng, currentLat],
                    zoom: 18,
                    pitch: 60, // Tilted view
                    bearing: currentHeading,
                    essential: true
                });

                // Aqui você chamaria o Capacitor LocalNotifications para avisar que a rota iniciou
                enviarNotificacaoCapacitor("Rota Iniciada", `Navegando para: ${destInput}`);

            } else {
                // PARAR ROTA
                isNavigating = false;
                btn.innerHTML = '<i class="fa-solid fa-route"></i> Iniciar Rota';
                btn.classList.remove('active');
                
                // Voltar para visão 2D plana
                map.flyTo({
                    center: [currentLng, currentLat],
                    zoom: 15,
                    pitch: 0,
                    bearing: 0
                });
            }
        }

        function recenterMap() {
            const zoomLevel = isNavigating ? 18 : 15;
            const pitchLevel = isNavigating ? 60 : 0;
            
            map.flyTo({
                center: [currentLng, currentLat],
                zoom: zoomLevel,
                pitch: pitchLevel,
                bearing: isNavigating ? currentHeading : 0,
                essential: true
            });
        }

        function syncOfflineMaps() {
            // Lógica para o botão de download
            const btn = document.querySelector('.btn-sync');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Baixando...';
            
            // Simulação de download de mapa para o @capacitor/filesystem
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Mapas Atualizados';
                btn.style.background = '#34C759'; // Fica verde
                
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Sincronizar';
                    btn.style.background = 'var(--primary-color)';
                }, 3000);
            }, 2500);
        }

        function openMenu() {
            alert("Menu de Configurações do GPS.");
        }

        // Função helper para enviar notificação (Capacitor)
        async function enviarNotificacaoCapacitor(titulo, texto) {
            if (window.Capacitor && window.Capacitor.Plugins.LocalNotifications) {
                await window.Capacitor.Plugins.LocalNotifications.schedule({
                    notifications: [
                        {
                            title: titulo,
                            body: texto,
                            id: new Date().getTime(),
                            schedule: { at: new Date(Date.now() + 1000) }
                        }
                    ]
                });
            }
        }
    </script>
</body>
</html>
