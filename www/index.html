<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Michael Jackson Runner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Arial Black',Arial,sans-serif;touch-action:none;}
  canvas{display:block;}
  #hud{position:fixed;top:0;left:0;width:100%;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none;}
  .pill{background:rgba(10,5,25,.7);border:2px solid rgba(255,255,255,.35);border-radius:22px;padding:6px 14px;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 2px 4px #000;backdrop-filter:blur(6px);font-size:15px;display:flex;align-items:center;gap:6px;}
  #scoreHud{flex-direction:column;align-items:center;padding:5px 18px;}
  #scoreHud .lbl{font-size:9px;color:#ffcc00;letter-spacing:2px;}
  #scoreHud .val{font-size:22px;line-height:1;}
  #coinHud{color:#ffd700;}
  #distHud{color:#00e5ff;}
  #speedHud{color:#ff44ff;}
  #pauseBtn{pointer-events:all;background:linear-gradient(#ffcc00,#ff8800);border:3px solid #fff;border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer;color:#000;box-shadow:0 4px 0 #aa5500;font-weight:900;}
  #pauseBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #aa5500;}
  .hud-c{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .hud-r{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  #announce{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%) scale(0);color:#ff00aa;font-size:34px;font-weight:900;letter-spacing:2px;text-shadow:0 0 25px #ff00aa,4px 4px 0 #000;z-index:9;pointer-events:none;text-align:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
  #announce.show{transform:translate(-50%,-50%) scale(1);}
  #announce .sub{display:block;font-size:16px;color:#fff;margin-top:4px;}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,0,0,.4) 100%);}
  #flash.on{opacity:1;}
  #rocketHud{position:fixed;top:80px;left:50%;transform:translateX(-50%) scale(0);z-index:9;background:linear-gradient(180deg,#ff8800,#cc4400);border:3px solid #fff;border-radius:30px;padding:8px 22px;font-weight:900;color:#fff;font-size:18px;letter-spacing:1px;text-shadow:0 2px 4px #000;box-shadow:0 0 30px #ff8800;transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
  #rocketHud.show{transform:translateX(-50%) scale(1);}
  #rocketHud .time{color:#ffee00;}
  .screen{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at center,#2a0055 0%,#0a0015 70%,#000 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;color:#fff;text-align:center;overflow-y:auto;}
  .screen h1{font-size:30px;letter-spacing:2px;line-height:1.1;margin-bottom:12px;background:linear-gradient(180deg,#fff 0%,#ffcc00 50%,#ff00ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px #ff00ff);}
  .screen h2{font-size:26px;letter-spacing:2px;margin-bottom:8px;background:linear-gradient(180deg,#fff,#ff3333);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 25px #ff0000);}
  .screen p{font-size:13px;color:#b0b0c0;margin:4px 0;font-family:Arial,sans-serif;}
  .mj-emoji{font-size:50px;margin-bottom:6px;}
  .stats{background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 22px;margin:10px 0;}
  .stats .row{display:flex;justify-content:space-between;gap:28px;font-size:14px;margin:5px 0;font-family:Arial,sans-serif;}
  .stats .row .k{color:#999;}
  .stats .row .v{color:#ffcc00;font-weight:900;font-family:'Arial Black',sans-serif;}
  .btn{margin-top:14px;padding:14px 42px;background:linear-gradient(180deg,#ffcc00,#ff8800);border:4px solid #fff;border-radius:50px;font-size:18px;font-weight:900;letter-spacing:2px;cursor:pointer;color:#000;box-shadow:0 7px 0 #aa5500,0 0 35px rgba(255,180,0,.6);font-family:'Arial Black',sans-serif;}
  .btn:active{transform:translateY(4px);box-shadow:0 3px 0 #aa5500;}
  .hidden{display:none !important;}
  .controls{margin-top:14px;font-size:11px;color:#888;font-family:Arial,sans-serif;line-height:1.8;}
  .controls kbd{background:#222;border:1px solid #555;border-radius:4px;padding:2px 6px;font-family:monospace;color:#ffcc00;}
  #cryingCanvas { width: 200px; height: 240px; margin: 4px auto; display: block; }
</style>
</head>
<body>

<div id="hud">
  <button id="pauseBtn">⏸</button>
  <div class="hud-c">
    <div class="pill" id="scoreHud"><div><div class="lbl">SCORE</div><div class="val" id="scoreVal">0</div></div></div>
    <div class="pill" id="distHud">📏 <span id="distVal">0</span> m</div>
  </div>
  <div class="hud-r">
    <div class="pill" id="coinHud">🪙 <span id="coinVal">0</span></div>
    <div class="pill" id="speedHud">⚡ x<span id="speedVal">1.0</span></div>
  </div>
</div>

<div id="rocketHud">🚀 VOANDO: <span class="time" id="rocketTime">8</span>s</div>
<div id="announce"></div>
<div id="flash"></div>

<div class="screen" id="startScreen">
  <span class="mj-emoji">🕺</span>
  <h1>MICHAEL JACKSON<br>SUBWAY RUN</h1>
  <p>Desvie dos trens, barreiras e tubarões 🦈</p>
  <p>Pegue o <strong>foguete 🚀</strong> e voe 8s!</p>
  <button class="btn" id="startBtn">▶ CORRER</button>
  <div class="controls">
    <kbd>←</kbd><kbd>→</kbd> mover &nbsp; <kbd>↑</kbd> pular &nbsp; <kbd>↓</kbd> deslizar
  </div>
</div>

<div class="screen hidden" id="gameOverScreen">
  <h2 id="goTitle">GAME OVER</h2>
  <canvas id="cryingCanvas" width="400" height="480"></canvas>
  <div class="stats">
    <div class="row"><span class="k">Score</span><span class="v" id="fScore">0</span></div>
    <div class="row"><span class="k">Distância</span><span class="v" id="fDist">0 m</span></div>
    <div class="row"><span class="k">Moedas</span><span class="v" id="fCoins">0</span></div>
    <div class="row"><span class="k">Recorde</span><span class="v" id="fBest">0</span></div>
  </div>
  <button class="btn" id="restartBtn">🔄 DE NOVO</button>
</div>

<div class="screen hidden" id="pauseScreen">
  <h1>⏸ PAUSADO</h1>
  <button class="btn" id="resumeBtn">▶ CONTINUAR</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// ROSTO — usa foto se PHOTO_URL for definido, senão desenha
// ============================================================
const PHOTO_URL = '';  // ⬅️ COLE A URL DA SUA FOTO AQUI (opcional)

const faceCanvas = document.createElement('canvas');
faceCanvas.width = 256;
faceCanvas.height = 256;
const faceCtx = faceCanvas.getContext('2d');

function drawFallbackFace() {
  const ctx = faceCtx;
  const w = 256, h = 256, cx = 128, cy = 128;
  ctx.clearRect(0, 0, w, h);

  // Pele
  const g = ctx.createRadialGradient(cx, cy - 10, 20, cx, cy, 120);
  g.addColorStop(0, '#d8a878');
  g.addColorStop(1, '#a87850');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 5, 88, 100, 0, 0, Math.PI*2);
  ctx.fill();

  // Cabelo
  ctx.fillStyle = '#1a1410';
  ctx.beginPath();
  ctx.ellipse(cx, cy - 70, 90, 55, 0, Math.PI, 0);
  ctx.fill();

  // Sobrancelhas
  ctx.beginPath();
  ctx.ellipse(cx - 33, cy - 18, 22, 7, -0.15, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 33, cy - 18, 22, 7, 0.15, 0, Math.PI*2);
  ctx.fill();

  // Olhos
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx - 33, cy + 5, 17, 11, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 33, cy + 5, 17, 11, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a2010';
  ctx.beginPath(); ctx.arc(cx - 33, cy + 5, 9, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 33, cy + 5, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx - 33, cy + 5, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 33, cy + 5, 5, 0, Math.PI*2); ctx.fill();

  // Nariz
  ctx.strokeStyle = '#8a5838';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx, cy + 10);
  ctx.lineTo(cx - 6, cy + 35);
  ctx.quadraticCurveTo(cx, cy + 43, cx + 6, cy + 35);
  ctx.stroke();

  // Bigode
  ctx.fillStyle = '#1a1410';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 53, 26, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // Boca
  ctx.fillStyle = '#a05850';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 65, 20, 8, 0, 0, Math.PI*2);
  ctx.fill();
}

function initFace() {
  if (PHOTO_URL) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      faceCtx.clearRect(0, 0, 256, 256);
      faceCtx.drawImage(img, 0, 0, img.width, img.height, 0, 0, 256, 256);
      if (window._faceMat) {
        window._faceMat.map = new THREE.CanvasTexture(faceCanvas);
        window._faceMat.map.needsUpdate = true;
        window._faceMat.needsUpdate = true;
      }
    };
    img.onerror = () => {
      console.warn('Erro ao carregar foto, usando fallback');
      drawFallbackFace();
    };
    img.src = PHOTO_URL;
  } else {
    drawFallbackFace();
  }
}
drawFallbackFace();
initFace();

const faceTexture = new THREE.CanvasTexture(faceCanvas);

// ============================================================
// 😭 PERSONAGEM CHORANDO NA TELA DE GAME OVER
// ============================================================
const cCanvas = document.getElementById('cryingCanvas');
const cctx = cCanvas.getContext('2d');

function renderCrying() {
  const W = cCanvas.width;
  const H = cCanvas.height;
  cctx.clearRect(0, 0, W, H);

  // Céu pôr-do-sol
  const sky = cctx.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#2a1a4a');
  sky.addColorStop(0.4, '#c84a6a');
  sky.addColorStop(0.7, '#f08858');
  sky.addColorStop(1, '#ffcc66');
  cctx.fillStyle = sky;
  cctx.fillRect(0, 0, W, H * 0.55);

  // Sol
  cctx.fillStyle = '#ffdd44';
  cctx.beginPath();
  cctx.arc(W / 2, H * 0.55, 50, Math.PI, 0);
  cctx.fill();

  // Mar
  const sea = cctx.createLinearGradient(0, H * 0.55, 0, H * 0.72);
  sea.addColorStop(0, '#f08858');
  sea.addColorStop(0.4, '#4a8aba');
  sea.addColorStop(1, '#1a4a7a');
  cctx.fillStyle = sea;
  cctx.fillRect(0, H * 0.55, W, H * 0.17);

  // Areia
  const sand = cctx.createLinearGradient(0, H * 0.72, 0, H);
  sand.addColorStop(0, '#f0d8a0');
  sand.addColorStop(1, '#c8a868');
  cctx.fillStyle = sand;
  cctx.fillRect(0, H * 0.72, W, H * 0.28);

  const cx = W / 2;
  const bodyY = H * 0.82;

  // Sombra
  cctx.fillStyle = 'rgba(0,0,0,0.3)';
  cctx.beginPath();
  cctx.ellipse(cx, bodyY + 10, 70, 14, 0, 0, Math.PI*2);
  cctx.fill();

  // Pernas
  cctx.fillStyle = '#e0b088';
  cctx.strokeStyle = '#000';
  cctx.lineWidth = 2;
  cctx.beginPath();
  cctx.moveTo(cx - 30, bodyY - 60);
  cctx.lineTo(cx - 70, bodyY + 5);
  cctx.lineTo(cx - 55, bodyY + 12);
  cctx.lineTo(cx - 20, bodyY - 50);
  cctx.closePath();
  cctx.fill(); cctx.stroke();

  cctx.beginPath();
  cctx.moveTo(cx + 30, bodyY - 60);
  cctx.lineTo(cx + 70, bodyY + 5);
  cctx.lineTo(cx + 55, bodyY + 12);
  cctx.lineTo(cx + 20, bodyY - 50);
  cctx.closePath();
  cctx.fill(); cctx.stroke();

  // Torso
  cctx.beginPath();
  cctx.ellipse(cx, bodyY - 80, 50, 65, 0, 0, Math.PI*2);
  cctx.fill();
  cctx.stroke();

  // Biquíni sutiã
  cctx.fillStyle = '#ee2233';
  cctx.beginPath();
  cctx.ellipse(cx - 20, bodyY - 105, 22, 16, -0.15, 0, Math.PI*2);
  cctx.fill();
  cctx.stroke();
  cctx.beginPath();
  cctx.ellipse(cx + 20, bodyY - 105, 22, 16, 0.15, 0, Math.PI*2);
  cctx.fill();
  cctx.stroke();

  // Calcinha
  cctx.beginPath();
  cctx.moveTo(cx - 42, bodyY - 30);
  cctx.lineTo(cx + 42, bodyY - 30);
  cctx.lineTo(cx + 30, bodyY - 5);
  cctx.lineTo(cx - 30, bodyY - 5);
  cctx.closePath();
  cctx.fill();
  cctx.stroke();

  // Bolinhas
  cctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) {
    const bx = cx - 30 + (i % 3) * 30;
    const by = bodyY - 22 + Math.floor(i / 3) * 10;
    cctx.beginPath();
    cctx.arc(bx, by, 2.5, 0, Math.PI*2);
    cctx.fill();
  }

  // Braços cobrindo o rosto
  cctx.fillStyle = '#e0b088';
  cctx.beginPath();
  cctx.moveTo(cx - 45, bodyY - 105);
  cctx.quadraticCurveTo(cx - 65, bodyY - 160, cx - 35, bodyY - 190);
  cctx.lineTo(cx - 12, bodyY - 182);
  cctx.quadraticCurveTo(cx - 40, bodyY - 145, cx - 25, bodyY - 95);
  cctx.closePath();
  cctx.fill(); cctx.stroke();

  cctx.beginPath();
  cctx.moveTo(cx + 45, bodyY - 105);
  cctx.quadraticCurveTo(cx + 65, bodyY - 160, cx + 35, bodyY - 190);
  cctx.lineTo(cx + 12, bodyY - 182);
  cctx.quadraticCurveTo(cx + 40, bodyY - 145, cx + 25, bodyY - 95);
  cctx.closePath();
  cctx.fill(); cctx.stroke();

  // Cabeça (com a foto do rosto)
  const headY = bodyY - 220;
  const headW = 110;
  const headH = 125;

  cctx.save();
  cctx.beginPath();
  cctx.ellipse(cx, headY, headW/2, headH/2, 0, 0, Math.PI*2);
  cctx.closePath();
  cctx.clip();
  cctx.drawImage(faceCanvas, cx - headW/2, headY - headH/2, headW, headH);
  cctx.restore();

  // Contorno da cabeça
  cctx.strokeStyle = '#000';
  cctx.lineWidth = 3;
  cctx.beginPath();
  cctx.ellipse(cx, headY, headW/2, headH/2, 0, 0, Math.PI*2);
  cctx.stroke();

  // Sobrancelhas tristes
  cctx.strokeStyle = '#000';
  cctx.lineWidth = 5;
  cctx.lineCap = 'round';
  cctx.beginPath();
  cctx.moveTo(cx - 32, headY - 20);
  cctx.lineTo(cx - 10, headY - 28);
  cctx.stroke();
  cctx.beginPath();
  cctx.moveTo(cx + 32, headY - 20);
  cctx.lineTo(cx + 10, headY - 28);
  cctx.stroke();

  // Boca aberta chorando
  cctx.fillStyle = '#5a1810';
  cctx.beginPath();
  cctx.ellipse(cx, headY + 40, 18, 14, 0, 0, Math.PI*2);
  cctx.fill();
  cctx.strokeStyle = '#000';
  cctx.lineWidth = 2;
  cctx.stroke();
  cctx.fillStyle = '#fff';
  cctx.fillRect(cx - 12, headY + 30, 24, 5);
  cctx.fillRect(cx - 12, headY + 46, 24, 3);

  // Lágrimas animadas
  const t = Date.now() / 400;
  cctx.fillStyle = '#44bbee';
  for (let i = 0; i < 6; i++) {
    const lx = cx - 35 + i * 14;
    const ly = headY + 15 + ((t + i * 0.5) % 3) * 25;
    const alpha = 1 - ((t + i * 0.5) % 3) / 3;
    cctx.globalAlpha = alpha;
    cctx.beginPath();
    cctx.moveTo(lx, ly);
    cctx.quadraticCurveTo(lx + 5, ly + 10, lx, ly + 18);
    cctx.quadraticCurveTo(lx - 5, ly + 10, lx, ly);
    cctx.fill();
  }
  cctx.globalAlpha = 1;

  requestAnimationFrame(renderCrying);
}
renderCrying();

// ============================================================
// CONFIG
// ============================================================
const LANE_W = 2.4;
const LANES = [-LANE_W, 0, LANE_W];
const GRAVITY = -60;
const JUMP_FORCE = 19;
const SLIDE_TIME = 0.55;
const BASE_SPEED = 22;
const MAX_SPEED = 60;
const RESET_Z = 20;
const SPAWN_Z = -140;
const ROCKET_TIME = 8;

// ============================================================
// CENA
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec8e3);
scene.fog = new THREE.Fog(0x9cd0e8, 55, 155);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 250);
camera.position.set(0, 5.5, 9);
camera.lookAt(0, 1.5, -8);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// Luzes
scene.add(new THREE.AmbientLight(0xffffff, 0.95));
const dirL = new THREE.DirectionalLight(0xffffff, 1.1);
dirL.position.set(8, 25, 8);
scene.add(dirL);
scene.add(new THREE.HemisphereLight(0xa8d8ff, 0x3a2a1a, 0.5));

// ============================================================
// MATERIAIS
// ============================================================
const M = {
  street: new THREE.MeshLambertMaterial({ color: 0xd8c8b0 }),
  sidewalk: new THREE.MeshLambertMaterial({ color: 0xe8dcc8 }),
  bld1: new THREE.MeshLambertMaterial({ color: 0xe86a3a }),
  bld2: new THREE.MeshLambertMaterial({ color: 0xf0c860 }),
  bld3: new THREE.MeshLambertMaterial({ color: 0xe8d8b8 }),
  bld4: new THREE.MeshLambertMaterial({ color: 0xc85a4a }),
  window: new THREE.MeshLambertMaterial({ color: 0x2a2a3a }),
  railMetal: new THREE.MeshStandardMaterial({ color: 0x9090b0, metalness: 0.9, roughness: 0.25 }),
  sleeper: new THREE.MeshLambertMaterial({ color: 0x6a4a2a }),
  treeTrunk: new THREE.MeshLambertMaterial({ color: 0x7a4a2a }),
  palmLeaf: new THREE.MeshLambertMaterial({ color: 0x5a9a3a }),
  trainRed: new THREE.MeshLambertMaterial({ color: 0xdd2222 }),
  trainBlue: new THREE.MeshLambertMaterial({ color: 0x2288dd }),
  trainYellow: new THREE.MeshLambertMaterial({ color: 0xffcc22 }),
  trainDark: new THREE.MeshLambertMaterial({ color: 0x1a1a1a }),
  barrierYellow: new THREE.MeshLambertMaterial({ color: 0xffcc22 }),
  barrierBlack: new THREE.MeshLambertMaterial({ color: 0x0a0a0a }),
  holeBlack: new THREE.MeshBasicMaterial({ color: 0x000000 }),
  water: new THREE.MeshLambertMaterial({ color: 0x22aadd, transparent: true, opacity: 0.85 }),
  sharkBody: new THREE.MeshPhongMaterial({ color: 0x1a3a5a, shininess: 30 }),
  sharkBelly: new THREE.MeshPhongMaterial({ color: 0xcfd8e0, shininess: 40 }),
  sharkThroat: new THREE.MeshBasicMaterial({ color: 0x550000 }),
  sharkTeeth: new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 80 }),
  sharkEyeW: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  sharkEyeB: new THREE.MeshBasicMaterial({ color: 0x000000 }),
  sharkFin: new THREE.MeshPhongMaterial({ color: 0x152e46 }),
  coin: new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xaa6600, emissiveIntensity: 0.7, metalness: 0.8, roughness: 0.2 }),
  coinRing: new THREE.MeshBasicMaterial({ color: 0xfff066 }),
  mjSkin: new THREE.MeshLambertMaterial({ color: 0xe0b890 }),
  mjBlack: new THREE.MeshLambertMaterial({ color: 0x0a0a0a }),
  mjWhite: new THREE.MeshLambertMaterial({ color: 0xffffff }),
  mjBlue: new THREE.MeshLambertMaterial({ color: 0x2255cc }),
  shadow: new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4 }),
  faceMat: new THREE.MeshBasicMaterial({ map: faceTexture, transparent: true }),
  rocketBody: new THREE.MeshPhongMaterial({ color: 0x4a6a9a, shininess: 90 }),
  rocketNose: new THREE.MeshPhongMaterial({ color: 0xe83a2a, shininess: 70 }),
  rocketFin: new THREE.MeshPhongMaterial({ color: 0xd82a1a, shininess: 60 }),
  rocketRing: new THREE.MeshPhongMaterial({ color: 0x2a3a5a, shininess: 80 }),
  rocketGlass: new THREE.MeshPhongMaterial({ color: 0x0a0a1a, shininess: 120 }),
  rocketNozzle: new THREE.MeshPhongMaterial({ color: 0x2a2a3a, shininess: 60 }),
  flame1: new THREE.MeshBasicMaterial({ color: 0xff4400 }),
  flame2: new THREE.MeshBasicMaterial({ color: 0xff8800 }),
  flame3: new THREE.MeshBasicMaterial({ color: 0xffdd44 }),
  flame4: new THREE.MeshBasicMaterial({ color: 0xffffff })
};

// ============================================================
// PISTA
// ============================================================
const SEG_LEN = 5;
const SEG_COUNT = 30;
const segments = [];

function makeSegment(z) {
  const g = new THREE.Group();
  g.position.z = z;

  const street = new THREE.Mesh(new THREE.PlaneGeometry(12, SEG_LEN), M.street);

function createBuilding(x, z, w, h, mat) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, 5), mat);
  body.position.y = h / 2;
  g.add(body);

  const facingX = x > 0 ? -1 : 1;
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.9), M.window);
      win.position.x = facingX * (w / 2 + 0.01);
      win.position.y = 1.5 + r * 1.8;
      win.position.z = -1.5 + c * 1.5;
      win.rotation.y = facingX > 0 ? Math.PI/2 : -Math.PI/2;
      g.add(win);
    }
  }
  scene.add(g);
  buildings.push(g);
}

function createShark() {
  const shark = new THREE.Group();

  const head = new THREE.Mesh(new THREE.ConeGeometry(1.0, 2.4, 8), M.sharkBody);
  head.rotation.x = Math.PI;
  head.position.y = 1.2;
  shark.add(head);

  const vL = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.8, 4), M.sharkBody);
  vL.position.set(-0.55, 1.3, 0);
  vL.rotation.z = 0.35;
  vL.rotation.x = Math.PI;
  shark.add(vL);
  const vR = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.8, 4), M.sharkBody);
  vR.position.set(0.55, 1.3, 0);
  vR.rotation.z = -0.35;
  vR.rotation.x = Math.PI;
  shark.add(vR);

  const throat = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 8, 0, Math.PI*2, 0, Math.PI/2), M.sharkThroat);
  throat.rotation.x = -Math.PI/2;
  throat.position.set(0, 0.9, 0.3);
  shark.add(throat);

  const toothGeo = new THREE.ConeGeometry(0.11, 0.32, 4);
  for (let i = 0; i < 7; i++) {
    const t = new THREE.Mesh(toothGeo, M.sharkTeeth);
    const angle = -Math.PI/2 + (i / 6) * Math.PI;
    const r = 0.72;
    t.position.set(Math.cos(angle) * r, 1.0 + Math.sin(angle) * r * 0.35, 0.7);
    t.rotation.x = Math.PI;
    shark.add(t);
  }
  for (let i = 0; i < 7; i++) {
    const t = new THREE.Mesh(toothGeo, M.sharkTeeth);
    const angle = Math.PI/2 + (i / 6) * Math.PI;
    const r = 0.72;
    t.position.set(Math.cos(angle) * r, 0.6 + Math.sin(angle) * r * 0.35, 0.7);
    shark.add(t);
  }

  const eWL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), M.sharkEyeW);
  eWL.position.set(-0.55, 1.6, 0.55);
  shark.add(eWL);
  const eWR = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), M.sharkEyeW);
  eWR.position.set(0.55, 1.6, 0.55);
  shark.add(eWR);
  const pL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), M.sharkEyeB);
  pL.position.set(-0.55, 1.6, 0.68);
  shark.add(pL);
  const pR = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), M.sharkEyeB);
  pR.position.set(0.55, 1.6, 0.68);
  shark.add(pR);

  const belly = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 12, 8, 0, Math.PI*2, Math.PI * 0.7, Math.PI * 0.3),
    M.sharkBelly
  );
  belly.position.set(0, 0.5, 0.2);
  belly.scale.set(1, 0.6, 0.6);
  shark.add(belly);

  return shark;
}

function updateHUD() {
  $score.textContent = Math.floor(state.score);
  $dist.textContent = Math.floor(state.distance);
  $coin.textContent = state.coinsCollected;
  $speed.textContent = (state.speed / BASE_SPEED).toFixed(1);
  if (state.flying) {
    $rocketHud.classList.add('show');
    $rocketTime.textContent = Math.ceil(state.flyTimer);
  } else {
    $rocketHud.classList.remove('show');
  }
}

function announce(main, sub = '') {
  $announce.innerHTML = main + (sub ? `<span class="sub">${sub}</span>` : '');
  $announce.classList.add('show');
  clearTimeout(announce._t);
  announce._t = setTimeout(() => $announce.classList.remove('show'), 1400);
}

// INPUT
function moveLeft() { if (state.running && !state.paused && state.targetLane > 0) state.targetLane--; }
function moveRight() { if (state.running && !state.paused && state.targetLane < 2) state.targetLane++; }
function doJump() {
  if (!state.running || state.paused || state.flying) return;
  if (state.onGround) {
    state.velocityY = JUMP_FORCE;
    state.onGround = false;
    state.sliding = false;
    player.scale.y = 1;
  }
}
function doSlide() {
  if (!state.running || state.paused || state.flying) return;
  if (state.onGround) {
    state.sliding = true;
    state.slideTimer = SLIDE_TIME;
  } else {
    state.velocityY = -28;
  }
}

addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': e.preventDefault(); moveLeft(); break;
    case 'ArrowRight': case 'KeyD': e.preventDefault(); moveRight(); break;
    case 'ArrowUp': case 'Space': case 'KeyW': e.preventDefault(); doJump(); break;
    case 'ArrowDown': case 'KeyS': e.preventDefault(); doSlide(); break;
    case 'KeyP': case 'Escape': togglePause(); break;
  }
});

let tStart = null;
addEventListener('touchstart', (e) => {
  if (!state.running || state.paused) return;
  tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
addEventListener('touchend', (e) => {
  if (!tStart || !state.running || state.paused) return;
  const dx = e.changedTouches[0].clientX - tStart.x;
  const dy = e.changedTouches[0].clientY - tStart.y;
  const dt = Date.now() - tStart.t;
  if (Math.abs(dx) < 30 && Math.abs(dy) < 30 && dt < 300) doJump();
  else if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30) moveRight(); else if (dx < -30) moveLeft();
  } else {
    if (dy < -30) doJump(); else if (dy > 30) doSlide();
  }
  tStart = null;
}, { passive: true });

// Telas
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const pauseScreen = document.getElementById('pauseScreen');
const goTitle = document.getElementById('goTitle');

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;
document.getElementById('pauseBtn').onclick = togglePause;
document.getElementById('resumeBtn').onclick = togglePause;

function togglePause() {
  if (!state.running) return;
  state.paused = !state.paused;
  pauseScreen.classList.toggle('hidden', !state.paused);
}

function startGame() {
  state.running = true;
  state.paused = false;
  state.score = 0;
  state.coinsCollected = 0;
  state.distance = 0;
  state.speed = BASE_SPEED;
  state.targetLane = 1;
  state.currentX = 0;
  state.velocityY = 0;
  state.onGround = true;
  state.sliding = false;
  state.slideTimer = 0;
  state.spawnTimer = 0;
  state.coinTimer = 0;
  state.rocketTimer = 0;
  state.spawnInterval = 1.1;
  state.coinInterval = 1.4;
  state.rocketInterval = 12;
  state.legPhase = 0;
  state.lastMilestone = 0;
  state.moonwalkActive = false;
  state.danceTimer = 0;
  state.flying = false;
  state.flyTimer = 0;

  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);
  player.scale.set(1, 1, 1);
  player.visible = true;
  rocket.visible = false;

  obstacles.forEach(o => scene.remove(o));
  obstacles.length = 0;
  coins.forEach(c => scene.remove(c));
  coins.length = 0;
  powerups.forEach(p => scene.remove(p));
  powerups.length = 0;

  segments.forEach((s, i) => s.position.z = SPAWN_Z + i * SEG_LEN);
  buildings.forEach((b, i) => {
    b.position.z = SPAWN_Z + Math.floor(i / 2) * BLD_SEG + (i % 2 === 1 ? 5 : 0);
  });
  trees.forEach((t, i) => {
    t.position.z = SPAWN_Z + Math.floor(i / 2) * 14 + (i % 2 === 0 ? 3 : 10);
  });

  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
  updateHUD();
}

function gameOver(reason = 'GAME OVER') {
  state.running = false;
  goTitle.textContent = reason;
  if (state.score > state.bestScore) {
    state.bestScore = Math.floor(state.score);
    localStorage.setItem('mj_v8_best', state.bestScore);
  }
  document.getElementById('fScore').textContent = Math.floor(state.score);
  document.getElementById('fDist').textContent = Math.floor(state.distance) + ' m';
  document.getElementById('fCoins').textContent = state.coinsCollected;
  document.getElementById('fBest').textContent = state.bestScore;
  gameOverScreen.classList.remove('hidden');
}

function checkCollision(obs) {
  if (state.flying) return false;
  const ud = obs.userData;
  const px = player.position.x;
  const py = player.position.y;
  const pz = player.position.z;
  const pW = 0.7;
  const pH = state.sliding ? 1.1 : 2.85;
  const pD = 0.7;
  const halfW = ud.w / 2;
  const halfD = ud.d / 2;
  if (Math.abs(px - obs.position.x) > (pW/2 + halfW)) return false;
  if (Math.abs(pz - obs.position.z) > (pD/2 + halfD)) return false;
  if (py > ud.h || py + pH < 0) return false;
  return true;
}

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);
  const rand = Math.random();
  let type, obs, sizes;
  if (rand < 0.5) {
    type = 'train'; obs = createTrain(); sizes = { w: 2.4, h: 3.6, d: 7 };
  } else if (rand < 0.8) {
    type = 'barrier'; obs = createBarrier(); sizes = { w: 2.9, h: 2.4, d: 0.5 };
  } else {
    type = 'hole'; obs = createHole(); sizes = { w: 2.6, h: 2.5, d: 2.6 };
  }
  obs.position.set(LANES[lane], 0, SPAWN_Z);
  obs.userData = Object.assign({ type, ...sizes, lane, hit: false }, obs.userData);
  scene.add(obs);
  obstacles.push(obs);
}

// ============================================================
// LOOP
// ============================================================
const clock = new THREE.Clock();
let skyTime = 0;

function update(delta) {
  state.speed = Math.min(MAX_SPEED, BASE_SPEED + Math.floor(state.distance / 500) * 3);
  state.score += delta * state.speed * 0.7;
  state.distance += delta * state.speed;

  if (!state.moonwalkActive && state.distance >= 100) {
    state.moonwalkActive = true;
    announce('MOONWALK! 🚶‍♂️', 'A partir de 100m');
  }

  const milestone = Math.floor(state.distance / 1000);
  if (milestone > state.lastMilestone) {
    state.lastMilestone = milestone;
    state.spawnInterval = Math.max(0.5, 1.1 - milestone * 0.12);
    state.danceTimer = 1.8;
    const dances = ['SPIN! 💫', 'MOONWALK! 🚶‍♂️', 'ANTI-GRAVITY! 🌟', 'ROBOT! 🤖', 'SOUL TRAIN! 🚂'];
    announce(`${milestone * 1000}m! 🎉`, dances[milestone % 5]);
    $flash.classList.add('on');
    setTimeout(() => $flash.classList.remove('on'), 500);
  }

  const targetX = LANES[state.targetLane];
  state.currentX += (targetX - state.currentX) * Math.min(1, delta * 12);

  if (state.flying) {
    state.flyTimer -= delta;
    player.visible = false;
    rocket.visible = true;
    rocket.position.set(state.currentX, 5, 0);
    rocket.rotation.set(-0.25, 0, 0);
    if (state.flyTimer <= 0) {
      state.flying = false;
      announce('POUSOU! 🌍');
      player.position.set(state.currentX, 5, 0);
      state.velocityY = 0;
      state.onGround = false;
      player.visible = true;
      rocket.visible = false;
    }
  } else {
    player.visible = true;
    rocket.visible = false;
    player.position.x = state.currentX;
    player.rotation.y = (targetX - state.currentX) * -0.15;
    player.rotation.z = (targetX - state.currentX) * -0.3;

    if (!state.onGround) {
      state.velocityY += GRAVITY * delta;
      player.position.y += state.velocityY * delta;
      if (player.position.y <= 0) {
        player.position.y = 0;
        state.velocityY = 0;
        state.onGround = true;
      }
    }

    if (state.sliding) {
      state.slideTimer -= delta;
      player.scale.y = 0.55;
      if (state.slideTimer <= 0) {
        state.sliding = false;
        player.scale.y = 1;
      }
    }

    state.legPhase += delta * state.speed * 0.7;
    const swing = Math.sin(state.legPhase) * 0.7;
    legL.rotation.x = swing;
    legR.rotation.x = -swing;
    armL.rotation.x = -swing * 0.75;
    armR.rotation.x = swing * 0.75;
    torso.rotation.z = Math.sin(state.legPhase * 2) * 0.05;
  }

  if (state.danceTimer > 0) state.danceTimer -= delta;

  const moveZ = state.speed * delta;

  for (const s of segments) {
    s.position.z += moveZ;
    if (s.position.z > RESET_Z) s.position.z -= SEG_LEN * SEG_COUNT;
  }
  for (const b of buildings) {
    b.position.z += moveZ;
    if (b.position.z > RESET_Z + 10) b.position.z -= BLD_SEG * BLD_COUNT;
  }
  for (const t of trees) {
    t.position.z += moveZ;
    if (t.position.z > RESET_Z + 5) t.position.z -= 14 * 10;
  }

  state.spawnTimer += delta;
  if (state.spawnTimer >= state.spawnInterval) {
    state.spawnTimer = 0;
    spawnObstacle();
  }
  state.coinTimer += delta;
  if (state.coinTimer >= state.coinInterval) {
    state.coinTimer = 0;
    spawnCoin(state.flying);
  }
  state.rocketTimer += delta;
  if (!state.flying && state.rocketTimer >= state.rocketInterval) {
    state.rocketTimer = 0;
    state.rocketInterval = 14 + Math.random() * 8;
    spawnRocketPowerup();
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.position.z += moveZ;
    if (obs.userData.type === 'hole' && obs.userData.shark) {
      const z = obs.position.z;
      const shark = obs.userData.shark;
      let targetY = -3.5;
      if (z > -35 && z < 3) {
        const progress = Math.min(1, Math.max(0, (z + 35) / 35));
        targetY = -3.5 + Math.pow(progress, 1.6) * 6;
        if (z > -5) targetY = 2.5;
      }
      shark.position.y += (targetY - shark.position.y) * Math.min(1, delta * 6);
      shark.rotation.z = Math.sin(skyTime * 4 + obs.userData.sharkPhase) * 0.1;
    }
    if (obs.position.z > RESET_Z + 10) {
      scene.remove(obs);
      obstacles.splice(i, 1);
      continue;
    }
    if (!obs.userData.hit && checkCollision(obs)) {
      let reason = 'GAME OVER';
      if (obs.userData.type === 'hole') reason = '🦈 COMIDO PELO TUBARÃO!';
      else if (obs.userData.type === 'train') reason = '🚂 ATROPELADO PELO TREM!';
      else reason = '🚧 BATEU NA BARREIRA!';
      gameOver(reason);
      return;
    }
  }

  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.position.z += moveZ;
    c.rotation.z += delta * 8;
    if (c.position.z > RESET_Z + 5) {
      scene.remove(c);
      coins.splice(i, 1);
      continue;
    }
    const refX = state.flying ? rocket.position.x : player.position.x;
    const refY = state.flying ? rocket.position.y + 1 : player.position.y + 1.5;
    const dx = refX - c.position.x;
    const dy = refY - c.position.y;
    const dz = -c.position.z;
    const radius = state.flying ? 9 : 2.4;
    if (dx*dx + dy*dy + dz*dz < radius) {
      state.coinsCollected++;
      state.score += 15;
      scene.remove(c);
      coins.splice(i, 1);
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.position.z += moveZ;
    p.userData.phase += delta * 4;
    p.rotation.y += delta * 2;
    p.position.y = 1.6 + Math.sin(p.userData.phase) * 0.3;
    if (p.userData.aura) {
      const s = 1 + Math.sin(p.userData.phase * 2) * 0.15;
      p.userData.aura.scale.set(s, s, 1);
    }
    if (p.position.z > RESET_Z + 5) {
      scene.remove(p);
      powerups.splice(i, 1);
      continue;
    }
    const dx = player.position.x - p.position.x;
    const dy = (player.position.y + 1.5) - p.position.y;
    const dz = -p.position.z;
    if (!state.flying && dx*dx + dy*dy + dz*dz < 2.5) {
      scene.remove(p);
      powerups.splice(i, 1);
      state.flying = true;
      state.flyTimer = ROCKET_TIME;
      state.velocityY = 0;
      state.sliding = false;
      player.scale.y = 1;
      announce('🚀 FOGUETE!', `${ROCKET_TIME}s voando!`);
      $flash.classList.add('on');
      setTimeout(() => $flash.classList.remove('on'), 500);
    }
  }

  updateHUD();
}

function updateCamera(delta) {
  const targetY = state.flying ? 8 : player.position.y * 0.3 + 5.2;
  const tx = player.position.x * 0.55;
  camera.position.x += (tx - camera.position.x) * Math.min(1, delta * 5);
  camera.position.y += (targetY - camera.position.y) * Math.min(1, delta * 4);
  camera.position.z = 9;
  const lookY = state.flying ? 6 : player.position.y * 0.35 + 1.6;
  camera.lookAt(player.position.x * 0.35, lookY, -8);
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  if (state.running && !state.paused) update(delta);

  // Atualiza nuvens/pássaros se tiver
  skyTime += delta;

  updateCamera(delta);
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
