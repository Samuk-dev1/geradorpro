  async shareBackup() {
    const backup = Actions.buildBackup();
    const txt = JSON.stringify(backup);
    const ok = await NativeBridge.share({ title: 'Backup VendasPro', text: txt });
    if (!ok) {
      try { await navigator.clipboard.writeText(txt); toast('Backup copiado!', 'success'); }
      catch (e) { toast('Não foi possível compartilhar.', 'error'); }
    }
  },

  importBackup() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.onchange = () => {
      const file = inp.files && inp.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !data.dados || !Array.isArray(data.dados.sales)) {
            toast('Arquivo de backup inválido.', 'error');
            return;
          }
          const ok = await confirmDlg({
            title: 'Restaurar backup',
            message: 'Os dados atuais serão substituídos pelos dados do arquivo. Deseja continuar?',
            confirmText: 'Restaurar'
          });
          if (!ok) return;

          await Store.clearAll();
          const d = data.dados;
          for (const c of (d.customers || [])) await Store.put('customers', c);
          for (const s of (d.sales || [])) await Store.put('sales', s);
          for (const p of (d.payments || [])) await Store.put('payments', p);
          for (const p of (d.products || [])) await Store.put('products', p);
          if (d.settings) await Store.put('settings', { id: 'app', data: d.settings });
          if (typeof d.counter === 'number') await Store.put('meta', { id: 'saleCounter', value: d.counter });

          await reloadData();
          applyTheme();
          await Notif.rescheduleNotifications();
          toast('Backup restaurado com sucesso!', 'success');
          go('dashboard');
        } catch (e) {
          console.error(e);
          toast('Arquivo de backup inválido.', 'error');
        }
      };
      reader.readAsText(file);
    };
    inp.click();
  },

  async wipeData() {
    const ok1 = await confirmDlg({
      title: 'Apagar todos os dados',
      message: 'Todos os clientes, vendas, pagamentos e configurações serão removidos permanentemente. Deseja continuar?',
      confirmText: 'Continuar',
      danger: true
    });
    if (!ok1) return;
    const ok2 = await confirmDlg({
      title: 'Confirmação final',
      message: 'Esta ação NÃO pode ser desfeita. Tem absoluta certeza?',
      confirmText: 'Apagar tudo',
      danger: true
    });
    if (!ok2) return;

    const pend = State.sales.map((s) => s.id);
    for (const id of pend) await Notif.cancelDueDateNotification(id);

    await Store.clearAll();
    State.settings = defaultSettings();
    await saveSettings();
    await reloadData();
    applyTheme();
    toast('Todos os dados foram apagados.', 'info');
    go('dashboard');
    setTimeout(showOnboarding, 500);
  },

  /* ---------- Relatórios ---------- */
  exportCSV() {
    const range = reportRange(State.ui.reportPeriod);
    const list = State.sales.filter((s) => !s.excluida && s.dataVenda >= range.from && s.dataVenda <= range.to);
    const rows = [['Numero', 'Data', 'Cliente', 'Telefone', 'Tipo', 'Forma', 'Subtotal', 'Desconto', 'Total', 'Pago', 'Pendente', 'Vencimento', 'Status']];
    list.forEach((s) => {
      const st = s.valorPendente > 0 ? statusInfo(s) : { label: 'Pago' };
      rows.push([
        s.numeroVenda,
        fmtDate(s.dataVenda),
        s.clienteNome,
        maskPhone(s.clienteTelefone),
        s.tipoVenda === 'fiado' ? 'Fiado' : 'À vista',
        s.formaPagamento || '',
        (s.subtotal / 100).toFixed(2).replace('.', ','),
        (s.desconto / 100).toFixed(2).replace('.', ','),
        (s.total / 100).toFixed(2).replace('.', ','),
        (s.valorPago / 100).toFixed(2).replace('.', ','),
        (s.valorPendente / 100).toFixed(2).replace('.', ','),
        s.dataVencimento ? fmtDate(s.dataVencimento) : '',
        st.label
      ]);
    });
    const csv = rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
    downloadFile('vendaspro-relatorio-' + todayISO() + '.csv', '\ufeff' + csv, 'text/csv');
    toast('CSV exportado!', 'success');
  },

  exportJSON() {
    const range = reportRange(State.ui.reportPeriod);
    const list = State.sales.filter((s) => !s.excluida && s.dataVenda >= range.from && s.dataVenda <= range.to);
    downloadFile('vendaspro-vendas-' + todayISO() + '.json', JSON.stringify(list, null, 2), 'application/json');
    toast('JSON exportado!', 'success');
  }
};

/* ============================== ARQUIVOS ============================== */
function downloadFile(name, content, mime) {
  try {
    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
  } catch (e) {
    toast('Não foi possível gerar o arquivo.', 'error');
  }
}

/* ============================== PERSISTÊNCIA ============================== */
async function saveSettings() {
  await Store.put('settings', { id: 'app', data: State.settings });
}

async function nextSaleNumber() {
  State.counter = (State.counter || 0) + 1;
  await Store.put('meta', { id: 'saleCounter', value: State.counter });
  return State.counter;
}

async function upsertCustomer(nome, telefone) {
  if (!nome) return;
  const existing = State.customers.find((c) => normText(c.nome) === normText(nome));
  if (existing) {
    if (telefone && phoneDigits(existing.telefone) !== phoneDigits(telefone)) {
      existing.telefone = telefone;
      await Store.put('customers', existing);
    }
    return existing;
  }
  const cust = {
    id: uid(),
    nome: nome,
    telefone: telefone || '',
    observacao: '',
    dataCriacao: Date.now(),
    arquivado: false
  };
  await Store.put('customers', cust);
  return cust;
}

async function reloadData() {
  State.customers = await Store.getAll('customers');
  State.sales = await Store.getAll('sales');
  State.payments = await Store.getAll('payments');
  State.products = await Store.getAll('products');
  const meta = await Store.get('meta', 'saleCounter');
  State.counter = meta ? meta.value : 0;

  // Sincroniza contador com o maior número existente
  const maxNum = State.sales.reduce((m, s) => Math.max(m, s.numero || 0), 0);
  if (maxNum > State.counter) {
    State.counter = maxNum;
    await Store.put('meta', { id: 'saleCounter', value: maxNum });
  }
}

/* ============================== TEMA ============================== */
function applyTheme() {
  const t = (State.settings && State.settings.tema) || 'auto';
  let dark = false;
  if (t === 'dark') dark = true;
  else if (t === 'auto') {
    try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { dark = false; }
  }
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#070b16' : '#4f46e5');
}

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  if (Actions[act]) {
    e.preventDefault();
    try { Actions[act](id, el); } catch (err) { console.error('Ação ' + act + ':', err); toast('Ocorreu um erro.', 'error'); }
  }
});

// Inputs do formulário de venda
document.addEventListener('input', function (e) {
  const t = e.target;

  if (t.id === 'f-telefone') {
    const pos = t.selectionStart;
    const before = t.value.length;
    t.value = maskPhone(t.value);
    const after = t.value.length;
    try { t.setSelectionRange(pos + (after - before), pos + (after - before)); } catch (err) {}
    return;
  }

  if (t.id === 'search-fiados') {
    State.ui.fiadosSearch = t.value;
    refreshList('fiados-list', fiadosListHTML);
    return;
  }
  if (t.id === 'search-sales') {
    State.ui.salesSearch = t.value;
    refreshList('sales-list', salesListHTML);
    return;
  }

  if (t.dataset && t.dataset.pf) {
    const row = t.closest('.prod-row');
    if (!row || !State.form) return;
    const idx = parseInt(row.dataset.idx, 10);
    const p = State.form.products[idx];
    if (!p) return;
    if (t.dataset.pf === 'nome') p.nome = t.value;
    else if (t.dataset.pf === 'qtd') p.qtd = Math.max(0, parseInt(t.value, 10) || 0);
    else if (t.dataset.pf === 'valor') p.valor = parseMoney(t.value);
    const sub = row.querySelector('.subtotal');
    if (sub) sub.textContent = fmtMoney((p.qtd || 0) * (p.valor || 0));
    recalcTotals();
    return;
  }

  if (t.id === 'f-desconto' || t.id === 'f-entrada') {
    if (!State.form) return;
    if (t.id === 'f-desconto') State.form.desconto = parseMoney(t.value);
    if (t.id === 'f-entrada') State.form.entrada = parseMoney(t.value);
    recalcTotals();
    return;
  }
});

// Autocomplete de cliente e produto
document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.id === 'f-cliente') {
    const found = State.customers.find((c) => normText(c.nome) === normText(t.value));
    if (found && found.telefone) {
      const tel = $('#f-telefone');
      if (tel && !tel.value.trim()) {
        tel.value = maskPhone(found.telefone);
        if (State.form) State.form.clienteTelefone = phoneDigits(found.telefone);
        toast('Telefone preenchido automaticamente.', 'info');
      }
    }
    return;
  }
  if (t.dataset && t.dataset.pf === 'nome') {
    const prod = Data.productByName(t.value);
    if (prod) {
      const row = t.closest('.prod-row');
      if (row) {
        const val = row.querySelector('[data-pf="valor"]');
        if (val && (!val.value || parseMoney(val.value) === 0)) {
          val.value = centsToInput(prod.preco);
          const idx = parseInt(row.dataset.idx, 10);
          if (State.form && State.form.products[idx]) State.form.products[idx].valor = prod.preco;
          const sub = row.querySelector('.subtotal');
          const p = State.form.products[idx];
          if (sub && p) sub.textContent = fmtMoney((p.qtd || 0) * (p.valor || 0));
          recalcTotals();
        }
      }
    }
    return;
  }
  if (t.id === 'n-ativas') { /* tratado no botão salvar */ }
});

// Enter em campos de login/diálogos
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    const root = $('#modal-root');
    if (root && root.querySelector('.modal-backdrop')) closeModal();
  }
});

// Tema automático
try {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    if (State.settings && State.settings.tema === 'auto') applyTheme();
  });
} catch (e) { /* ignore */ }

/* ============================== AÇÕES DE ONBOARDING ============================== */
Actions.finishOnboarding = async function () {
  const loja = $('#ob-loja') ? $('#ob-loja').value.trim() : '';
  const wa = $('#ob-wa') ? phoneDigits($('#ob-wa').value) : '';
  const pix = $('#ob-pix') ? $('#ob-pix').value.trim() : '';
  State.settings.loja.nome = loja || 'Minha Loja';
  State.settings.loja.whatsapp = wa;
  State.settings.pix.chave = pix;
  State.settings.onboardingFeito = true;
  await saveSettings();
  closeModal();
  render();
  setTimeout(showNotifIntro, 400);
};

Actions.skipOnboarding = async function () {
  State.settings.onboardingFeito = true;
  await saveSettings();
  closeModal();
  render();
};

Actions.enableNotifsOnboarding = async function () {
  State.settings.notificacoes.ativadas = true;
  await saveSettings();
  const r = await Notif.requestNotificationPermission();
  if (r === 'granted') {
    await Notif.createChannel();
    await Notif.rescheduleNotifications();
    toast('Notificações ativadas!', 'success');
  } else if (r === 'unsupported') {
    toast('Notificações nativas estarão disponíveis no APK.', 'info');
  } else {
    toast('Permissão negada. Você pode ativar depois nas configurações.', 'info');
  }
  closeModal();
  render();
};

Actions.skipNotifsOnboarding = async function () {
  State.settings.onotificacoes = State.settings.notificacoes;
  State.settings.notificacoes.ativadas = false;
  await saveSettings();
  closeModal();
  render();
};

/* ============================== BOOT ============================== */
async function boot() {
  await Store.init();

  const rawSettings = await Store.get('settings', 'app');
  State.settings = rawSettings && rawSettings.data
    ? deepMerge(defaultSettings(), rawSettings.data)
    : defaultSettings();
  if (!State.settings.mensagens) State.settings.mensagens = defaultMessages();

  await reloadData();
  applyTheme();

  render();

  if (!State.settings.onboardingFeito && !State.sales.length && !State.customers.length) {
    setTimeout(showOnboarding, 350);
  } else {
    // Reagenda notificações silenciosamente
    setTimeout(function () { Notif.rescheduleNotifications(); }, 1200);
  }

  // Ajusta quando a data muda (virada de dia) — recalcula status
  let lastDay = todayISO();
  setInterval(function () {
    const d = todayISO();
    if (d !== lastDay) {
      lastDay = d;
      render();
    }
  }, 60000);
}

document.addEventListener('DOMContentLoaded', boot);
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  boot();
}
</script>
