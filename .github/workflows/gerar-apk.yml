name: Gerar APK — Gestor IPTV Profissional
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'GestorIPTV'
      enviou_logo:
        description: 'Usuário enviou logo?'
        required: false
        default: 'nao'
      enviou_som:
        description: 'Usuário enviou som de notificação?'
        required: false
        default: 'nao'
      nome_arquivo_som:
        description: 'Nome do arquivo de som (ex: notificacao.ogg)'
        required: false
        default: ''
      enviou_zip:
        description: 'Usuário enviou projeto ZIP completo?'
        required: false
        default: 'nao'
      versao:
        description: 'Versão do App (ex: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Baixar código do projeto
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚡ Cache Gradle (acelera compilação)
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Preparar Ambiente e Gerar Projeto
      run: |
        # ==========================================
        # 📦 OPÇÃO 1: Se usuário enviou ZIP do projeto
        # ==========================================
        ENVIOU_ZIP="${{ github.event.inputs.enviou_zip }}"
        
        if [ "$ENVIOU_ZIP" = "sim" ]; then
          echo "📦 Usuário enviou ZIP do projeto..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "✅ ZIP encontrado: $ZIP_FILE"
            mkdir -p projeto_zip
            unzip -q "$ZIP_FILE" -d projeto_zip
            cp -r projeto_zip/* ./ 2>/dev/null || true
            cp -r projeto_zip/.* ./ 2>/dev/null || true
            echo "✅ ZIP extraído com sucesso!"
          else
            echo "⚠️ Nenhum arquivo ZIP encontrado na raiz!"
          fi
        fi

        # ==========================================
        # 📦 Inicializa projeto npm
        # ==========================================
        npm init -y
        
        npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5 \
          @capacitor/local-notifications@5

        # Cria pasta www e copia o arquivo único index.html
        mkdir -p www
        
        if [ -f index.html ]; then
          cp index.html www/index.html
          echo "✅ Arquivo index.html copiado com sucesso!"
        else
          echo "⚠️ Arquivo index.html não encontrado! Crie o arquivo na raiz do repositório."
          exit 1
        fi

        # Limpa logo se não foi enviada
        ENVIOU_LOGO="${{ github.event.inputs.enviou_logo }}"
        if [ "$ENVIOU_LOGO" = "nao" ]; then
          echo "Nenhuma logo enviada — usando padrão..."
          rm -f logo.png
        fi

        APP_NAME="${{ github.event.inputs.app_name }}"
        VERSAO="${{ github.event.inputs.versao }}"
        
        # Gera ID único a partir do nome
        APP_ID=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')
        if [ -z "$APP_ID" ]; then
          APP_ID="app"
        fi

        # Inicializa Capacitor
        npx cap init "$APP_NAME" com.gestoriptv.$APP_ID --web-dir www
        npx cap add android

        # ==========================================
        # 🔧 ATUALIZA PARA ANDROID NOVO (resolve aviso "versão antiga")
        # ==========================================
        BUILD_GRADLE="android/app/build.gradle"
        if [ -f "$BUILD_GRADLE" ]; then
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' "$BUILD_GRADLE"
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/' "$BUILD_GRADLE"
          echo "✅ Android atualizado para SDK 34 (versão nova)"
        fi

        # Aplica nome personalizado no Android
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_FILE" ]; then
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" "$STRINGS_FILE"
        fi

        # Processa logo personalizada se existir
        if [ -f logo.png ]; then
          echo "🎨 Logo encontrada! Otimizando..."
          sudo apt-get update && sudo apt-get install -y imagemagick > /dev/null 2>&1

          mkdir -p android/app/src/main/res/mipmap-mdpi
          convert logo.png -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert logo.png -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-hdpi
          convert logo.png -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          convert logo.png -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          convert logo.png -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert logo.png -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert logo.png -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          find android/app/src/main/res/ -name "ic_launcher.xml" -delete
          find android/app/src/main/res/ -name "ic_launcher_round.xml" -delete
        fi

        # ==========================================
        # 🔊 CONFIGURAR SOM DE NOTIFICAÇÃO
        # ==========================================
        ENVIOU_SOM="${{ github.event.inputs.enviou_som }}"
        NOME_SOM="${{ github.event.inputs.nome_arquivo_som }}"
        
        mkdir -p android/app/src/main/res/raw
        
        SOM_USADO=""
        
        if [ "$ENVIOU_SOM" = "sim" ] && [ -n "$NOME_SOM" ] && [ -f "$NOME_SOM" ]; then
          echo "🔊 Som personalizado encontrado: $NOME_SOM"
          EXTENSAO="${NOME_SOM##*.}"
          cp "$NOME_SOM" "android/app/src/main/res/raw/notificacao.$EXTENSAO"
          SOM_USADO="notificacao.$EXTENSAO"
          echo "✅ Som copiado!"
        
        elif [ -d "assets" ]; then
          SOM_ASSETS=$(find assets -type f \( -name "*.mp3" -o -name "*.ogg" -o -name "*.wav" \) | head -1)
          if [ -n "$SOM_ASSETS" ]; then
            echo "🔊 Som encontrado na pasta assets: $SOM_ASSETS"
            EXTENSAO="${SOM_ASSETS##*.}"
            cp "$SOM_ASSETS" "android/app/src/main/res/raw/notificacao.$EXTENSAO"
            SOM_USADO="notificacao.$EXTENSAO"
          fi
        fi
        
        if [ -n "$SOM_USADO" ]; then
          echo "⚙️ Configurando Capacitor para usar som: $SOM_USADO"
          printf '{\n  "appId": "com.gestoriptv.%s",\n  "appName": "%s",\n  "webDir": "www",\n  "plugins": {\n    "LocalNotifications": {\n      "smallIcon": "ic_stat_icon_config_sample",\n      "iconColor": "#00A8E1",\n      "sound": "%s",\n      "importance": "high",\n      "priority": "high",\n      "vibrate": true,\n      "ongoing": false,\n      "autoCancel": true\n    }\n  }\n}\n' "$APP_ID" "$APP_NAME" "$SOM_USADO" > capacitor.config.json
        fi

        # ==========================================
        # 🔑 PERMISSÕES NO ANDROIDMANIFEST
        # ==========================================
        MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_FILE" ]; then
          sed -i '/<manifest/ a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST_FILE"
          sed -i '/<manifest/ a \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' "$MANIFEST_FILE"
          sed -i '/<manifest/ a \    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' "$MANIFEST_FILE"
          sed -i '/<manifest/ a \    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST_FILE"
          sed -i '/<manifest/ a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_FILE"
          sed -i '/<manifest/ a \    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST_FILE"
          sed -i '/<manifest/ a \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' "$MANIFEST_FILE"
        fi

        # Sincroniza tudo
        npx cap sync android

    - name: 🔐 Preparar chave de assinatura
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "🔑 Chave de assinatura encontrada! Preparando..."
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          
          cat > android/keystore.properties << EOF
storeFile=release-key.jks
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF
          
          # Configura build.gradle para assinar automaticamente
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i '/android {/a \    signingConfigs {\n        release {\n            def keystorePropertiesFile = rootProject.file("keystore.properties")\n            def keystoreProperties = new Properties()\n            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n        }\n    }' "$BUILD_GRADLE"
            
            sed -i 's/release {/release {\n            signingConfig signingConfigs.release/' "$BUILD_GRADLE"
          fi
          
          echo "✅ Assinatura configurada!"
        else
          echo "ℹ️ Nenhuma chave de assinatura configurada nos secrets. Gerando APK sem assinatura."
        fi

    - name: 🏗️ Compilar APK
      run: |
        cd android
        if [ -f keystore.properties ]; then
          ./gradlew assembleRelease
        else
          ./gradlew assembleDebug
        fi

    - name: 📦 Renomear e organizar APK
      run: |
        APP_NAME="${{ github.event.inputs.app_name }}"
        VERSAO="${{ github.event.inputs.versao }}"
        NOME_LIMPO=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')
        
        mkdir -p apk-final
        
        if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
          cp android/app/build/outputs/apk/release/app-release.apk "apk-final/${NOME_LIMPO}-v${VERSAO}-assinado.apk"
          echo "✅ APK ASSINADO pronto: ${NOME_LIMPO}-v${VERSAO}-assinado.apk"
        else
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-final/${NOME_LIMPO}-v${VERSAO}.apk"
          echo "✅ APK pronto: ${NOME_LIMPO}-v${VERSAO}.apk"
        fi

    - name: 📤 Disponibilizar APK (Apaga em 2 dias)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}-v${{ github.event.inputs.versao }}-APK
        path: apk-final/*.apk
        retention-days: 2

    # =================================================================
    # 🧹 ETAPA FINAL: FAXINA AUTOMÁTICA
    # =================================================================
    - name: 🧹 Limpar arquivos temporários do repositório
      if: always()
      run: |
        git config --global user.name "GitHub-Actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        echo "🗑️ Apagando arquivos temporários..."
        rm -f *.zip
        rm -f logo.png
        rm -f *.mp3 *.ogg *.wav
        rm -f index.html
        
        git add -A
        git diff --staged --quiet || git commit -m "🧹 Faxina automática [skip ci]"
        git push || echo "✅ Repositório já está limpo!"
