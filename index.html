  // ============================================
  // LOCALSTORAGE - 100% OFFLINE
  // ============================================
  function carregarDados() {
    try {
      const clientes = localStorage.getItem('gc_clientes');
      const config = localStorage.getItem('gc_config');
      const logado = localStorage.getItem('gc_logado');
      
      if (clientes) {
        state.clientes = JSON.parse(clientes);
      } else {
        state.clientes = [...CLIENTES_INICIAIS];
        salvarClientes();
      }
      
      if (config) {
        state.config = {...CONFIG_PADRAO, ...JSON.parse(config)};
      } else {
        salvarConfig();
      }
      
      if (logado === 'true') {
        state.usuarioLogado = true;
        state.tela = 'principal';
      }
    } catch(e) {
      state.clientes = [...CLIENTES_INICIAIS];
    }
  }

  function salvarClientes() {
    localStorage.setItem('gc_clientes', JSON.stringify(state.clientes));
  }

  function salvarConfig() {
    localStorage.setItem('gc_config', JSON.stringify(state.config));
  }

  // ============================================
  // NOTIFICAÇÕES
  // ============================================
  async function pedirPermissaoNotificacoes() {
    if (!('Notification' in window)) {
      mostrarToast('Navegador não suporta notificações');
      return false;
    }
    if (Notification.permission === 'granted') {
      state.config.notificacoesAtivadas = true;
      salvarConfig();
      return true;
    }
    if (Notification.permission !== 'denied') {
      const permissao = await Notification.requestPermission();
      if (permissao === 'granted') {
        state.config.notificacoesAtivadas = true;
        salvarConfig();
        mostrarToast('Notificações ativadas!');
        return true;
      }
    }
    return false;
  }

  function tocarSomNotificacao() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const ganho = ctx.createGain();
      osc.connect(ganho);
      ganho.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      ganho.gain.setValueAtTime(0.3, ctx.currentTime);
      ganho.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
      
      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        const ganho2 = ctx.createGain();
        osc2.connect(ganho2);
        ganho2.connect(ctx.destination);
        osc2.frequency.value = 1100;
        osc2.type = 'sine';
        ganho2.gain.setValueAtTime(0.3, ctx.currentTime);
        ganho2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc2.start(ctx.currentTime);
        osc2.stop(ctx.currentTime + 0.2);
      }, 150);
    } catch(e) {}
  }

  function enviarNotificacao(titulo, corpo) {
    if (state.config.notificacoesAtivadas && Notification.permission === 'granted') {
      new Notification(titulo, {
        body: corpo,
        icon: state.config.logo || '',
        badge: ''
      });
      tocarSomNotificacao();
    }
  }

  function testarNotificacao() {
    pedirPermissaoNotificacoes().then(ok => {
      if (ok) {
        enviarNotificacao(state.config.nomeApp, 'Notificação funcionando perfeitamente!');
        mostrarToast('Notificação de teste enviada!');
      } else {
        mostrarToast('Ative as notificações nas configurações');
      }
    });
  }

  // ============================================
  // UTILITÁRIOS
  // ============================================
  function mostrarToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function formatarData(dataStr) {
    if (!dataStr) return '-';
    const d = new Date(dataStr + 'T00:00:00');
    return d.toLocaleDateString('pt-BR');
  }

  function calcularStatus(cliente) {
    if (!cliente.data_vencimento) return 'pendente';
    const hoje = new Date();
    hoje.setHours(0,0,0,0);
    const venc = new Date(cliente.data_vencimento + 'T00:00:00');
    const diff = Math.ceil((venc - hoje) / (1000 * 60 * 60 * 24));
    if (diff < 0) return 'atrasado';
    if (diff <= state.config.diasAvisoVencimento) return 'pendente';
    return 'ativo';
  }

  function getStatusTexto(status) {
    return {ativo:'Em Dia', pendente:'Próximo Venc.', atrasado:'Atrasado'}[status];
  }

  function extrairValor(plano) {
    const match = String(plano).match(/(\d+)/);
    return match ? parseInt(match[1]) : 0;
  }

  function formatarWhatsapp(num) {
    const n = String(num).replace(/\D/g, '');
    if (n.length >= 13) return `+${n.slice(0,2)} (${n.slice(2,4)}) ${n.slice(4,9)}-${n.slice(9)}`;
    if (n.length >= 11) return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;
    return num;
  }

  function abrirWhatsapp(num) {
    const n = String(num).replace(/\D/g, '');
    window.open(`https://wa.me/${n}`, '_blank');
  }

  // ============================================
  // ESTATÍSTICAS
  // ============================================
  function calcularEstatisticas() {
    const total = state.clientes.length;
    let ativos = 0, pendentes = 0, atrasados = 0, receitaTotal = 0;
    
    state.clientes.forEach(c => {
      const status = calcularStatus(c);
      if (status === 'ativo') ativos++;
      else if (status === 'pendente') pendentes++;
      else atrasados++;
      receitaTotal += extrairValor(c.plano);
    });
    
    return {total, ativos, pendentes, atrasados, receitaTotal};
  }

  // ============================================
  // CRUD CLIENTES
  // ============================================
  function salvarCliente(cliente) {
    if (cliente.id) {
      const idx = state.clientes.findIndex(c => c.id === cliente.id);
      if (idx >= 0) state.clientes[idx] = cliente;
    } else {
      cliente.id = Date.now();
      state.clientes.push(cliente);
    }
    salvarClientes();
    render();
    mostrarToast('Cliente salvo com sucesso!');
  }

  function excluirCliente(id) {
    if (confirm('Tem certeza que deseja excluir este cliente?')) {
      state.clientes = state.clientes.filter(c => c.id !== id);
      salvarClientes();
      render();
      mostrarToast('Cliente excluído!');
    }
  }

  function getClientesFiltrados() {
    let lista = [...state.clientes];
    
    if (state.busca) {
      const b = state.busca.toLowerCase();
      lista = lista.filter(c => 
        c.nome.toLowerCase().includes(b) ||
        c.whatsapp.includes(b) ||
        c.usuario.toLowerCase().includes(b) ||
        c.mac.toLowerCase().includes(b) ||
        c.produto.toLowerCase().includes(b)
      );
    }
    
    if (state.filtroStatus !== 'todos') {
      lista = lista.filter(c => calcularStatus(c) === state.filtroStatus);
    }
    
    return lista.sort((a, b) => a.nome.localeCompare(b.nome));
  }

  // ============================================

  function exportarDados() {
    const dados = {
      clientes: state.clientes,
      config: state.config,
      exportadoEm: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(dados, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup_gestorclientes_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    mostrarToast('Backup exportado!');
  }

  function importarDados(arquivo) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const dados = JSON.parse(e.target.result);
        if (dados.clientes && Array.isArray(dados.clientes)) {
          if (confirm(`Importar ${dados.clientes.length} clientes? Isso substituirá os dados atuais.`)) {
            state.clientes = dados.clientes;
            if (dados.config) state.config = {...CONFIG_PADRAO, ...dados.config};
            salvarClientes();
            salvarConfig();
            render();
            mostrarToast('Dados importados com sucesso!');
          }
        }
      } catch(err) {
        mostrarToast('Arquivo inválido!');
      }
    };
    reader.readAsText(arquivo);
  }

          ${icon.plus} Novo Cliente

          </select>
        </div>
      </div>
      
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">
        ${clientes.map(c => {

          return `
          <div class="card cliente-card" style="padding:20px" onclick="app.verCliente(${c.id})">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">
              <div>

            </div>
            
            <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">
              <div style="display:flex;align-items:center;gap:8px;color:var(--muted)">
                ${icon.whatsapp} <span style="color:var(--text)">${formatarWhatsapp(c.whatsapp)}</span>

              ${c.mac ? `<div style="display:flex;align-items:center;gap:8px;color:var(--muted)">${icon.mac} <span style="color:var(--text);font-family:monospace;font-size:12px">${c.mac}</span></div>` : ''}
              <div style="display:flex;align-items:center;gap:8px;color:var(--muted)">
                ${icon.calendar} <span style="color:var(--text)">${formatarData(c.data_vencimento)}</span>

                ${icon.whatsapp} WhatsApp

              <button class="btn-ghost" style="color:var(--accent2)" onclick="app.editarCliente(${c.id})">${icon.edit}</button>
              <button class="btn-ghost" style="color:#f87171" onclick="app.excluirCliente(${c.id})">${icon.trash}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
      
      ${clientes.length === 0 ? `
        <div class="card" style="padding:60px;text-align:center">
          <div style="color:var(--muted);font-size:14px">Nenhum cliente encontrado</div>
        </div>` : ''}
    </div>`;
  }

          <div>

            <input type="date" class="input" name="data_vencimento" value="${c.data_vencimento}" required>
          </div>
          <div>
            <label class="label">Plano / Valor</label>
            <input type="text" class="input" name="plano" value="${c.plano}" placeholder="30 Reais">

          <div>
            <label class="label">Produto</label>

          <div>

            <input type="text" class="input" name="app" value="${c.app}" placeholder="Ibo StechPlay">

            <input type="text" class="input" name="key" value="${c.key}">

          <div style="grid-column:span 2">
            <label class="label">Observação</label>
            <textarea class="input" name="observacao" rows="2" style="resize:vertical">${c.observacao}</textarea>
          </div>
          
          <div style="grid-column:span 2;display:flex;gap:12px;justify-content:flex-end;margin-top:10px">

    if (!c) return '';
    const status = calcularStatus(c);
    
    return `
    <div class="modal-bg" onclick="if(event.target===this)app.fecharVerCliente()">
      <div class="modal-content animate-slide" style="padding:28px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
          <div style="display:flex;align-items:center;gap:16px">
            <div style="width:56px;height:56px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:24px">
              ${c.nome.charAt(0).toUpperCase()}
            </div>
            <div>
              <h3 style="font-size:18px;font-weight:700;margin:0 0 4px">${c.nome}</h3>
              <span class="status-pill status-${status}">${getStatusTexto(status)}</span>
            </div>
          </div>
          <button class="btn-ghost" onclick="app.fecharVerCliente()" style="font-size:20px;padding:4px 10px">✕</button>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">WhatsApp</div>
            <div style="font-weight:500">${formatarWhatsapp(c.whatsapp)}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Vencimento</div>
            <div style="font-weight:500">${formatarData(c.data_vencimento)}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Produto</div>
            <div style="font-weight:500">${c.produto || '-'}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Plano</div>
            <div style="font-weight:500">${c.plano || '-'}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Usuário</div>
            <div style="font-weight:500">${c.usuario || '-'}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Senha</div>
            <div style="font-weight:500">${c.senha || '-'}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Aplicativo</div>
            <div style="font-weight:500">${c.app || '-'}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">MAC Address</div>
            <div style="font-weight:500;font-family:monospace;font-size:13px">${c.mac || '-'}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Key</div>
            <div style="font-weight:500">${c.key || '-'}</div>
          </div>
          <div class="card" style="padding:16px;background:var(--bg)">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">E-mail</div>
            <div style="font-weight:500">${c.email || '-'}</div>
          </div>
          ${c.observacao ? `<div class="card" style="padding:16px;background:var(--bg);grid-column:span 2">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Observação</div>
            <div style="font-weight:500">${c.observacao}</div>
          </div>` : ''}
        </div>
        
        <hr>
        
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <button class="btn-primary" style="display:flex;align-items:center;gap:8px;flex:1" onclick="app.abrirWhatsapp('${c.whatsapp}')">
            ${icon.whatsapp} Abrir WhatsApp
          </button>
          <button class="btn-secondary" style="display:flex;align-items:center;gap:8px" onclick="app.editarCliente(${c.id});app.fecharVerCliente()">
            ${icon.edit} Editar
          </button>
          <button class="btn-secondary" style="color:#f87171;border-color:rgba(248,113,113,.3)" onclick="app.excluirCliente(${c.id});app.fecharVerCliente()">
            ${icon.trash} Excluir
          </button>
        </div>
      </div>
    </div>`;
  }

  // ============================================
  // RENDER - PRINCIPAL
  // ============================================
  function renderPrincipal() {
    let conteudo = '';
    if (state.aba === 'dashboard') conteudo = renderDashboard();
    else if (state.aba === 'clientes') conteudo = renderClientes();
    else if (state.aba === 'configuracoes') conteudo = renderConfiguracoes();
    
    return `
    <div style="display:flex;min-height:100vh">
      <div style="width:240px;background:var(--card);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto" class="scrollbar-thin">
        <div style="padding:0 16px 24px;border-bottom:1px solid var(--border);margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px">
            ${state.config.logo ? 
              `<img src="${state.config.logo}" style="width:40px;height:40px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">` :
              `<div style="width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700">${state.config.nomeApp.charAt(0)}</div>`
            }
            <div>
              <div style="font-weight:700;font-size:14px;line-height:1.2">${state.config.nomeApp}</div>
              <div style="font-size:11px;color:var(--muted)">Painel Admin</div>
            </div>
          </div>
        </div>
        
        <nav style="padding:0 8px;flex:1">
          <div class="nav-item ${state.aba==='dashboard'?'active':''}" onclick="app.irParaAba('dashboard')">
            ${icon.dashboard} Dashboard
          </div>
          <div class="nav-item ${state.aba==='clientes'?'active':''}" onclick="app.irParaAba('clientes')">
            ${icon.users} Clientes
            <span style="margin-left:auto;background:var(--accent-soft);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:10px">${state.clientes.length}</span>
          </div>
          <div class="nav-item ${state.aba==='configuracoes'?'active':''}" onclick="app.irParaAba('configuracoes')">
            ${icon.settings} Configurações
          </div>
        </nav>
        
        <div style="padding:8px;border-top:1px solid var(--border);margin-top:16px">
          <div class="nav-item" onclick="app.logout()" style="color:#f87171">
            ${icon.logout} Sair
          </div>
        </div>
      </div>
      
      <div style="flex:1;padding:28px;overflow-y:auto;min-width:0" class="scrollbar-thin">
        ${conteudo}
      </div>
    </div>
    
    ${renderModalCliente()}
    ${renderVerCliente()}`;
  }

  // ============================================
  // RENDER PRINCIPAL
  // ============================================
  function render() {
    const app = document.getElementById('app');
    if (state.tela === 'login') {
      app.innerHTML = renderLogin();
      setupLoginForm();
    } else {
      app.innerHTML = renderPrincipal();
      setupFormCliente();
    }
    document.title = state.config.nomeApp;
  }

  // ============================================
  // EVENT HANDLERS
  // ============================================
  function setupLoginForm() {
    const form = document.getElementById('loginForm');
    if (form) {
      form.onsubmit = (e) => {
        e.preventDefault();
        const user = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;
        if (user === 'admin' && pass === 'admin123') {
          state.usuarioLogado = true;
          state.tela = 'principal';
          localStorage.setItem('gc_logado', 'true');
          pedirPermissaoNotificacoes();
          render();
        } else {
          mostrarToast('Usuário ou senha incorretos!');
        }
      };
    }
  }

  function setupFormCliente() {
    const form = document.getElementById('formCliente');
    if (form) {
      form.onsubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const cliente = {};
        formData.forEach((v, k) => cliente[k] = v);
        
        if (state.modalAberto !== 'novo') {
          cliente.id = state.modalAberto;
        }
        
        salvarCliente(cliente);
        state.modalAberto = null;
      };
    }
  }

  // ============================================
  // API PÚBLICA
  // ============================================
  window.app = {
    irParaAba: (aba) => { state.aba = aba; render(); },
    setBusca: (v) => { state.busca = v; render(); },
    setFiltro: (v) => { state.filtroStatus = v; render(); },
    novoCliente: () => { state.modalAberto = 'novo'; render(); },
    editarCliente: (id) => { state.modalAberto = id; render(); },
    excluirCliente: (id) => excluirCliente(id),
    verCliente: (id) => { state.clienteSelecionado = id; render(); },
    fecharVerCliente: () => { state.clienteSelecionado = null; render(); },
    fecharModal: () => { state.modalAberto = null; render(); },
    abrirWhatsapp: (num) => abrirWhatsapp(num),
    testarNotificacao: () => testarNotificacao(),
    pedirPermissaoNotificacoes: () => pedirPermissaoNotificacoes().then(render),
    salvarConfig: () => {
      const nome = document.getElementById('cfgNome')?.value || state.config.nomeApp;
      const logo = document.getElementById('cfgLogo')?.value || '';
      const cor = document.getElementById('cfgCor')?.value || state.config.corTema;
      const dias = parseInt(document.getElementById('cfgDias')?.value) || 3;
      
      state.config.nomeApp = nome;
      state.config.logo = logo;
      state.config.corTema = cor;
      state.config.diasAvisoVencimento = dias;
      salvarConfig();
      
      document.documentElement.style.setProperty('--accent', cor);
      document.documentElement.style.setProperty('--accent-soft', cor + '22');
      
      render();
      mostrarToast('Configurações salvas!');
    },
    exportarDados: () => exportarDados(),
    importarDados: (arq) => importarDados(arq),
    logout: () => {
      localStorage.removeItem('gc_logado');
      state.usuarioLogado = false;
      state.tela = 'login';
      render();
    }
  };

  // ============================================
  // INICIALIZAÇÃO
  // ============================================
  carregarDados();
  render();
  
  // Verificar vencimentos periodicamente
  setInterval(() => {
    if (!state.usuarioLogado) return;
    state.clientes.forEach(c => {
      const status = calcularStatus(c);
      if (status === 'pendente' || status === 'atrasado') {
        const hoje = new Date().toDateString();
        const chave = `notif_${c.id}_${hoje}_${status}`;
        if (!localStorage.getItem(chave)) {
          localStorage.setItem(chave, '1');
          if (state.config.notificacoesAtivadas) {
            enviarNotificacao(
              status === 'atrasado' ? 'PAGAMENTO ATRASADO!' : 'Vencimento Próximo',
              `${c.nome} - ${status === 'atrasado' ? 'Cliente com pagamento atrasado!' : 'Vence em breve!'}\nPlano: ${c.plano}`
            );
          }
        }
      }
    });
  }, 60000);

})();
</script>

</body>
</html>
