<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="format-detection" content="telephone=no">
<title>VendasPro — Controle de Vendas</title>
<style>
/* ============================================================
   TEMAS
============================================================ */
:root{
  --bg:#eef2f8;
  --surface:#ffffff;
  --surface-2:#f6f8fc;
  --surface-3:#eef2f9;
  --text:#0f172a;
  --text-2:#3b475c;
  --muted:#7b889d;
  --border:#e4eaf3;
  --primary:#4f46e5;
  --primary-2:#6366f1;
  --primary-soft:#eef2ff;
  --on-primary:#ffffff;
  --green:#059669;
  --green-soft:#e6f7f0;
  --red:#dc2626;
  --red-soft:#fdecec;
  --amber:#c2740a;
  --amber-soft:#fdf3e3;
  --blue:#2563eb;
  --blue-soft:#e8f0fe;
  --gray-soft:#eef1f6;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 2px 8px rgba(15,23,42,.05), 0 14px 32px -14px rgba(15,23,42,.18);
  --shadow-lg:0 24px 60px -18px rgba(15,23,42,.35);
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --bg:#070b16;
  --surface:#131a2b;
  --surface-2:#1a2236;
  --surface-3:#222c45;
  --text:#eef2fb;
  --text-2:#c3cddf;
  --muted:#8b97ad;
  --border:#25304b;
  --primary:#6366f1;
  --primary-2:#818cf8;
  --primary-soft:#1d2444;
  --on-primary:#ffffff;
  --green:#34d399;
  --green-soft:#0e2b25;
  --red:#f87171;
  --red-soft:#301719;
  --amber:#fbbf24;
  --amber-soft:#2e2410;
  --blue:#60a5fa;
  --blue-soft:#132340;
  --gray-soft:#1e2739;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 2px 8px rgba(0,0,0,.4), 0 14px 32px -14px rgba(0,0,0,.7);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.85);
}

/* ============================================================
   BASE
============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter','Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  font-size:15px;line-height:1.45;
}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
::-webkit-scrollbar{width:0;height:0;}
.ic{width:20px;height:20px;flex:0 0 auto;display:block;}

/* ============================================================
   LAYOUT
============================================================ */
#app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  max-width:760px;margin:0 auto;position:relative;
  background:var(--bg);
}
.appbar{
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:30;
  min-height:58px;
}
.appbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.3px;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.appbar .sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px;}
.appbar-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.appbar-actions{display:flex;gap:6px;align-items:center;}
.views{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:16px 16px calc(110px + var(--safe-bottom));
  scroll-behavior:smooth;
}

/* ============================================================
   BOTTOM NAV
============================================================ */
.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:760px;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:8px 4px calc(8px + var(--safe-bottom));
  z-index:40;
  box-shadow:0 -6px 24px -12px rgba(15,23,42,.18);
}
html[data-theme="dark"] .bottomnav{box-shadow:0 -6px 24px -12px rgba(0,0,0,.8);}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px;border-radius:12px;
  color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:-.2px;
  transition:color .18s ease, transform .18s ease;
  min-height:48px;justify-content:center;
}
.nav-btn .ic{width:21px;height:21px;}
.nav-btn:active{transform:scale(.92);}
.nav-btn.active{color:var(--primary);}
.nav-btn.active .ic{stroke-width:2.2;}
.nav-fab{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-size:9.5px;font-weight:600;
}
.nav-fab .fabc{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px -6px rgba(79,70,229,.75);
  transition:transform .18s ease;
  margin-top:-14px;border:3px solid var(--surface);
}
.nav-fab:active .fabc{transform:scale(.9);}
.nav-fab .fabc .ic{width:20px;height:20px;stroke-width:2.6;}

/* ============================================================
   COMPONENTES GERAIS
============================================================ */
.card{
  background:var(--surface);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);
  margin-bottom:14px;
}
.section-title{
  display:flex;align-items:center;justify-content:space-between;
  margin:20px 2px 10px;gap:10px;
}
.section-title h2{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.2px;}
.section-title .link{font-size:12.5px;color:var(--primary);font-weight:600;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:14px;font-weight:650;font-size:14.5px;
  transition:transform .12s ease, filter .18s ease, background .18s ease;
  min-height:48px;letter-spacing:-.2px;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
  box-shadow:0 10px 24px -10px rgba(79,70,229,.85);}
.btn.success{background:linear-gradient(135deg,#059669,#10b981);color:#fff;
  box-shadow:0 10px 24px -10px rgba(16,185,129,.8);}
.btn.danger{background:var(--red);color:#fff;}
.btn.ghost{background:var(--surface-3);color:var(--text-2);}
.btn.outline{background:transparent;border:1.5px solid var(--border);color:var(--text-2);}
.btn.wa{background:linear-gradient(135deg,#128C7E,#25D366);color:#fff;
  box-shadow:0 10px 24px -10px rgba(37,211,102,.8);}
.btn.block{width:100%;}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px;min-height:40px;}
.btn.xs{padding:7px 10px;font-size:12px;border-radius:10px;min-height:34px;gap:5px;}
.btn.xs .ic{width:15px;height:15px;}
.btn:disabled{opacity:.5;pointer-events:none;}

.icon-btn{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);background:var(--surface-3);transition:transform .12s ease;
  flex:0 0 auto;
}
.icon-btn:active{transform:scale(.9);}
.icon-btn.plain{background:transparent;}
.icon-btn.danger{color:var(--red);background:var(--red-soft);}
.icon-btn.wa{color:#25D366;background:var(--green-soft);}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;}
.icon-btn.sm .ic{width:17px;height:17px;}

/* Inputs */
.inp, .sel, .txa{
  width:100%;background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 13px;font-size:15px;
  outline:none;transition:border-color .18s ease, background .18s ease;
  min-height:48px;color:var(--text);
}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--primary);background:var(--surface);}
.txa{min-height:88px;resize:vertical;line-height:1.5;}
.field{margin-bottom:13px;}
.field > label{
  display:block;font-size:12px;font-weight:650;color:var(--muted);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -2px;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  padding:9px 15px;border-radius:999px;background:var(--surface);
  border:1.5px solid var(--border);font-size:13px;font-weight:600;
  color:var(--text-2);white-space:nowrap;transition:all .18s ease;flex:0 0 auto;
}
.chip:active{transform:scale(.95);}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;
  box-shadow:0 6px 16px -8px rgba(79,70,229,.9);}
.chip.opt{display:flex;align-items:center;gap:7px;}
.chip.opt .ic{width:16px;height:16px;}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px;border-radius:8px;font-size:10.5px;font-weight:750;
  letter-spacing:.3px;text-transform:uppercase;
}
.badge.green{background:var(--green-soft);color:var(--green);}
.badge.red{background:var(--red-soft);color:var(--red);}
.badge.amber{background:var(--amber-soft);color:var(--amber);}
.badge.blue{background:var(--blue-soft);color:var(--blue);}
.badge.gray{background:var(--gray-soft);color:var(--muted);}
.badge.purple{background:var(--primary-soft);color:var(--primary);}

/* Empty state */
.empty{
  text-align:center;padding:44px 20px;color:var(--muted);
}
.empty .eico{
  width:74px;height:74px;border-radius:24px;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  color:var(--muted);
}
.empty .eico .ic{width:34px;height:34px;stroke-width:1.6;}
.empty h3{margin:0 0 6px;font-size:15.5px;color:var(--text);font-weight:700;}
.empty p{margin:0 0 16px;font-size:13.5px;line-height:1.5;}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
.stat{
  background:var(--surface);border-radius:var(--radius);padding:14px;
  border:1px solid var(--border);box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
  animation:pop .32s cubic-bezier(.2,.9,.3,1) both;
}
.stat .s-ico{
  width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.stat .s-ico .ic{width:18px;height:18px;}
.stat .s-lbl{font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.2px;text-transform:uppercase;}
.stat .s-val{font-size:19px;font-weight:800;letter-spacing:-.6px;margin-top:3px;line-height:1.15;}
.stat .s-sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500;}
.s-ico.p{background:var(--primary-soft);color:var(--primary);}
.s-ico.g{background:var(--green-soft);color:var(--green);}
.s-ico.r{background:var(--red-soft);color:var(--red);}
.s-ico.a{background:var(--amber-soft);color:var(--amber);}
.s-ico.b{background:var(--blue-soft);color:var(--blue);}

/* List items (sales / fiados) */
.item{
  background:var(--surface);border-radius:var(--radius);padding:14px;
  border:1px solid var(--border);box-shadow:var(--shadow-sm);
  margin-bottom:11px;animation:fadeUp .28s ease both;
  position:relative;overflow:hidden;
}
.item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--muted);
}
.item.t-red::before{background:var(--red);}
.item.t-amber::before{background:var(--amber);}
.item.t-blue::before{background:var(--blue);}
.item.t-green::before{background:var(--green);}
.item.t-gray::before{background:var(--muted);}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.item-name{font-weight:700;font-size:15.5px;letter-spacing:-.2px;line-height:1.25;}
.item-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.item-meta .ic{width:13px;height:13px;}
.item-vals{display:flex;gap:16px;flex-wrap:wrap;margin:9px 0 10px;}
.vblock .v-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:650;letter-spacing:.3px;}
.vblock .v-num{font-size:15px;font-weight:750;letter-spacing:-.3px;}
.vblock .v-num.red{color:var(--red);}
.vblock .v-num.green{color:var(--green);}
.item-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border);}
.prod-line{font-size:12.5px;color:var(--text-2);display:flex;justify-content:space-between;gap:10px;padding:3px 0;}

/* Sale form */
.prod-row{
  background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:11px;margin-bottom:10px;
  animation:fadeUp .25s ease both;
}
.prod-main{display:flex;gap:8px;align-items:center;margin-bottom:9px;}
.prod-main .inp{background:var(--surface);}
.prod-grid{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:end;}
.mini{display:flex;flex-direction:column;gap:4px;}
.mini > span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
.mini .inp{padding:10px;min-height:42px;font-size:14px;background:var(--surface);}
.subtotal{
  min-height:42px;display:flex;align-items:center;justify-content:flex-end;
  font-weight:750;font-size:14.5px;color:var(--primary);padding:0 4px;
}
.totals-box{
  background:var(--surface-2);border-radius:var(--radius-sm);padding:14px;
  border:1.5px dashed var(--border);
}
.total-line{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--text-2);}
.total-line.big{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.6px;
  border-top:1.5px solid var(--border);margin-top:6px;padding-top:11px;}
.total-line .g{color:var(--green);font-weight:700;}
.total-line .r{color:var(--red);font-weight:700;}

/* Segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.seg-btn{
  padding:15px 12px;border-radius:15px;border:2px solid var(--border);
  background:var(--surface-2);font-weight:700;font-size:14px;color:var(--text-2);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:all .18s ease;
}
.seg-btn .ic{width:22px;height:22px;}
.seg-btn:active{transform:scale(.97);}
.seg-btn.active{
  border-color:var(--primary);background:var(--primary-soft);color:var(--primary);
  box-shadow:0 8px 20px -12px rgba(79,70,229,.9);
}

/* Menu list */
.menu-list{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);
  overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:14px;}
.menu-item{
  display:flex;align-items:center;gap:13px;padding:15px 15px;width:100%;
  border-bottom:1px solid var(--border);text-align:left;transition:background .15s ease;
}
.menu-item:last-child{border-bottom:none;}
.menu-item:active{background:var(--surface-3);}
.menu-item .mi-ico{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-3);color:var(--primary);flex:0 0 auto;
}
.menu-item .mi-ico .ic{width:19px;height:19px;}
.menu-item .mi-txt{flex:1;min-width:0;}
.menu-item .mi-t{font-weight:650;font-size:14.5px;letter-spacing:-.2px;}
.menu-item .mi-s{font-size:12px;color:var(--muted);margin-top:1px;}
.menu-item .ic.chev{width:18px;height:18px;color:var(--muted);}

/* Modal */
#modal-root{position:fixed;inset:0;z-index:200;pointer-events:none;}
.modal-backdrop{
  position:absolute;inset:0;background:rgba(8,12,24,.55);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .22s ease;pointer-events:auto;
  padding:0;
}
.modal-backdrop.show{opacity:1;}
.modal{
  background:var(--surface);width:100%;max-width:760px;
  border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;
  transform:translateY(26px) scale(.99);opacity:0;
  transition:transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease;
  padding-bottom:calc(16px + var(--safe-bottom));
  box-shadow:var(--shadow-lg);
}
.modal-backdrop.show .modal{transform:translateY(0) scale(1);opacity:1;}
@media(min-width:700px){
  .modal-backdrop{align-items:center;padding:24px;}
  .modal{border-radius:24px;max-width:560px;}
}
.modal-head{
  padding:20px 20px 12px;display:flex;align-items:flex-start;gap:12px;
  position:sticky;top:0;background:var(--surface);z-index:2;
  border-radius:24px 24px 0 0;
}
.modal-head h3{margin:0;font-size:17.5px;font-weight:750;letter-spacing:-.4px;flex:1;}
.modal-body{padding:0 20px 8px;}
.modal-foot{
  padding:14px 20px calc(6px + var(--safe-bottom));display:flex;gap:10px;
  position:sticky;bottom:0;background:var(--surface);z-index:2;
}
.modal-foot .btn{flex:1;}
.modal-msg{color:var(--text-2);font-size:14px;line-height:1.6;margin:0 0 8px;}
.grabber{width:38px;height:4px;border-radius:99px;background:var(--border);margin:9px auto 0;}

/* Summary rows */
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--border);font-size:14px;}
.sum-row:last-child{border-bottom:none;}
.sum-row .k{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;}
.sum-row .v{font-weight:650;text-align:right;}
.sum-row .v.red{color:var(--red);}
.sum-row .v.green{color:var(--green);}
.sum-box{background:var(--surface-2);border-radius:var(--radius-sm);padding:6px 14px;margin-bottom:14px;}

/* Toast */
.toast-root{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + var(--safe-bottom));z-index:300;
  display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:440px;pointer-events:none;}
.toast{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:11px;
  box-shadow:var(--shadow-lg);font-size:13.8px;font-weight:600;
  transform:translateY(18px);opacity:0;transition:all .3s cubic-bezier(.2,.9,.3,1);
  pointer-events:auto;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast .ti{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.toast .ti .ic{width:16px;height:16px;stroke-width:2.4;}
.toast.success .ti{background:var(--green-soft);color:var(--green);}
.toast.error .ti{background:var(--red-soft);color:var(--red);}
.toast.info .ti{background:var(--blue-soft);color:var(--blue);}

/* Charts */
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding:8px 0 0;}
.cbar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px;}
.cbar-track{width:100%;flex:1;display:flex;align-items:flex-end;background:var(--surface-3);border-radius:8px;overflow:hidden;}
.cbar-fill{width:100%;background:linear-gradient(180deg,var(--primary-2),var(--primary));
  border-radius:8px;transition:height .5s cubic-bezier(.2,.9,.3,1);min-height:3px;}
.cbar-lbl{font-size:9.5px;color:var(--muted);font-weight:650;text-transform:uppercase;}
.cbar-val{font-size:9.5px;color:var(--text-2);font-weight:700;}

.hbar{margin-bottom:11px;}
.hbar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;font-weight:600;}
.hbar-top .lbl{color:var(--text-2);}
.hbar-top .val{color:var(--text);font-weight:700;}
.hbar-track{height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden;}
.hbar-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1);}

/* Switch */

.switch .track{
  position:absolute;inset:0;background:var(--surface-3);border-radius:99px;
  transition:background .22s ease;border:1px solid var(--border);
}
.switch .knob{
  position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);
  transition:transform .22s cubic-bezier(.2,.9,.3,1);
}
.switch input:checked + .track{background:var(--primary);border-color:var(--primary);}

/* ---- Dinheiro: armazenado internamente em CENTAVOS (inteiro) ---- */
function fmtMoney(cents) {
  const v = (Number(cents) || 0) / 100;
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function fmtMoneyShort(cents) {
  const v = (Number(cents) || 0) / 100;
  if (Math.abs(v) >= 1000) return 'R$ ' + (v / 1000).toFixed(1).replace('.', ',') + 'k';
  return 'R$ ' + v.toFixed(0);
}
function parseMoney(str) {
  if (typeof str === 'number') return Math.round(str * 100);
  let s = String(str == null ? '' : str).replace(/[^\d,.-]/g, '').trim();
  if (!s) return 0;
  if (s.indexOf(',') > -1) {
    s = s.replace(/\./g, '').replace(',', '.');
  }
  const n = parseFloat(s);
  if (isNaN(n)) return 0;
  return Math.round(n * 100);
}
function centsToInput(cents) {
  const v = (Number(cents) || 0) / 100;
  return v.toFixed(2).replace('.', ',');

/* ---- Datas: formato interno AAAA-MM-DD (fuso local Brasil) ---- */
function isoOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayISO() { return isoOf(new Date()); }
function parseISO(iso) {
  if (!iso) return null;
  const p = String(iso).split('-');
  if (p.length !== 3) return null;
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0, 0);
}
function fmtDate(iso) {
  const d = parseISO(iso);
  if (!d) return '—';
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}
function fmtDateShort(iso) {
  const d = parseISO(iso);
  if (!d) return '—';
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' +
    d.getFullYear() + ' às ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function addDaysISO(iso, n) {
  const d = parseISO(iso);
  if (!d) return null;
  d.setDate(d.getDate() + n);
  return isoOf(d);
}
/* Diferença em dias inteiros: b - a (positivo => b no futuro) */
function diffDays(aISO, bISO) {
  const a = parseISO(aISO), b = parseISO(bISO);
  if (!a || !b) return 0;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
function monthKey(iso) { return (iso || '').slice(0, 7); }
function todayMonthKey() { return todayISO().slice(0, 7); }

/* ---- Telefone ---- */
function maskPhone(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('55') && d.length > 11) d = d.slice(2);
  d = d.slice(0, 11);
  if (!d) return '';
  if (d.length <= 2) return '(' + d;
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}
function normalizePhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('55') && d.length > 11) d = d.slice(2);
  if (!d) return '';
  return '55' + d;
}
function phoneDigits(p) { return String(p || '').replace(/\D/g, ''); }

/* ---- Texto ---- */
function normText(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function includesQuery(hay, q) { return normText(hay).indexOf(normText(q)) > -1; }
function truncate(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

/* ---- Debounce ---- */
function debounce(fn, ms) {
  let t; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); };
}

/* ============================== STORE (IndexedDB) ============================== */
const DB_NAME = 'vendaspro_db';
const DB_VER = 1;
const STORES = ['customers', 'sales', 'payments', 'products', 'settings', 'meta'];
const LS_KEY = 'vendaspro_ls_v1';

const Store = {
  mode: 'idb',
  db: null,
  ls: { customers: [], sales: [], payments: [], products: [], settings: {}, meta: {} },

  async init() {
    try {
      await new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          STORES.forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
        };
        req.onsuccess = (e) => { Store.db = e.target.result; resolve(); };
        req.onerror = () => reject(req.error || new Error('idb error'));
        req.onblocked = () => reject(new Error('idb blocked'));
        setTimeout(() => { if (!Store.db) reject(new Error('idb timeout')); }, 3000);
      });
      this.mode = 'idb';
    } catch (err) {
      console.warn('[VendasPro] IndexedDB indisponível, usando localStorage.', err);
      this.mode = 'ls';
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) this.ls = Object.assign(this.ls, JSON.parse(raw));
      } catch (e) { /* ignore */ }
    }
    // settings vive com chave fixa 'app'
    if (this.mode === 'ls' && !this.ls.settings) this.ls.settings = {};
    if (this.mode === 'ls' && !this.ls.meta) this.ls.meta = {};
  },

  _persistLS() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.ls)); } catch (e) { console.warn('LS cheio', e); }
  },

  _tx(store, mode) {
    return this.db.transaction(store, mode).objectStore(store);
  },

  put(store, value) {
    if (this.mode === 'ls') {
      const arr = this.ls[store];
      if (Array.isArray(arr)) {
        const i = arr.findIndex((x) => x.id === value.id);
        if (i > -1) arr[i] = value; else arr.push(value);
      } else {
        arr[value.id] = value;
      }
      this._persistLS();
      return Promise.resolve(value);
    }
    return new Promise((res, rej) => {
      const r = this._tx(store, 'readwrite').put(value);
      r.onsuccess = () => res(value);
      r.onerror = () => rej(r.error);
    });
  },

  getAll(store) {
    if (this.mode === 'ls') {
      const v = this.ls[store];
      if (Array.isArray(v)) return Promise.resolve(v.slice());
      return Promise.resolve(Object.values(v || {}));
    }
    return new Promise((res, rej) => {
      const r = this._tx(store, 'readonly').getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  },

  get(store, key) {
    if (this.mode === 'ls') {
      const v = this.ls[store];
      if (Array.isArray(v)) return Promise.resolve(v.find((x) => x.id === key));
      return Promise.resolve((v || {})[key]);
    }
    return new Promise((res, rej) => {
      const r = this._tx(store, 'readonly').get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },

  del(store, key) {
    if (this.mode === 'ls') {
      const v = this.ls[store];
      if (Array.isArray(v)) this.ls[store] = v.filter((x) => x.id !== key);
      else delete v[key];
      this._persistLS();
      return Promise.resolve();
    }
    return new Promise((res, rej) => {
      const r = this._tx(store, 'readwrite').delete(key);
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  },

  clear(store) {
    if (this.mode === 'ls') {
      this.ls[store] = Array.isArray(this.ls[store]) ? [] : {};
      this._persistLS();
      return Promise.resolve();
    }
    return new Promise((res, rej) => {
      const r = this._tx(store, 'readwrite').clear();
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  },

  async clearAll() {
    for (const s of STORES) await this.clear(s);
  }
};

function deepMerge(base, over) {
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  if (!over || typeof over !== 'object') return out;
  Object.keys(over).forEach((k) => {
    const bv = out[k], ov = over[k];
    if (bv && typeof bv === 'object' && !Array.isArray(bv) && ov && typeof ov === 'object' && !Array.isArray(ov)) {
      out[k] = deepMerge(bv, ov);
    } else if (ov !== undefined && ov !== null) {
      out[k] = ov;
    }
  });
  return out;
}

const NativeBridge = {
  capacitor() { return window.Capacitor || null; },
  isNative() {
    const c = this.capacitor();
    if (!c) return false;
    try {
      if (typeof c.isNativePlatform === 'function') return !!c.isNativePlatform();
      return c.platform === 'android' || c.platform === 'ios';
    } catch (e) { return false; }
  },
  platform() {
    const c = this.capacitor();
    return (c && c.platform) ? c.platform : 'web';
  },
  plugin(name) {
    const c = this.capacitor();
    return (c && c.Plugins && c.Plugins[name]) ? c.Plugins[name] : null;
  },
  localNotifications() { return this.plugin('LocalNotifications'); },
  hasLocalNotifications() { return !!this.localNotifications(); },
  async share(payload) {
    const S = this.plugin('Share');
    if (S && S.share) { try { await S.share(payload); return true; } catch (e) { return false; } }
    if (navigator.share) {
      try { await navigator.share(payload); return true; } catch (e) { return false; }
    }
    return false;
  },
  async openUrl(url) {
    const B = this.plugin('Browser');
    if (B && B.open) { try { await B.open({ url }); return; } catch (e) { /* fallback */ } }
    window.open(url, '_blank', 'noopener');
  }
};

/* ============================== NOTIFICAÇÕES ============================== */
/* ATENÇÃO: esta camada está preparada para o plugin @capacitor/local-notifications.
   No navegador o agendamento real NÃO acontece com o app fechado — quem garante
   isso é o serviço nativo do Android dentro do APK. Aqui apenas integramos. */
const Notif = {
  CHANNEL_ID: 'vendaspro_vencimentos',

  notifIdFor(saleId) {
    let h = 0;
    const s = String(saleId);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return (Math.abs(h) % 2147483000) + 1;
  },

  async checkPermission() {
    const LN = NativeBridge.localNotifications();
    if (LN && LN.checkPermissions) {
      try { const r = await LN.checkPermissions(); return r.display || 'prompt'; }
      catch (e) { return 'unsupported'; }
    }
    if (typeof Notification !== 'undefined') return Notification.permission;
    return 'unsupported';
  },

  async requestNotificationPermission() {
    const LN = NativeBridge.localNotifications();
    if (LN && LN.requestPermissions) {
      try { const r = await LN.requestPermissions(); return r.display || 'denied'; }
      catch (e) { return 'denied'; }
    }
    if (typeof Notification !== 'undefined' && Notification.requestPermission) {
      try { return await Notification.requestPermission(); } catch (e) { return 'denied'; }
    }
    return 'unsupported';
  },

  async createChannel() {
    const LN = NativeBridge.localNotifications();
    if (!LN || !LN.createChannel) return false;
    try {
      await LN.createChannel({
        id: this.CHANNEL_ID,
        name: 'Lembretes de vencimento',
        description: 'Avisos de pagamentos fiados próximos do vencimento',
        importance: 5,
        visibility: 1,
        sound: 'default',
        vibration: true,
        lights: true,
        lightColor: '#4F46E5'
      });
      return true;
    } catch (e) { console.warn('createChannel', e); return false; }
  },

  buildBody(sale, daysBefore) {
    const val = fmtMoney(sale.valorPendente);
    if (daysBefore === 0) return sale.clienteNome + ' possui um pagamento de ' + val + ' vencendo hoje.';
    if (daysBefore === 1) return sale.clienteNome + ' possui um pagamento de ' + val + ' vencendo amanhã.';
    return sale.clienteNome + ' possui um pagamento de ' + val + ' vencendo em ' + daysBefore + ' dias.';
  },

  async scheduleDueDateNotification(sale) {
    if (!sale) return;
    if (sale.tipoVenda !== 'fiado') return;
    if (!sale.valorPendente || sale.valorPendente <= 0) return;
    if (!sale.dataVencimento) return;
    if (sale.arquivado) return;

    const cfg = State.settings.notificacoes || {};
    if (!cfg.ativadas) return;

    const LN = NativeBridge.localNotifications();
    if (!LN || !LN.schedule) return; // No navegador não há agendamento real em background

    await this.createChannel();
    await this.cancelDueDateNotification(sale.id);

    const daysBefore = Math.max(0, parseInt(cfg.quando, 10) || 0);
    const parts = String(cfg.horario || '09:00').split(':');
    const hh = parseInt(parts[0], 10) || 9;
    const mm = parseInt(parts[1], 10) || 0;

    const dt = parseISO(sale.dataVencimento);
    if (!dt) return;
    dt.setDate(dt.getDate() - daysBefore);
    dt.setHours(hh, mm, 0, 0);
    if (dt.getTime() <= Date.now()) return; // não agenda no passado

    try {
      await LN.schedule({
        notifications: [{
          id: this.notifIdFor(sale.id),
          title: 'Pagamento vencendo',
          body: this.buildBody(sale, daysBefore),
          schedule: { at: dt, allowWhileIdle: true },
          channelId: this.CHANNEL_ID,
          smallIcon: 'ic_stat_icon_config_sample',
          iconColor: '#4F46E5',
          sound: cfg.som ? 'default' : null,
          ongoing: false,
          autoCancel: true,
          extra: { saleId: sale.id, tipo: 'vencimento' }
        }]
      });
    } catch (e) { console.warn('schedule notification', e); }
  },

  async cancelDueDateNotification(saleId) {
    const LN = NativeBridge.localNotifications();
    if (!LN || !LN.cancel) return;
    try { await LN.cancel({ notifications: [{ id: this.notifIdFor(saleId) }] }); }
    catch (e) { /* ignore */ }
  },

  async rescheduleNotifications() {
    const LN = NativeBridge.localNotifications();
    if (!LN) return;
    try {
      const pend = await LN.getPending();
      if (pend && pend.notifications && pend.notifications.length) {
        await LN.cancel({ notifications: pend.notifications.map((n) => ({ id: n.id })) });
      }
    } catch (e) { /* ignore */ }

    if (!State.settings.notificacoes.ativadas) return;
    const list = State.sales.filter((s) => s.tipoVenda === 'fiado' && s.valorPendente > 0 && !s.arquivado && s.dataVencimento);
    for (const s of list) await this.scheduleDueDateNotification(s);
  },

  async testNotification() {
    const LN = NativeBridge.localNotifications();
    const title = 'VendasPro — Teste';
    const body = 'Se você está vendo isso, as notificações estão funcionando perfeitamente. 🎉';

    if (LN && LN.schedule) {
      await this.createChannel();
      try {
        await LN.schedule({
          notifications: [{
            id: 999999,
            title,
            body,
            schedule: { at: new Date(Date.now() + 4000) },
            channelId: this.CHANNEL_ID,
            smallIcon: 'ic_stat_icon_config_sample',
            sound: State.settings.notificacoes.som ? 'default' : null
          }]
        });
        return 'native';
      } catch (e) { console.warn(e); }
    }

    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      try { new Notification(title, { body }); return 'web'; } catch (e) { /* ignore */ }
    }
    return 'none';
  },

  isNativeAvailable() { return NativeBridge.hasLocalNotifications(); }
};

/* ============================== STATUS / PRIORIDADE ============================== */
function statusInfo(sale) {
  if (!sale) return { key: 'PENDENTE', label: '—', tone: 'gray' };
  if (sale.valorPendente <= 0) return { key: 'PAGO', label: 'Pago', tone: 'green', days: null };
  if (!sale.dataVencimento) return { key: 'PENDENTE', label: 'Sem vencimento', tone: 'gray', days: null };
  const d = diffDays(todayISO(), sale.dataVencimento); // >0 futuro, 0 hoje, <0 atrasado
  if (d < 0) return { key: 'ATRASADO', label: 'Atrasado há ' + Math.abs(d) + (Math.abs(d) === 1 ? ' dia' : ' dias'), tone: 'red', days: d };
  if (d === 0) return { key: 'VENCE HOJE', label: 'Vence hoje', tone: 'amber', days: 0 };
  if (d === 1) return { key: 'VENCE AMANHÃ', label: 'Vence amanhã', tone: 'blue', days: 1 };
  return { key: 'A VENCER', label: 'Vence em ' + d + ' dias', tone: 'blue', days: d };
}

function saleStatusLabel(sale) {
  if (sale.arquivado) return { key: 'ARQUIVADO', label: 'Arquivado', tone: 'gray' };
  return statusInfo(sale);
}

function fiadoPriority(sale) {
  const st = statusInfo(sale);
  if (st.key === 'ATRASADO') return 0;
  if (st.key === 'VENCE HOJE') return 1;
  if (st.key === 'VENCE AMANHÃ') return 2;
  if (st.key === 'A VENCER') return 3;
  return 4;
}

function sortFiados(list) {
  return list.slice().sort((a, b) => {
    const pa = fiadoPriority(a), pb = fiadoPriority(b);
    if (pa !== pb) return pa - pb;
    const da = a.dataVencimento || '9999-99-99';
    const db = b.dataVencimento || '9999-99-99';
    if (da !== db) return da < db ? -1 : 1;
    return (b.criadoEm || 0) - (a.criadoEm || 0);
  });
}

function renderTemplate(tpl, vars) {
  return String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => {
    return (vars[k] !== undefined && vars[k] !== null) ? String(vars[k]) : '';
  });
}

function pixBlock() {
  const chave = (State.settings.pix && State.settings.pix.chave) ? State.settings.pix.chave : '';
  return chave;
}

function buildVars(sale, extra) {
  const cfg = State.settings;
  const produtosTxt = (sale.produtos || []).map((p) =>
    '• ' + p.qtd + 'x ' + p.nome + ' — ' + fmtMoney((p.qtd || 0) * (p.valor || 0))
  ).join('\n');
  return Object.assign({
    cliente: sale.clienteNome || 'Cliente',
    valor: fmtMoney(sale.total),
    valor_pago: fmtMoney(sale.valorPago),
    valor_pendente: fmtMoney(sale.valorPendente),
    produto: produtosTxt,
    data_venda: fmtDate(sale.dataVenda),
    data_vencimento: sale.dataVencimento ? fmtDate(sale.dataVencimento) : 'a combinar',
    pix: pixBlock() || '(não cadastrada)',
    loja: (cfg.loja && cfg.loja.nome) || 'Minha Loja',
    telefone_loja: (cfg.loja && cfg.loja.telefone) || ''
  }, extra || {});
}

function openWhatsApp(phone, message) {
  const num = normalizePhone(phone);
  if (!num || num === '55') {
    toast('Telefone do cliente não informado.', 'error');
    return;
  }
  const url = 'https://wa.me/' + num + '?text=' + encodeURIComponent(message || '');
  NativeBridge.openUrl(url);
}

function waSaleMessage(sale, tipo) {
  const msgs = State.settings.mensagens || defaultMessages();
  const vars = buildVars(sale);
  let tpl;
  if (tipo === 'atraso') tpl = msgs.atraso;
  else if (tipo === 'lembrete') tpl = msgs.lembrete;
  else if (tipo === 'pagamento') tpl = msgs.pagamento;
  else tpl = msgs.confirmacao;
  let txt = renderTemplate(tpl, vars);
  const chave = pixBlock();
  if (chave && txt.indexOf('{pix}') === -1 && txt.indexOf(chave) === -1 && tipo !== 'pagamento') {
    txt += '\n\nSe preferir pagar via Pix:\nChave Pix: ' + chave + '\n\nObrigado!';
  }
  return txt;
}

/* ============================== UI PRIMITIVAS ============================== */
function toast(msg, type) {
  type = type || 'success';
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ico = type === 'success' ? 'check' : (type === 'error' ? 'alert' : 'info');
  el.innerHTML = '<span class="ti">' + icon(ico) + '</span><span>' + esc(msg) + '</span>';
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 320);
  }, 2700);
}

function openModal(html, opts) {
  opts = opts || {};
  const root = $('#modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" data-backdrop="1">' +
      '<div class="modal">' +
        '<div class="grabber"></div>' +
        html +
      '</div>' +
    '</div>';
  const bd = root.querySelector('.modal-backdrop');
  requestAnimationFrame(() => bd.classList.add('show'));
  if (opts.dismissable !== false) {
    bd.addEventListener('click', (e) => { if (e.target === bd) closeModal(); });
  }
}

function closeModal() {
  const root = $('#modal-root');
  const bd = root.querySelector('.modal-backdrop');
  if (!bd) { root.innerHTML = ''; return; }
  bd.classList.remove('show');
  setTimeout(() => { root.innerHTML = ''; }, 230);
}

function modalHeader(title) {
  return '<div class="modal-head"><h3>' + esc(title) + '</h3>' +
    '<button class="icon-btn plain" data-act="closeModal">' + icon('x') + '</button></div>';
}

function confirmDlg(opts) {
  return new Promise((resolve) => {
    const danger = !!opts.danger;
    openModal(
      modalHeader(opts.title || 'Confirmar') +
      '<div class="modal-body"><p class="modal-msg">' + (opts.html || esc(opts.message || '')) + '</p></div>' +
      '<div class="modal-foot">' +
        '<button class="btn ghost" id="dlg-cancel">' + esc(opts.cancelText || 'Cancelar') + '</button>' +
        '<button class="btn ' + (danger ? 'danger' : 'primary') + '" id="dlg-ok">' + esc(opts.confirmText || 'Confirmar') + '</button>' +
      '</div>',
      { dismissable: true }
    );
    const ok = $('#dlg-ok'), cancel = $('#dlg-cancel');
    if (ok) ok.onclick = () => { closeModal(); resolve(true); };
    if (cancel) cancel.onclick = () => { closeModal(); resolve(false); };
  });
}

function promptDlg(opts) {
  return new Promise((resolve) => {
    openModal(
      modalHeader(opts.title || '') +
      '<div class="modal-body">' +
        '<div class="field"><label>' + esc(opts.label || '') + '</label>' +
        '<input class="inp" id="dlg-input" type="' + (opts.type || 'text') + '" inputmode="' + (opts.inputmode || 'text') + '" value="' + esc(opts.value || '') + '" placeholder="' + esc(opts.placeholder || '') + '"></div>' +
        (opts.hint ? '<p class="hint">' + esc(opts.hint) + '</p>' : '') +
      '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn ghost" id="dlg-cancel">Cancelar</button>' +
        '<button class="btn primary" id="dlg-ok">' + esc(opts.confirmText || 'Confirmar') + '</button>' +
      '</div>'
    );
    const inp = $('#dlg-input');
    if (inp) { inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {} }
    $('#dlg-ok').onclick = () => { const v = inp ? inp.value : ''; closeModal(); resolve(v); };
    $('#dlg-cancel').onclick = () => { closeModal(); resolve(null); };
    if (inp) inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); $('#dlg-ok').click(); }
    });
  });
}

/* ============================== HELPERS DE ESTATÍSTICA ============================== */
function salesInRange(fromISO, toISO) {
  return State.sales.filter((s) => !s.excluida && !s.arquivado && s.dataVenda >= fromISO && s.dataVenda <= toISO);
}
function sum(arr, fn) { return arr.reduce((a, b) => a + (fn ? fn(b) : b), 0); }

function dashboardStats() {
  const today = todayISO();
  const mk = todayMonthKey();
  const all = State.sales.filter((s) => !s.excluida);

  const vendasHoje = all.filter((s) => s.dataVenda === today && !s.arquivado);
  const vendasMes = all.filter((s) => monthKey(s.dataVenda) === mk && !s.arquivado);

  const totalHoje = sum(vendasHoje, (s) => s.total);
  const totalMes = sum(vendasMes, (s) => s.total);

  const recebidoTotal = sum(all.filter((s) => !s.arquivado), (s) => s.valorPago);
  const recebidoHoje = sum(vendasHoje, (s) => s.valorPago);

  const fiadosAbertos = all.filter((s) => !s.arquivado && s.tipoVenda === 'fiado' && s.valorPendente > 0);
  const totalFiado = sum(fiadosAbertos, (s) => s.valorPendente);

  const atrasados = fiadosAbertos.filter((s) => statusInfo(s).key === 'ATRASADO');
  const totalAtraso = sum(atrasados, (s) => s.valorPendente);

  const venceHoje = fiadosAbertos.filter((s) => statusInfo(s).key === 'VENCE HOJE');
  const totalVenceHoje = sum(venceHoje, (s) => s.valorPendente);

  const proximos = all.filter((s) => {
    if (s.arquivado || s.valorPendente <= 0 || !s.dataVencimento) return false;
    const d = diffDays(today, s.dataVencimento);
    return d >= 0 && d <= 7;
  });

  return {
    totalHoje, totalMes, recebidoTotal, recebidoHoje, totalFiado, totalAtraso, totalVenceHoje,
    qtdHoje: vendasHoje.length,
    qtdMes: vendasMes.length,
    qtdClientes: State.customers.filter((c) => !c.arquivado).length,
    qtdPendentes: fiadosAbertos.length,
    qtdAtrasados: atrasados.length,
    clientesUnicos: new Set(all.map((s) => normText(s.clienteNome))).size,
    fiadosAbertos, atrasados, venceHoje, proximos,
    ticketMedio: vendasMes.length ? Math.round(totalMes / vendasMes.length) : 0
  };
}

  let html = '';

  html += '<div class="stats-grid">';
  html += statCard('Vendas hoje', fmtMoney(st.totalHoje), st.qtdHoje + ' venda' + (st.qtdHoje === 1 ? '' : 's'), 'wallet', 'p');
  html += statCard('Vendas no mês', fmtMoney(st.totalMes), capitalizar(mesNome) + ' · ' + st.qtdMes + ' vendas', 'trend', 'b');
  html += statCard('Recebido', fmtMoney(st.recebidoTotal), 'Hoje: ' + fmtMoney(st.recebidoHoje), 'check', 'g');
  html += statCard('Fiado em aberto', fmtMoney(st.totalFiado), st.qtdPendentes + ' pendente' + (st.qtdPendentes === 1 ? '' : 's'), 'book', 'a');
  html += statCard('Em atraso', fmtMoney(st.totalAtraso), st.qtdAtrasados + ' cliente' + (st.qtdAtrasados === 1 ? '' : 's'), 'alert', 'r');

  html += '</div>';

  const prox = st.proximos.slice().sort((a, b) => (a.dataVencimento < b.dataVencimento ? -1 : 1)).slice(0, 5);

  }

  /* Em atraso */
  const atr = sortFiados(st.atrasados).slice(0, 5);
  html += '<div class="section-title"><h2>Em atraso</h2>' +
    (atr.length ? '<button class="link" data-act="nav" data-id="fiados">Ver todos</button>' : '') + '</div>';

    atr.forEach((s) => { html += miniFiadoCard(s); });

  '</div>';
}
function quickAction(label, ico, view) {
  return '<button class="btn ghost" style="justify-content:flex-start;padding:15px 14px;" data-act="nav" data-id="' + view + '">' +
    '<span style="width:32px;height:32px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--primary);">' + icon(ico) + '</span>' +

    '<span style="color:var(--muted);">' + icon(ico) + '</span>' + esc(text) + '</div>';

function capitalizar(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function newFormObject(sale) {
  if (sale) {
    return {
      id: sale.id,
      editing: true,
      numeroVenda: sale.numeroVenda,
      clienteNome: sale.clienteNome || '',
      clienteTelefone: sale.clienteTelefone || '',
      products: (sale.produtos || []).map((p) => ({ nome: p.nome, codigo: p.codigo || '', qtd: p.qtd, valor: p.valor })),
      desconto: sale.desconto || 0,
      subtotal: sale.subtotal || 0,
      total: sale.total || 0,
      tipoVenda: sale.tipoVenda || 'vista',
      formaPagamento: sale.formaPagamento || 'Dinheiro',
      entrada: sale.tipoVenda === 'fiado' ? (sale.valorPago || 0) : 0,
      pendente: sale.valorPendente || 0,
      dataVenda: sale.dataVenda || todayISO(),
      dataVencimento: sale.dataVencimento || '',
      observacao: sale.observacao || '',
      formaCombinada: sale.formaCombinada || ''
    };
  }
  return {
    id: null,
    editing: false,
    numeroVenda: null,
    clienteNome: '',
    clienteTelefone: '',
    products: [{ nome: '', codigo: '', qtd: 1, valor: 0 }],
    desconto: 0,
    subtotal: 0,
    total: 0,
    tipoVenda: 'vista',
    formaPagamento: 'Dinheiro',
    entrada: 0,
    pendente: 0,
    dataVenda: todayISO(),
    dataVencimento: '',
    observacao: '',
    formaCombinada: ''
  };
}

function syncFormFromDOM() {
  const f = State.form;
  if (!f) return;
  const cli = $('#f-cliente'); if (cli) f.clienteNome = cli.value.trim();
  const tel = $('#f-telefone'); if (tel) f.clienteTelefone = phoneDigits(tel.value);
  const desc = $('#f-desconto'); if (desc) f.desconto = parseMoney(desc.value);
  const obs = $('#f-obs'); if (obs) f.observacao = obs.value;
  const dv = $('#f-datavenda'); if (dv && dv.value) f.dataVenda = dv.value;
  const venc = $('#f-vencimento'); if (venc) f.dataVencimento = venc.value;
  const ent = $('#f-entrada'); if (ent) f.entrada = parseMoney(ent.value);
  const fc = $('#f-formacomb'); if (fc) f.formaCombinada = fc.value.trim();
  $$('#produtos-wrap .prod-row').forEach((row) => {
    const i = parseInt(row.dataset.idx, 10);
    const p = f.products[i];
    if (!p) return;
    const nome = row.querySelector('[data-pf="nome"]');
    const qtd = row.querySelector('[data-pf="qtd"]');
    const val = row.querySelector('[data-pf="valor"]');
    if (nome) p.nome = nome.value.trim();
    if (qtd) p.qtd = Math.max(1, parseInt(qtd.value, 10) || 1);
    if (val) p.valor = parseMoney(val.value);
  });
  recalcTotals(false);
}

function recalcTotals(updateInputs) {
  const f = State.form;
  if (!f) return;
  const subtotal = f.products.reduce((s, p) => s + (p.qtd || 0) * (p.valor || 0), 0);
  f.subtotal = subtotal;
  f.total = Math.max(0, subtotal - (f.desconto || 0));

  const sv = $('#f-subtotal-view'); if (sv) sv.textContent = fmtMoney(f.subtotal);
  const tv = $('#f-total-view'); if (tv) tv.textContent = fmtMoney(f.total);

  if (f.tipoVenda === 'fiado') {
    const ent = Math.min(f.entrada || 0, f.total);
    f.entrada = ent;
    f.pendente = f.total - ent;
    const pv = $('#f-pendente-view'); if (pv) pv.textContent = fmtMoney(f.pendente);
  } else {
    f.pendente = 0;
  }
  if (updateInputs !== false) { /* reservado */ }
}

function fiadosChips() {
  const f = State.ui.fiadosFilter;
  const items = [
    ['todos', 'Todos'],
    ['vencendohoje', 'Vence hoje'],
    ['atrasados', 'Em atraso'],
    ['avencer', 'A vencer'],
    ['pagos', 'Pagos'],

  ];
  return items.map((it) =>
    '<button class="chip ' + (f === it[0] ? 'active' : '') + '" data-act="fiadosFilter" data-id="' + it[0] + '">' + it[1] + '</button>'
  ).join('');
}

function filteredFiados() {
  const f = State.ui.fiadosFilter;
  const q = State.ui.fiadosSearch;
  let list = State.sales.filter((s) => !s.excluida);

  if (f === 'arquivados') {
    list = list.filter((s) => s.arquivado);
  } else {
    list = list.filter((s) => !s.arquivado && s.tipoVenda === 'fiado');
  }

  if (f === 'vencendohoje') list = list.filter((s) => s.valorPendente > 0 && statusInfo(s).key === 'VENCE HOJE');
  else if (f === 'atrasados') list = list.filter((s) => s.valorPendente > 0 && statusInfo(s).key === 'ATRASADO');
  else if (f === 'avencer') list = list.filter((s) => s.valorPendente > 0 && ['A VENCER', 'VENCE AMANHÃ', 'PENDENTE'].indexOf(statusInfo(s).key) > -1);
  else if (f === 'pagos') list = list.filter((s) => s.valorPendente <= 0);
  else if (f === 'todos') list = list.filter((s) => s.valorPendente > 0 || s.arquivado);

  if (q && q.trim()) {
    const query = q.trim();
    list = list.filter((s) => {
      if (includesQuery(s.clienteNome, query)) return true;
      if (includesQuery(s.clienteTelefone, query)) return true;
      if (includesQuery(s.numeroVenda, query)) return true;
      if (includesQuery(String(s.total / 100), query)) return true;
      if ((s.produtos || []).some((p) => includesQuery(p.nome, query))) return true;
      if (includesQuery(fmtDate(s.dataVencimento), query)) return true;
      if (includesQuery(fmtDate(s.dataVenda), query)) return true;
      return false;
    });
  }

  return sortFiados(list);
}

function fiadosListHTML() {
  const list = filteredFiados();
  if (!list.length) {
    const f = State.ui.fiadosFilter;
    const map = {
      arquivados: ['Nenhum cliente arquivado', 'Clientes arquivados aparecerão aqui.', 'archive'],
      pagos: ['Nenhum fiado quitado', 'Os fiados pagos aparecerão aqui.', 'check'],
      atrasados: ['Nenhum pagamento atrasado', 'Continue assim! 🎉', 'check'],
      vencendohoje: ['Nada vencendo hoje', 'Nenhum pagamento com vencimento para hoje.', 'calendar']
    };
    const m = map[f] || ['Nenhum fiado em aberto', 'Você não possui pagamentos pendentes.', 'book'];
    return '<div class="card"><div class="empty">' +
      '<div class="eico">' + icon(m[2]) + '</div>' +
      '<h3>' + esc(m[0]) + '</h3><p>' + esc(m[1]) + '</p>' +
      (f === 'todos' ? '<button class="btn primary" data-act="nav" data-id="newsale">' + icon('plus') + ' Nova venda fiada</button>' : '') +
      '</div></div>';
  }
  return list.map(fiadoCard).join('');
}

function fiadoCard(s) {
  const st = statusInfo(s);
  const pay = Data.paymentsOf(s.id);
  return '<div class="item t-' + st.tone + '">' +

function salesChips() {
  const f = State.ui.salesFilter;
  const items = [
    ['todos', 'Todas'],
    ['hoje', 'Hoje'],
    ['ontem', 'Ontem'],
    ['7', 'Últimos 7 dias'],
    ['mes', 'Este mês'],
    ['mesanterior', 'Mês anterior'],
    ['vista', 'À vista'],
    ['fiado', 'Fiado'],
    ['pago', 'Pago'],
    ['pendente', 'Pendente'],
    ['atrasado', 'Atrasado']
  ];
  return items.map((it) =>
    '<button class="chip ' + (f === it[0] ? 'active' : '') + '" data-act="salesFilter" data-id="' + it[0] + '">' + it[1] + '</button>'
  ).join('');
}

function filteredSales() {
  const f = State.ui.salesFilter;
  const q = State.ui.salesSearch;
  const today = todayISO();
  let list = State.sales.filter((s) => !s.excluida);

  if (f === 'hoje') list = list.filter((s) => s.dataVenda === today);
  else if (f === 'ontem') list = list.filter((s) => s.dataVenda === addDaysISO(today, -1));
  else if (f === '7') list = list.filter((s) => diffDays(s.dataVenda, today) <= 6 && diffDays(s.dataVenda, today) >= 0);
  else if (f === 'mes') list = list.filter((s) => monthKey(s.dataVenda) === todayMonthKey());
  else if (f === 'mesanterior') {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
    const mk = isoOf(d).slice(0, 7);
    list = list.filter((s) => monthKey(s.dataVenda) === mk);
  }
  else if (f === 'vista') list = list.filter((s) => s.tipoVenda === 'vista');
  else if (f === 'fiado') list = list.filter((s) => s.tipoVenda === 'fiado');
  else if (f === 'pago') list = list.filter((s) => s.valorPendente <= 0);
  else if (f === 'pendente') list = list.filter((s) => s.valorPendente > 0 && statusInfo(s).key !== 'ATRASADO');
  else if (f === 'atrasado') list = list.filter((s) => s.valorPendente > 0 && statusInfo(s).key === 'ATRASADO');

  if (q && q.trim()) {
    const query = q.trim();
    list = list.filter((s) => {
      if (includesQuery(s.clienteNome, query)) return true;
      if (includesQuery(s.clienteTelefone, query)) return true;
      if (includesQuery(s.numeroVenda, query)) return true;
      if (includesQuery(fmtDate(s.dataVenda), query)) return true;
      if ((s.produtos || []).some((p) => includesQuery(p.nome, query))) return true;
      return false;
    });
  }

  return list.sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
}

function salesListHTML() {
  const list = filteredSales();
  if (!list.length) {
    return '<div class="card"><div class="empty">' +
      '<div class="eico">' + icon('receipt') + '</div>' +
      '<h3>Nenhuma venda encontrada</h3>' +
      '<p>Ajuste os filtros ou registre uma nova venda.</p>' +
      '<button class="btn primary" data-act="nav" data-id="newsale">' + icon('plus') + ' Nova venda</button>' +

  return list.map(saleCard).join('');
}

  html += '<div class="divider"></div>';
  html += '<div class="total-line"><span>Quantidade de vendas</span><span class="mono bold">' + list.length + '</span></div>';
  html += '<div class="total-line"><span>Ticket médio</span><span class="mono bold">' + fmtMoney(ticket) + '</span></div>';
  html += '<div class="total-line"><span>Vendas à vista</span><span class="mono bold">' + fmtMoney(vista) + '</span></div>';
  html += '<div class="total-line"><span>Vendas fiadas</span><span class="mono bold">' + fmtMoney(fiado) + '</span></div>';
  html += '</div>';

  /* Gráfico últimos 7 dias */
  const dias = [];
  for (let i = 6; i >= 0; i--) {
    const iso = addDaysISO(todayISO(), -i);
    const d = parseISO(iso);
    const val = sum(State.sales.filter((s) => !s.excluida && !s.arquivado && s.dataVenda === iso), (s) => s.total);
    dias.push({ label: ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'][d.getDay()], value: val });
  }
  html += '<div class="card">';
  html += '<div class="section-title" style="margin-top:0;"><h2>' + icon('chart') + ' Últimos 7 dias</h2></div>';
  html += barChart(dias);
  html += '</div>';

  /* Formas de pagamento */
  const formas = {};
  list.forEach((s) => {
    const k = s.formaPagamento || 'Outra';
    formas[k] = (formas[k] || 0) + s.valorPago;
  });
  const formaArr = Object.keys(formas).map((k) => ({ label: k, value: formas[k] })).sort((a, b) => b.value - a.value);
  if (formaArr.length) {
    html += '<div class="card">';
    html += '<div class="section-title" style="margin-top:0;"><h2>' + icon('wallet') + ' Formas de pagamento</h2></div>';
    html += hBarList(formaArr);
    html += '</div>';
  }

  /* Fiados em aberto */
  const abertos = State.sales.filter((s) => !s.excluida && !s.arquivado && s.valorPendente > 0);
  const totalAberto = sum(abertos, (s) => s.valorPendente);
  const vencido = sum(abertos.filter((s) => statusInfo(s).key === 'ATRASADO'), (s) => s.valorPendente);
  const aVencer = totalAberto - vencido;
  const maior = abertos.slice().sort((a, b) => b.valorPendente - a.valorPendente)[0];
  const devedores = new Set(abertos.map((s) => normText(s.clienteNome))).size;

  html += '<div class="card">';
  html += '<div class="section-title" style="margin-top:0;"><h2>' + icon('book') + ' Relatório de fiados</h2></div>';
  html += '<div class="stats-grid" style="grid-template-columns:1fr 1fr;">' +
    statMini('Total em aberto', fmtMoney(totalAberto), 'b') +
    statMini('Total vencido', fmtMoney(vencido), 'r') +
    statMini('Total a vencer', fmtMoney(aVencer), 'g') +
    statMini('Clientes devedores', String(devedores), 'a') +
  '</div>';
  if (maior) {
    html += '<div class="divider"></div>';
    html += '<div class="sum-row"><span class="k">Maior dívida</span><span class="v">' + esc(maior.clienteNome) + ' · ' + fmtMoney(maior.valorPendente) + '</span></div>';
  }
  html += '</div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
    '<button class="btn ghost" data-act="exportCSV">' + icon('download') + ' Exportar CSV</button>' +
    '<button class="btn ghost" data-act="exportJSON">' + icon('share') + ' Exportar JSON</button>' +
    '</div>';

  return html;
};

function reportRange(period) {
  const today = todayISO();
  if (period === 'hoje') return { from: today, to: today };
  if (period === '7') return { from: addDaysISO(today, -6), to: today };
  if (period === 'mes') return { from: todayMonthKey() + '-01', to: today };
  if (period === 'mesanterior') {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
    const from = isoOf(d);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return { from, to: isoOf(last) };
  }
  if (period === 'ano') return { from: today.slice(0, 4) + '-01-01', to: today };
  if (period === 'custom') {
    return { from: State.ui.reportFrom || '1900-01-01', to: State.ui.reportTo || '2999-12-31' };
  }
  return { from: '1900-01-01', to: '2999-12-31' };
}

function barChart(data) {
  const max = Math.max.apply(null, data.map((d) => d.value).concat([1]));
  return '<div class="chart">' + data.map((d) =>
    '<div class="cbar">' +
      '<div class="cbar-val">' + (d.value > 0 ? fmtMoneyShort(d.value) : '') + '</div>' +
      '<div class="cbar-track"><div class="cbar-fill" style="height:' + Math.max(3, Math.round(d.value / max * 100)) + '%"></div></div>' +
      '<div class="cbar-lbl">' + esc(d.label) + '</div>' +
    '</div>'
  ).join('') + '</div>';
}

function hBarList(arr) {
  const max = Math.max.apply(null, arr.map((a) => a.value).concat([1]));
  const colors = ['var(--primary)', 'var(--green)', 'var(--blue)', 'var(--amber)', 'var(--red)'];
  return arr.map((a, i) =>
    '<div class="hbar">' +
      '<div class="hbar-top"><span class="lbl">' + esc(a.label) + '</span><span class="val mono">' + fmtMoney(a.value) + '</span></div>' +
      '<div class="hbar-track"><div class="hbar-fill" style="width:' + Math.max(2, Math.round(a.value / max * 100)) + '%;background:' + colors[i % colors.length] + ';"></div></div>' +
    '</div>'
  ).join('');
}

    '<div style="font-size:13px;line-height:1.6;color:var(--text-2);">Todos os seus dados ficam armazenados apenas neste dispositivo. Nada é enviado para servidores externos.</div>' +
  '</div>';

  html += '<button class="btn ghost block" data-act="exportBackup">' + icon('download') + ' Fazer backup agora</button>';
  return html;
};

/* ============================== AÇÕES ============================== */
const Actions = {

  closeModal() { closeModal(); },
  back() {
    const meta = VIEW_META[State.view];
    if (State.view === 'editsale') { State.form = null; go('sales'); return; }
    if (State.view === 'saledetail') { go('fiados'); return; }
    go('dashboard');
  },
  nav(id) {
    if (id === 'newsale') { State.form = newFormObject(null); }
    if (id === 'reports' && State.ui.reportPeriod === 'custom' && !State.ui.reportFrom) {
      State.ui.reportFrom = addDaysISO(todayISO(), -30);
      State.ui.reportTo = todayISO();
    }
    go(id);
  },
  goSearch() { go('sales'); setTimeout(() => { const el = $('#search-sales'); if (el) el.focus(); }, 120); },

  /* ---------- Formulário de venda ---------- */
  addProd() {
    syncFormFromDOM();
    State.form.products.push({ nome: '', codigo: '', qtd: 1, valor: 0 });
    refreshList('produtos-wrap', () => productsHTML(State.form));
    recalcTotals();
    const rows = $$('#produtos-wrap .prod-row');

    if (last) { const inp = last.querySelector('[data-pf="nome"]'); if (inp) inp.focus(); }
  },

  removeProd(idx) {
    syncFormFromDOM();
    State.form.products.splice(Number(idx), 1);
    if (!State.form.products.length) State.form.products.push({ nome: '', codigo: '', qtd: 1, valor: 0 });
    refreshList('produtos-wrap', () => productsHTML(State.form));
    recalcTotals();
  },

  setTipo(tipo) {
    syncFormFromDOM();
    State.form.tipoVenda = tipo;
    if (tipo === 'fiado') {
      if (!State.form.dataVencimento) State.form.dataVencimento = addDaysISO(todayISO(), 7);
      State.form.pendente = State.form.total - (State.form.entrada || 0);
    } else {
      State.form.pendente = 0;
    }
    render();
  },

  setForma(forma) {
    syncFormFromDOM();
    State.form.formaPagamento = forma;
    render();
  },

  setVenc(op) {
    syncFormFromDOM();
    let iso;
    if (op === 'hoje') iso = todayISO();
    else if (op === 'amanha') iso = addDaysISO(todayISO(), 1);
    else iso = addDaysISO(todayISO(), parseInt(op, 10) || 7);
    State.form.dataVencimento = iso;
    const inp = $('#f-vencimento');
    if (inp) inp.value = iso;
    toast('Vencimento: ' + fmtDate(iso), 'info');
  },

  finalizarVenda() {

    const f = State.form;
    const prods = f.products.filter((p) => (p.nome || '').trim() && p.qtd > 0);
    if (!f.clienteNome) { toast('Informe o nome do cliente.', 'error'); return; }
    if (!prods.length) { toast('Adicione pelo menos um produto.', 'error'); return; }
    if (f.total <= 0) { toast('O valor total precisa ser maior que zero.', 'error'); return; }
    if (f.tipoVenda === 'fiado' && !f.dataVencimento) { toast('Escolha a data de vencimento.', 'error'); return; }

    f.products = prods;

    const vista = f.tipoVenda === 'vista';
    const valorPago = vista ? f.total : Math.min(f.entrada || 0, f.total);
    const valorPendente = f.total - valorPago;

    let html = '<div class="modal-body">';
    html += '<div class="sum-box">';
    html += '<div class="sum-row"><span class="k">Cliente</span><span class="v">' + esc(f.clienteNome) + '</span></div>';
    if (f.clienteTelefone) html += '<div class="sum-row"><span class="k">Telefone</span><span class="v">' + esc(maskPhone(f.clienteTelefone)) + '</span></div>';
    html += '</div>';

    html += '<div class="sum-box">';
    f.products.forEach((p) => {
      html += '<div class="sum-row"><span class="k">' + p.qtd + '× ' + esc(truncate(p.nome, 22)) + '</span>' +
        '<span class="v">' + fmtMoney(p.qtd * p.valor) + '</span></div>';
    });
    html += '</div>';

    html += '<div class="sum-box">';
    html += '<div class="sum-row"><span class="k">Subtotal</span><span class="v">' + fmtMoney(f.subtotal) + '</span></div>';
    if (f.desconto) html += '<div class="sum-row"><span class="k">Desconto</span><span class="v">- ' + fmtMoney(f.desconto) + '</span></div>';
    html += '<div class="sum-row"><span class="k">Total</span><span class="v">' + fmtMoney(f.total) + '</span></div>';
    html += '<div class="sum-row"><span class="k">Valor pago</span><span class="v green">' + fmtMoney(valorPago) + '</span></div>';
    if (valorPendente > 0) html += '<div class="sum-row"><span class="k">Valor pendente</span><span class="v red">' + fmtMoney(valorPendente) + '</span></div>';
    html += '</div>';

    html += '<div class="sum-box">';
    html += '<div class="sum-row"><span class="k">Forma</span><span class="v">' + esc(vista ? f.formaPagamento : 'Fiado') + '</span></div>';
    html += '<div class="sum-row"><span class="k">Data da venda</span><span class="v">' + esc(fmtDate(f.dataVenda)) + '</span></div>';
    if (!vista) html += '<div class="sum-row"><span class="k">Vencimento</span><span class="v">' + esc(fmtDate(f.dataVencimento)) + '</span></div>';
    if (f.observacao) html += '<div class="sum-row"><span class="k">Observações</span><span class="v" style="max-width:60%;white-space:pre-wrap;">' + esc(f.observacao) + '</span></div>';
    html += '</div>';
    html += '</div>';

    html += '<div class="modal-foot">' +
      '<button class="btn ghost" data-act="closeModal">Voltar</button>' +
      '<button class="btn primary" data-act="confirmarVenda">' + icon('check') + ' Confirmar venda</button>' +
      '</div>';

    openModal(modalHeader(f.editing ? 'Confirmar alterações' : 'Resumo da venda') + html);
  },

  async confirmarVenda() {
    const f = State.form;
    const vista = f.tipoVenda === 'vista';
    const valorPago = vista ? f.total : Math.min(f.entrada || 0, f.total);
    const valorPendente = f.total - valorPago;

    const existing = f.editing ? Data.saleById(f.id) : null;
    const historico = existing && existing.historico ? existing.historico.slice() : [];

    let numeroVenda = f.numeroVenda;
    let numero = existing ? existing.numero : null;

    if (!existing) {
      numero = await nextSaleNumber();
      numeroVenda = '#' + String(numero).padStart(6, '0');
    }

    const sale = {
      id: existing ? existing.id : uid(),
      numero: numero,
      numeroVenda: numeroVenda,
      clienteId: null,
      clienteNome: f.clienteNome,
      clienteTelefone: f.clienteTelefone || '',
      produtos: f.products.map((p) => ({ nome: p.nome, codigo: p.codigo || '', qtd: p.qtd, valor: p.valor })),
      subtotal: f.subtotal,
      desconto: f.desconto || 0,
      total: f.total,
      valorPago: valorPago,
      valorPendente: valorPendente,
      formaPagamento: vista ? f.formaPagamento : 'Fiado',
      formaCombinada: f.formaCombinada || '',
      tipoVenda: f.tipoVenda,
      dataVenda: f.dataVenda,
      dataVencimento: vista ? null : f.dataVencimento,
      observacao: f.observacao || '',
      arquivado: existing ? existing.arquivado : false,
      excluida: false,
      historico: historico,
      criadoEm: existing ? existing.criadoEm : Date.now(),
      atualizadoEm: Date.now()
    };

    if (existing) {
      if (existing.dataVencimento !== sale.dataVencimento) {
        sale.historico.push({
          data: Date.now(),
          texto: 'Vencimento alterado de ' + fmtDate(existing.dataVencimento) + ' para ' + fmtDate(sale.dataVencimento)
        });
      }
      if (existing.total !== sale.total) {
        sale.historico.push({ data: Date.now(), texto: 'Valor total alterado de ' + fmtMoney(existing.total) + ' para ' + fmtMoney(sale.total) });
      }
      sale.historico.push({ data: Date.now(), texto: 'Venda editada' });
    } else {
      sale.historico.push({ data: Date.now(), texto: 'Venda criada' });
    }

    await Store.put('sales', sale);

    // Registra entrada como pagamento (fiado com entrada)
    if (!existing && !vista && valorPago > 0) {
      await Store.put('payments', {
        id: uid(), vendaId: sale.id, valor: valorPago, data: Date.now(),
        formaPagamento: f.formaPagamento || 'Dinheiro', observacao: 'Entrada'
      });
    }
    if (existing && valorPago > 0 && !vista) {
      const jaPago = existing.valorPago;
      if (valorPago > jaPago) {
        await Store.put('payments', {
          id: uid(), vendaId: sale.id, valor: valorPago - jaPago, data: Date.now(),
          formaPagamento: f.formaPagamento || 'Dinheiro', observacao: 'Entrada complementar'
        });
      }
    }

    // Cliente
    await upsertCustomer(sale.clienteNome, sale.clienteTelefone);

    // Estoque
    if (!existing) {
      for (const p of sale.produtos) {
        const prod = Data.productByName(p.nome);
        if (prod && prod.estoque !== null && prod.estoque !== undefined && prod.estoque !== '') {
          prod.estoque = Number(prod.estoque) - Number(p.qtd);
          await Store.put('products', prod);
        }
      }
    }

    // Notificação
    if (sale.tipoVenda === 'fiado' && sale.valorPendente > 0) {
      await Notif.scheduleDueDateNotification(sale);
    } else {
      await Notif.cancelDueDateNotification(sale.id);
    }

    await reloadData();
    closeModal();
    State.form = newFormObject(null);

    toast(existing ? 'Venda atualizada com sucesso!' : 'Venda salva com sucesso!', 'success');
    showSaleSuccess(sale, !existing);
  },

  openSale(id) { go('saledetail', { id: id }); },

  editarVenda(id) {
    const sale = Data.saleById(id);
    if (!sale) return;
    State.form = newFormObject(sale);
    go('editsale', { id: id });
  },

  async excluirVenda(id) {
    const ok = await confirmDlg({
      title: 'Excluir venda',
      message: 'Tem certeza que deseja excluir esta venda? Ela irá para a lixeira e poderá ser restaurada.',
      confirmText: 'Excluir',
      danger: true
    });
    if (!ok) return;
    const sale = Data.saleById(id);
    if (!sale) return;
    sale.excluida = true;
    sale.excluidaEm = Date.now();
    await Store.put('sales', sale);
    await Notif.cancelDueDateNotification(id);
    await reloadData();
    toast('Venda movida para a lixeira.', 'info');
    go('sales');
  },

  async restaurarVenda(id) {
    const sale = Data.saleById(id);
    if (!sale) return;
    sale.excluida = false;
    delete sale.excluidaEm;
    await Store.put('sales', sale);
    if (sale.tipoVenda === 'fiado' && sale.valorPendente > 0) await Notif.scheduleDueDateNotification(sale);
    await reloadData();
    toast('Venda restaurada!', 'success');
  },

  async apagarDefinitivo(id) {
    const ok = await confirmDlg({
      title: 'Apagar definitivamente',
      message: 'Esta ação é permanente e não pode ser desfeita. Deseja continuar?',
      confirmText: 'Apagar',
      danger: true
    });
    if (!ok) return;
    await Store.del('sales', id);
    await Notif.cancelDueDateNotification(id);
    await reloadData();
    toast('Venda apagada.', 'info');
  },

  async esvaziarLixeira() {
    const ok = await confirmDlg({
      title: 'Esvaziar lixeira',
      message: 'Todas as vendas da lixeira serão apagadas permanentemente.',
      confirmText: 'Esvaziar',
      danger: true
    });
    if (!ok) return;
    const list = State.sales.filter((s) => s.excluida);
    for (const s of list) await Store.del('sales', s.id);
    await reloadData();
    toast('Lixeira esvaziada.', 'info');
  },

  async arquivar(id) {
    const sale = Data.saleById(id);
    if (!sale) return;
    if (sale.arquivado) { return Actions.desarquivar(id); }
    const ok = await confirmDlg({
      title: 'Arquivar cliente?',
      html: 'Este cliente possui pagamento pendente. Ele será movido para a área de arquivados, mas <b>todos os dados serão preservados</b>.',
      confirmText: 'Arquivar'
    });
    if (!ok) return;
    sale.arquivado = true;
    sale.historico = sale.historico || [];
    sale.historico.push({ data: Date.now(), texto: 'Venda arquivada' });
    await Store.put('sales', sale);
    await Notif.cancelDueDateNotification(id);
    await reloadData();
    toast('Cliente arquivado.', 'info');
    if (State.view === 'saledetail') go('fiados');
  },

  async desarquivar(id) {
    const sale = Data.saleById(id);
    if (!sale) return;
    sale.arquivado = false;
    sale.historico = sale.historico || [];
    sale.historico.push({ data: Date.now(), texto: 'Venda desarquivada' });
    await Store.put('sales', sale);
    if (sale.tipoVenda === 'fiado' && sale.valorPendente > 0) await Notif.scheduleDueDateNotification(sale);
    await reloadData();
    toast('Cliente restaurado!', 'success');
  },

  async alterarVencimento(id) {
    const sale = Data.saleById(id);
    if (!sale) return;
    const novo = await promptDlg({
      title: 'Alterar vencimento',
      label: 'Nova data (AAAA-MM-DD)',
      type: 'date',
      value: sale.dataVencimento || todayISO(),
      confirmText: 'Salvar'
    });
    if (!novo) return;
    const antigo = sale.dataVencimento;
    sale.dataVencimento = novo;
    sale.historico = sale.historico || [];
    sale.historico.push({ data: Date.now(), texto: 'Vencimento alterado de ' + fmtDate(antigo) + ' para ' + fmtDate(novo) });
    sale.atualizadoEm = Date.now();
    await Store.put('sales', sale);
    await Notif.cancelDueDateNotification(id);
    await Notif.scheduleDueDateNotification(sale);
    await reloadData();
    toast('Vencimento atualizado para ' + fmtDate(novo), 'success');
    render();
  },

  /* ---------- Pagamentos ---------- */
  registrarPagamento(id) {
    const sale = Data.saleById(id);
    if (!sale) return;
    if (sale.valorPendente <= 0) { toast('Esta venda já está totalmente paga.', 'info'); return; }

    const formas = ['Dinheiro', 'Pix', 'Cartão de crédito', 'Cartão de débito', 'Outra forma'];
    let html = modalHeader('Registrar pagamento');
    html += '<div class="modal-body">';
    html += '<div class="sum-box">' +
      '<div class="sum-row"><span class="k">Cliente</span><span class="v">' + esc(sale.clienteNome) + '</span></div>' +
      '<div class="sum-row"><span class="k">Valor pendente</span><span class="v red">' + fmtMoney(sale.valorPendente) + '</span></div>' +
      '</div>';

    html += '<div class="field"><label>Valor do pagamento</label>' +
      '<input class="inp" id="pg-valor" inputmode="decimal" value="' + centsToInput(sale.valorPendente) + '">' +
      '<div class="chips" style="margin-top:9px;flex-wrap:wrap;overflow:visible;">' +
        '<button class="chip" data-act="pgFull">Quitar total</button>' +
        '<button class="chip" data-act="pgHalf">Metade</button>' +
      '</div></div>';

    html += '<div class="field"><label>Forma de pagamento</label><div class="chips" style="flex-wrap:wrap;overflow:visible;">' +

      '<button class="btn ghost" data-act="closeModal">Cancelar</button>' +
      '<button class="btn success" data-act="confirmarPagamento" data-id="' + id + '">' + icon('check') + ' Confirmar</button>' +
      '</div>';

    openModal(html);
    State.params._pgForma = 'Dinheiro';
  },

  pgFull() {
    const sale = Data.saleById(State.params.id);
    if (sale) { const el = $('#pg-valor'); if (el) el.value = centsToInput(sale.valorPendente); }
  },
  pgHalf() {
    const sale = Data.saleById(State.params.id);
    if (sale) { const el = $('#pg-valor'); if (el) el.value = centsToInput(Math.round(sale.valorPendente / 2)); }
  },
  pgForma(f) {
    State.params._pgForma = f;
    $$('[data-act="pgForma"]').forEach((b) => b.classList.toggle('active', b.dataset.id === f));
  },

  async confirmarPagamento(id) {
    const sale = Data.saleById(id);
    if (!sale) return;
    const valor = parseMoney($('#pg-valor') ? $('#pg-valor').value : 0);
    if (valor <= 0) { toast('Informe um valor válido.', 'error'); return; }
    if (valor > sale.valorPendente) { toast('O valor é maior que o pendente.', 'error'); return; }

    const forma = State.params._pgForma || 'Dinheiro';
    const obs = $('#pg-obs') ? $('#pg-obs').value.trim() : '';

    await Store.put('payments', {
      id: uid(), vendaId: sale.id, valor: valor, data: Date.now(),
      formaPagamento: forma, observacao: obs
    });

    sale.valorPago = (sale.valorPago || 0) + valor;
    sale.valorPendente = Math.max(0, sale.total - sale.valorPago);
    sale.historico = sale.historico || [];
    sale.historico.push({
      data: Date.now(),
      texto: 'Pagamento de ' + fmtMoney(valor) + ' (' + forma + ')' +
        (sale.valorPendente > 0 ? ' · Restante ' + fmtMoney(sale.valorPendente) : ' · Venda quitada')
    });
    sale.atualizadoEm = Date.now();

    if (sale.valorPendente <= 0) {
      sale.formaPagamento = forma;
      await Notif.cancelDueDateNotification(sale.id);
    }

    await Store.put('sales', sale);
    await reloadData();
    closeModal();
    toast(sale.valorPendente <= 0 ? 'Venda quitada! 🎉' : 'Pagamento registrado!', 'success');

    if (sale.valorPendente <= 0) {
      const ok = await confirmDlg({
        title: 'Pagamento recebido',
        message: 'Deseja enviar uma mensagem de agradecimento pelo WhatsApp?',
        confirmText: 'Enviar'
      });
      if (ok) {
        openWhatsApp(sale.clienteTelefone, waSaleMessage(sale, 'pagamento'));
      }
    }
    render();
  },

  async salvarCliente(nomeAntigo) {
    const nome = $('#c-nome').value.trim();
    const tel = phoneDigits($('#c-tel').value);
    const obs = $('#c-obs').value.trim();
    if (!nome) { toast('Informe o nome.', 'error'); return; }

    let cust = State.customers.find((c) => normText(c.nome) === normText(nomeAntigo));
    if (!cust) {
      cust = { id: uid(), nome: nome, telefone: tel, observacao: obs, dataCriacao: Date.now(), arquivado: false };
    } else {
      cust.nome = nome;
      cust.telefone = tel;
      cust.observacao = obs;
    }
    await Store.put('customers', cust);

    // Atualiza vendas vinculadas
    const antigoNorm = normText(nomeAntigo);
    for (const s of State.sales) {
      if (normText(s.clienteNome) === antigoNorm) {
        s.clienteNome = nome;
        s.clienteTelefone = tel;
        s.historico = s.historico || [];
        s.historico.push({ data: Date.now(), texto: 'Dados do cliente atualizados' });
        await Store.put('sales', s);
      }
    }

    await reloadData();
    closeModal();
    toast('Cliente atualizado!', 'success');
    if (State.view === 'customer') go('customer', { nome: nome, telefone: tel });
    else render();
  },

    refreshList('fiados-list', fiadosListHTML);
  },
  salesFilter(f) {

    refreshList('sales-list', salesListHTML);
  },
  reportPeriod(p) {
