<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechGestor — Gestão de Assistência Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================ TEMA / BASE ============================ */
:root{
  --bg:#0e1116; --panel:#151922; --panel2:#1a1f2a; --panel3:#212836;
  --border:#252c3a; --text:#e7eaf0; --muted:#8a93a8;
  --accent:#3b82f6; --accent-soft:rgba(59,130,246,.14);
  --green:#22c55e; --red:#ef4444; --yellow:#f59e0b; --purple:#a855f7; --cyan:#06b6d4;
  --radius:14px; --sidebar-w:252px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
body.light{
  --bg:#f2f5fa; --panel:#ffffff; --panel2:#f7f9fd; --panel3:#eef2f9;
  --border:#e1e7f1; --text:#121826; --muted:#5f6b80;
  --shadow:0 8px 24px rgba(20,40,80,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  transition:background .25s, color .25s;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============================ LAYOUT ============================ */
#app{display:flex;min-height:100vh}
#sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--panel);
  border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; z-index:60; transition:transform .25s;
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.brand-logo{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 16px rgba(59,130,246,.35);
}
.brand-txt h1{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand-txt span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.nav{flex:1;overflow-y:auto;padding:6px 10px 16px}
.nav-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.9px;text-transform:uppercase;padding:14px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:10px;
  color:var(--muted);font-weight:500;font-size:13.2px;margin-bottom:2px;
  transition:background .16s,color .16s,transform .16s; cursor:pointer; position:relative;
}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a.active::before{
  content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent);
}
.nav a svg{flex-shrink:0}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  height:64px;flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:0 22px;border-bottom:1px solid var(--border);background:var(--panel);
  position:sticky;top:0;z-index:50;
}
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);transition:.16s;position:relative;flex-shrink:0;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent);background:var(--panel3)}
#menuToggle{display:none}
.searchbox{
  flex:1;max-width:460px;display:flex;align-items:center;gap:9px;
  background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:0 12px;height:38px;transition:.16s;position:relative;
}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox input{flex:1;background:none;border:none;outline:none;font-size:13px}
.searchbox input::placeholder{color:var(--muted)}
.search-results{
  position:absolute;top:46px;left:0;right:0;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  max-height:340px;overflow:auto;padding:6px;display:none;z-index:80;
}
.search-results.show{display:block}
.sr-item{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sr-item:hover{background:var(--panel2)}
.sr-item small{color:var(--muted);font-size:11px}
.sr-tag{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.date-chip{
  font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);
  padding:8px 12px;border-radius:9px;white-space:nowrap;
}
.badge-dot{
  position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;
  background:var(--red);color:#fff;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--panel);
}
.avatar{
  width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b5cf6);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;
  cursor:pointer;flex-shrink:0;
}
#view{padding:22px;flex:1;min-width:0}

/* ============================ COMPONENTES ============================ */
.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.page-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:13px;
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 6px 18px rgba(59,130,246,.3)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--panel2);border-color:var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent);background:var(--panel3);box-shadow:none;filter:none}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.success{background:var(--green);border-color:var(--green)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.xs{padding:4px 8px;font-size:11px;border-radius:7px}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head h3{font-size:14px;font-weight:700;letter-spacing:-.2px}
.card-head .link{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer;font-weight:600}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:18px}
.kpi{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px;position:relative;overflow:hidden;transition:.18s;box-shadow:var(--shadow);
}
.kpi:hover{transform:translateY(-2px);border-color:rgba(59,130,246,.5)}
.kpi .k-top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.kpi .k-ico{
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);flex-shrink:0;
}
.kpi .k-lbl{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}
.kpi .k-val{font-size:20px;font-weight:800;letter-spacing:-.6px}
.kpi .k-sub{font-size:11px;color:var(--muted);margin-top:4px}
.kpi.green .k-ico{background:rgba(34,197,94,.14);color:var(--green)}
.kpi.red .k-ico{background:rgba(239,68,68,.14);color:var(--red)}
.kpi.yellow .k-ico{background:rgba(245,158,11,.14);color:var(--yellow)}
.kpi.purple .k-ico{background:rgba(168,85,247,.14);color:var(--purple)}
.kpi.cyan .k-ico{background:rgba(6,182,212,.14);color:var(--cyan)}

.table-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
.t-actions{display:flex;gap:5px;justify-content:flex-end}
.t-actions .icon-btn{width:28px;height:28px;border-radius:7px}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:10.8px;font-weight:700;white-space:nowrap;
}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.b-blue{background:rgba(59,130,246,.15);color:#60a5fa}
.b-green{background:rgba(34,197,94,.15);color:#4ade80}
.b-red{background:rgba(239,68,68,.15);color:#f87171}
.b-yellow{background:rgba(245,158,11,.15);color:#fbbf24}
.b-purple{background:rgba(168,85,247,.15);color:#c084fc}
.b-gray{background:rgba(138,147,168,.15);color:#9aa3b8}
.b-cyan{background:rgba(6,182,212,.15);color:#22d3ee}

/* filtros */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.filters input,.filters select{
  background:var(--panel2);border:1px solid var(--border);border-radius:9px;
  padding:8.5px 12px;font-size:12.8px;outline:none;transition:.16s;min-width:0;
}
.filters input:focus,.filters select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters input[type=text]{min-width:230px}

/* formulários */
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px}
.fld input,.fld select,.fld textarea{
  background:var(--panel2);border:1px solid var(--border);border-radius:9px;
  padding:9px 11px;font-size:13px;font-weight:400;color:var(--text);outline:none;
  transition:.16s;width:100%;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
.sec-title{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
  color:var(--accent);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);
}
.sec-title:first-child{margin-top:0}

/* modal */
.backdrop{
  position:fixed;inset:0;background:rgba(5,8,14,.72);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;
  z-index:200;overflow-y:auto;animation:fadeIn .16s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:600px;box-shadow:0 24px 70px rgba(0,0,0,.6);
  animation:slideUp .2s;margin:auto;
}
.modal.wide{max-width:900px}
.modal-head{
  display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);
}
.modal-head h3{font-size:15px;font-weight:700}
.modal-head .icon-btn{margin-left:auto;width:30px;height:30px}
.modal-body{padding:18px 20px;max-height:calc(100vh - 230px);overflow-y:auto}
.modal-foot{
  display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);
}

/* toast */
#toastRoot{position:fixed;top:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:9px}
.toast{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:11px;
  background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);
  font-size:13px;font-weight:500;min-width:250px;animation:slideIn .22s;
  border-left:3px solid var(--accent);
}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--yellow)}

/* charts */
.chart-box{position:relative;height:230px}
.chart-box canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.hbar{margin-bottom:11px}
.hbar .hbar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.hbar .hbar-top span:last-child{color:var(--muted);font-weight:600}
.hbar .track{height:7px;border-radius:5px;background:var(--panel3);overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#8b5cf6);transition:width .5s}

.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:13px}
.empty svg{opacity:.35;margin-bottom:10px}

/* listas */
.mini-list{display:flex;flex-direction:column;gap:2px}
.mini-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  cursor:pointer;transition:.14s;
}
.mini-item:hover{background:var(--panel2)}
.mini-item .mi-ico{
  width:30px;height:30px;border-radius:8px;background:var(--panel3);
  display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;
}
.mini-item .mi-txt{flex:1;min-width:0}
.mini-item .mi-txt b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-item .mi-txt small{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-item .mi-val{font-size:12.5px;font-weight:700;white-space:nowrap}

.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.dash-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}

.shortcut{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;
  border-radius:11px;background:var(--panel2);border:1px solid var(--border);
  cursor:pointer;transition:.16s;text-align:center;
}
.shortcut:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--panel3)}
.shortcut span{font-size:11px;font-weight:600;color:var(--muted)}
.shortcut .sc-ico{color:var(--accent)}

/* PDV */
.pdv{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px;margin-top:12px}
.prod-card{
  background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:12px;
  cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:6px;
}
.prod-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.prod-card .pc-name{font-size:12.5px;font-weight:600;line-height:1.3;min-height:32px}
.prod-card .pc-cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.prod-card .pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.prod-card .pc-price{font-size:14px;font-weight:800;color:var(--accent)}
.prod-card .pc-stock{font-size:10.5px;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{
  padding:6px 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);
  font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;color:var(--muted);
}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cart-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.cart-item .ci-name{flex:1;min-width:0;font-size:12.5px;font-weight:600}
.cart-item .ci-name small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.qty{display:flex;align-items:center;gap:5px}
.qty button{
  width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);
  cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;
}
.qty button:hover{border-color:var(--accent);color:var(--accent)}
.qty span{min-width:22px;text-align:center;font-size:12.5px;font-weight:700}
.tot-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.tot-row.big{font-size:17px;font-weight:800;border-top:1px solid var(--border);margin-top:8px;padding-top:11px}
.tot-row span:last-child{font-weight:700}

/* configurações */
.color-swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{
  width:34px;height:34px;border-radius:9px;cursor:pointer;border:2px solid transparent;
  transition:.16s;
}
.swatch.on{border-color:#fff;transform:scale(1.1);box-shadow:0 0 0 2px var(--accent)}

.info-note{
  background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--yellow);
  border-radius:10px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.6;
}
.info-note b{color:var(--text)}

/* impressão ficha */
.ficha h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:16px 0 8px;border-bottom:1px solid var(--border);padding-bottom:5px}
.ficha .frow{display:flex;justify-content:space-between;padding:5px 0;font-size:12.8px;border-bottom:1px dashed var(--border)}
.ficha .frow span:first-child{color:var(--muted)}

/* responsivo */
@media(max-width:1100px){
  .dash-grid,.dash-grid3{grid-template-columns:1fr}
  .pdv{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
}
@media(max-width:900px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow)}
  #sidebar.open{transform:translateX(0)}
  #menuToggle{display:flex}
  .date-chip{display:none}
  #view{padding:16px}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .searchbox{max-width:none}
}
@media(max-width:600px){
  .page-head h1{font-size:18px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .k-val{font-size:16px}
  .modal-body{max-height:calc(100vh - 200px)}
  .prod-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <header id="topbar"></header>
    <main id="view"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =====================================================================
   TECHGESTOR — Sistema de Gestão para Assistência Técnica
   Protótipo 100% local (single-file). Dados em localStorage.
   ===================================================================== */

/* ------------------------- ÍCONES (SVG inline) ------------------------- */

function icon(name, size){
  size = size || 18;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.grid)+'</svg>';
}

const esc = s => String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const nf = (n,d)=> (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});
const dOnly = s => { if(!s) return '—'; const d=new Date(s); return isNaN(d)?'—':d.toLocaleDateString('pt-BR'); };
const dFull = s => { if(!s) return '—'; const d=new Date(s); return isNaN(d)?'—':d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const isoDay = d => { const x=new Date(d); return x.toISOString().slice(0,10); };
const todayISO = ()=> isoDay(new Date());
const numOr = (v,d)=> { const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?(d||0):n; };

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast '+(type||'');
  const ic = type==='err'?'alert':(type==='ok'?'check':'bell');
  el.innerHTML = '<span style="color:var(--'+(type==='err'?'red':type==='ok'?'green':'accent')+')">'+icon(ic,16)+'</span><span>'+esc(msg)+'</span>';
  $('#toastRoot').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateX(30px)'; setTimeout(()=>el.remove(),260); }, 3200);
}
function confirmar(msg, cb){
  openModal({
    title:'Confirmação',
    body:'<p style="font-size:13.5px;line-height:1.6">'+esc(msg)+'</p>',
    submitText:'Confirmar',
    danger:true,
    onSubmit:()=>{ cb(); return true; }
  });
}
function printHTML(html){
  const f = document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d = f.contentDocument || f.contentWindow.document;
  d.open(); d.write(html); d.close();
  setTimeout(()=>{
    try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ console.warn(e); }
    setTimeout(()=>f.remove(), 1500);
  }, 350);
}
function exportCSV(filename, headers, rows){
  const lines = [headers].concat(rows);
  const csv = lines.map(r=> r.map(c=> '"'+String(c===undefined||c===null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  toast('Arquivo CSV gerado.', 'ok');
}

/* ------------------------------ PERSISTÊNCIA ------------------------------ */
function loadDB(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{ DB = JSON.parse(raw); }catch(e){ DB = null; }
  }
  if(!DB || !DB.clientes){ DB = seedData(); saveDB(); }
  // garante campos novos
  if(!DB.caixas) DB.caixas = [];
  if(!DB.atividades) DB.atividades = [];
}
function saveDB(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ console.warn('Falha ao salvar', e); }
}
function logActivity(texto){
  DB.atividades.unshift({id:uid(), texto, data:new Date().toISOString()});
  if(DB.atividades.length>60) DB.atividades.length = 60;
}

/* ------------------------------ CÁLCULOS ------------------------------ */
function osSubtotal(os){
  let s = 0;
  (os.servicos||[]).forEach(i=> s += (Number(i.preco)||0)*(Number(i.qtd)||1));
  (os.pecas||[]).forEach(i=> s += (Number(i.preco)||0)*(Number(i.qtd)||1));
  return s;
}
function osTotal(os){ return Math.max(0, osSubtotal(os) - (Number(os.desconto)||0)); }
function osCusto(os){
  let c = 0;
  (os.servicos||[]).forEach(i=> c += (Number(i.custo)||0)*(Number(i.qtd)||1));
  (os.pecas||[]).forEach(i=> c += (Number(i.custo)||0)*(Number(i.qtd)||1));
  return c;
}
function osAtrasada(os){
  if(!os.previsao) return false;
  if(os.status==='Entregue'||os.status==='Cancelado') return false;
  return new Date(os.previsao+'T23:59:59') < new Date();
}
function vendaTotalCalc(itens, desconto){
  const sub = itens.reduce((a,i)=> a + i.preco*i.qtd, 0);
  return Math.max(0, sub - (Number(desconto)||0));
}
function periodoRange(p){
  const now = new Date();
  const end = new Date(now); end.setHours(23,59,59,999);
  let start = new Date(now);
  if(p==='hoje'){ start.setHours(0,0,0,0); }
  else if(p==='7d'){ start.setDate(start.getDate()-6); start.setHours(0,0,0,0); }
  else if(p==='30d'){ start.setDate(start.getDate()-29); start.setHours(0,0,0,0); }
  else { start = new Date(now.getFullYear(), now.getMonth(), 1); }
  return {start, end};
}
function inRange(dateStr, r){
  if(!dateStr) return false;
  const d = new Date(dateStr);
  return d>=r.start && d<=r.end;
}
function receitaTotal(desde){
  let total = 0;
  DB.vendas.forEach(v=>{
    if(v.status==='Cancelada') return;
    if(desde && new Date(v.criadoEm) < desde) return;
    total += v.total;
  });
  DB.os.forEach(o=>{
    if(o.status!=='Entregue') return;
    const d = o.entregueEm || o.criadoEm;
    if(desde && new Date(d) < desde) return;
    total += osTotal(o);
  });
  return total;
}
function lucroBruto(desde){
  let lucro = 0;
  DB.vendas.forEach(v=>{
    if(v.status==='Cancelada') return;
    if(desde && new Date(v.criadoEm) < desde) return;
    v.itens.forEach(i=> lucro += (i.preco - (i.custo||0))*i.qtd);
  });
  DB.os.forEach(o=>{
    if(o.status!=='Entregue') return;
    const d = o.entregueEm || o.criadoEm;
    if(desde && new Date(d) < desde) return;
    lucro += osTotal(o) - osCusto(o);
  });
  return lucro;
}

/* ------------------------------ GRÁFICOS (canvas) ------------------------------ */
function prepCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  const w = rect.width || (cv.parentElement? cv.parentElement.clientWidth : 400) || 400;
  const h = rect.height || 220;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, w, h};
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#3b82f6';
}
function moneyShort(v){
  if(v>=1000000) return (v/1000000).toFixed(1).replace('.',',')+'M';
  if(v>=1000) return (v/1000).toFixed(1).replace('.',',')+'k';
  return Math.round(v).toString();
}
function roundRectPath(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function barChart(cv, labels, values, color){
  if(!cv) return;
  const {ctx,w,h} = prepCanvas(cv);
  color = color || cssVar('--accent');
  const pad = {l:46,r:12,t:16,b:28};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  const max = Math.max.apply(null, values.concat([1]));
  const muted = cssVar('--muted') || '#8a93a8';
  // grid
  ctx.strokeStyle = 'rgba(140,150,175,.14)'; ctx.lineWidth = 1;
  ctx.font = '11px Inter, sans-serif'; ctx.fillStyle = muted; ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const y = pad.t + ch - (ch*i/4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();
    ctx.fillText(moneyShort(max*i/4), pad.l-8, y+4);
  }
  const n = values.length || 1;
  const slot = cw/n;
  const bw = Math.min(slot*0.62, 44);
  values.forEach((v,i)=>{
    const bh = Math.max((ch*(v/max)), v>0?2:0);
    const x = pad.l + slot*i + (slot-bw)/2;
    const y = pad.t + ch - bh;
    const g = ctx.createLinearGradient(0,y,0,pad.t+ch);
    g.addColorStop(0, color);
    g.addColorStop(1, color+'22');
    ctx.fillStyle = g;
    roundRectPath(ctx, x, y, bw, bh, 5); ctx.fill();
    if(n<=16){
      ctx.fillStyle = muted; ctx.textAlign='center'; ctx.font='10.5px Inter, sans-serif';
      ctx.fillText(labels[i], pad.l + slot*i + slot/2, h-9);
    }
  });
}
function lineChart(cv, labels, values, color){
  if(!cv) return;
  const {ctx,w,h} = prepCanvas(cv);
  color = color || cssVar('--accent');
  const pad = {l:46,r:12,t:16,b:28};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  const max = Math.max.apply(null, values.concat([1]));
  const muted = cssVar('--muted') || '#8a93a8';
  ctx.strokeStyle='rgba(140,150,175,.14)'; ctx.lineWidth=1;
  ctx.font='11px Inter, sans-serif'; ctx.fillStyle=muted; ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const y = pad.t + ch - (ch*i/4);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
    ctx.fillText(moneyShort(max*i/4), pad.l-8, y+4);
  }
  const n = values.length;
  if(n===0) return;
  const px = i => pad.l + (n===1? cw/2 : (cw*i/(n-1)));
  const py = v => pad.t + ch - (ch*(v/max));
  // area
  const g = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  g.addColorStop(0, color+'55'); g.addColorStop(1, color+'00');
  ctx.beginPath(); ctx.moveTo(px(0), pad.t+ch);
  values.forEach((v,i)=> ctx.lineTo(px(i), py(v)));
  ctx.lineTo(px(n-1), pad.t+ch); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  // line
  ctx.beginPath();
  values.forEach((v,i)=> i===0? ctx.moveTo(px(i),py(v)) : ctx.lineTo(px(i),py(v)));
  ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin='round'; ctx.stroke();
  // points
  values.forEach((v,i)=>{
    ctx.beginPath(); ctx.arc(px(i), py(v), 3, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = cssVar('--panel') || '#151922'; ctx.lineWidth=1.5; ctx.stroke();
  });
  ctx.fillStyle = muted; ctx.textAlign='center'; ctx.font='10.5px Inter, sans-serif';
  if(n<=16){ values.forEach((v,i)=> ctx.fillText(labels[i], px(i), h-9)); }
}
function donutChart(cv, items){
  if(!cv) return;
  const {ctx,w,h} = prepCanvas(cv);
  const total = items.reduce((a,i)=>a+i.value,0);
  const cx = w/2, cy = h/2;
  const R = Math.min(w,h)/2 - 12;
  const r = R*0.62;
  if(total===0){
    ctx.fillStyle = cssVar('--muted'); ctx.font='13px Inter, sans-serif'; ctx.textAlign='center';
    ctx.fillText('Sem dados', cx, cy); return;
  }
  let ang = -Math.PI/2;
  items.forEach(it=>{
    const a = (it.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,R,ang,ang+a);
    ctx.arc(cx,cy,r,ang+a,ang,true);
    ctx.closePath();
    ctx.fillStyle = it.color;
    ctx.fill();
    ctx.strokeStyle = cssVar('--panel') || '#151922'; ctx.lineWidth=2; ctx.stroke();
    ang += a;
  });
  ctx.fillStyle = cssVar('--text') || '#fff';
  ctx.font = 'bold 17px Inter, sans-serif'; ctx.textAlign='center';
  ctx.fillText(String(total), cx, cy+1);
  ctx.fillStyle = cssVar('--muted') || '#888';
  ctx.font = '10.5px Inter, sans-serif';
  ctx.fillText('OS', cx, cy+16);
}

/* ------------------------------ WHATSAPP ------------------------------ */
function waLink(numero, msg){
  const n = String(numero||'').replace(/\D/g,'');
  if(!n) return null;
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(msg);
}
function montarMensagem(tipo, os){
  const c = DB.clientes.find(x=>x.id===os.clienteId) || {nome:'Cliente',whatsapp:''};
  const cfg = DB.config;
  const tpl = (cfg.msgs && cfg.msgs[tipo]) || '';
  const servicos = (os.servicos||[]).map(s=>s.nome).join(', ') || 'a definir';
  return tpl
    .replace(/\{cliente\}/g, c.nome.split(' ')[0])
    .replace(/\{equipamento\}/g, (os.equip.categoria||'equipamento')+(os.equip.marca? ' '+os.equip.marca:'')+(os.equip.modelo? ' '+os.equip.modelo:''))
    .replace(/\{empresa\}/g, cfg.empresa)
    .replace(/\{os\}/g, os.numero)
    .replace(/\{total\}/g, money(osTotal(os)))
    .replace(/\{servicos\}/g, servicos)
    .replace(/\{data\}/g, dOnly(os.criadoEm));
}
function abrirWhats(tipo, os){
  const c = DB.clientes.find(x=>x.id===os.clienteId);
  const numero = c? c.whatsapp : '';
  const msg = montarMensagem(tipo, os);
  const link = waLink(numero, msg);
  if(!link){
    toast('Cliente sem WhatsApp cadastrado.','err'); return;
  }
  openInfo('Mensagem para WhatsApp',
    '<div class="info-note" style="margin-bottom:14px">'+icon('alert',14)+' O envio <b>não é automático</b>. Revise a mensagem e confirme dentro do WhatsApp.</div>'+
    '<label class="fld">Mensagem<textarea rows="7" id="waMsg">'+esc(msg)+'</textarea></label>'+
    '<label class="fld">Número<select id="waNum">'+
      '<option value="'+esc(numero)+'">'+esc((c?c.nome:'')+' — '+numero)+'</option>'+
    '</select></label>'+
    '<a class="btn" id="waOpen" href="'+link+'" target="_blank" rel="noopener">'+icon('message',15)+' Abrir WhatsApp</a>'
  );
  setTimeout(()=>{
    const ta = $('#waMsg'), sel = $('#waNum'), a = $('#waOpen');
    if(ta && a){
      const upd = ()=>{ a.href = waLink(sel.value, ta.value); };
      ta.addEventListener('input', upd); sel.addEventListener('change', upd);
    }
  }, 30);
}

  const ticket = (vendasPeriodo.length + entreguesPeriodo.length) > 0
    ? fatPeriodo/(vendasPeriodo.length + entreguesPeriodo.length) : 0;

  const kpi = (lbl, val, ico, cls, sub) =>
    '<div class="kpi '+(cls||'')+'"><div class="k-top"><div class="k-ico">'+icon(ico,16)+'</div><div class="k-lbl">'+lbl+'</div></div>'+
    '<div class="k-val">'+val+'</div>'+(sub?'<div class="k-sub">'+sub+'</div>':'')+'</div>';

  // série de faturamento
  const dias = state.dashPeriod==='hoje' ? 1 : (state.dashPeriod==='7d'?7:(state.dashPeriod==='30d'?30:new Date().getDate()));
  const labels=[], valores=[], vendasQtd=[];
  for(let i=dias-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const d2 = new Date(d); d2.setHours(23,59,59,999);
    let v = 0;
    DB.vendas.forEach(x=>{ if(x.status==='Cancelada') return; const t=new Date(x.criadoEm); if(t>=d && t<=d2) v+=x.total; });
    DB.os.forEach(o=>{ if(o.status!=='Entregue') return; const t=new Date(o.entregueEm||o.criadoEm); if(t>=d && t<=d2) v+=osTotal(o); });
    valores.push(v);
    vendasQtd.push(DB.vendas.filter(x=> x.status!=='Cancelada' && new Date(x.criadoEm)>=d && new Date(x.criadoEm)<=d2).length);
    labels.push(d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0'));
  }

  // serviços mais realizados
  const servCount = {};
  DB.os.forEach(o=> (o.servicos||[]).forEach(s=>{ servCount[s.nome] = (servCount[s.nome]||0) + (s.qtd||1); }));
  DB.vendas.forEach(v=> v.itens.forEach(i=>{ if(i.tipo==='servico') servCount[i.nome] = (servCount[i.nome]||0) + i.qtd; }));
  const topServ = Object.keys(servCount).map(k=>({nome:k, qtd:servCount[k]})).sort((a,b)=>b.qtd-a.qtd).slice(0,5);
  const maxServ = topServ.length? topServ[0].qtd : 1;

  // status OS
  const statusCount = {};
  OS_STATUS.forEach(s=> statusCount[s]=0);
  DB.os.forEach(o=> statusCount[o.status] = (statusCount[o.status]||0)+1);
  const statusColors = {'Recebido':'#3b82f6','Em diagnóstico':'#06b6d4','Aguardando aprovação':'#f59e0b','Aguardando peça':'#eab308','Em manutenção':'#a855f7','Em testes':'#8b5cf6','Pronto para entrega':'#22c55e','Entregue':'#16a34a','Cancelado':'#ef4444'};
  const statusItems = OS_STATUS.filter(s=> statusCount[s]>0).map(s=>({label:s, value:statusCount[s], color:statusColors[s]}));

  const ultimasOS = DB.os.slice().sort((a,b)=> new Date(b.criadoEm)-new Date(a.criadoEm)).slice(0,6);
  const ultimasVendas = DB.vendas.slice().sort((a,b)=> new Date(b.criadoEm)-new Date(a.criadoEm)).slice(0,5);
  const hojeStr = todayISO();
  const agendaHoje = DB.agenda.filter(a=> a.data===hojeStr).sort((a,b)=> a.hora.localeCompare(b.hora));

  const periodBtn = (id,lbl) => '<button class="chip '+(state.dashPeriod===id?'on':'')+'" data-dashp="'+id+'">'+lbl+'</button>';

  let html = '<div class="page-head"><div><h1>Dashboard</h1><p class="sub">Visão geral da operação · dados de demonstração</p></div>'+
    '<div class="page-actions">'+
      '<button class="btn ghost" data-act="nova-os">'+icon('plus',15)+' Nova OS</button>'+
      '<button class="btn" data-act="ir-pdv">'+icon('cart',15)+' Abrir PDV</button>'+
    '</div></div>';

  html += '<div class="filters">'+periodBtn('hoje','Hoje')+periodBtn('7d','Últimos 7 dias')+periodBtn('30d','Últimos 30 dias')+periodBtn('mes','Mês atual')+'</div>';

  html += '<div class="kpis">'+
    kpi('Faturamento hoje', money(fatHoje), 'dollar', 'green', 'Vendas + OS entregues')+
    kpi('Faturamento do mês', money(fatMes), 'up', 'green', 'Mês corrente')+
    kpi('Vendas no período', vendasPeriodo.length, 'cart', '', 'Pedidos concluídos')+
    kpi('OS abertas', osAbertas.length, 'wrench', '', 'Todas em andamento')+
    kpi('Aguardando aprovação', aguardAprov.length, 'clock', 'yellow', 'Precisam de retorno')+
    kpi('Em andamento', emAndamento.length, 'refresh', 'purple', 'Diagnóstico / manutenção')+
    kpi('Prontas p/ entrega', prontas.length, 'check', 'green', 'Aguardando retirada')+
    kpi('OS atrasadas', atrasadas.length, 'alert', 'red', 'Previsão vencida')+
    kpi('Clientes cadastrados', DB.clientes.length, 'users', 'cyan', 'Base ativa')+
    kpi('Estoque baixo', estoqueBaixo.length, 'box', 'yellow', 'Produtos no mínimo')+
    kpi('Contas a pagar', money(contasPagar()), 'down', 'red', 'Em aberto')+
    kpi('Contas a receber', money(contasReceber()), 'up', 'cyan', 'Em aberto')+
    kpi('Lucro bruto estimado', money(lucroPeriodo), 'chart', 'green', 'No período selecionado')+
    kpi('Ticket médio', money(ticket), 'tag', '', 'Por atendimento')+
  '</div>';

  html += '<div class="dash-grid">'+
    '<div class="card"><div class="card-head"><h3>Faturamento por dia</h3><span class="link" data-route="relatorios">Relatórios</span></div>'+
      '<div class="chart-box"><canvas id="cFat"></canvas></div></div>'+
    '<div class="card"><div class="card-head"><h3>OS por status</h3></div>'+
      '<div class="chart-box" style="height:180px"><canvas id="cStatus"></canvas></div>'+
      '<div class="legend">'+statusItems.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.label)+' ('+s.value+')</span>').join('')+'</div></div>'+
  '</div>';

  html += '<div class="dash-grid">'+
    '<div class="card"><div class="card-head"><h3>Vendas por dia (quantidade)</h3></div>'+
      '<div class="chart-box" style="height:190px"><canvas id="cVendas"></canvas></div></div>'+
    '<div class="card"><div class="card-head"><h3>Serviços mais realizados</h3></div>'+
      (topServ.length? topServ.map(s=>
        '<div class="hbar"><div class="hbar-top"><span>'+esc(s.nome)+'</span><span>'+s.qtd+'x</span></div>'+
        '<div class="track"><div class="fill" style="width:'+Math.round(s.qtd/maxServ*100)+'%"></div></div></div>'
      ).join('') : '<div class="empty">Sem serviços registrados.</div>')+
    '</div>'+
  '</div>';

  // últimas OS + últimas vendas
  html += '<div class="dash-grid">'+
    '<div class="card"><div class="card-head"><h3>Últimas ordens de serviço</h3><span class="link" data-route="os">Ver todas</span></div>'+
      '<div class="table-wrap"><table><thead><tr><th>OS</th><th>Cliente</th><th>Equipamento</th><th>Status</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+
      ultimasOS.map(o=>'<tr style="cursor:pointer" data-act="ver-os" data-id="'+o.id+'"><td><b>'+esc(o.numero)+'</b></td><td>'+esc(nomeCliente(o.clienteId))+'</td><td>'+esc(o.equip.categoria)+'</td><td><span class="badge '+OS_BADGE[o.status]+'">'+esc(o.status)+'</span></td><td style="text-align:right;font-weight:700">'+money(osTotal(o))+'</td></tr>').join('')+
      '</tbody></table></div></div>'+
    '<div class="card"><div class="card-head"><h3>Últimas vendas</h3><span class="link" data-route="pdv">PDV</span></div>'+
      '<div class="mini-list">'+
      (ultimasVendas.length? ultimasVendas.map(v=>'<div class="mini-item"><div class="mi-ico">'+icon('cart',14)+'</div><div class="mi-txt"><b>'+esc(v.numero)+' · '+esc(nomeCliente(v.clienteId))+'</b><small>'+dFull(v.criadoEm)+' · '+esc(v.pagamento)+'</small></div><div class="mi-val">'+money(v.total)+'</div></div>').join('') : '<div class="empty">Sem vendas.</div>')+
      '</div></div>'+
  '</div>';

  html += '<div class="dash-grid3">'+
    '<div class="card"><div class="card-head"><h3>Agendamentos de hoje</h3><span class="link" data-route="agenda">Agenda</span></div>'+
      '<div class="mini-list">'+
      (agendaHoje.length? agendaHoje.map(a=>'<div class="mini-item"><div class="mi-ico">'+icon('clock',14)+'</div><div class="mi-txt"><b>'+esc(a.hora)+' · '+esc(nomeCliente(a.clienteId))+'</b><small>'+esc(a.tipo)+'</small></div></div>').join('') : '<div class="empty">Nada agendado hoje.</div>')+
      '</div></div>'+
    '<div class="card"><div class="card-head"><h3>Atividades recentes</h3></div>'+
      '<div class="mini-list">'+
      (DB.atividades.slice(0,6).map(a=>'<div class="mini-item" style="cursor:default"><div class="mi-ico">'+icon('check',13)+'</div><div class="mi-txt"><b style="font-weight:500">'+esc(a.texto)+'</b><small>'+dFull(a.data)+'</small></div></div>').join('') || '<div class="empty">Sem atividades.</div>')+
      '</div></div>'+
    '<div class="card"><div class="card-head"><h3>Atalhos rápidos</h3></div>'+
      '<div class="grid" style="grid-template-columns:1fr 1fr;gap:9px">'+
        shortcut('wrench','Nova OS','nova-os')+
        shortcut('cart','PDV','ir-pdv')+
        shortcut('users','Novo cliente','novo-cliente')+
        shortcut('box','Produtos','ir-produtos')+
        shortcut('calendar','Agenda','ir-agenda')+
        shortcut('chart','Relatórios','ir-relatorios')+
      '</div></div>'+
  '</div>';

  // alertas
  const alertas = [];
  atrasadas.slice(0,3).forEach(o=> alertas.push({c:'var(--red)', t:'OS '+o.numero+' está atrasada', s:nomeCliente(o.clienteId)+' · previsão '+dOnly(o.previsao)}));
  estoqueBaixo.slice(0,3).forEach(p=> alertas.push({c:'var(--yellow)', t:'Estoque baixo: '+p.nome, s:'Restam '+p.qtd+' un. (mínimo '+p.min+')'}));
  DB.financeiro.filter(f=> f.tipo==='despesa' && !f.pago && new Date(f.vencimento)<new Date()).slice(0,3).forEach(f=> alertas.push({c:'var(--red)', t:'Conta vencida: '+f.descricao, s:money(f.valor)+' · venceu em '+dOnly(f.vencimento)}));
  if(alertas.length){
    html += '<div class="card"><div class="card-head"><h3>Alertas importantes</h3></div><div class="mini-list">'+
      alertas.map(a=>'<div class="mini-item" style="cursor:default"><div class="mi-ico" style="color:'+a.c+'">'+icon('alert',14)+'</div><div class="mi-txt"><b>'+esc(a.t)+'</b><small>'+esc(a.s)+'</small></div></div>').join('')+
      '</div></div>';
  }

  AFTER.push(()=>{
    barChart($('#cFat'), labels, valores);
    barChart($('#cVendas'), labels, vendasQtd, '#a855f7');
    donutChart($('#cStatus'), statusItems);
  });

  return html;
};
function shortcut(ico, lbl, act){
  return '<div class="shortcut" data-act="'+act+'"><span class="sc-ico">'+icon(ico,19)+'</span><span>'+lbl+'</span></div>';
}

ROUTES.os = function(){
  const f = state.osFiltro;
  let list = DB.os.slice().sort((a,b)=> new Date(b.criadoEm)-new Date(a.criadoEm));
  if(f.status!=='Todos') list = list.filter(o=> o.status===f.status);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(o=>{
      const c = DB.clientes.find(x=>x.id===o.clienteId) || {};
      const hay = (o.numero+' '+(c.nome||'')+' '+(c.telefone||'')+' '+o.equip.categoria+' '+o.equip.marca+' '+o.equip.modelo+' '+o.status).toLowerCase();
      return hay.indexOf(q)>=0;
    });
  }

  let html = '<div class="page-head"><div><h1>Ordens de Serviço</h1><p class="sub">'+list.length+' ordem(ns) listada(s)</p></div>'+
    '<div class="page-actions"><button class="btn" data-act="nova-os">'+icon('plus',15)+' Nova OS</button></div></div>';

  html += '<div class="filters">'+
    '<input type="text" id="osq" placeholder="Buscar por número, cliente, telefone, equipamento..." value="'+esc(f.q)+'">'+
    '<select id="osStatus"><option value="Todos">Todos os status</option>'+OS_STATUS.map(s=>'<option '+(f.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select>'+
    '<button class="btn ghost sm" data-act="limpar-os-filtro">Limpar</button>'+
    '<button class="btn ghost sm" data-act="csv-os">'+icon('download',13)+' CSV</button>'+
  '</div>';

  if(!list.length){
    html += '<div class="card"><div class="empty">'+icon('wrench',40)+'<div>Nenhuma OS encontrada.</div></div></div>';
    return html;
  }

  html += '<div class="card"><div class="table-wrap"><table><thead><tr>'+
    '<th>Nº OS</th><th>Cliente</th><th>Equipamento</th><th>Status</th><th>Técnico</th><th>Previsão</th><th style="text-align:right">Total</th><th></th>'+
    '</tr></thead><tbody>';
  list.forEach(o=>{
    const t = DB.tecnicos.find(x=>x.id===o.tecnicoId);
    const atras = osAtrasada(o);
    html += '<tr>'+
      '<td><b>'+esc(o.numero)+'</b>'+(atras?' <span class="badge b-red" style="font-size:9px">atrasada</span>':'')+'</td>'+
      '<td>'+esc(nomeCliente(o.clienteId))+'</td>'+
      '<td>'+esc(o.equip.categoria)+'<br><small style="color:var(--muted)">'+esc(o.equip.marca+' '+o.equip.modelo)+'</small></td>'+
      '<td><span class="badge '+OS_BADGE[o.status]+'">'+esc(o.status)+'</span></td>'+
      '<td>'+esc(t? t.nome : '—')+'</td>'+
      '<td>'+dOnly(o.previsao)+'</td>'+
      '<td style="text-align:right;font-weight:700">'+money(osTotal(o))+'</td>'+
      '<td><div class="t-actions">'+
        '<button class="icon-btn" title="Ver ficha" data-act="ver-os" data-id="'+o.id+'">'+icon('eye',13)+'</button>'+
        '<button class="icon-btn" title="Editar" data-act="editar-os" data-id="'+o.id+'">'+icon('edit',13)+'</button>'+
        '<button class="icon-btn" title="Alterar status" data-act="status-os" data-id="'+o.id+'">'+icon('refresh',13)+'</button>'+
        '<button class="icon-btn" title="Imprimir" data-act="imprimir-os" data-id="'+o.id+'">'+icon('printer',13)+'</button>'+
      '</div></td>'+
    '</tr>';
  });
  html += '</tbody></table></div></div>';

  AFTER.push(()=>{
    const q = $('#osq');
    if(q) q.addEventListener('input', ()=>{ state.osFiltro.q = q.value; render(); setTimeout(()=>{ const n=$('#osq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },0); });
    const s = $('#osStatus');
    if(s) s.addEventListener('change', ()=>{ state.osFiltro.status = s.value; render(); });
  });
  return html;
};

    '<div class="grid2">'+

      '<div style="display:flex;align-items:flex-end;padding-bottom:12px"><button type="button" class="btn ghost sm" id="addServ">'+icon('plus',13)+' Adicionar serviço</button></div>'+
    '</div>'+
    '<div id="listServ" style="margin-bottom:10px"></div>'+
    '<div class="grid2">'+
      '<div><label class="fld">Peça / produto<select id="selPeca"><option value="">Selecione...</option>'+DB.produtos.map(p=>'<option value="'+p.id+'">'+esc(p.nome)+' — '+money(p.preco)+'</option>').join('')+'</select></div>'+
      '<div style="display:flex;align-items:flex-end;padding-bottom:12px"><button type="button" class="btn ghost sm" id="addPeca">'+icon('plus',13)+' Adicionar peça</button></div>'+
    '</div>'+

      '<label class="fld">Desconto (R$)<input name="desconto" type="number" step="0.01" min="0" value="'+(os?os.desconto:0)+'"></label>'+

    '<div class="info-note" id="osResumo"></div>';

  openModal({
    title: os? 'Editar OS '+os.numero : 'Abrir nova Ordem de Serviço',
    body,
    wide:true,
    submitText: os? 'Salvar alterações' : 'Abrir OS',
    onSubmit(data){
      if(!data.clienteId){ toast('Selecione um cliente.','err'); return false; }
      if(!data.defeito.trim()){ toast('Descreva o defeito relatado.','err'); return false; }
      const equipObj = {categoria:data.categoria, marca:data.marca, modelo:data.modelo, serie:data.serie, acessorios:data.acessorios};
      if(os){
        const oldStatus = os.status;
        Object.assign(os, {
          clienteId:data.clienteId, equip:equipObj, defeito:data.defeito, diagnostico:data.diagnostico,
          servicos:draft.servicos, pecas:draft.pecas, desconto:numOr(data.desconto), sinal:numOr(data.sinal),
          tecnicoId:data.tecnicoId, previsao:data.previsao, status:data.status, obs:data.obs
        });
        if(oldStatus!=='Entregue' && data.status==='Entregue'){ os.entregueEm = new Date().toISOString(); registrarReceitaOS(os); }
        os.historico = os.historico || [];
        os.historico.push({data:new Date().toISOString(), texto:'OS editada'});
        if(oldStatus!==data.status) os.historico.push({data:new Date().toISOString(), texto:'Status alterado para '+data.status});
        logActivity('OS '+os.numero+' atualizada');
        toast('OS atualizada com sucesso.','ok');
      } else {
        const numero = DB.config.osPrefix+'-'+(DB.config.osNext++);
        const nova = {
          id:uid(), numero, clienteId:data.clienteId, equip:equipObj, defeito:data.defeito, diagnostico:data.diagnostico,
          servicos:draft.servicos, pecas:draft.pecas, desconto:numOr(data.desconto), sinal:numOr(data.sinal),
          tecnicoId:data.tecnicoId, previsao:data.previsao, obs:data.obs, status:data.status,
          criadoEm:new Date().toISOString(), entregueEm:null,
          historico:[{data:new Date().toISOString(), texto:'OS aberta — '+data.status}]
        };
        DB.os.unshift(nova);
        // baixa de estoque das peças
        draft.pecas.forEach(p=>{
          const prod = DB.produtos.find(x=>x.id===p.id);
          if(prod){ prod.qtd = Math.max(0, prod.qtd - p.qtd); prod.movs = prod.movs||[]; prod.movs.push({data:new Date().toISOString(),tipo:'Saída',qtd:p.qtd,obs:'OS '+numero}); }
        });
        logActivity('Nova OS aberta: '+numero);
        toast('OS '+numero+' aberta com sucesso.','ok');
      }
      saveDB(); render();
      return true;
    }

  setTimeout(()=>{
    const renderItens = ()=>{
      const ls = $('#listServ'), lp = $('#listPeca');

        '<div class="cart-item"><div class="ci-name">'+esc(s.nome)+'<small>'+money(s.preco)+' × '+s.qtd+'</small></div>'+
        '<div class="qty"><button type="button" data-qtds="-1" data-i="'+i+'">−</button><span>'+s.qtd+'</span><button type="button" data-qtds="1" data-i="'+i+'">+</button></div>'+
        '<button type="button" class="icon-btn" data-dels="'+i+'" style="width:26px;height:26px">'+icon('trash',12)+'</button></div>'
      ).join('') : '<div style="font-size:12px;color:var(--muted);padding:4px 0 8px">Nenhum serviço adicionado.</div>';
      if(lp) lp.innerHTML = draft.pecas.length ? draft.pecas.map((p,i)=>
        '<div class="cart-item"><div class="ci-name">'+esc(p.nome)+'<small>'+money(p.preco)+' × '+p.qtd+'</small></div>'+
        '<div class="qty"><button type="button" data-qtdp="-1" data-i="'+i+'">−</button><span>'+p.qtd+'</span><button type="button" data-qtdp="1" data-i="'+i+'">+</button></div>'+
        '<button type="button" class="icon-btn" data-delp="'+i+'" style="width:26px;height:26px">'+icon('trash',12)+'</button></div>'
      ).join('') : '<div style="font-size:12px;color:var(--muted);padding:4px 0 8px">Nenhuma peça adicionada.</div>';
      atualizarResumo();
    };
    const atualizarResumo = ()=>{
      const f = $('#mform');
      if(!f) return;
      const desc = numOr(f.desconto.value);
      const sinal = numOr(f.sinal.value);
      const sub = draft.servicos.reduce((a,s)=>a+s.preco*s.qtd,0) + draft.pecas.reduce((a,p)=>a+p.preco*p.qtd,0);
      const total = Math.max(0, sub-desc);
      const el = $('#osResumo');
      if(el) el.innerHTML = '<b>Subtotal:</b> '+money(sub)+' &nbsp;·&nbsp; <b>Desconto:</b> '+money(desc)+' &nbsp;·&nbsp; <b>Total:</b> '+money(total)+' &nbsp;·&nbsp; <b>Sinal:</b> '+money(sinal)+' &nbsp;·&nbsp; <b>Restante:</b> '+money(Math.max(0,total-sinal));
    };
    renderItens();

    const selServ = $('#selServ');
    const addServ = $('#addServ');
    if(addServ) addServ.addEventListener('click', ()=>{
      const s = DB.servicos.find(x=>x.id===selServ.value);
      if(!s){ toast('Selecione um serviço.','warn'); return; }
      const ex = draft.servicos.find(x=>x.id===s.id);
      if(ex) ex.qtd++; else draft.servicos.push({id:s.id, nome:s.nome, preco:s.preco, custo:s.custo, qtd:1});
      renderItens();
    });
    const selPeca = $('#selPeca');
    const addPeca = $('#addPeca');
    if(addPeca) addPeca.addEventListener('click', ()=>{
      const p = DB.produtos.find(x=>x.id===selPeca.value);
      if(!p){ toast('Selecione uma peça.','warn'); return; }
      const ex = draft.pecas.find(x=>x.id===p.id);
      if(ex) ex.qtd++; else draft.pecas.push({id:p.id, nome:p.nome, preco:p.preco, custo:p.custo, qtd:1});
      renderItens();
    });
    document.addEventListener('click', function h(e){
      const t = e.target.closest('[data-qtds],[data-qtdp],[data-dels],[data-delp]');
      if(!t) return;
      if(t.dataset.qtds){
        const i = +t.dataset.i; draft.servicos[i].qtd = Math.max(1, draft.servicos[i].qtd + (+t.dataset.qtds));
      } else if(t.dataset.qtdp){
        const i = +t.dataset.i; draft.pecas[i].qtd = Math.max(1, draft.pecas[i].qtd + (+t.dataset.qtdp));
      } else if(t.dataset.dels!==undefined && t.hasAttribute('data-dels')){
        draft.servicos.splice(+t.dataset.dels,1);
      } else if(t.hasAttribute('data-delp')){
        draft.pecas.splice(+t.dataset.delp,1);
      }
      renderItens();
    }, {once:false});
    ['desconto','sinal'].forEach(n=>{ const el = document.querySelector('#mform [name='+n+']'); if(el) el.addEventListener('input', atualizarResumo); });

    const pick = $('#pickEquip');
    if(pick) pick.addEventListener('change', ()=>{
      const e = DB.equipamentos.find(x=>x.id===pick.value);
      if(!e) return;
      const f = $('#mform');
      f.categoria.value = e.categoria;
      f.marca.value = e.marca;
      f.modelo.value = e.modelo;
      f.serie.value = e.serie;
      if(!f.clienteId.value) f.clienteId.value = e.clienteId;
    });
  }, 40);
}

function pdvAdd(id){
  if(state.pdvMode==='produtos'){
    const p = DB.produtos.find(x=>x.id===id);
    if(!p) return;
    if(p.qtd<=0){ toast('Produto esgotado.','err'); return; }
    const ex = state.pdvCart.find(i=> i.tipo==='produto' && i.id===id);
    const atual = ex? ex.qtd : 0;
    if(atual+1 > p.qtd){ toast('Estoque insuficiente.','err'); return; }
    if(ex) ex.qtd++; else state.pdvCart.push({tipo:'produto', id:p.id, nome:p.nome, preco:p.preco, custo:p.custo, qtd:1});
  } else {
    const s = DB.servicos.find(x=>x.id===id);
    if(!s) return;
    const ex = state.pdvCart.find(i=> i.tipo==='servico' && i.id===id);
    if(ex) ex.qtd++; else state.pdvCart.push({tipo:'servico', id:s.id, nome:s.nome, preco:s.preco, custo:s.custo, qtd:1});
  }
  render();
}
function pdvFinalizar(){
  if(!state.pdvCart.length){ toast('Carrinho vazio.','err'); return; }
  const sub = state.pdvCart.reduce((a,i)=> a+i.preco*i.qtd, 0);
  const desc = Math.min(state.pdvDesconto||0, sub);
  const total = sub - desc;
  const pgto = state.pdvPgto || 'Pix';
  const clienteId = state.pdvCliente || '';
  const numero = 'V-'+(2011 + DB.vendas.length);
  const venda = {
    id:uid(), numero, clienteId, itens: clone(state.pdvCart), desconto:desc, total, pagamento:pgto,
    criadoEm:new Date().toISOString(), status:'Concluída'
  };
  DB.vendas.unshift(venda);
  // baixa de estoque
  state.pdvCart.forEach(i=>{
    if(i.tipo==='produto'){
      const p = DB.produtos.find(x=>x.id===i.id);
      if(p){ p.qtd = Math.max(0, p.qtd - i.qtd); p.movs = p.movs||[]; p.movs.push({data:new Date().toISOString(), tipo:'Saída', qtd:i.qtd, obs:'Venda '+numero}); }
    }
  });
  // financeiro
  DB.financeiro.push({id:uid(), tipo:'receita', descricao:'Venda '+numero, categoria: i_temServico(state.pdvCart)?'Serviços':'Vendas', valor:total, vencimento:todayISO(), pago:true, pagoEm:new Date().toISOString(), origem:'venda'});
  // caixa
  let caixaAberto = DB.caixas.find(c=> !c.fechado);
  if(caixaAberto){
    caixaAberto.movimentos.push({id:uid(), tipo:'entrada', descricao:'Venda '+numero, valor:total, hora:new Date().toISOString()});
  }
  logActivity('Venda '+numero+' registrada no valor de '+money(total));
  saveDB();

  const itensHTML = venda.itens.map(i=>'<tr><td>'+esc(i.nome)+'</td><td>'+i.qtd+'</td><td>'+money(i.preco)+'</td><td>'+money(i.preco*i.qtd)+'</td></tr>').join('');
  openInfo('Venda concluída — '+numero,
    '<div style="text-align:center;margin-bottom:16px"><div style="width:54px;height:54px;border-radius:50%;background:rgba(34,197,94,.15);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px">'+icon('check',26)+'</div>'+
    '<div style="font-size:17px;font-weight:800">'+money(total)+'</div><div style="color:var(--muted);font-size:12px">'+esc(pgto)+' · '+esc(nomeCliente(clienteId))+'</div></div>'+
    '<table><thead><tr><th>Item</th><th>Qtd</th><th>Unit.</th><th>Total</th></tr></thead><tbody>'+itensHTML+'</tbody></table>'+
    '<div style="margin-top:14px;display:flex;gap:8px"><button class="btn ghost sm" data-act="imprimir-venda" data-id="'+venda.id+'">'+icon('printer',13)+' Imprimir comprovante</button>'+
    '<button class="btn sm" data-act="fechar-modal">OK</button></div>'
  );
  state.pdvCart = []; state.pdvDesconto = 0; state.pdvCliente = '';
  render();
}
function i_temServico(itens){ return itens.some(i=> i.tipo==='servico'); }

function cancelarVenda(id){
  const v = DB.vendas.find(x=>x.id===id);
  if(!v) return;
  confirmar('Cancelar a venda '+v.numero+'? O valor de '+money(v.total)+' será removido do financeiro e o estoque será reposto.', ()=>{
    v.status = 'Cancelada';
    // repõe estoque
    v.itens.forEach(i=>{
      if(i.tipo==='produto'){
        const p = DB.produtos.find(x=>x.id===i.id);
        if(p){ p.qtd += i.qtd; p.movs = p.movs||[]; p.movs.push({data:new Date().toISOString(),tipo:'Entrada',qtd:i.qtd,obs:'Cancelamento '+v.numero}); }
      }
    });
    DB.financeiro = DB.financeiro.filter(f=> f.descricao.indexOf(v.numero)<0 || f.origem!=='venda');
    logActivity('Venda '+v.numero+' cancelada');
    saveDB(); closeModal(); render(); toast('Venda cancelada.','ok');
  });
}

function movEstoque(id){
  const p = DB.produtos.find(x=>x.id===id);
  if(!p) return;
  openModal({
    title:'Movimentar estoque — '+p.nome,
    body:
      '<div class="info-note" style="margin-bottom:12px">Estoque atual: <b>'+p.qtd+' un.</b> · Mínimo: '+p.min+'</div>'+
      '<div class="grid2"><label class="fld">Tipo<select name="tipo"><option>Entrada</option><option>Saída</option><option>Ajuste</option></select></label>'+
      '<label class="fld">Quantidade<input name="qtd" type="number" min="1" value="1"></label></div>'+
      '<label class="fld">Observação<input name="obs" placeholder="Ex.: compra de fornecedor"></label>'+
      (p.movs&&p.movs.length? '<div class="sec-title">Últimas movimentações</div>'+p.movs.slice(-6).reverse().map(m=>'<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px dashed var(--border)"><span>'+esc(m.tipo)+' · '+esc(m.obs||'—')+'</span><span style="color:var(--muted)">'+m.qtd+' un · '+dOnly(m.data)+'</span></div>').join('') : ''),
    submitText:'Registrar',
    onSubmit(d){
      const q = Math.round(numOr(d.qtd));
      if(q<=0){ toast('Quantidade inválida.','err'); return false; }
      if(d.tipo==='Entrada') p.qtd += q;
      else if(d.tipo==='Saída') p.qtd = Math.max(0, p.qtd-q);
      else p.qtd = q;
      p.movs = p.movs||[];
      p.movs.push({data:new Date().toISOString(), tipo:d.tipo, qtd:q, obs:d.obs});
      logActivity('Estoque de "'+p.nome+'" movimentado ('+d.tipo+' '+q+')');
      saveDB(); render(); toast('Estoque atualizado.','ok'); return true;
    }
  });
}

  let list = DB.financeiro.slice().sort((a,b)=> new Date(a.vencimento)-new Date(b.vencimento));
  if(filtro.tipo!=='Todos') list = list.filter(f=> f.tipo===filtro.tipo);
  if(filtro.situacao==='Pago') list = list.filter(f=> f.pago);
  if(filtro.situacao==='Aberto') list = list.filter(f=> !f.pago);
  if(filtro.q) list = list.filter(f=> (f.descricao+' '+f.categoria).toLowerCase().indexOf(filtro.q.toLowerCase())>=0);

  const receitasPagas = DB.financeiro.filter(f=> f.tipo==='receita' && f.pago).reduce((a,f)=>a+f.valor,0);
  const despesasPagas = DB.financeiro.filter(f=> f.tipo==='despesa' && f.pago).reduce((a,f)=>a+f.valor,0);

    '<div class="kpi '+(saldo>=0?'cyan':'red')+'"><div class="k-top"><div class="k-ico">'+icon('wallet',15)+'</div><div class="k-lbl">Saldo realizado</div></div><div class="k-val">'+money(saldo)+'</div></div>'+
    '<div class="kpi yellow"><div class="k-top"><div class="k-ico">'+icon('clock',15)+'</div><div class="k-lbl">A pagar</div></div><div class="k-val">'+money(contasPagar())+'</div></div>'+
    '<div class="kpi purple"><div class="k-top"><div class="k-ico">'+icon('clock',15)+'</div><div class="k-lbl">A receber</div></div><div class="k-val">'+money(contasReceber())+'</div></div>'+

    '<select id="finSit"><option value="Todos">Todas as situações</option><option '+(filtro.situacao==='Pago'?'selected':'')+' value="Pago">Pagas</option><option '+(filtro.situacao==='Aberto'?'selected':'')+' value="Aberto">Em aberto</option></select>'+
  '</div>';

  html += '<div class="card"><div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Vencimento</th><th style="text-align:right">Valor</th><th>Situação</th><th></th></tr></thead><tbody>';
  if(!list.length) html += '<tr><td colspan="7"><div class="empty">Nenhum lançamento encontrado.</div></td></tr>';
  list.forEach(f=>{
    const vencido = !f.pago && new Date(f.vencimento) < new Date();
    html += '<tr><td><b>'+esc(f.descricao)+'</b></td><td>'+esc(f.categoria)+'</td>'+
      '<td><span class="badge '+(f.tipo==='receita'?'b-green':'b-red')+'">'+(f.tipo==='receita'?'Receita':'Despesa')+'</span></td>'+
      '<td>'+dOnly(f.vencimento)+(vencido?' <span class="badge b-red" style="font-size:9px">vencido</span>':'')+'</td>'+

      '<td><span class="badge '+(f.pago?'b-green':'b-yellow')+'">'+(f.pago?'Pago':'Em aberto')+'</span></td>'+
      '<td><div class="t-actions">'+

   ==================================================================== */
ROUTES.caixa = function(){
  const aberto = DB.caixas.find(c=> !c.fechado);
  const ultimos = DB.caixas.filter(c=> c.fechado).slice().sort((a,b)=> new Date(b.fechadoEm)-new Date(a.fechadoEm));

  const calc = c => {
    const ent = (c.movimentos||[]).filter(m=> m.tipo==='entrada').reduce((a,m)=>a+m.valor,0);
    const sai = (c.movimentos||[]).filter(m=> m.tipo==='saida').reduce((a,m)=>a+m.valor,0);
    return {ent, sai, esperado: c.valorInicial + ent - sai};
  };

  let html = '<div class="page-head"><div><h1>Controle de Caixa</h1><p class="sub">Abertura, movimentações e fechamento</p></div></div>';

  if(aberto){
    const s = calc(aberto);
    html += '<div class="kpis">'+
      '<div class="kpi"><div class="k-top"><div class="k-ico">'+icon('wallet',15)+'</div><div class="k-lbl">Valor inicial</div></div><div class="k-val">'+money(aberto.valorInicial)+'</div></div>'+
      '<div class="kpi green"><div class="k-top"><div class="k-ico">'+icon('up',15)+'</div><div class="k-lbl">Entradas</div></div><div class="k-val">'+money(s.ent)+'</div></div>'+
      '<div class="kpi red"><div class="k-top"><div class="k-ico">'+icon('down',15)+'</div><div class="k-lbl">Saídas</div></div><div class="k-val">'+money(s.sai)+'</div></div>'+
      '<div class="kpi cyan"><div class="k-top"><div class="k-ico">'+icon('dollar',15)+'</div><div class="k-lbl">Saldo esperado</div></div><div class="k-val">'+money(s.esperado)+'</div></div>'+
    '</div>';
    html += '<div class="dash-grid"><div class="card"><div class="card-head"><h3>Caixa aberto desde '+dFull(aberto.abertoEm)+'</h3>'+
      '<span class="link" data-act="novo-mov-caixa">+ Movimentação</span></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Descrição</th><th>Hora</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+
      ((aberto.movimentos||[]).length? aberto.movimentos.slice().reverse().map(m=>
        '<tr><td><span class="badge '+(m.tipo==='entrada'?'b-green':'b-red')+'">'+(m.tipo==='entrada'?'Entrada':'Saída')+'</span></td><td>'+esc(m.descricao)+'</td><td>'+dFull(m.hora)+'</td>'+
        '<td style="text-align:right;font-weight:700;color:'+(m.tipo==='entrada'?'var(--green)':'var(--red)')+'">'+(m.tipo==='entrada'?'+':'−')+' '+money(m.valor)+'</td></tr>'
      ).join('') : '<tr><td colspan="4"><div class="empty">Nenhuma movimentação.</div></td></tr>')+
      '</tbody></table></div></div>'+
      '<div class="card"><div class="card-head"><h3>Fechamento</h3></div>'+
        '<p style="font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:12px">Saldo esperado: <b style="color:var(--text)">'+money(s.esperado)+'</b><br>Informe o valor contado em dinheiro para calcular a diferença.</p>'+
        '<button class="btn" style="width:100%;justify-content:center" data-act="fechar-caixa">'+icon('check',15)+' Fechar caixa</button>'+
      '</div></div>';
  } else {
    html += '<div class="card" style="text-align:center;padding:36px">'+
      '<div style="width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">'+icon('wallet',26)+'</div>'+
      '<h3 style="font-size:16px;margin-bottom:6px">Nenhum caixa aberto</h3>'+
      '<p style="color:var(--muted);font-size:13px;margin-bottom:16px">Abra o caixa informando o valor inicial (fundo de troco).</p>'+
      '<button class="btn" data-act="abrir-caixa">'+icon('plus',15)+' Abrir caixa</button></div>';
  }

  html += '<div class="card" style="margin-top:14px"><div class="card-head"><h3>Histórico de caixas</h3></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Abertura</th><th>Fechamento</th><th style="text-align:right">Inicial</th><th style="text-align:right">Esperado</th><th style="text-align:right">Informado</th><th style="text-align:right">Diferença</th></tr></thead><tbody>'+
    (ultimos.length? ultimos.map(c=>{
      const s = calc(c);
      const dif = (c.valorInformado||0) - s.esperado;
      return '<tr><td>'+dFull(c.abertoEm)+'</td><td>'+dFull(c.fechadoEm)+'</td>'+
        '<td style="text-align:right">'+money(c.valorInicial)+'</td>'+
        '<td style="text-align:right">'+money(s.esperado)+'</td>'+
        '<td style="text-align:right">'+money(c.valorInformado)+'</td>'+
        '<td style="text-align:right;font-weight:700;color:'+(dif<0?'var(--red)':dif>0?'var(--green)':'var(--muted)')+'">'+money(dif)+'</td></tr>';
    }).join('') : '<tr><td colspan="6"><div class="empty">Nenhum caixa fechado.</div></td></tr>')+
    '</tbody></table></div></div>';

  return html;
};

ROUTES.tecnicos = function(){
  const cards = DB.tecnicos.map(t=>{
    const os = DB.os.filter(o=> o.tecnicoId===t.id);
    const concluidas = os.filter(o=> o.status==='Entregue');
    const pendentes = os.filter(o=> OS_ABERTAS.indexOf(o.status)>=0);
    const fat = concluidas.reduce((a,o)=> a+osTotal(o),0);
    const comissao = t.comissaoTipo==='percentual' ? fat*(t.comissaoValor/100) : t.comissaoValor*concluidas.length;
    return '<div class="card">'+
      '<div style="display:flex;gap:11px;align-items:center;margin-bottom:12px">'+
        '<div class="avatar" style="width:40px;height:40px">'+esc(t.nome.split(' ').map(p=>p[0]).slice(0,2).join(''))+'</div>'+
        '<div><div style="font-weight:700">'+esc(t.nome)+'</div><div style="font-size:11.5px;color:var(--muted)">'+esc(t.funcao)+' · '+esc(t.telefone)+'</div></div>'+
        '<span class="badge '+(t.situacao==='Ativo'?'b-green':'b-gray')+'" style="margin-left:auto">'+esc(t.situacao)+'</span>'+
      '</div>'+
      '<div class="grid" style="grid-template-columns:1fr 1fr;gap:9px">'+
        miniStat('OS atribuídas', os.length)+
        miniStat('Concluídas', concluidas.length)+
        miniStat('Pendentes', pendentes.length)+
        miniStat('Faturamento', money(fat))+
      '</div>'+
      '<div class="info-note" style="margin-top:11px;font-size:11.5px">Comissão estimada: <b>'+money(comissao)+'</b><br>'+
      (t.comissaoTipo==='percentual'? t.comissaoValor+'% sobre serviços concluídos' : money(t.comissaoValor)+' por OS concluída')+'</div>'+
      '<div style="display:flex;gap:6px;margin-top:10px">'+
        '<button class="btn ghost sm" data-act="editar-tecnico" data-id="'+t.id+'">'+icon('edit',12)+' Editar</button>'+
        '<button class="btn ghost sm" data-act="excluir-tecnico" data-id="'+t.id+'">'+icon('trash',12)+' Excluir</button>'+
      '</div>'+
    '</div>';
  }).join('');

  let html = '<div class="page-head"><div><h1>Técnicos & Comissões</h1><p class="sub">Comissões são estimativas calculadas conforme as regras configuradas</p></div>'+
    '<div class="page-actions"><button class="btn" data-act="novo-tecnico">'+icon('plus',15)+' Novo técnico</button></div></div>';
  html += '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">'+cards+'</div>';

  html += '<div class="card" style="margin-top:14px"><div class="card-head"><h3>OS por técnico</h3></div><div class="table-wrap"><table><thead><tr><th>Técnico</th><th>OS</th><th>Concluídas</th><th>Pendentes</th><th style="text-align:right">Faturamento</th><th style="text-align:right">Comissão estimada</th></tr></thead><tbody>'+
    DB.tecnicos.map(t=>{
      const os = DB.os.filter(o=> o.tecnicoId===t.id);
      const conc = os.filter(o=> o.status==='Entregue');
      const fat = conc.reduce((a,o)=> a+osTotal(o),0);
      const com = t.comissaoTipo==='percentual'? fat*(t.comissaoValor/100) : t.comissaoValor*conc.length;
      return '<tr><td><b>'+esc(t.nome)+'</b></td><td>'+os.length+'</td><td>'+conc.length+'</td><td>'+os.filter(o=>OS_ABERTAS.indexOf(o.status)>=0).length+'</td>'+
        '<td style="text-align:right">'+money(fat)+'</td><td style="text-align:right;font-weight:700">'+money(com)+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';

  return html;
};
function miniStat(l,v){
  return '<div style="background:var(--panel2);border-radius:9px;padding:9px 11px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">'+l+'</div><div style="font-size:14px;font-weight:700;margin-top:2px">'+v+'</div></div>';
}
function tecnicoForm(id){
  const t = id? DB.tecnicos.find(x=>x.id===id) : null;
  openModal({
    title: t? 'Editar técnico' : 'Novo técnico',
    body:
      '<label class="fld">Nome *<input name="nome" required value="'+esc(t?t.nome:'')+'"></label>'+
      '<div class="grid2"><label class="fld">Telefone<input name="telefone" value="'+esc(t?t.telefone:'')+'"></label>'+
      '<label class="fld">Função<input name="funcao" value="'+esc(t?t.funcao:'Técnico')+'"></label></div>'+
      '<div class="grid2"><label class="fld">Situação<select name="situacao"><option '+(t&&t.situacao==='Ativo'?'selected':'')+'>Ativo</option><option '+(t&&t.situacao==='Inativo'?'selected':'')+'>Inativo</option></select></label>'+
      '<label class="fld">Tipo de comissão<select name="comissaoTipo"><option value="percentual" '+(t&&t.comissaoTipo==='percentual'?'selected':'')+'>Percentual (%)</option><option value="fixo" '+(t&&t.comissaoTipo==='fixo'?'selected':'')+'>Valor fixo por OS</option></select></label></div>'+
      '<label class="fld">Valor da comissão<input name="comissaoValor" type="number" step="0.01" min="0" value="'+(t?t.comissaoValor:DB.config.comissaoPct)+'"></label>',
    onSubmit(d){
      if(!d.nome.trim()){ toast('Informe o nome.','err'); return false; }
      const obj = {nome:d.nome, telefone:d.telefone, funcao:d.funcao, situacao:d.situacao, comissaoTipo:d.comissaoTipo, comissaoValor:numOr(d.comissaoValor)};
      if(t){ Object.assign(t,obj); toast('Técnico atualizado.','ok'); }
      else { DB.tecnicos.push(Object.assign({id:uid()},obj)); toast('Técnico cadastrado.','ok'); }
      saveDB(); render(); return true;
    }
  });
}
