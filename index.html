if(a==='cview'){c=find('cl',i);var s=stt(c.d);return modal('<h3>'+esc(c.n)+'</h3><dl class="dl"><dt>Plataforma</dt><dd>'+(c.p==='wa'?'WhatsApp':'Telegram')+'</dd><dt>Contato</dt><dd>'+esc(c.ct)+'</dd><dt>Validade</dt><dd>'+fd(c.d)+'</dd><dt>Valor</dt><dd>'+brl(c.v)+'</dd><dt>Situação</dt><dd>'+s[0]+'</dd>'+(c.app?'<dt>App</dt><dd>'+esc(c.app)+'</dd>':'')+(c.mac?'<dt>MAC</dt><dd>'+esc(c.mac)+'</dd>':'')+(c.dk?'<dt>Device key</dt><dd>'+esc(c.dk)+'</dd>':'')+(c.ds?'<dt>Descrição</dt><dd style="white-space:pre-wrap">'+esc(c.ds)+'</dd>':'')+'</dl><div class="ft"><button class="bt" data-a="x">Fechar</button></div>')}
if(a==='cdel')return confirmDel('Excluir o cliente <b>'+esc(find('cl',i).n)+'</b>?','cdel2',i);
if(a==='gdel')return confirmDel('Excluir o gasto <b>'+esc(find('ex',i).n)+'</b>?','gdel2',i);
if(a==='cdel2'){S.cl=S.cl.filter(function(x){return x.id!==i});sv();close();render();return toast('Cliente excluído.')}
if(a==='gdel2'){S.ex=S.ex.filter(function(x){return x.id!==i});sv();close();render();return toast('Gasto excluído.')}
if(a==='gren'){e2=find('ex',i);e2.d=addM(e2.d,false);sv();render();return toast('Gasto renovado para '+fd(e2.d)+'.')}
if(a==='cmsg'){c=find('cl',i);return send(c,fill(dflt('c'),c))}
if(a==='cren'){c=find('cl',i);c.d=addM(c.d,true);sv();render();
return modal('<h3>Renovado até '+fd(c.d)+'</h3><label>Mensagem de renovação<textarea id="rt">'+esc(fill(dflt('r'),c))+'</textarea></label><div class="ft"><button class="bt g" data-a="rcp">Copiar</button><button class="bt" data-a="rsd" data-i="'+c.id+'">Enviar no '+(c.p==='wa'?'WhatsApp':'Telegram')+'</button></div>')}
if(a==='rcp'){return copy($('rt').value).then(function(){toast('Mensagem copiada.')})}
if(a==='rsd'){return send(find('cl',i),$('rt').value)}
if(a==='tdef'){var z=i.split('|');S.tp[z[0]].forEach(function(m){m.d=m.id===z[1]?1:0});sv();render();return toast('Modelo padrão atualizado.')}
if(a==='tedit'){z=i.split('|');return tform(z[0],S.tp[z[0]].filter(function(m){return m.id===z[1]})[0])}
if(a==='tdel'){z=i.split('|');var m2=S.tp[z[0]].filter(function(m){return m.id===z[1]})[0];return confirmDel('Excluir o modelo <b>'+esc(m2.n)+'</b>?','tdel2',i)}
if(a==='tdel2'){z=i.split('|');S.tp[z[0]]=S.tp[z[0]].filter(function(m){return m.id!==z[1]});if(S.tp[z[0]].length&&!S.tp[z[0]].some(function(m){return m.d}))S.tp[z[0]][0].d=1;sv();close();render();return toast('Modelo excluído.')}
});
if(innerWidth<900)document.body.classList.remove('so');
render();
$('dt').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
setTimeout(function(){$('load').classList.add('off')},2000);
})();
</script>
