<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Estrada Infinita 3D — Clima Dinâmico</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;color:#eaf4ff}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  #hud{position:absolute;inset:0;pointer-events:none}
  
  #topBar{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
  #stats{display:flex;gap:10px}
  .stat{
    background:linear-gradient(160deg,rgba(10,12,25,.78),rgba(4,5,10,.85));
    border:1px solid rgba(0,255,255,.28); border-radius:12px;padding:8px 14px;min-width:96px;
    box-shadow:0 6px 22px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter:blur(6px);
  }
  .stat .k{display:block;font-size:9px;letter-spacing:2px;color:#00ffff;font-weight:700}
  .stat .v{display:block;font-size:20px;font-weight:800;color:#fff;text-shadow:0 0 14px rgba(0,255,255,.55);font-variant-numeric:tabular-nums}

  #weatherBox{
    background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.2); border-radius:12px;
    padding:8px 16px; font-size:14px; font-weight:700; color:#fff; text-transform:uppercase; letter-spacing:1px;
    backdrop-filter:blur(4px); transition:color 0.5s, border-color 0.5s;
  }

  #speedo{position:absolute;left:18px;bottom:18px;width:132px;height:132px}
  #speedo .bg{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(20,15,35,.92),rgba(5,3,10,.96));border:2px solid rgba(0,255,255,.25);box-shadow:0 0 34px rgba(0,255,255,.22), inset 0 0 26px rgba(0,0,0,.75)}
  #speedo .ring{position:absolute;inset:7px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 66%,#000 68%);mask:radial-gradient(circle,transparent 66%,#000 68%)}
  #speedo .needle{position:absolute;left:50%;top:50%;width:4px;height:44px;background:linear-gradient(to top,#00ffff,#fff);border-radius:3px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(-120deg);box-shadow:0 0 12px rgba(255,255,255,.85);transition:transform .06s linear}
  #speedo .hub{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 35%,#fff,#00aaaa);box-shadow:0 0 10px rgba(0,0,0,.8)}
  #speedo .num{position:absolute;left:0;right:0;bottom:24px;text-align:center}
  #speedo .num span{font-size:26px;font-weight:800;color:#fff;text-shadow:0 0 16px rgba(0,255,255,.7);font-variant-numeric:tabular-nums}
  #speedo .num small{display:block;font-size:9px;letter-spacing:2px;color:#00ffff;font-weight:700}

  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  #touch .side{position:absolute;bottom:22px;display:flex;gap:14px;pointer-events:auto}
  #touch .side.left{left:170px}
  #touch .side.right{right:22px}
  #touch button{
    width:76px;height:76px;border-radius:50%;font-size:26px;color:#fff;
    background:linear-gradient(160deg,rgba(40,20,60,.85),rgba(15,5,25,.9));
    border:2px solid rgba(0,255,255,.35); box-shadow:0 6px 20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    touch-action:none; cursor:pointer;
  }
  #touch button:active{background:rgba(0,255,255,.4);transform:scale(.94)}
  
  @media (hover:none) and (pointer:coarse){
    #touch{display:block}
    #speedo{width:104px;height:104px}
    #speedo .num span{font-size:20px}
    .stat{min-width:74px;padding:6px 10px}
    .stat .v{font-size:15px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="topBar">
      <div id="stats">
        <div class="stat"><span class="k">PONTOS</span><span class="v" id="uiScore">0</span></div>
        <div class="stat"><span class="k">DISTÂNCIA</span><span class="v" id="uiDist">0 m</span></div>
      </div>
      <div id="weatherBox">DIA</div>
    </div>
    <div id="speedo">
      <div class="bg"></div><div class="ring" id="ring"></div><div class="needle" id="needle"></div><div class="hub"></div>
      <div class="num"><span id="uiKmh">0</span><small>KM/H</small></div>
    </div>
  </div>
  <div id="touch">
    <div class="side left"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div class="side right"><button data-k="brake">▼</button><button data-k="gas">▲</button></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   MOTOR GRÁFICO - CLIMA DINÂMICO
   ===================================================================== */
const SEG_LEN = 200, ROAD_WIDTH = 2000, LANES = 3;
const FOV = 110, CAM_HEIGHT = 1500, CAM_DEPTH = 1/Math.tan((FOV/2)*Math.PI/180);
const DRAW_DIST = 300, PLAYER_Z = CAM_HEIGHT * CAM_DEPTH;

const MAX_SPEED = SEG_LEN * 60, ACCEL = MAX_SPEED/4.5, BREAKING = -MAX_SPEED, DECEL = -MAX_SPEED/5;
const OFF_ROAD_DECEL = -MAX_SPEED/2.2, OFF_ROAD_LIMIT = MAX_SPEED/4, CENTRIFUGAL = 0.32;
const PLAYER_W = 600 / ROAD_WIDTH;

/* -------- SISTEMA DE CLIMA -------- */
const CLIMATES = [
  { name:'DIA', sky:['#3a8ccc','#7bc8f6','#d3f0ff'], fog:'#d3f0ff', fogDens:3, sun:1, moon:0, rain:0, dark:0, light:0, ui:'#00ffff' },
  { name:'NEBLINA', sky:['#8a9ba8','#b4c2cb','#e0e6ed'], fog:'#e0e6ed', fogDens:14, sun:0, moon:0, rain:0, dark:0.2, light:0, ui:'#fff' },
  { name:'NOITE', sky:['#020208','#0a1024','#152542'], fog:'#050814', fogDens:5, sun:0, moon:1, rain:0, dark:0.75, light:1, ui:'#ff00ff' },
  { name:'TEMPESTADE', sky:['#1a1c23','#2a2d38','#3c4150'], fog:'#2a2d38', fogDens:8, sun:0, moon:0, rain:1, dark:0.6, light:1, thunder:true, ui:'#ff3333' }
];

let weatherTimer = 0;
const PHASE_DURATION = 15; 
const TRANS_DURATION = 5;  
let curW = 0, nextW = 1;
let currentEnv = JSON.parse(JSON.stringify(CLIMATES[0]));

let thunderFlash = 0;
let rainParticles = [];
for(let i=0; i<300; i++) {
  rainParticles.push({x:Math.random(), y:Math.random(), speed: 0.5 + Math.random()*0.5});
}

function hex2rgb(h) {
  let c = h.substring(1);
  if(c.length===3) c = c.split('').map(x=>x+x).join('');
  return [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)];
}
function rgb2hex(r,g,b) { return "#" + (1<<24|(r<<16)|(g<<8)|b).toString(16).slice(1); }
function lerpColor(a,b,t) {
  const c1=hex2rgb(a), c2=hex2rgb(b);
  return rgb2hex(Math.round(c1[0]+(c2[0]-c1[0])*t), Math.round(c1[1]+(c2[1]-c1[1])*t), Math.round(c1[2]+(c2[2]-c1[2])*t));
}

function updateWeather(dt) {
  weatherTimer += dt;
  if(weatherTimer >= PHASE_DURATION) {
    weatherTimer -= PHASE_DURATION;
    curW = nextW;
    nextW = (nextW + 1) % CLIMATES.length;
    document.getElementById('weatherBox').textContent = CLIMATES[curW].name;
    document.getElementById('weatherBox').style.color = CLIMATES[curW].ui;
    document.getElementById('weatherBox').style.borderColor = CLIMATES[curW].ui;
  }
  
  let t = 0;
  if(weatherTimer > (PHASE_DURATION - TRANS_DURATION)) {
    t = (weatherTimer - (PHASE_DURATION - TRANS_DURATION)) / TRANS_DURATION;
  }

  const w1 = CLIMATES[curW], w2 = CLIMATES[nextW];
  currentEnv.sky[0] = lerpColor(w1.sky[0], w2.sky[0], t);
  currentEnv.sky[1] = lerpColor(w1.sky[1], w2.sky[1], t);
  currentEnv.sky[2] = lerpColor(w1.sky[2], w2.sky[2], t);
  currentEnv.fog = lerpColor(w1.fog, w2.fog, t);
  currentEnv.fogDens = w1.fogDens + (w2.fogDens - w1.fogDens)*t;
  currentEnv.sun = w1.sun + (w2.sun - w1.sun)*t;
  currentEnv.moon = w1.moon + (w2.moon - w1.moon)*t;
  currentEnv.rain = w1.rain + (w2.rain - w1.rain)*t;
  currentEnv.dark = w1.dark + (w2.dark - w1.dark)*t;
  currentEnv.light = w1.light + (w2.light - w1.light)*t;
  
  thunderFlash = Math.max(0, thunderFlash - dt*3);
  if(w1.thunder && Math.random() < 0.015) thunderFlash = 1;
}

/* -------- UTILITÁRIOS & CANVAS -------- */
const limit = (v,a,b) => Math.max(a, Math.min(v,b));
const easeIn = (a,b,p) => a + (b-a) * p*p;
const easeInOut = (a,b,p) => a + (b-a) * ((-Math.cos(p*Math.PI)/2) + 0.5);
const interp = (a,b,p) => a + (b-a) * p;
const percentRemaining = (n,t) => (n % t) / t;
const expFog = (d,dens) => 1 / Math.pow(Math.E, d*d*dens);
const accelerate = (v,a,dt) => v + a*dt;
const randomChoice = arr => arr[Math.floor(Math.random()*arr.length)];
function increase(s, inc, max){ let r = s+inc; while(r>=max)r-=max; while(r<0)r+=max; return r; }
function roundRect(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', {alpha:false});
let W=0, H=0;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);

/* -------- SPRITES -------- */
function makeSprite(worldW, worldH, drawFn, frames=1, fDur=150){
  const h=256, w=Math.max(8,Math.round(h*worldW/worldH)), list=[];
  for(let i=0;i<frames;i++){
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    drawFn(c.getContext('2d'), 0,0,w,h,i); list.push(c);
  }
  return {img:list[0], frames:list, w:worldW, h:worldH, fDur:fDur};
}

function drawTree(g,x,y,w,h){
  const cx=x+w/2; g.fillStyle='#1c100a'; g.fillRect(cx-w*0.07, y+h*0.52, w*0.14, h*0.48);
  const blob = (bx,by,r,col) => { g.fillStyle=col; g.beginPath(); g.arc(bx,by,r,0,7); g.fill(); };
  blob(cx, y+h*0.4, w*0.4, '#0c381c'); blob(cx-w*0.26, y+h*0.54, w*0.3, '#0c381c'); blob(cx+w*0.26, y+h*0.54, w*0.3, '#0c381c');
  blob(cx-w*0.12, y+h*0.28, w*0.28, '#13542a'); blob(cx+w*0.14, y+h*0.32, w*0.24, '#13542a'); blob(cx, y+h*0.2, w*0.22, '#1b703a');
}
function drawBuilding(g,x,y,w,h){
  g.fillStyle='#111520'; g.fillRect(x+w*0.06,y,w*0.88,h);
  g.fillStyle='#0a0d14'; g.fillRect(x+w*0.06,y,w*0.88,h*0.05);
  for(let r=0;r<6;r++){
    for(let c=0;c<3;c++){
      if(Math.random()<0.3) { g.fillStyle=Math.random()<0.5?'#00ffff':'#ff00ff'; g.shadowBlur=8; g.shadowColor=g.fillStyle; }
      else if(Math.random()<0.5) { g.fillStyle='#ffe6a7'; g.shadowBlur=4; g.shadowColor='#ffe6a7'; }
      else { g.fillStyle='#222'; g.shadowBlur=0; }
      g.fillRect(x+w*(0.16+c*0.26), y+h*(0.10+r*0.145), w*0.16, h*0.085);
    }
  }
}
function drawLamp(g,x,y,w,h){
  g.fillStyle='#3b3d45'; g.fillRect(x+w*0.38, y+h*0.1, w*0.24, h*0.9);
  g.beginPath(); g.arc(x+w*0.5, y+h*0.1, w*0.42, Math.PI, 0); g.lineTo(x+w*0.92, y+h*0.1); g.lineTo(x+w*0.08, y+h*0.1); g.closePath(); g.fill();
  g.fillStyle='#fff'; g.shadowColor='#fff'; g.shadowBlur=20;
  g.beginPath(); g.arc(x+w*0.5, y+h*0.14, w*0.2, 0, 7); g.fill(); g.shadowBlur=0;
}
function drawNeonSign(g,x,y,w,h,f, col, t1, t2){
  g.fillStyle='#111'; g.fillRect(x+w*0.42, y+h*0.6, w*0.16, h*0.4);
  g.fillStyle='#050505'; roundRect(g,x,y,w,h*0.6,w*0.05); g.fill();
  const isOn = (f%2===0);
  g.strokeStyle = isOn?col:'#333'; g.shadowColor = isOn?col:'transparent'; g.shadowBlur = isOn?20:0; g.lineWidth=w*0.04;
  roundRect(g, x+w*0.05, y+h*0.05, w*0.9, h*0.5, w*0.03); g.stroke();
  g.fillStyle = isOn?'#fff':'#444'; g.textAlign='center'; g.font="900 "+(h*0.2)+"px Arial"; g.fillText(t1, x+w*0.5, y+h*0.28);
  g.fillStyle = isOn?col:'#222'; g.font="700 "+(h*0.12)+"px Arial"; g.fillText(t2, x+w*0.5, y+h*0.48); g.shadowBlur=0;
}
function drawCarSprite(g,x,y,w,h,c){
  g.fillStyle='rgba(0,0,0,.5)'; g.beginPath(); g.ellipse(x+w*0.5,y+h*0.97,w*0.48,h*0.09,0,0,7); g.fill();
  g.fillStyle='#15161a'; roundRect(g,x+w*0.0,y+h*0.52,w*0.16,h*0.44,h*0.05); g.fill(); roundRect(g,x+w*0.84,y+h*0.52,w*0.16,h*0.44,h*0.05); g.fill();
  g.fillStyle=c.dark; roundRect(g,x+w*0.17,y+h*0.02,w*0.66,h*0.46,h*0.14); g.fill();
  const vg=g.createLinearGradient(0,y+h*0.06,0,y+h*0.36); vg.addColorStop(0,'#050810'); vg.addColorStop(1,'#152538');
  g.fillStyle=vg; roundRect(g,x+w*0.22,y+h*0.09,w*0.56,h*0.28,h*0.07); g.fill();
  const bg=g.createLinearGradient(0,y+h*0.3,0,y+h*0.92); bg.addColorStop(0,c.main); bg.addColorStop(0.5,c.dark); bg.addColorStop(1,c.main);
  g.fillStyle=bg; roundRect(g,x+w*0.04,y+h*0.3,w*0.92,h*0.6,h*0.13); g.fill();
  g.fillStyle='#ff2d2d'; g.shadowColor='#ff2d2d'; g.shadowBlur=15; roundRect(g,x+w*0.08,y+h*0.52,w*0.2,h*0.13,h*0.04); g.fill(); roundRect(g,x+w*0.72,y+h*0.52,w*0.2,h*0.13,h*0.04); g.fill(); g.shadowBlur=0;
  g.fillStyle='#111'; roundRect(g,x+w*0.04,y+h*0.76,w*0.92,h*0.14,h*0.05); g.fill();
}

const SPRITES = {
  TREE: makeSprite(2400, 4200, drawTree),
  BUILDING: makeSprite(3200, 6200, drawBuilding),
  LAMP: makeSprite(520, 3400, drawLamp),
  BOATE: makeSprite(2500, 3000, (g,x,y,w,h,f)=>drawNeonSign(g,x,y,w,h,f,'#ff00ff','NIGHT','CLUB'), 4, 400),
  LOJA: makeSprite(2200, 2600, (g,x,y,w,h,f)=>drawNeonSign(g,x,y,w,h,f,'#00ffff','CYBER','SHOP'), 4, 300)
};
const CAR_SPRITES = [
  {main:'#e0245e',dark:'#8f1338'}, {main:'#1da1f2',dark:'#115b8a'}, {main:'#f1c40f',dark:'#b89500'}, {main:'#0ca678',dark:'#077a58'}
].map(c => makeSprite(760, 620, (g,x,y,w,h)=>drawCarSprite(g,x,y,w,h,c)));

/* -------- PISTA -------- */
let segments=[], cars=[], trackLength=0;
const ROAD = { LENGTH:{SHORT:25,MED:50,LONG:100}, HILL:{LOW:20,MED:40,HIGH:60}, CURVE:{EASY:2,MED:4,HARD:6} };
const C = {
  LIGHT: {road:'#3c3e44', grass:'#1d2d35', rumble:'#a0a2a5', lane:'#fff'},
  DARK:  {road:'#32343a', grass:'#16242a', rumble:'#8a1030', lane:null}
};

function addSegment(curve, y){
  const n = segments.length;
  segments.push({ index:n, p1:{world:{y:segments.length?segments[segments.length-1].p2.world.y:0, z:n*SEG_LEN}, camera:{}, screen:{}}, p2:{world:{y:y, z:(n+1)*SEG_LEN}, camera:{}, screen:{}}, curve:curve, sprites:[], cars:[], clip:0, color:null });
}
function addRoad(enter, hold, leave, curve, y){
  const startY = segments.length?segments[segments.length-1].p2.world.y:0, endY = startY + (y||0)*SEG_LEN, total = enter+hold+leave;
  for(let n=0;n<enter;n++) addSegment(easeIn(0,curve,n/enter), easeInOut(startY,endY,n/total));
  for(let n=0;n<hold ;n++) addSegment(curve, easeInOut(startY,endY,(enter+n)/total));
  for(let n=0;n<leave;n++) addSegment(easeInOut(curve,0,n/leave), easeInOut(startY,endY,(enter+hold+n)/total));
}

function buildTrack(){
  segments=[]; cars=[];
  addRoad(ROAD.LENGTH.SHORT, ROAD.LENGTH.SHORT, ROAD.LENGTH.SHORT, 0, 0);
  addRoad(ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.CURVE.EASY, ROAD.HILL.LOW);
  addRoad(ROAD.LENGTH.LONG, ROAD.LENGTH.MED, ROAD.LENGTH.LONG, -ROAD.CURVE.MED, -ROAD.HILL.MED);
  addRoad(ROAD.LENGTH.SHORT, ROAD.LENGTH.SHORT, ROAD.LENGTH.SHORT, 0, 0);
  addRoad(ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.CURVE.HARD, ROAD.HILL.HIGH);
  addRoad(ROAD.LENGTH.MED, ROAD.LENGTH.MED, ROAD.LENGTH.MED, -ROAD.CURVE.EASY, -ROAD.HILL.LOW);
  addRoad(200, 200, 200, -ROAD.CURVE.EASY, -(segments.length?segments[segments.length-1].p2.world.y:0)/SEG_LEN);
  
  for(let n=0;n<segments.length;n++) segments[n].color = (Math.floor(n/3)%2) ? C.DARK : C.LIGHT;
  trackLength = segments.length * SEG_LEN;
  
  for(let i=24; i<segments.length-24; i+=16) {
    segments[i].sprites.push({source:SPRITES.LAMP, offset:1.28});
    segments[i].sprites.push({source:SPRITES.LAMP, offset:-1.28});
  }
  for(let i=8; i<segments.length-8; i+=4) {
    const s = Math.random()<0.5?-1:1;
    segments[i].sprites.push({source:SPRITES.TREE, offset:s*(2+Math.random()*2)});
    if(Math.random()<0.3) segments[i].sprites.push({source:SPRITES.BUILDING, offset:s*(4+Math.random()*2)});
  }
  for(let i=40; i<segments.length-40; i+=60) {
    segments[i].sprites.push({source:Math.random()>0.5?SPRITES.BOATE:SPRITES.LOJA, offset:(Math.random()<0.5?-1:1)*1.5, phase:Math.random()*1000});
  }
  for(let i=0; i<45; i++){
    const z = Math.floor(Math.random()*segments.length)*SEG_LEN;
    const c = {offset:Math.random()*1.6-0.8, z:z, sprite:randomChoice(CAR_SPRITES), speed:MAX_SPEED/4+Math.random()*MAX_SPEED/2, percent:0};
    segments[Math.floor(z/SEG_LEN)%segments.length].cars.push(c); cars.push(c);
  }
}

/* -------- LÓGICA -------- */
let pos=0, pX=0, speed=0, shake=0, bgOff=0, time=0, dist=0, score=0;
const input = {gas:0, brake:0, left:0, right:0};
let steerIn=0, steerVis=0, carPitch=0;

const KEYS = {ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown', e=>{if(KEYS[e.code]){input[KEYS[e.code]]=1;e.preventDefault()}});
window.addEventListener('keyup', e=>{if(KEYS[e.code]){input[KEYS[e.code]]=0;e.preventDefault()}});
document.querySelectorAll('#touch button').forEach(b => {
  const k=b.dataset.k, on=e=>{e.preventDefault();input[k]=1}, off=e=>{e.preventDefault();input[k]=0};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off); b.addEventListener('contextmenu',e=>e.preventDefault());
});

function overlap(x1,w1,x2,w2){ const h=0.82/2; return !(x1+w1*h < x2-w2*h || x1-w1*h > x2+w2*h); }

function update(dt){
  time += dt; updateWeather(dt);
  const pSeg = segments[Math.floor((pos+PLAYER_Z)/SEG_LEN)%segments.length];
  const sPct = speed/MAX_SPEED;

  const stTarg = input.right - input.left;
  steerIn += (stTarg - steerIn) * (1-Math.pow(0.001, dt));
  if(Math.abs(steerIn)<0.02 && stTarg===0) steerIn=0;
  carPitch += ((input.gas?1:input.brake?-1:0) - carPitch) * dt * 4;

  pos = increase(pos, dt*speed, trackLength); dist += (dt*speed)/380;
  const dx = dt * 2.2 * sPct * (1-sPct*0.18);
  pX += steerIn * dx - dx * sPct * pSeg.curve * CENTRIFUGAL;

  if(input.gas) speed = accelerate(speed, ACCEL, dt);
  else if(input.brake) speed = accelerate(speed, BREAKING, dt);
  else speed = accelerate(speed, DECEL, dt);

  const off = (pX < -1 || pX > 1);
  if(off && speed > OFF_ROAD_LIMIT) { speed = accelerate(speed, OFF_ROAD_DECEL, dt); shake = Math.min(1, shake+dt*3); }
  else shake = Math.max(0, shake-dt*3);

  for(let c of cars) {
    const oS = segments[Math.floor(c.z/SEG_LEN)%segments.length];
    c.z = increase(c.z, dt*c.speed, trackLength); c.percent = percentRemaining(c.z, SEG_LEN);
    const nS = segments[Math.floor(c.z/SEG_LEN)%segments.length];
    if(oS !== nS) { oS.cars.splice(oS.cars.indexOf(c),1); nS.cars.push(c); }
  }

  for(let c of pSeg.cars) {
    if(speed > c.speed && overlap(pX, PLAYER_W, c.offset, c.sprite.w/ROAD_WIDTH)){
      speed = c.speed*0.4; pos = increase(c.z, -PLAYER_Z, trackLength); shake = 1; break;
    }
  }

  pX = limit(pX, -2.4, 2.4); speed = limit(speed, 0, MAX_SPEED);
  steerVis += ((steerIn*sPct) - steerVis) * dt * 9;
  score += dt*sPct*42*(off?0.35:1); bgOff += pSeg.curve*sPct*dt*380;

  if(currentEnv.rain > 0) {
    for(let r of rainParticles) {
      r.y += r.speed * dt * 60; r.x -= steerIn * dt;
      if(r.y > 1) { r.y = -0.1; r.x = Math.random(); }
      if(r.x < 0) r.x += 1; else if (r.x > 1) r.x -= 1;
    }
  }
}

/* -------- RENDER -------- */
function project(p, cx, cy, cz, d, w, h, rw){
  p.camera.x=(p.world.x||0)-cx; p.camera.y=(p.world.y||0)-cy; p.camera.z=(p.world.z||0)-cz;
  p.screen.scale=d/p.camera.z; p.screen.x=Math.round(w/2+(p.screen.scale*p.camera.x*w/2));
  p.screen.y=Math.round(h/2-(p.screen.scale*p.camera.y*h/2)); p.screen.w=Math.round(p.screen.scale*rw*w/2);
}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4); ctx.closePath(); ctx.fill(); }

function drawSkyHills(){
  const grad = ctx.createLinearGradient(0,0,0,H*0.62);
  grad.addColorStop(0, currentEnv.sky[0]); grad.addColorStop(0.55, currentEnv.sky[1]); grad.addColorStop(1, currentEnv.sky[2]);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  if(thunderFlash > 0) { ctx.fillStyle=`rgba(255,255,255,${thunderFlash})`; ctx.fillRect(0,0,W,H); }

  const sx = W*0.5 - (bgOff*0.3 % (W*2)), sy = H*0.45;
  if(currentEnv.sun > 0) {
    ctx.globalAlpha = currentEnv.sun;
    ctx.fillStyle='#ffc922'; ctx.shadowColor='#ffc922'; ctx.shadowBlur=40;
    ctx.beginPath(); ctx.arc(sx,sy,H*0.15,0,7); ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  if(currentEnv.moon > 0) {
    ctx.globalAlpha = currentEnv.moon;
    ctx.fillStyle='#eaf4ff'; ctx.shadowColor='#fff'; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(sx+W*0.2,sy-H*0.2,H*0.08,0,7); ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(sx+W*0.2 - H*0.03,sy-H*0.2 - H*0.02,H*0.07,0,7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  const off = bgOff; const horiz = H/2;
  const layer = (bY, amp, clr, o, f) => {
    ctx.fillStyle=clr; ctx.beginPath(); ctx.moveTo(0,bY+H);
    for(let x=0;x<=W;x+=20){ const t=(x+o)*f; ctx.lineTo(x, bY-amp*(0.55+0.3*Math.sin(t)+0.18*Math.sin(t*2.3))); }
    ctx.lineTo(W,bY+H); ctx.closePath(); ctx.fill();
  };
  const d1 = currentEnv.dark * 0.6;
  layer(horiz+4, H*0.08, lerpColor('#4b5a6b', '#11131a', d1), off*0.22, 2*Math.PI/900);
  layer(horiz+10, H*0.05, lerpColor('#3a4b5c', '#090a0f', d1), off*0.42, 2*Math.PI/620);
}

function renderPlayer(){
  const w=Math.min(W*0.22, H*0.35), h=w*0.72, bX=W/2+limit(pX,-1.6,1.6)*W*0.045+(shake?(Math.random()-0.5)*shake*9:0), bY=H-h*0.6+(shake?(Math.random()-0.5)*shake*6:0);
  const byOff = carPitch*h*-0.15 + Math.sin(time*30)*(speed/MAX_SPEED)*2;

  ctx.save(); ctx.translate(bX,bY);
  const x=-w/2, yS=-h/2, wt=steerIn*w*0.04;

  if(currentEnv.light > 0) {
    ctx.fillStyle = `rgba(255,255,200,${currentEnv.light*0.25})`;
    ctx.beginPath(); ctx.moveTo(x+w*0.1, yS); ctx.lineTo(-W, -h*0.5); ctx.lineTo(W, -h*0.5); ctx.lineTo(x+w*0.9, yS); ctx.fill();
  }

  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.ellipse(0,yS+h*0.5,w*0.55,h*0.14,0,0,7); ctx.fill();
  ctx.fillStyle='#0a0b0f'; roundRect(ctx,x,yS+h*0.2,w*0.15,h*0.62,h*0.05); roundRect(ctx,x+w*0.85,yS+h*0.2,w*0.15,h*0.62,h*0.05);
  roundRect(ctx,x+w*0.01+wt,yS+h*0.18,w*0.13,h*0.58,h*0.05); roundRect(ctx,x+w*0.86+wt,yS+h*0.18,w*0.13,h*0.58,h*0.05);

  ctx.rotate(steerVis*0.06); const yB=-h/2+byOff;
  const tg=ctx.createLinearGradient(0,yB,0,yB+h*0.42); tg.addColorStop(0,'#e63946'); tg.addColorStop(1,'#b51724');
  ctx.fillStyle=tg; roundRect(ctx,x+w*0.19,yB,w*0.62,h*0.42,h*0.13); ctx.fill();
  const vg=ctx.createLinearGradient(0,yB+h*0.04,0,yB+h*0.36); vg.addColorStop(0,'#050a12'); vg.addColorStop(1,'#14253a');
  ctx.fillStyle=vg; roundRect(ctx,x+w*0.24,yB+h*0.06,w*0.52,h*0.28,h*0.07); ctx.fill();
  const bg=ctx.createLinearGradient(0,yB+h*0.22,0,yB+h*0.92); bg.addColorStop(0,'#ff4d4d'); bg.addColorStop(0.5,'#cc0000'); bg.addColorStop(1,'#800000');
  ctx.fillStyle=bg; roundRect(ctx,x+w*0.04,yB+h*0.24,w*0.92,h*0.66,h*0.14); ctx.fill();

  const brk = input.brake || speed<30;
  ctx.shadowColor = brk?'#ff0000':'rgba(255,0,0,.4)'; ctx.shadowBlur=brk?30:10; ctx.fillStyle=brk?'#ff3333':'#990000';
  roundRect(ctx,x+w*0.08,yB+h*0.44,w*0.2,h*0.15,h*0.05); ctx.fill(); roundRect(ctx,x+w*0.72,yB+h*0.44,w*0.2,h*0.15,h*0.05); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#111'; roundRect(ctx,x+w*0.04,yB+h*0.72,w*0.92,h*0.16,h*0.05); ctx.fill();
  ctx.fillStyle='#eee'; roundRect(ctx,x+w*0.4,yB+h*0.6,w*0.2,h*0.11,h*0.02); ctx.fill();
  ctx.restore();
}

function render(){
  const bSeg=segments[Math.floor(pos/SEG_LEN)%segments.length], bPct=percentRemaining(pos,SEG_LEN);
  const pSeg=segments[Math.floor((pos+PLAYER_Z)/SEG_LEN)%segments.length], pPct=percentRemaining(pos+PLAYER_Z,SEG_LEN);
  
  drawSkyHills();

  let maxy=H, x=0, dx=-(bSeg.curve*bPct);
  const camY = interp(pSeg.p1.world.y, pSeg.p2.world.y, pPct) + CAM_HEIGHT + (shake*60*(Math.random()-0.5));

  for(let n=0; n<DRAW_DIST; n++){
    const s=segments[(bSeg.index+n)%segments.length];
    s.clip=maxy; s.fog=expFog(n/DRAW_DIST, currentEnv.fogDens);
    const cz = pos - (s.index<bSeg.index ? trackLength : 0);
    project(s.p1, pX*ROAD_WIDTH-x, camY, cz, CAM_DEPTH, W, H, ROAD_WIDTH);
    project(s.p2, pX*ROAD_WIDTH-x-dx, camY, cz, CAM_DEPTH, W, H, ROAD_WIDTH);
    x+=dx; dx+=s.curve;

    if(s.p1.camera.z<=CAM_DEPTH || s.p2.screen.y>=s.p1.screen.y || s.p2.screen.y>=maxy) continue;
    
    const p1=s.p1.screen, p2=s.p2.screen, c=s.color, r1=p1.w/6, r2=p2.w/6;
    ctx.fillStyle=c.grass; ctx.fillRect(0,p2.y,W,p1.y-p2.y);
    poly(p1.x-p1.w-r1,p1.y, p1.x-p1.w,p1.y, p2.x-p2.w,p2.y, p2.x-p2.w-r2,p2.y, c.rumble);
    poly(p1.x+p1.w+r1,p1.y, p1.x+p1.w,p1.y, p2.x+p2.w,p2.y, p2.x+p2.w+r2,p2.y, c.rumble);
    poly(p1.x-p1.w,p1.y, p1.x+p1.w,p1.y, p2.x+p2.w,p2.y, p2.x-p2.w,p2.y, c.road);
    if(c.lane){
      const lw1=p1.w*2/LANES, lw2=p2.w*2/LANES, l1=p1.w/24, l2=p2.w/24;
      let lx1=p1.x-p1.w+lw1, lx2=p2.x-p2.w+lw2;
      for(let l=1;l<LANES;l++,lx1+=lw1,lx2+=lw2) poly(lx1-l1/2,p1.y, lx1+l1/2,p1.y, lx2+l2/2,p2.y, lx2-l2/2,p2.y, c.lane);
    }
    if(s.fog<1) { ctx.globalAlpha=1-s.fog; ctx.fillStyle=currentEnv.fog; ctx.fillRect(0,p2.y,W,p1.y-p2.y); ctx.globalAlpha=1; }
    maxy=s.p1.screen.y;
  }

  for(let n=DRAW_DIST-1; n>0; n--){
    const s=segments[(bSeg.index+n)%segments.length];
    for(let c of s.cars){
      const sc=interp(s.p1.screen.scale, s.p2.screen.scale, c.percent);
      const cx=interp(s.p1.screen.x, s.p2.screen.x, c.percent) + sc*c.offset*ROAD_WIDTH*W/2;
      const cy=interp(s.p1.screen.y, s.p2.screen.y, c.percent);
      drawSprite(c.sprite, sc, cx, cy, s.clip, s.fog, null);
    }
    for(let p of s.sprites){
      const sx=s.p1.screen.x + s.p1.screen.scale*p.offset*ROAD_WIDTH*W/2;
      drawSprite(p.source, s.p1.screen.scale, sx, s.p1.screen.y, s.clip, s.fog, p);
    }
  }

  // Dark overlay
  if(currentEnv.dark > 0) {
    ctx.fillStyle = `rgba(0,4,15,${currentEnv.dark})`;
    ctx.fillRect(0,H*0.4,W,H*0.6);
  }

  renderPlayer();

  // Rain
  if(currentEnv.rain > 0) {
    ctx.strokeStyle = `rgba(200,220,255,${currentEnv.rain*0.6})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(let r of rainParticles) {
      const rx = r.x*W, ry = r.y*H;
      ctx.moveTo(rx, ry); ctx.lineTo(rx - (steerIn*20), ry + 30);
    }
    ctx.stroke();
  }

  if(shake>0.72) { ctx.fillStyle=`rgba(255,0,0,${(shake-0.72)*0.6})`; ctx.fillRect(0,0,W,H); }
}

function drawSprite(src, sc, dX, dY, clipY, fog, obj){
  if(sc<=0||fog<0.03) return; const dw=sc*src.w*W/2, dh=sc*src.h*W/2;
  const x=dX-dw/2, y=dY-dh; if(dw<1||x>W||x+dw<0) return;
  let img=src.img;
  if(src.frames&&src.frames.length>1){
    const idx=Math.floor((time*1000+(obj?obj.phase:0))/src.fDur)%src.frames.length;
    img=src.frames[idx];
  }
  const nClip=(y+dh)>clipY;
  if(nClip){ if(clipY<=0) return; ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,clipY); ctx.clip(); }
  ctx.globalAlpha=fog; ctx.drawImage(img,x,y,dw,dh); ctx.globalAlpha=1;
  if(nClip) ctx.restore();
}

let lastKmh = -1;
function updateHUD(){
  const kmh = Math.round((speed/MAX_SPEED)*320);
  if(kmh!==lastKmh){
    lastKmh=kmh; document.getElementById('uiKmh').textContent=kmh; const pct=kmh/320;
    document.getElementById('needle').style.transform=`translate(-50%,-100%) rotate(${-120+pct*240}deg)`;
    document.getElementById('ring').style.background=`conic-gradient(from 210deg, #00ffff 0deg, #fff ${pct*240}deg, rgba(255,255,255,.07) ${pct*240}deg, transparent 240deg)`;
  }
  document.getElementById('uiScore').textContent=Math.floor(score).toLocaleString('pt-BR');
  document.getElementById('uiDist').textContent=Math.floor(dist).toLocaleString('pt-BR')+' m';
}

function frame(now){
  if(!window.lastT) window.lastT=now;
  let dt=Math.min((now-window.lastT)/1000, 0.25); window.lastT=now;
  window.acc = (window.acc||0)+dt;
  while(window.acc>=1/60){ update(1/60); window.acc-=1/60; }
  render(); updateHUD(); requestAnimationFrame(frame);
}

resize(); buildTrack(); speed=MAX_SPEED*0.12; requestAnimationFrame(frame);
})();
</script>
</body>
