<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-accent="violet" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="color-scheme" content="dark light">
<title>Notas Pro</title>
<style>
/* ==========================================================
   NOTAS PRO — estilos
   ========================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0d0f13;--surf:#171c26;--surf2:#1f2632;--line:#2a323f;
  --txt:#e9edf5;--txt2:#98a3b4;--txt3:#6a7484;
  --acc:#7c5cff;--soft:rgba(124,92,255,.16);
  --ok:#2fbf71;--warn:#f0a63a;--err:#ef4d5b;
  --r:18px;--rs:12px;--rx:9px;--sh:0 8px 28px rgba(0,0,0,.42);--fs:15px
}
[data-accent=blue]{--acc:#3b82f6;--soft:rgba(59,130,246,.16)}
[data-accent=green]{--acc:#22c55e;--soft:rgba(34,197,94,.16)}
[data-accent=amber]{--acc:#f59e0b;--soft:rgba(245,158,11,.16)}
[data-accent=rose]{--acc:#f43f5e;--soft:rgba(244,63,94,.16)}
[data-accent=cyan]{--acc:#06b6d4;--soft:rgba(6,182,212,.16)}
[data-theme=light]{--bg:#f3f5f9;--surf:#fff;--surf2:#eef1f7;--line:#dfe4ed;--txt:#141924;--txt2:#5a6575;--txt3:#8b95a5;--sh:0 6px 20px rgba(20,30,55,.10)}
[data-density=compact]{--r:14px;--rs:10px}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;font-family:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700}
mark{background:var(--acc);color:#fff;border-radius:4px;padding:0 2px}
a{color:var(--acc)}
/* ---------- estrutura ---------- */
.shell{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.pad{padding:0 14px}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 12px 12px;background:var(--bg);position:sticky;top:0;z-index:20;border-bottom:1px solid transparent}
.hdr-main{flex:1;min-width:0}
.hdr-title{font-size:1.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-title.big{font-size:1.55rem}
.hdr-sub{display:block;color:var(--txt2);font-size:.78rem;font-weight:500;text-transform:capitalize}
.sec{margin-top:20px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 2px}
.sec-hdr h2{font-size:.95rem;color:var(--txt2);font-weight:600;letter-spacing:.02em}
.link-btn{color:var(--acc);font-size:.8rem;font-weight:600}
/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:var(--rs);font-weight:600;font-size:.9rem;background:var(--surf2);color:var(--txt);transition:transform .12s,filter .15s;min-height:46px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:#fff;box-shadow:0 6px 18px var(--soft)}
.btn.ghost{background:var(--surf2);color:var(--txt)}
.btn.danger{background:var(--err);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.82rem}
.btn.block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:var(--rs);color:var(--txt2);flex:none;transition:background .15s,color .15s}
.icon-btn:active{background:var(--surf2)}
.icon-btn.on{color:var(--acc);background:var(--soft)}
.icon-btn.sm{width:34px;height:34px}
.row{display:flex;align-items:center}
.row.gap{gap:10px}
.grow{flex:1}
.mt{margin-top:14px}
.mb{margin-bottom:14px}
/* ---------- busca ---------- */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);padding:13px 14px;color:var(--txt3);font-size:.9rem}
.search-bar input{flex:1;background:none;border:0;outline:none;min-width:0;color:var(--txt)}
/* ---------- cards ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:4px;text-align:left}
.stat .sv{font-size:1.5rem;font-weight:800;line-height:1}
.stat .sl{font-size:.74rem;color:var(--txt2);font-weight:600}
.stat .si{color:var(--acc)}
.note-card{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 11px 17px;margin-bottom:10px;overflow:hidden}
.note-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--nc,transparent)}
.note-card.pinned{border-color:var(--acc)}
.nc-top{display:flex;align-items:center;gap:6px}
.nc-title{font-size:.97rem;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-fav{color:var(--warn);display:flex}
.nc-prev{color:var(--txt2);font-size:.83rem;margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;font-size:.72rem;color:var(--txt3)}
.nc-date{margin-left:auto;font-size:.7rem;color:var(--txt3)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--line);border-radius:20px;padding:4px 9px;font-size:.74rem;font-weight:600;color:var(--txt2)}
.chip.tiny{padding:2px 7px;font-size:.68rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:2px 7px;font-size:.68rem;font-weight:700;color:#fff}
.p-low{background:#3b82f6}.p-normal{background:#64748b}.p-high{background:#f59e0b}.p-urgent{background:#ef4444}
/* ---------- listas ---------- */
.task-row{display:flex;align-items:flex-start;gap:11px;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);padding:12px;margin-bottom:9px}
.task-row.done .tr-title{text-decoration:line-through;color:var(--txt3)}
.task-row.late{border-color:var(--err)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.tr-main{flex:1;min-width:0}
.tr-title{font-size:.92rem;font-weight:600;display:block}
.tr-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:.72rem;color:var(--txt3);align-items:center}
.late-t{color:var(--err);font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);padding:13px;margin-bottom:9px}
.li-ico{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;font-size:.92rem}
.li-sub{font-size:.75rem;color:var(--txt2)}
/* ---------- vazio ---------- */
.empty{text-align:center;padding:44px 24px;color:var(--txt2)}
.empty svg{color:var(--acc);opacity:.85}
.empty h3{color:var(--txt);margin:12px 0 6px;font-size:1.02rem}
.empty p{font-size:.85rem;margin:0 auto 16px;max-width:280px}
/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--txt3);font-size:.66rem;font-weight:600;border-radius:12px}
.nav-item.on{color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:20px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px var(--soft);z-index:41}
.fab:active{transform:scale(.94)}
/* ---------- modal / toast ---------- */
#modal-root{position:fixed;inset:0;z-index:60;display:none}
#modal-root.open{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.modal{background:var(--surf);width:100%;max-width:520px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.9,.3,1);border:1px solid var(--line)}
.modal-hdr{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.modal-hdr h2{flex:1;font-size:1.02rem}
.modal-body{padding:14px;overflow-y:auto}
.modal-ftr{display:flex;gap:9px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.modal-ftr .btn{flex:1}
.modal-text{color:var(--txt2);font-size:.88rem}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px)}to{transform:translateY(0)}}
#toast-root{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#20262f;color:#fff;padding:11px 16px;border-radius:12px;font-size:.84rem;font-weight:600;box-shadow:var(--sh);max-width:88%;animation:up .2s}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}
.toast.out{opacity:0;transition:opacity .3s}
[data-theme=light] .toast{background:#1f2530}
/* ---------- formulários ---------- */
.field{margin-bottom:12px}
.field>label{display:block;font-size:.76rem;font-weight:700;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.input,.select,.textarea{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:var(--rs);padding:12px;outline:none;min-height:46px}
.textarea{min-height:110px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{border-color:var(--acc)}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff}
.sw.on{border-color:var(--txt)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch span{font-size:.87rem}
.switch small{display:block;color:var(--txt3);font-size:.72rem;font-weight:400}
.toggle{width:48px;height:28px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .18s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s}
.toggle.on{background:var(--acc)}
.toggle.on:after{transform:translateX(20px)}
/* ---------- editor ---------- */
.ed-title{width:100%;background:none;border:0;outline:none;font-size:1.3rem;font-weight:800;padding:4px 0}
.ed-content{min-height:240px;outline:none;line-height:1.65;font-size:.95rem;padding:6px 0}
.ed-content:empty:before{content:attr(data-ph);color:var(--txt3)}
.ed-content h1{font-size:1.4rem;margin:.6em 0 .3em}
.ed-content h2{font-size:1.15rem;margin:.6em 0 .3em}
.ed-content blockquote{border-left:3px solid var(--acc);margin:.6em 0;padding:2px 12px;color:var(--txt2)}
.ed-content ul,.ed-content ol{padding-left:22px;margin:.5em 0}
.ed-content hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.ed-content img{max-width:100%;border-radius:10px;margin:6px 0}
.toolbar{display:flex;gap:4px;overflow-x:auto;padding:7px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{min-width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-weight:700;flex:none}
.tool:active{background:var(--surf2);color:var(--acc)}
.save-state{font-size:.72rem;color:var(--txt3);font-weight:600;margin-right:2px}
.save-state.saving{color:var(--warn)}
.ck-item{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.ck-item input[type=text]{flex:1;background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
.ck-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none}
.ck-item .done-txt{text-decoration:line-through;color:var(--txt3)}
.thumb{width:74px;height:74px;border-radius:11px;object-fit:cover;border:1px solid var(--line)}
/* ---------- calendário ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.68rem;color:var(--txt3);font-weight:700;padding:5px 0}
.cal .day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.82rem;position:relative;color:var(--txt)}
.cal .day.out{color:var(--txt3);opacity:.5}
.cal .day.today{border:1.5px solid var(--acc);color:var(--acc);font-weight:800}
.cal .day.sel{background:var(--acc);color:#fff;font-weight:800}
.cal .day .dd{display:flex;gap:2px;position:absolute;bottom:5px}
.cal .day .dd i{width:4px;height:4px;border-radius:50%;background:var(--acc)}
.cal .day.sel .dd i{background:#fff}
/* ---------- gráficos ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:9px;font-size:.78rem}
.bar-lbl{width:96px;flex:none;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:9px;background:var(--surf2);border-radius:9px;overflow:hidden}
.bar-fill{height:100%;background:var(--acc);border-radius:9px}
.bar-val{width:26px;text-align:right;color:var(--txt3);font-weight:700}
.prog{height:8px;background:var(--surf2);border-radius:9px;overflow:hidden;margin-top:7px}
.prog>div{height:100%;background:var(--acc)}
.habit-days{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.hd{width:26px;height:26px;border-radius:8px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:.64rem;color:var(--txt3)}
.hd.on{background:var(--ok);color:#fff;font-weight:700}
/* ---------- util ---------- */
.divider{height:1px;background:var(--line);margin:14px 0}
.note-info{font-size:.72rem;color:var(--txt3);line-height:1.7}
.bulkbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;gap:8px;align-items:center;box-shadow:var(--sh);z-index:39}
#print-area{display:none}
@media print{body>*{display:none!important}#print-area{display:block!important;color:#000;background:#fff;padding:20px;font-size:13px}#print-area img{max-width:100%}}
</style>
</head>
<body>
<div id="app" class="shell"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>
<div id="print-area"></div>
<script>
'use strict';
/* ==========================================================
   NOTAS PRO v1.0.0 — app de anotações offline
   HTML/CSS/JS puro • IndexedDB + localStorage • sem dependências
   ========================================================== */
const APP_VERSION='1.0.0';
const DB_NAME='notaspro_db';
const STORES=['notes','tasks','folders','tags','habits','goals'];
const PRIO={low:'Baixa',normal:'Normal',high:'Alta',urgent:'Urgente'};
const COLORS=['#7c5cff','#3b82f6','#22c55e','#f59e0b','#f43f5e','#06b6d4','#a855f7','#14b8a6','#ef4444','#64748b'];
const SEED_FOLDERS=[['Pessoal','user'],['Trabalho','briefcase'],['Estudos','book'],['Ideias','bulb'],['Finanças','coin'],['Compras','cart'],['Projetos','layers'],['Saúde e rotina','heart'],['Sem categoria','folder']];

/* ---------- utilidades ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO=()=>isoD(new Date());
const nowISO=()=>new Date().toISOString();
const parseD=s=>new Date(String(s).length<=10?s+'T12:00:00':s);
const fmtD=(s,long)=>{if(!s)return'';const d=parseD(s);if(isNaN(d))return'';return d.toLocaleDateString('pt-BR',long?{day:'2-digit',month:'long',year:'numeric'}:{day:'2-digit',month:'2-digit',year:'numeric'});};
const fmtDT=s=>{if(!s)return'';const d=new Date(s);if(isNaN(d))return'';return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());};
const rel=s=>{if(!s)return'';const t=new Date(s).getTime();if(isNaN(t))return'';const m=Math.round((Date.now()-t)/60000);if(m<1)return'agora';if(m<60)return'há '+m+' min';const h=Math.round(m/60);if(h<24)return'há '+h+' h';const d=Math.round(h/24);if(d<30)return'há '+d+' d';return fmtD(s);};
const strip=h=>{const d=document.createElement('div');d.innerHTML=h||'';return(d.textContent||'').replace(/\s+/g,' ').trim();};
const hl=(t,q)=>{t=esc(t);if(!q)return t;try{return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}catch(e){return t;}};
const greet=()=>{const h=new Date().getHours();return h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';};
const debounce=(fn,ms)=>{let t;return function(){const a=arguments;clearTimeout(t);t=setTimeout(()=>fn.apply(null,a),ms);};};
const bytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';

/* ---------- ícones (SVG inline, sem fonte externa) ---------- */
const P={
home:'<path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
note:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
check:'<path d="M9 11.5l2.5 2.5L20 6"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
calendar:'<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10.5h18"/>',
menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>',
star:'<path d="M12 3.2l2.7 5.5 6 .9-4.3 4.3 1 6-5.4-2.9-5.4 2.9 1-6L3.3 9.6l6-.9z"/>',
pin:'<path d="M12 2.5v7"/><path d="M6.5 9.5h11l-1.7 4.2V21h-7.6v-7.3z"/>',
archive:'<rect x="3" y="4" width="18" height="5" rx="1.4"/><path d="M5 9v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13.5h4"/>',
trash:'<path d="M3.5 6.5h17"/><path d="M8.5 6.5V4h7v2.5"/><path d="M6 6.5l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/>',

const DEFAULTS={theme:'dark',accent:'violet',fontSize:15,density:'comfortable',defaultSort:'updated_desc',autosave:true,trashDays:30,confirm:true,userName:'',recentSearches:[]};

function applySettings(){

  r.setAttribute('data-theme',th);r.setAttribute('data-accent',S.accent);r.setAttribute('data-density',S.density);

/* ---------- banco de dados (IndexedDB) ---------- */
let db=null;
function openDB(){return new Promise((res,rej)=>{
  if(!('indexedDB' in window)){rej(new Error('sem indexeddb'));return;}
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};
  r.onsuccess=()=>{db=r.result;res(db);};
  r.onerror=()=>rej(r.error);
});}
const dbAll=s=>new Promise((res,rej)=>{const q=db.transaction(s,'readonly').objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
const dbPut=(s,o)=>new Promise((res,rej)=>{const q=db.transaction(s,'readwrite').objectStore(s).put(o);q.onsuccess=()=>res(o);q.onerror=()=>rej(q.error);});
const dbDel=(s,id)=>new Promise((res,rej)=>{const q=db.transaction(s,'readwrite').objectStore(s).delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});
const dbBulk=(s,a)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');const st=t.objectStore(s);a.forEach(o=>st.put(o));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});
const dbClearAll=()=>Promise.all(STORES.map(s=>new Promise((res,rej)=>{const q=db.transaction(s,'readwrite').objectStore(s).clear();q.onsuccess=()=>res();q.onerror=()=>rej(q.error);})));

const sortNotes=arr=>{const s=S.defaultSort;
  if(s==='updated_asc')arr.sort((a,b)=>(a.updatedAt||'').localeCompare(b.updatedAt||''));
  else if(s==='created_desc')arr.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  else if(s==='title_asc')arr.sort((a,b)=>(a.title||'').localeCompare(b.title||'','pt-BR'));
  else if(s==='priority'){const o={urgent:0,high:1,normal:2,low:3};arr.sort((a,b)=>(o[a.priority||'normal']-o[b.priority||'normal']));}
  else arr.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  arr.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));return arr;};
function upcoming(n){
  const now=Date.now()-3600000;const out=[];
  State.notes.filter(x=>!x.deletedAt&&x.reminderAt).forEach(x=>out.push({t:'note',id:x.id,ti:x.title||'Sem título',at:x.reminderAt}));
  State.tasks.filter(x=>!x.deletedAt&&!x.done&&x.reminderAt).forEach(x=>out.push({t:'task',id:x.id,ti:x.title,at:x.reminderAt}));
  return out.filter(x=>new Date(x.at).getTime()>=now).sort((a,b)=>a.at.localeCompare(b.at)).slice(0,n);
}

function viewTasks(p){
  const tab=(p&&p.tab)||'hoje';const today=todayISO();
  let arr=State.tasks.filter(t=>!t.deletedAt);
  if(tab==='hoje')arr=arr.filter(t=>!t.done&&t.dueDate&&t.dueDate<=today);
  else if(tab==='proximas')arr=arr.filter(t=>!t.done&&t.dueDate&&t.dueDate>today);
  else if(tab==='atrasadas')arr=arr.filter(t=>!t.done&&t.dueDate&&t.dueDate<today);
  else if(tab==='concluidas')arr=arr.filter(t=>t.done);
  const ord={urgent:0,high:1,normal:2,low:3};
  arr.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||(ord[a.priority||'normal']-ord[b.priority||'normal']));
  const pend=State.tasks.filter(t=>!t.done&&!t.deletedAt).length;
  const late=State.tasks.filter(t=>isLate(t)&&!t.deletedAt).length;
  return header('Tarefas',{sub:pend+' pendentes'+(late?' • '+late+' atrasadas':''),actions:'<button class="icon-btn" data-act="newTask" aria-label="Nova tarefa">'+ic('plus')+'</button>'})+
  '<div class="chips">'+[['hoje','Hoje'],['proximas','Próximas'],['atrasadas','Atrasadas'],['concluidas','Concluídas'],['todas','Todas']].map(t=>'<button class="chip'+(tab===t[0]?' on':'')+'" data-act="taskTab" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+

}
function viewCalendar(){
  const cur=State.calMonth,y=cur.getFullYear(),m=cur.getMonth();
  const firstDay=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),prevDim=new Date(y,m,0).getDate();
  let cells='';
  for(let i=firstDay-1;i>=0;i--)cells+='<div class="day out">'+(prevDim-i)+'</div>';
  for(let d=1;d<=dim;d++){
    const iso=isoD(new Date(y,m,d));
    const has=State.tasks.some(t=>!t.deletedAt&&t.dueDate===iso)||State.notes.some(n=>!n.deletedAt&&n.reminderAt&&n.reminderAt.slice(0,10)===iso);
    cells+='<div class="day'+(iso===todayISO()?' today':'')+(iso===State.calDay?' sel':'')+'" data-act="calDay" data-d="'+iso+'">'+d+(has?'<span class="dd"><i></i></span>':'')+'</div>';
  }
  const rest=(7-((firstDay+dim)%7))%7;
  for(let i=1;i<=rest;i++)cells+='<div class="day out">'+i+'</div>';
  const sel=State.calDay;
  const tks=State.tasks.filter(t=>!t.deletedAt&&t.dueDate===sel);
  const nts=State.notes.filter(n=>!n.deletedAt&&n.reminderAt&&n.reminderAt.slice(0,10)===sel);
  const wd=['D','S','T','Q','Q','S','S'];

const VIEWS={home:viewHome,notes:viewNotes,tasks:viewTasks,calendar:viewCalendar,more:viewMore,folders:viewFolders,favorites:viewFavorites,archived:viewArchived,private:viewPrivate,trash:viewTrash,habits:viewHabits,stats:viewStats,templates:viewTemplates,quick:viewQuick,search:viewSearch,editor:viewEditor,settings:viewSettings};

/* ==========================================================
   RENDER E ROTEADOR (com suporte à tecla voltar)
   ========================================================== */
function render(){
  const v=State.view;const fn=VIEWS[v.name]||viewHome;
  let html;
  try{html=fn(v.params||{});}catch(err){html='<div class="empty">'+ic('info',40)+'<h3>Erro ao renderizar</h3><p>'+esc(err.message)+'</p></div>';}
  $('#app').innerHTML=html;
  if(v.name!=='editor')$('#app').scrollTop=0;
  if(v.name==='settings')updateStorage();
}
function navigate(name,params){params=params||{};State.stack.push({name:name,params:params});State.view={name:name,params:params};try{history.pushState({i:State.stack.length-1},'');}catch(e){}render();}
function finalizeEditor(){
  const e=State.editor;if(!e)return;
  const isEmpty=e.isNew&&!e.note.title.trim()&&!strip(e.note.content).trim()&&!(e.note.checklist||[]).length;
  if(!isEmpty)saveEditor(true);
  State.editor=null;
}
function goBack(){if(State.modalOpen){closeModal();return;}if(State.view.name==='editor')finalizeEditor();if(State.stack.length>1){try{history.back();}catch(e){State.stack.pop();State.view=State.stack[State.stack.length-1];render();}}}
window.addEventListener('popstate',function(){
  if(State.modalOpen){closeModal();try{history.pushState({i:State.stack.length-1},'');}catch(e){}return;}
  if(State.view.name==='editor')finalizeEditor();
  if(State.stack.length>1){State.stack.pop();State.view=State.stack[State.stack.length-1];render();}
});

function openEditor(id){

function setSaveStatus(txt,cls){const el=$('#save-state');if(el){el.textContent=txt;el.className='save-state '+(cls||'');}}
async function saveEditor(quiet){
  const e=State.editor;if(!e)return;
  const n=e.note;n.updatedAt=nowISO();
  try{
    await dbPut('notes',n);
    const i=State.notes.findIndex(x=>x.id===n.id);
    if(i>=0)State.notes[i]=JSON.parse(JSON.stringify(n));else State.notes.push(JSON.parse(JSON.stringify(n)));

}

function saveSel(){const s=window.getSelection();if(s&&s.rangeCount)State.savedRange=s.getRangeAt(0).cloneRange();}
function restoreSel(){const r=State.savedRange;if(r){const s=window.getSelection();s.removeAllRanges();s.addRange(r);}}
async function attachFiles(el){
  const files=Array.prototype.slice.call(el.files||[]);
  for(const f of files){
    if(!/^image\//.test(f.type))continue;
    if(f.size>6*1024*1024){toast('Imagem muito grande (máx. 6MB)','err');continue;}
    const d=await compressImage(f,1280);
    if(d){State.editor.note.attachments=State.editor.note.attachments||[];State.editor.note.attachments.push(d);}
  }
  el.value='';await saveEditor(true);render();toast('Imagem anexada','ok');
}
function compressImage(file,max){return new Promise(res=>{
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    try{res(c.toDataURL('image/jpeg',.78));}catch(e){res(fr.result);}
  };img.onerror=()=>res(fr.result);img.src=fr.result;};
  fr.onerror=()=>res(null);fr.readAsDataURL(file);
});}

/* ==========================================================
   PIN (PBKDF2-SHA256 quando disponível)
   ========================================================== */
const pinSet=()=>!!localStorage.getItem('notaspro.pin');
const hexToBytes=h=>{const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;};
const bytesToHex=b=>Array.prototype.map.call(b,x=>('0'+x.toString(16)).slice(-2)).join('');
function rndHex(n){const a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return bytesToHex(a);}
function djb2(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(16);}
async function hashPin(pin,salt,iter){
  if(window.crypto&&crypto.subtle){
    try{
      const enc=new TextEncoder();
      const key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexToBytes(salt),iterations:iter,hash:'SHA-256'},key,256);
      return bytesToHex(new Uint8Array(bits));
    }catch(e){}
  }
  return 'fb'+djb2(pin+'|'+salt);
}
async function setPin(pin){
  const salt=rndHex(16),iter=100000;
  const hash=await hashPin(pin,salt,iter);
  localStorage.setItem('notaspro.pin',JSON.stringify({salt:salt,iter:iter,hash:hash,algo:(window.crypto&&crypto.subtle)?'pbkdf2':'fallback'}));
}
async function verifyPin(pin){
  const d=JSON.parse(localStorage.getItem('notaspro.pin')||'null');if(!d)return true;
  return (await hashPin(pin,d.salt,d.iter||100000))===d.hash;
}

function download(name,text,mime){
  try{
    const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);
    toast('Arquivo gerado: '+name,'ok');
  }catch(e){toast('Falha ao gerar o arquivo','err');}
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copiado','ok')).catch(()=>fbCopy(t));
  else fbCopy(t);
}
function fbCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copiado','ok');}catch(e){toast('Não foi possível copiar','err');}a.remove();}
function htmlToMd(h){
  let s=h||'';
  s=s.replace(/<h1[^>]*>([\s\S]*?)<\/h1>/gi,'# $1\n\n').replace(/<h2[^>]*>([\s\S]*?)<\/h2>/gi,'## $1\n\n')
     .replace(/<blockquote[^>]*>([\s\S]*?)<\/blockquote>/gi,'> $1\n\n').replace(/<li[^>]*>([\s\S]*?)<\/li>/gi,'- $1\n')
     .replace(/<hr\s*\/?>/gi,'\n---\n').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|ul|ol)>/gi,'\n')
     .replace(/<b>|<strong>/gi,'**').replace(/<\/b>|<\/strong>/gi,'**').replace(/<i>|<em>/gi,'*').replace(/<\/i>|<\/em>/gi,'*')
     .replace(/<[^>]+>/g,'');
  return s.replace(/\n{3,}/g,'\n\n').trim();
}
function printNote(n){
  const pa=$('#print-area');
  pa.innerHTML='<h1>'+esc(n.title||'Sem título')+'</h1><p><i>'+esc(fmtDT(n.createdAt))+'</i></p>'+(n.content||'')+
    ((n.checklist||[]).length?'<ul>'+n.checklist.map(c=>'<li>'+(c.done?'[x] ':'[ ] ')+esc(c.text)+'</li>').join('')+'</ul>':'');
  setTimeout(()=>{try{window.print();}catch(e){toast('Impressão não suportada aqui','err');}},80);
}
async function doImport(el){
  const f=el.files&&el.files[0];if(!f)return;
  el.value='';
  try{
    const j=JSON.parse(await f.text());
    const d=j.data||j;
    if(!d||(!d.notes&&!d.tasks)){toast('Arquivo inválido','err');return;}
    State._import=d;
    modal({title:'Importar backup',body:'<p class="modal-text">Arquivo válido.<br><br><b>'+(d.notes||[]).length+'</b> anotações<br><b>'+(d.tasks||[]).length+'</b> tarefas<br><b>'+(d.folders||[]).length+'</b> pastas<br><br>"Mesclar" mantém o que já existe e adiciona os novos. "Substituir" apaga os dados atuais.</p>',actions:[{label:'Cancelar',act:'closeModal'},{label:'Mesclar',act:'impMerge',cls:'primary'},{label:'Substituir',act:'impReplace',cls:'danger'}]});
  }catch(e){toast('Não foi possível ler o arquivo','err');}
}
async function applyImport(replace){
  const d=State._import;if(!d)return;closeModal();
  for(const s of STORES){
    const arr=d[s];if(!arr||!arr.length)continue;
    if(replace)await dbBulk(s,arr);
    else{const ex=new Set(State[s].map(x=>x.id));await dbBulk(s,arr.filter(x=>!ex.has(x.id)));}
  }
  if(replace&&d.settings){S=Object.assign({},DEFAULTS,d.settings);saveSettings();applySettings();}
  await loadAll();render();
  toast(replace?'Backup substituído':'Backup mesclado','ok');
}
async function updateStorage(force){
  const el=$('#stg');if(!el)return;
  if(!navigator.storage||!navigator.storage.estimate){el.textContent='não informado pelo WebView';return;}
  try{const e=await navigator.storage.estimate();el.textContent=bytes(e.usage||0)+' de '+(e.quota?bytes(e.quota):'?');if(force)toast('Uso: '+bytes(e.usage||0));}
  catch(err){el.textContent='indisponível';}
}
function streak(h){let n=0;const d=new Date();for(let i=0;i<400;i++){const k=isoD(d);if((h.history||{})[k])n++;else if(i>0)break;d.setDate(d.getDate()-1);}return n;}

/* ==========================================================
   INICIALIZAÇÃO
   ========================================================== */
async function seedFolders(){
  const arr=SEED_FOLDERS.map((f,i)=>({id:uid('f'),name:f[0],icon:f[1],color:'',createdAt:new Date(Date.now()+i).toISOString()}));
  await dbBulk('folders',arr);State.folders=arr;
}
async function purgeTrash(){
  const lim=Date.now()-S.trashDays*86400000;
  for(const s of ['notes','tasks'])
    for(const it of State[s])
      if(it.deletedAt&&new Date(it.deletedAt).getTime()<lim)await dbDel(s,it.id);
}
function checkReminders(){
  const now=Date.now();
  State.notes.concat(State.tasks).forEach(it=>{
    if(!it.reminderAt||it.deletedAt)return;
    const t=new Date(it.reminderAt).getTime();
    if(t<=now&&t>now-86400000&&!State.fired.has(it.id)){State.fired.add(it.id);toast('Lembrete: '+(it.title||'sem título'),'ok');}
  });
}
async function boot(){
  loadSettings();applySettings();
  try{await openDB();}catch(e){
    $('#app').innerHTML='<div class="empty">'+ic('info',42)+'<h3>Armazenamento indisponível</h3><p>O IndexedDB não pôde ser aberto. O app precisa dele para salvar os dados.</p></div>';return;
  }
  try{
    await loadAll();
    if(!State.folders.length)await seedFolders();
    await purgeTrash();
    await loadAll();
  }catch(e){toast('Erro ao carregar dados','err');}
  State.stack=[{name:'home',params:{}}];State.view=State.stack[0];
  try{history.replaceState({i:0},'');}catch(e){}
  render();
  setInterval(checkReminders,60000);
  document.addEventListener('visibilitychange',async()=>{if(!document.hidden){await loadAll();render();checkReminders();}});
  window.addEventListener('beforeunload',()=>{if(State.editor)saveEditor(true);});
  if(window.matchMedia)matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.theme==='auto')applySettings();});
}
boot();
