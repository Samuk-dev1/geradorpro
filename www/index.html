<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Tattoo Studio Manager</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f0f1a;--card:#1a1a2e;--card2:#232342;--accent:#e94560;--accent2:#0f3460;
  --green:#00d9a5;--red:#ff4757;--yellow:#ffa502;--text:#eaeaea;--muted:#8b8b9e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px;overflow-x:hidden}
.header{background:linear-gradient(135deg,#1a1a2e,#0f3460);padding:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.4)}
.header h1{font-size:18px;display:flex;align-items:center;gap:8px}
.header .sub{font-size:11px;color:var(--muted);margin-top:2px}
.container{padding:12px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--accent)}
.card h3{font-size:13px;margin:10px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input,select,textarea,button{font-family:inherit;font-size:14px;width:100%}
input,select,textarea{background:var(--card2);border:1px solid #333;border-radius:10px;padding:11px;color:var(--text);margin-bottom:8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;cursor:pointer;transition:.2s}
button:active{transform:scale(.97)}
button.secondary{background:var(--card2);color:var(--text)}
button.green{background:var(--green);color:#000}
button.red{background:var(--red)}
button.small{padding:7px 10px;font-size:12px;width:auto}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px;gap:4px;overflow-x:auto}
.tabs button{background:transparent;color:var(--muted);padding:9px 10px;font-size:12px;border-radius:8px;flex:1;white-space:nowrap;min-width:fit-content}
.tabs button.active{background:var(--accent);color:#fff}
.nav-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;padding:6px;border-top:1px solid #333;z-index:100;max-width:600px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.nav-bottom button{background:transparent;color:var(--muted);flex:1;padding:8px 4px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px}
.nav-bottom button.active{color:var(--accent)}
.nav-bottom button span{font-size:18px}
.item{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .info{flex:1;min-width:0}
.item .info strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .info small{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.item .value{font-weight:700;font-size:14px;white-space:nowrap}
.item .actions{display:flex;gap:4px;flex-shrink:0}
.item .actions button{padding:6px 8px;font-size:11px}
.total-box{background:linear-gradient(135deg,var(--accent2),var(--card2));border-radius:12px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.total-box .label{font-size:11px;color:var(--muted);text-transform:uppercase}
.total-box .amount{font-size:20px;font-weight:800}
.green-text{color:var(--green)}
.red-text{color:var(--red)}
.yellow-text{color:var(--yellow)}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;overflow-y:auto}
.modal.show{display:flex}
.modal-content{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-content h2{font-size:16px;margin-bottom:12px;color:var(--accent)}
.filter-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{margin:0;font-size:12px;padding:8px;flex:1;min-width:100px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase}
.badge.pix{background:#32bcad33;color:#32bcad}
.badge.cartao{background:#5c6bc033;color:#7c8cf0}
.badge.dinheiro{background:#00d9a533;color:#00d9a5}
.badge.parcelado{background:#ffa50233;color:#ffa502}
.badge.pendente{background:#ff475733;color:#ff4757}
.badge.pago{background:#00d9a533;color:#00d9a5}
.chart-container{position:relative;height:220px;margin-top:8px}
details{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'▼';font-size:10px;transition:.2s}
details[open] summary::after{transform:rotate(180deg)}
details[open] summary{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #333}
.hidden{display:none!important}
.alert{background:#ff475733;border:1px solid var(--red);border-radius:10px;padding:10px;font-size:12px;margin-bottom:10px}
.info-line{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #2a2a45}
.info-line:last-child{border:none}
.info-line strong{color:var(--text)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat-box .l{font-size:10px;color:var(--muted);text-transform:uppercase}
.stat-box .v{font-size:16px;font-weight:700;margin-top:3px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.error{background:var(--red);color:#fff}
.income-card{background:linear-gradient(135deg,#00d9a520,#00d9a508);border:1px solid #00d9a533;border-radius:12px;padding:12px;margin-bottom:8px}
.income-card .t{font-size:14px;font-weight:700;margin-bottom:4px}
.income-card .d{font-size:11px;color:var(--muted)}
.income-card .v{font-size:16px;font-weight:800;color:var(--green);margin-top:4px}
</style>
</head>
<body>

<div class="header">
  <h1>🖤 Tattoo Studio Manager</h1>
  <div class="sub">Ganhos • Gastos • Impostos • Gráficos</div>
</div>

<div class="container" id="app"></div>

<div class="nav-bottom">
  <button data-tab="dashboard" class="active"><span>📊</span>Painel</button>
  <button data-tab="ganhos"><span>💰</span>Ganhos</button>
  <button data-tab="gastos"><span>💸</span>Gastos</button>
  <button data-tab="contas"><span>📋</span>Contas</button>
  <button data-tab="config"><span>⚙️</span>Config</button>
</div>

<div class="modal" id="modal"><div class="modal-content" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ ESTADO ============ */
const DEFAULTS = {
  ganhos: [],        // {id,data,nome,valor,forma,juros,valorLiquido,imposto,parcelas,obs}
  gastos: [],        // {id,data,tipo:'estudio'|'pessoal',categoria,descricao,valor}
  contas: [],        // {id,tipo:'estudio'|'pessoal',nome,valor,vencimento,status:'pendente'|'paga',recorrente:bool}
  config: {
    impostoPix: 6,
    impostoCartao: 6,
    moeda: 'R$',
    studioNome: 'Meu Estúdio',
    categoriasGastoEstudio: ['Material','Aluguel','Energia','Internet','Marketing','Equipamento','Manutenção','Outros'],
    categoriasGastoPessoal: ['Alimentação','Moradia','Transporte','Saúde','Lazer','Educação','Roupas','Outros'],
    formasPagamento: ['Pix','Cartão Débito','Cartão Crédito','Dinheiro','Cartão Parcelado']
  }
};

let state = loadState();
let currentTab = 'dashboard';
let currentFilter = { ano: new Date().getFullYear(), mes: new Date().getMonth() };

/* ============ PERSISTÊNCIA ============ */
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem('tattoo_manager_v1'));
    if(!s) return structuredClone(DEFAULTS);
    return {
      ganhos: s.ganhos || [],
      gastos: s.gastos || [],
      contas: s.contas || [],
      config: {...DEFAULTS.config, ...(s.config||{})}
    };
  }catch(e){ return structuredClone(DEFAULTS); }
}
function saveState(){ localStorage.setItem('tattoo_manager_v1', JSON.stringify(state)); }

/* ============ HELPERS ============ */
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt = v => 'R$ '+(Number(v)||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtDate = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };
const today = () => new Date().toISOString().slice(0,10);
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function toast(msg, err=false){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show'+(err?' error':'');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.className='toast'+(err?' error':''),2200);
}
function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

function mesAnoMatch(dataStr){
  if(!dataStr) return false;
  const d = new Date(dataStr+'T00:00:00');
  return d.getMonth()===currentFilter.mes && d.getFullYear()===currentFilter.ano;
}

/* ============ CÁLCULOS ============ */
function calcGanho(g){
  const val = Number(g.valor)||0;
  const juros = Number(g.juros)||0;
  const forma = g.forma;
  let impostoPct = 0;
  if(forma==='Pix') impostoPct = state.config.impostoPix;
  else if(forma.includes('Cartão')) impostoPct = state.config.impostoCartao;
  const imposto = val * (impostoPct/100);
  const liquido = val - juros - imposto;
  return { bruto: val, juros, imposto, liquido, impostoPct };
}

function totalGanhos(lista){
  return lista.reduce((s,g)=>{ const c=calcGanho(g); s.bruto+=c.bruto; s.juros+=c.juros; s.imposto+=c.imposto; s.liquido+=c.liquido; return s; }, {bruto:0,juros:0,imposto:0,liquido:0});
}
function totalGastos(lista,tipo){
  return lista.filter(g=>!tipo||g.tipo===tipo).reduce((s,g)=>s+(Number(g.valor)||0),0);
}
function totalContas(lista,tipo,status){
  return lista.filter(c=>(!tipo||c.tipo===tipo)&&(!status||c.status===status)).reduce((s,c)=>s+(Number(c.valor)||0),0);
}

/* ============ NAVEGAÇÃO ============ */
document.querySelectorAll('.nav-bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.nav-bottom button').forEach(b=>b.classList.toggle('active',b===btn));
    render();
    window.scrollTo(0,0);
  });
});

/* ============ RENDER PRINCIPAL ============ */
function render(){
  const app = document.getElementById('app');
  if(currentTab==='dashboard') app.innerHTML = renderDashboard();
  else if(currentTab==='ganhos') app.innerHTML = renderGanhos();
  else if(currentTab==='gastos') app.innerHTML = renderGastos();
  else if(currentTab==='contas') app.innerHTML = renderContas();
  else if(currentTab==='config') app.innerHTML = renderConfig();
  attachEvents();
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const ganhosMes = state.ganhos.filter(g=>mesAnoMatch(g.data));
  const gastosMes = state.gastos.filter(g=>mesAnoMatch(g.data));
  const contasMes = state.contas.filter(c=>{
    if(!c.vencimento) return false;
    const d = new Date(c.vencimento+'T00:00:00');
    return d.getMonth()===currentFilter.mes && d.getFullYear()===currentFilter.ano;
  });

  const tg = totalGanhos(ganhosMes);
  const ge = totalGastos(gastosMes,'estudio');
  const gp = totalGastos(gastosMes,'pessoal');
  const cePend = totalContas(contasMes,'estudio','pendente');
  const cpPend = totalContas(contasMes,'pessoal','pendente');

  const receitaLiq = tg.liquido;
  const despesasTotal = ge+gp+cePend+cpPend;
  const saldo = receitaLiq - despesasTotal;

  return `
  <div class="filter-bar">
    <select id="fAno">${anosDisponiveis().map(a=>`<option ${a===currentFilter.ano?'selected':''}>${a}</option>`).join('')}</select>
    <select id="fMes">${MESES.map((m,i)=>`<option value="${i}" ${i===currentFilter.mes?'selected':''}>${m}</option>`).join('')}</select>
  </div>

  <div class="stat-grid">
    <div class="stat-box"><div class="l">Ganho Líquido</div><div class="v green-text">${fmt(tg.liquido)}</div></div>
    <div class="stat-box"><div class="l">Ganho Bruto</div><div class="v">${fmt(tg.bruto)}</div></div>
    <div class="stat-box"><div class="l">Impostos</div><div class="v yellow-text">${fmt(tg.imposto)}</div></div>
    <div class="stat-box"><div class="l">Juros Maquininha</div><div class="v yellow-text">${fmt(tg.juros)}</div></div>
  </div>

  <div class="card">
    <h2>💼 Resumo do Mês</h2>
    <div class="info-line"><span>Ganhos Líquidos</span><strong class="green-text">${fmt(receitaLiq)}</strong></div>
    <div class="info-line"><span>Gastos Estúdio</span><strong class="red-text">-${fmt(ge)}</strong></div>
    <div class="info-line"><span>Gastos Pessoais</span><strong class="red-text">-${fmt(gp)}</strong></div>
    <div class="info-line"><span>Contas Estúdio (pendentes)</span><strong class="red-text">-${fmt(cePend)}</strong></div>
    <div class="info-line"><span>Contas Pessoais (pendentes)</span><strong class="red-text">-${fmt(cpPend)}</strong></div>
    <div class="info-line" style="border-top:2px solid var(--accent);margin-top:6px;padding-top:8px;font-size:15px">
      <span><strong>SALDO FINAL</strong></span>
      <strong class="${saldo>=0?'green-text':'red-text'}" style="font-size:18px">${fmt(saldo)}</strong>
    </div>
  </div>

  <div class="card">
    <h2>📈 Ganhos vs Gastos (${currentFilter.ano})</h2>
    <div class="chart-container"><canvas id="chartMensal"></canvas></div>
  </div>

  <div class="card">
    <h2>🎯 Distribuição por Forma de Pagamento</h2>
    <div class="chart-container"><canvas id="chartFormas"></canvas></div>
  </div>

  <div class="card">
    <h2>🏷️ Top Categorias de Gasto (Mês)</h2>
    ${renderCategoriasResumo(gastosMes)}
  </div>
  `;
}

function renderCategoriasResumo(gastos){
  const map = {};
  gastos.forEach(g=>{ const k = g.tipo+'|'+g.categoria; map[k]=(map[k]||0)+Number(g.valor); });
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(!arr.length) return '<div class="empty">Sem gastos no mês</div>';
  return arr.map(([k,v])=>{
    const [tipo,cat]=k.split('|');
    return `<div class="info-line"><span>${tipo==='estudio'?'🏪':'🏠'} ${cat}</span><strong class="red-text">${fmt(v)}</strong></div>`;
  }).join('');
}

function anosDisponiveis(){
  const anos = new Set([new Date().getFullYear()]);
  [...state.ganhos.map(x=>x.data),...state.gastos.map(x=>x.data),...state.contas.map(x=>x.vencimento)].forEach(d=>{
    if(d) anos.add(parseInt(d.slice(0,4)));
  });
  return [...anos].sort((a,b)=>b-a);
}

/* ============ GANHOS ============ */
function renderGanhos(){
  const lista = state.ganhos.filter(g=>mesAnoMatch(g.data)).sort((a,b)=>b.data.localeCompare(a.data));
  const t = totalGanhos(lista);

  return `
  <div class="filter-bar">
    <select id="fAno">${anosDisponiveis().map(a=>`<option ${a===currentFilter.ano?'selected':''}>${a}</option>`).join('')}</select>
    <select id="fMes">${MESES.map((m,i)=>`<option value="${i}" ${i===currentFilter.mes?'selected':''}>${m}</option>`).join('')}</select>
  </div>

  <div class="total-box">
    <div><div class="label">Líquido Recebido</div><div class="amount green-text">${fmt(t.liquido)}</div></div>
    <button class="small" onclick="novoGanho()">+ Novo</button>
  </div>

  <div class="stat-grid">
    <div class="stat-box"><div class="l">Bruto</div><div class="v">${fmt(t.bruto)}</div></div>
    <div class="stat-box"><div class="l">Impostos</div><div class="v yellow-text">${fmt(t.imposto)}</div></div>
  </div>

  <div class="card">
    <h2>💰 Trabalhos do Mês (${lista.length})</h2>
    ${lista.length? lista.map(g=>{
      const c = calcGanho(g);
      const badge = g.forma.toLowerCase().replace('á','a').replace('â','a').split(' ')[0];
      return `<div class="income-card">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
          <div style="flex:1;min-width:0">
            <div class="t">${escapeHtml(g.nome)}</div>
            <div class="d">${fmtDate(g.data)} • <span class="badge ${badge}">${g.forma}</span>${g.parcelas>1?` • ${g.parcelas}x`:''}</div>
            <div class="d" style="margin-top:4px">
              Bruto ${fmt(c.bruto)} • Juros ${fmt(c.juros)} • Imp. ${fmt(c.imposto)} (${c.impostoPct}%)
            </div>
          </div>
          <div style="text-align:right">
            <div class="v">${fmt(c.liquido)}</div>
            <div style="display:flex;gap:4px;margin-top:6px;justify-content:flex-end">
              <button class="small secondary" onclick="editarGanho('${g.id}')">✏️</button>
              <button class="small red" onclick="excluirGanho('${g.id}')">🗑</button>
            </div>
          </div>
        </div>
      </div>`;
    }).join('') : '<div class="empty">Nenhum ganho registrado neste mês</div>'}
  </div>
  `;
}

function novoGanho(id){
  const g = id ? state.ganhos.find(x=>x.id===id) : {data:today(),nome:'',valor:'',forma:'Pix',juros:0,parcelas:1,obs:''};
  openModal(`
    <h2>${id?'Editar':'Novo'} Ganho</h2>
    <label>Data</label><input type="date" id="gData" value="${g.data}">
    <label>Nome da Tattoo / Trabalho</label><input type="text" id="gNome" value="${escapeHtml(g.nome)}" placeholder="Ex: Rosa no braço">
    <label>Valor Cobrado (R$)</label><input type="number" step="0.01" id="gValor" value="${g.valor}" oninput="previewGanho()">
    <label>Forma de Pagamento</label>
    <select id="gForma" onchange="previewGanho()">
      ${state.config.formasPagamento.map(f=>`<option ${f===g.forma?'selected':''}>${f}</option>`).join('')}
    </select>
    <div id="gParcelasWrap">
      <label>Nº de Parcelas</label>
      <input type="number" min="1" id="gParcelas" value="${g.parcelas||1}" oninput="previewGanho()">
    </div>
    <label>Juros da Maquininha (R$)</label>
    <input type="number" step="0.01" id="gJuros" value="${g.juros||0}" oninput="previewGanho()">
    <label>Observação</label>
    <input type="text" id="gObs" value="${escapeHtml(g.obs||'')}" placeholder="Opcional">
    <div id="gPreview" class="card" style="background:var(--card2);margin-top:10px"></div>
    <div class="row" style="margin-top:10px">
      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button class="green" onclick="salvarGanho('${id||''}')">Salvar</button>
    </div>
  `);
  previewGanho();
}

function previewGanho(){
  const val = parseFloat(document.getElementById('gValor').value)||0;
  const juros = parseFloat(document.getElementById('gJuros').value)||0;
  const forma = document.getElementById('gForma').value;
  const impostoPct = forma==='Pix' ? state.config.impostoPix : (forma.includes('Cartão') ? state.config.impostoCartao : 0);
  const imposto = val*(impostoPct/100);
  const liquido = val-juros-imposto;
  document.getElementById('gPreview').innerHTML = `
    <div class="info-line"><span>Valor Bruto</span><strong>${fmt(val)}</strong></div>
    <div class="info-line"><span>Juros Maquininha</span><strong class="yellow-text">-${fmt(juros)}</strong></div>
    <div class="info-line"><span>Imposto (${impostoPct}%)</span><strong class="yellow-text">-${fmt(imposto)}</strong></div>
    <div class="info-line" style="border-top:1px solid var(--accent);margin-top:4px;padding-top:8px">
      <span><strong>Você recebe</strong></span>
      <strong class="green-text" style="font-size:16px">${fmt(liquido)}</strong>
    </div>
  `;
  const forma = document.getElementById('gForma').value;
  document.getElementById('gParcelasWrap').style.display = forma==='Cartão Parcelado' ? 'block' : 'none';
}

function salvarGanho(id){
  const data = document.getElementById('gData').value;
  const nome = document.getElementById('gNome').value.trim();
  const valor = parseFloat(document.getElementById('gValor').value)||0;
  const forma = document.getElementById('gForma').value;
  const juros = parseFloat(document.getElementById('gJuros').value)||0;
  const parcelas = parseInt(document.getElementById('gParcelas').value)||1;
  const obs = document.getElementById('gObs').value.trim();
  if(!nome || valor<=0){ toast('Preencha nome e valor',true); return; }

  if(id){
    const g = state.ganhos.find(x=>x.id===id);
    Object.assign(g,{data,nome,valor,forma,juros,parcelas,obs});
  } else {
    state.ganhos.push({id:uid(),data,nome,valor,forma,juros,parcelas,obs});
  }
  saveState(); closeModal(); render(); toast('Ganho salvo!');
}

function editarGanho(id){ novoGanho(id); }
function excluirGanho(id){
  if(!confirm('Excluir este ganho?')) return;
  state.ganhos = state.ganhos.filter(g=>g.id!==id);
  saveState(); render(); toast('Excluído');
}
